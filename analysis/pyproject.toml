[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "opentide-analysis"
version = "0.6.0"
description = "The opentide query and Tide object analysis engine and language server, for the opentide package."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "opentide", email = "digit-ec-opentide@ec.europa.eu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://opentide.org"
Repository = "https://github.com/opentidehq/opentide"
Engine = "https://github.com/opentidehq/language-server"

[tool.maturin]
python-source = "python"
module-name = "opentide_analysis._native"

[tool.uv]
# Rebuild the extension when the Rust source changes, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
