[package]
name = "opentide-native"
# Compiled into the opentide package as opentide._native (hatch_build.py),
# whose version comes from its git tag; this crate is never published.
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false
description = "The analysis engine and language server, compiled into the opentide Python package"
repository = "https://github.com/opentidehq/opentide"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform serves CPython 3.10 and later. A free-threaded
# interpreter (3.14t) has no stable ABI, so it builds from the sdist.
# generate-import-lib: a Windows build needs no python3.lib on the machine.
pyo3 = { version = "0.30.1", features = ["abi3-py310", "generate-import-lib"] }
# The engine and the server, from opentidehq/language-server. Both come from one
# release: the engine crates share a version and pin each other to it. Between
# language-server releases this may be a git revision, but
# scripts/build/check_engine_pin.py refuses a git source when a release is
# published, so a release always builds from crates.io.
# The Exabeam Query Language and the Exabeam block checks
# (opentidehq/language-server, branch claude/magical-volta-t2z24d), on top of
# 0.13.0, ahead of the release that ships them.
opentide-analysis = { git = "https://github.com/opentidehq/language-server", rev = "687b8035e12d71a2816f6c13c13976f0d6b7e72e" }
opentide-lsp = { git = "https://github.com/opentidehq/language-server", rev = "687b8035e12d71a2816f6c13c13976f0d6b7e72e" }

[build-dependencies]
pyo3-build-config = "0.30.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# What an editable install (`uv sync`) builds for development and CI
# (hatch_build.py): optimised, so the engine runs at full speed in the test
# suite, without the release profile's slow link-time optimisation.
[profile.develop]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

# Its own workspace: built from an sdist or a checkout inside another Cargo
# workspace (language-server's canary checks opentide out in its tree), cargo
# would otherwise take this crate for a member of that one.
[workspace]
