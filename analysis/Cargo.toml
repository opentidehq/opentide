[package]
name = "opentide-native"
# Compiled into the opentide package as opentide._native (hatch_build.py),
# whose version comes from its git tag; this crate is never published.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
publish = false
description = "The analysis engine, the language server and the differential comparator, compiled into the opentide Python package"
repository = "https://github.com/opentidehq/opentide"

[lints]
workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform serves CPython 3.10 and later. A free-threaded
# interpreter (3.14t) has no stable ABI, so it builds from the sdist.
# generate-import-lib: a Windows build needs no python3.lib on the machine.
pyo3 = { workspace = true, features = ["abi3-py310", "generate-import-lib"] }
# The engine and the server, from this workspace (crates/).
opentide-analysis.workspace = true
opentide-lsp.workspace = true
# The differential comparator, for OPENTIDE_ENGINE=compare (UC-0.7, #805).
opentide-compare.workspace = true
# The Tide models as Python classes, opentide._native.models (UC-1.9, #815).
opentide-schema = { workspace = true, features = ["python"] }
# The Rust command line, for the commands ported to it (`cli_main`, run by
# `python -m opentide.cli.rust`).
opentide-cli.workspace = true

[features]
# PyO3's introspection data, from which `cargo xtask stubs` writes the
# generated stubs (src/opentide/_native/models.pyi). Only that build turns it
# on: the wheel carries no introspection data.
stubs = ["opentide-schema/stubs", "pyo3/experimental-inspect"]

[build-dependencies]
pyo3-build-config = "0.30.1"
