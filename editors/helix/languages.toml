# Helix — opentide

[[language]]
name = "opentide-yaml"
scope = "source.opentide-yaml"
file-types = ["yaml", "yml"]
roots = [".opentide", "objects"]
language-servers = ["opentide-lsp"]
# Disable yamlls on objects/** — opentide LSP owns Tide diagnostics.

[[language]]
name = "kql"
scope = "source.kql"
file-types = ["kql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "spl"
scope = "source.spl"
file-types = ["spl"]
language-servers = ["opentide-lsp"]

[[language]]
name = "esql"
scope = "source.esql"
file-types = ["esql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "eql"
scope = "source.eql"
file-types = ["eql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "kuery"
scope = "source.kuery"
file-types = ["kuery"]
language-servers = ["opentide-lsp"]

[[language]]
name = "lucene"
scope = "source.lucene"
file-types = ["lucene"]
language-servers = ["opentide-lsp"]

[[language]]
name = "falco"
scope = "source.falco"
file-types = ["falco"]
language-servers = ["opentide-lsp"]

# CrowdStrike Query Language (Falcon LogScale, Next-Gen SIEM). Cassandra's
# CQL uses `.cql` too: drop this block in a workspace of Cassandra scripts.
# The scope matches the TextMate grammar's, which avoids Cassandra's
# `source.cql`.
[[language]]
name = "cql"
scope = "source.opentide.cql"
file-types = ["cql"]
language-servers = ["opentide-lsp"]

# YARA signatures (libyara 4.5). The scope matches the TextMate grammar's,
# which avoids the YARA extensions' `source.yara`.
[[language]]
name = "yara"
scope = "source.opentide.yara"
file-types = ["yar", "yara"]
language-servers = ["opentide-lsp"]

# The Exabeam Query Language (Exabeam New-Scale SIEM). A `.exabeam` file is
# a search.
[[language]]
name = "exabeam"
scope = "source.exabeam"
file-types = ["exabeam"]
language-servers = ["opentide-lsp"]

# YARA-L 2.0 (Google Security Operations). The scope matches the TextMate
# grammar's, which avoids Google's own `source.yara-l`.
[[language]]
name = "yaral"
scope = "source.yaral"
file-types = ["yaral", "yl2"]
comment-token = "//"
language-servers = ["opentide-lsp"]

# Configuration TOML: the editor's TOML grammar highlights it, and opentide
# checks it. Only `opentide lsp start` has the checks; `opentide-lsp` on its
# own reports nothing for these files. Giving them their own language keeps
# a generic TOML server (taplo) off them.
[[language]]
name = "opentide-config"
scope = "source.toml"
grammar = "toml"
file-types = [{ glob = ".opentide/configurations/**/*.toml" }]
roots = [".opentide"]
language-servers = ["opentide"]

[language-server.opentide-lsp]
command = "opentide-lsp"
args = ["--stdio"]

# The server opentide ships, with configuration checks.
[language-server.opentide]
command = "opentide"
args = ["lsp", "start"]
