# Helix — opentide

[[language]]
name = "opentide-yaml"
scope = "source.opentide-yaml"
file-types = ["yaml", "yml"]
roots = [".opentide", "objects"]
language-servers = ["opentide-lsp"]
# Disable yamlls on objects/** — opentide LSP owns Tide diagnostics.

[[language]]
name = "kql"
scope = "source.kql"
file-types = ["kql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "spl"
scope = "source.spl"
file-types = ["spl"]
language-servers = ["opentide-lsp"]

[[language]]
name = "esql"
scope = "source.esql"
file-types = ["esql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "eql"
scope = "source.eql"
file-types = ["eql"]
language-servers = ["opentide-lsp"]

[[language]]
name = "kuery"
scope = "source.kuery"
file-types = ["kuery"]
language-servers = ["opentide-lsp"]

[[language]]
name = "lucene"
scope = "source.lucene"
file-types = ["lucene"]
language-servers = ["opentide-lsp"]

[language-server.opentide-lsp]
command = "opentide-lsp"
args = ["--stdio"]
