[workspace]
resolver = "2"
members = [
    "crates/opentide-core",
    "crates/opentide-highlight",
    "crates/opentide-syntax",
    "crates/opentide-kql",
    "crates/opentide-spl",
    "crates/opentide-esql",
    "crates/opentide-eql",
    "crates/opentide-kuery",
    "crates/opentide-lucene",
    "crates/opentide-ecs",
    "crates/opentide-tide",
    "crates/opentide-analysis",
    "crates/opentide-lsp",
    "crates/opentide-wasm",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
repository = "https://github.com/opentidehq/language-server"
homepage = "https://opentide.org"
authors = ["opentide"]

[workspace.dependencies]
opentide-core = { path = "crates/opentide-core", version = "=0.6.0" }
opentide-highlight = { path = "crates/opentide-highlight", version = "=0.6.0" }
opentide-syntax = { path = "crates/opentide-syntax", version = "=0.6.0" }
opentide-kql = { path = "crates/opentide-kql", version = "=0.6.0" }
opentide-spl = { path = "crates/opentide-spl", version = "=0.6.0" }
opentide-esql = { path = "crates/opentide-esql", version = "=0.6.0" }
opentide-eql = { path = "crates/opentide-eql", version = "=0.6.0" }
opentide-kuery = { path = "crates/opentide-kuery", version = "=0.6.0" }
opentide-lucene = { path = "crates/opentide-lucene", version = "=0.6.0" }
opentide-ecs = { path = "crates/opentide-ecs", version = "=0.6.0" }
opentide-tide = { path = "crates/opentide-tide", version = "=0.6.0" }
opentide-analysis = { path = "crates/opentide-analysis", version = "=0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
regex = "1"
lsp-types = "0.97"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
cc = "1"
uuid = "1"
similar = "2"
insta = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
