[workspace]
resolver = "2"
members = [
    "crates/opentide-core",
    "crates/opentide-highlight",
    "crates/opentide-syntax",
    "crates/opentide-kql",
    "crates/opentide-spl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
repository = "https://github.com/opentidehq/language-server"
authors = ["OpenTide"]

[workspace.dependencies]
opentide-core = { path = "crates/opentide-core" }
opentide-highlight = { path = "crates/opentide-highlight" }
opentide-syntax = { path = "crates/opentide-syntax" }
opentide-kql = { path = "crates/opentide-kql" }
opentide-spl = { path = "crates/opentide-spl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
regex = "1"
lsp-types = "0.97"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.25"
cc = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
insta = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
