# Install: uv sync --group dev && uv run pre-commit install --install-hooks
#
# pre-commit  — fast checks on staged files (seconds)
# pre-push    — scripts/ci-local.sh --full when code/CI config changes (matches CI:
#               lint + pytest + coverage gate from pyproject.toml). Do not swap
#               for pytest --no-cov or the coverage threshold will only fail on CI.
#
# CodeQL is intentionally NOT a hook — full analysis rebuilds the DB each run (~40–60s
# locally, minutes in CI). Use .github/workflows/codeql.yml + scripts/codeql-local.sh.
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.ambr$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allow custom YAML tags in GitHub Actions
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type checker
        entry: uv run ty check src/opentide
        language: system
        pass_filenames: false
        files: ^src/opentide/

      - id: ci-local-full
        name: CI parity before push (lint, tests, coverage gate)
        entry: scripts/ci-local.sh --full
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/opentide/|tests/|pyproject\.toml|uv\.lock|\.github/workflows/(ci|codeql|stack-comment)\.yml|scripts/(ci-local|codeql-local|jj-|github_stack_comment)\.(sh|py)|\.pre-commit-config\.yaml|AGENTS\.md|\.agents/skills/jujutsu/)

      - id: validate-docs
        name: validate docs structure (docs only)
        entry: scripts/validate-docs.sh
        language: system
        pass_filenames: false
        files: ^(docs/|scripts/validate-docs\.sh)
        stages: [pre-push]
