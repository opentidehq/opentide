# Install: uv sync --group dev && uv run pre-commit install --install-hooks
#
# pre-commit  — fast checks on staged files (seconds)
# pre-push    — scripts/ci-local.sh --full when code/CI config changes (matches CI:
#               lint + pytest + coverage gate from pyproject.toml, and the Rust
#               jobs). Do not swap for pytest --no-cov or the coverage threshold
#               will only fail on CI. With nightly and cargo-fuzz installed it
#               also fuzzes each target for 60 s: `FUZZ_SMOKE_SECONDS=0 git push`
#               skips that (CI runs it).
#
# CodeQL is intentionally NOT a hook — full analysis rebuilds the DB each run (~40–60s
# locally, minutes in CI). Use .github/workflows/codeql.yml + scripts/codeql-local.sh.
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The golden recordings and vendored fixtures are bytes the oracle wrote
      # or a repository shipped (tests/golden/README.md): the hooks that rewrite
      # or parse files leave them alone; detect-private-key and
      # check-merge-conflict still read them.
      - id: trailing-whitespace
        exclude: '\.ambr$|^tests/golden/(cases|blobs|fixtures)/'
      - id: end-of-file-fixer
        exclude: '^tests/golden/(cases|blobs|fixtures)/'
      - id: check-yaml
        args: [--unsafe]  # allow custom YAML tags in GitHub Actions
        exclude: '^tests/golden/(cases|blobs|fixtures)/'
      - id: check-toml
        exclude: '^tests/golden/(cases|blobs|fixtures)/'
      - id: check-merge-conflict
      - id: detect-private-key

  # ruff and ty run from the locked dev environment (uv.lock), so the hook and
  # CI can never disagree on the version and Dependabot bumps them in one place.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty type checker
        entry: uv run ty check src/opentide
        language: system
        pass_filenames: false
        files: ^src/opentide/

      - id: ci-local-full
        name: CI parity before push (lint, tests, coverage gate)
        entry: scripts/ci-local.sh --full
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/opentide/|tests/|pyproject\.toml|uv\.lock|hatch_build\.py|Cargo\.(toml|lock)|analysis/|crates/|data/catalogs/|grammars/|highlights/|scripts/engine/|\.github/workflows/(ci|codeql|stack-comment|engine-release|engine-release-build|engine-fuzz|oracle|publish-pypi)\.yml|scripts/(ci-local|codeql-local|github_stack_comment)\.(sh|py)|\.pre-commit-config\.yaml|AGENTS\.md)

      - id: validate-docs
        name: validate docs structure (docs only)
        entry: scripts/validate-docs.sh
        language: system
        pass_filenames: false
        files: ^(docs/|scripts/validate-docs\.sh)
        stages: [pre-push]
