[commands.load]
label = "load and index the workspace (SDK: Opentide.initialise())"
# UC-2.1 (#816): heavy workspace load and index in 80 ms or less on 4 cores.
# The oracle side is the SDK's registry load (`Opentide.initialise()`). Its
# time is recorded only on the EPYC 9V74 ([[cpu_baseline]] below, run
# 42758665925, the first that measured it), so on another CPU it is held to
# that median + cross_cpu_regression until a run there records its own.
baseline_rss_mib = 70.2
target_s = 0.08

[commands.rules_unreviewed]
label = "rules unreviewed"
baseline_s = 0.359
baseline_rss_mib = 52.9

[commands.explain]
label = "explain vocab_unknown"
plan_s = 0.18
baseline_s = 0.136
baseline_rss_mib = 36.3
target_s = 0.03

[commands.startup]
label = "opentide --version (the console script's start)"
# Plan D-3 and UC-3.8 (#830): `opentide --version` in 20 ms or less, through the
# console script, opentide._cli:main (UC-3.8b, #960; UC-6.2, #841). The rust engine runs it
# (and explain, above, whose 30 ms target is the other startup budget) through the
# launcher of `uv sync`; the oracle's start is not measured.
target_s = 0.02

[commands.lsp_first_diagnostics]
label = "language server, first diagnostics"
# Plan section 2: 0.7 to 3.0 s in the editor (vscode-extension, Python backend).
baseline_s = 1.515
baseline_rss_mib = 163.2
target_s = 0.1
# The language server misses the target. UC-2.6 (#821) rebuilt it on
# opentide-workspace and took its own Tide checks away (the platform-block
# analysis, and with it the editor's index of the other objects for the first
# diagnostics): measured on one machine (4-core Xeon 2.10GHz, not a runner of
# the class the numbers below come from, 7 runs each), the median moved from
# 0.147 s before that change to 0.144 s after it, inside the run-to-run
# spread. What is left is the workspace load `validate` needs before the first
# findings, so the waiver stays and names the item that addresses it.
target_waiver = "#926, the first diagnostics waiting for the workspace load"
rust_baseline_s = 0.154
# Plan section 11: editor memory per window (language server and backend) <= 150 MB,
# enforced as MiB (150e6 bytes).
target_rss_mib = 143.1

# The medians on more CPU models of the runner class, from CI runs of the workflow
# (same oracle, workspace and run count as [baseline]). Two runners with the same CPU
# model differ by up to about 10% on every command (run 42587161988 measured 3 to 12%
# above run 42514414249, both on EPYC 9V74), so where two runs exist the entry keeps
# each command's slower median, and the 10% rule starts from there. A report on one of
# these CPUs is held to its own numbers at policy.regression; on a CPU listed nowhere,
# to the slowest recorded + policy.cross_cpu_regression. Add an entry when a job's
# summary notes an unrecorded CPU, copying that job's medians.

[[cpu_baseline]]
engine = "python"
cpu_model = "AMD EPYC 7763 64-Core Processor"
# The slower median of each command over two runs on this CPU.
source = "https://github.com/opentidehq/opentide/actions/runs/42511597394 and https://github.com/opentidehq/opentide/actions/runs/42515106569"

