# What each language's passes cost (`cargo xtask throughput`, ADR 0014):
# parse alone and full analysis, over the short corpus and the external
# public rules. `<pass>` is the bench binary's own instructions in the
# counted pass (glibc and the loader left out), held within 3%;
# `<pass>_allocations` its calls into the allocator over the warm-up and
# counted passes, held within a few calls. Written by
# `cargo xtask throughput --record`, the highest of several runs. Record
# again when a change lowers counts on purpose, or raises them on purpose
# with the reason in its PR.
# Recorded on: valgrind-3.22.0, glibc 2.39, x86_64

