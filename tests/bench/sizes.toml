# The release artifacts' size budgets: the most bytes each may have (`scripts/av/sizes.py`,
# the AV gate's `markers` job, #1743). The embedded datasets are compressed at build time
# (opentide-dataset), which took 9 to 10 MB off each binary; a dataset stored loose again, or a
# decoder that grew, fails here. Move a budget in a change that says why.
#
# `glob` matches a file name (fnmatch) in the release assets or a wheel directory; a budget no file
# of the run matches is reported and passes (the assets and the wheels are separate downloads).
#
# Linux and WebAssembly: what `cargo build --release` made on the change (51.8 MB, 29.4 MB, 24.6 MB,
# 24.7 MB before; the WASI language server is built with `--profile wasi-lsp` since #1768, as
# `scripts/engine/build-wasm.sh wasi` does, so its budget is read from that build), +3%. The wheels: what the publish.yml dry run built (`opentide-1.0.0rc3`), +3%, measured again on 2026-11-22 (run 45007567075) after the NOTICE and licence files, the editor's deployment-state findings and the severity checks landed: every wheel but the Windows x64 one had grown 0.2 to 0.8% past its budget. The
# macOS binaries are not shipped as a budgeted file here: their wheels carry the same code.

[[artifact]]
glob = "opentide-v*-x86_64-unknown-linux-gnu"
max_bytes = 43_920_000

[[artifact]]
glob = "opentide-lsp-v*-x86_64-unknown-linux-gnu"
max_bytes = 20_710_000

[[artifact]]
glob = "opentide-lsp-wasm32-wasip1.wasm"
max_bytes = 15_900_000

# The command line's WASI module, which the VS Code extension pins (docs/internal/vscode-wasi.md):
# 18,952,428 bytes as `build-wasm.sh cli` built it on the change (8.3 MB at gzip -9, held to the
# .vsix's 15 MiB by the script), +3%.
[[artifact]]
glob = "opentide-wasm32-wasip1.wasm"
max_bytes = 19_530_000

[[artifact]]
glob = "opentide-wasm-web-v*.zip"
max_bytes = 5_800_000

[[artifact]]
glob = "opentide-*-cp310-abi3-win_amd64.whl"
max_bytes = 24_190_000

[[artifact]]
glob = "opentide-*-cp310-abi3-win_arm64.whl"
max_bytes = 22_440_000

[[artifact]]
glob = "opentide-*-cp310-abi3-manylinux_2_28_x86_64.whl"
max_bytes = 22_720_000

[[artifact]]
glob = "opentide-*-cp310-abi3-manylinux_2_28_aarch64.whl"
max_bytes = 21_230_000

[[artifact]]
glob = "opentide-*-cp310-abi3-macosx_10_12_x86_64.whl"
max_bytes = 22_090_000

[[artifact]]
glob = "opentide-*-cp310-abi3-macosx_11_0_arm64.whl"
