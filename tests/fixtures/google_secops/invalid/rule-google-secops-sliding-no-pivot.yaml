# A sliding window without the event it is anchored on.
# Expected code: yaral_match_shape.
name: Google SecOps sliding window without a pivot
metadata:
  uuid: 00000000-0000-4000-8003-000000000068
  schema: rule::1.0
  version: 1
  created: "2026-01-01"
  modified: "2026-01-02"
  tlp: clear
  author: Detection Engineering
description: |
  A sliding match window with no pivot or direction.
status: STAGING
severity: Medium
configurations:
  google_secops:
    enabled: true
    schema: platform::google_secops::1.0
    status: STAGING
    events: |
      $login.metadata.event_type = "USER_LOGIN"
      $login.target.user.userid = $user
      $proc.metadata.event_type = "PROCESS_LAUNCH"
      $proc.principal.user.userid = $user
    match:
      group_by: [$user]
      window: 5m
      type: sliding
    condition: |
      $login and $proc
