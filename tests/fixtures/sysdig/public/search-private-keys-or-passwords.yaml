name: Search Private Keys or Passwords
metadata:
  uuid: 7a9c3e52-1f08-4b6d-a2e4-9d1f5c7b3e28
  schema: rule::1.0
  version: 1
  created: '2026-11-02'
  modified: '2026-11-02'
  tlp: clear
  author: Detection Engineering
description: |
  Attempts to search for private keys or passwords with grep or find.
techniques:
- T1552.001
response:
  alert_severity: Medium
configurations:
  sysdig:
    enabled: true
    schema: platform::sysdig::1.0
    status: PRODUCTION
    priority: WARNING
    condition: >
      spawned_process
      and ((grep_commands and private_key_or_password) or
           (proc.name = "find" and (proc.args contains "id_rsa" or
                                    proc.args contains "id_dsa" or
                                    proc.args contains "id_ed25519" or
                                    proc.args contains "id_ecdsa"
            )
          ))
    macros:
    - name: grep_commands
      condition: (proc.name in (grep_binaries))
    - name: grep_more
      condition: (grep_commands and proc.args icontains "-r")
    - name: private_key_or_password
      condition: >
        (proc.args icontains "BEGIN PRIVATE" or
         proc.args icontains "BEGIN OPENSSH PRIVATE" or
         proc.args icontains "BEGIN RSA PRIVATE" or
         proc.args icontains "BEGIN DSA PRIVATE" or
         proc.args icontains "BEGIN EC PRIVATE" or
         (grep_more and
          (proc.args icontains " pass " or
           proc.args icontains " ssh " or
           proc.args icontains " user "))
        )
    lists:
    - name: grep_binaries
      items: [grep, egrep, fgrep]
    tags: [host, container, process, filesystem]
