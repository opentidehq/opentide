name: Contact K8S API Server From Container, monitoring agents excluded
metadata:
  uuid: 8e3b5c27-6a1d-4f94-9b02-1c7e4a6d8f35
  schema: rule::1.0
  version: 1
  created: '2026-11-02'
  modified: '2026-11-02'
  tlp: clear
  author: Detection Engineering
description: |
  Monitoring agents query the Kubernetes API from their containers by design.
response:
  alert_severity: Low
configurations:
  sysdig:
    enabled: true
    schema: platform::sysdig::1.0
    status: PRODUCTION
    append_to_rule: Contact K8S API Server From Container
    condition: and not container.image.repository in (monitoring_images)
    exceptions:
    - name: monitoring_namespaces
      fields: [k8s.ns.name, proc.name]
      comps: [in, '=']
      values:
      - [[monitoring, observability], node-exporter]
    lists:
    - name: monitoring_images
      items: [quay.io/prometheus/node-exporter, docker.io/grafana/agent]
