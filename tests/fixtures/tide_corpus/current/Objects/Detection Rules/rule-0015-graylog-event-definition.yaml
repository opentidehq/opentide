name: Graylog Event Definition Rule

metadata:
  uuid: 00000000-0000-4000-8003-00000091a7e0
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear

description: |
  Simulated Graylog event definition for CLI E2E corpus: an Office
  application starting an encoded PowerShell, three times in fifteen minutes.
status: STAGING
severity: High
techniques:
  - T1059.005
detection_model: 00000000-0000-4000-8002-000000000001

response:
  alert_severity: High

configurations:
  graylog:
    enabled: true
    schema: platform::graylog::1.0
    status: STAGING
    tags: [office]
    streams: sysmon
    schedule: {every: 5m, window: 15m}
    aggregation:
      group_by: source
      condition: count() >= 3
    event_fields:
      host: source
    event_key: host
    notifications: soc-slack
    query: >-
      EventID:1
      AND parent_image_lc:/.*\\(winword|excel)\.exe/
      AND command_line_lc:/.* -enc .*/
