name: Exabeam Correlation Rule

metadata:
  uuid: 00000000-0000-4000-8003-0000e8ab0001
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear

description: |
  Simulated Exabeam correlation rule for CLI E2E corpus: one source address
  failing to log in as many users.
status: STAGING
severity: High
techniques:
  - T1059.005
detection_model: 00000000-0000-4000-8002-000000000001

response:
  alert_severity: High

configurations:
  exabeam:
    enabled: true
    schema: platform::exabeam::1.0
    status: STAGING
    outcome: case
    sequences:
      - name: Failed logins
        query: |
          activity_type:"app-login" AND outcome:"fail"
        group_by: [src_ip]
        threshold:
          function: unique_count
          field: user
          operator: more_than
          value: 3
          within: 30m
    suppression:
      for: 1h
