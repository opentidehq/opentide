routes = ["misp.invalid"]
secrets = ["MISP_API_KEY"]
cwd = "repo"
exit = 3

[[scenario]]
name = "golden/share-retract"
description = "share retract on the MISP stand-in, the golden cases' cassette: a shared rule's event unpublished, and an object gone from the catalogue whose event the instance no longer holds forgotten."
client = ["/bin/sh", "-c", "cp -R tests/golden/fixtures/share-misp \"$HOME/ws\" && exec {oracle}/opentide --repo \"$HOME/ws\" --json share retract --target misp-prod --uuid 00000000-0000-4000-8048-000000000012 --uuid 00000000-0000-4000-8048-000000000020"]
tenant = ["{python}", "tests/cassettes/misp/tenant.py"]
routes = ["misp.invalid"]
secrets = ["MISP_API_KEY"]
cwd = "repo"

[[scenario]]
name = "golden/share-push-changed"
description = "share push --changed on the MISP stand-in, the golden cases' cassette (UC-4.4e): share-misp as a checkout whose last commit, a GitHub push, changed one rule; misp-prod probed and that rule's event updated over the instance's own object, nothing else shared; misp-locked refused at its probe (403): a partial run."
client = ["/bin/sh", "-c", "cp -R tests/golden/fixtures/share-misp \"$HOME/ws\" && cd \"$HOME/ws\" && export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_AUTHOR_NAME='opentide golden' GIT_AUTHOR_EMAIL=golden@opentide.invalid GIT_AUTHOR_DATE=2026-01-01T00:00:00Z GIT_COMMITTER_NAME='opentide golden' GIT_COMMITTER_EMAIL=golden@opentide.invalid GIT_COMMITTER_DATE=2026-01-01T00:00:00Z && g() { git -c init.defaultBranch=main -c commit.gpgsign=false -c core.autocrlf=false -c maintenance.auto=false -c gc.auto=0 \"$@\"; } && g init -q && g add -A && g commit -q --no-verify -m 'The fixture' && sed -i 's/^  A rule the MISP stand-in receives\\.$/  A rule the MISP stand-in receives, changed by a push./' objects/rules/rule-b-update.yaml && g commit -q --no-verify -a -m 'A push' && GITHUB_ACTIONS=true GITHUB_EVENT_NAME=push GITHUB_SHA=HEAD GITHUB_WORKSPACE=\"$HOME/ws\" exec {oracle}/opentide --repo \"$HOME/ws\" --json share push --changed"]
tenant = ["{python}", "tests/cassettes/misp/tenant.py"]
routes = ["misp.invalid"]
secrets = ["MISP_API_KEY"]
cwd = "repo"
exit = 3

