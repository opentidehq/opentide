description = "`setup skills --install` of a skill one of whose files answers 404 (UC-4.4d): the failed download, which writes nothing."
client = ["{oracle}/opentide", "--json", "setup", "skills", "--generic", "--install", "broken-skill", "--yes"]
tenant = ["{python}", "tests/cassettes/skills/tenant.py"]
routes = ["raw.githubusercontent.com", "api.github.com"]
cwd = "tmp"
exit = 1

