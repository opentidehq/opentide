# ---- UC-4.4b (#834): the cassettes of `opentide share`'s golden cases ----
# The client copies the `share-misp` fixture first: a push or a retract writes
# the sharing ledger, and the repository's copy stays as committed.

[[scenario]]
name = "golden/share-push"
description = "share push on the MISP stand-in, the golden cases' cassette: misp-prod probed (version, organisation, template), the threat and the objective created and published (the galaxy's ATT&CK and actor clusters read once), a rule updated over the instance's own object, one unchanged; misp-locked refused at its probe (403): a partial run."
client = ["/bin/sh", "-c", "cp -R tests/golden/fixtures/share-misp \"$HOME/ws\" && exec {oracle}/opentide --repo \"$HOME/ws\" --json share push"]
