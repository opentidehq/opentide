[[scenario]]
name = "sysdig/deploy"
description = "Sysdig's deployer on the tide corpus's Falco rule: create and join the runtime policy, update, rename, disable (leave the policy), delete, recreate a rule the tenant lost, forget one to disable, a missing policy, a rule the tenant rejects and a refused token."
