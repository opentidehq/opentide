# ---- UC-4.2b (#832): Defender for Endpoint, Elastic, SentinelOne ----
# Each platform's stand-in tenant (tenant.py) answers as the Python suite's mocks
# do; client.py drives the oracle's own client, runner, deployer or validator
# through the scenario. `client.py fixture <path>` writes the inputs the Rust
# tests give the connector (crates/opentide-connectors/tests/fixtures/).

[[scenario]]
name = "defender/deploy"
description = "Defender for Endpoint: sign in, create a rule (refused, then created with the safer configuration), update it, update an id Graph does not know (404), delete it."
