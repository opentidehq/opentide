# ---- UC-4.6 (#979): the cassettes of `opentide deploy`'s golden cases ----
# A deploy that sends, on each platform whose requests replay, against the
# `deploy-tenants` fixture. The client copies the fixture first: a deploy
# writes deployment state, and the repository's copy stays as committed.
# Sentinel has none (azure-core's and MSAL's random request ids), nor has a
# Carbon Black Cloud create or update (the SDK stamps the report with the
# time), nor HarfangLab (the oracle's deploy stops on an AttributeError before
# any request: its configuration has no HarfangLab section):
# crates/opentide-cli/tests/deploy_send.rs replays their connector cassettes
# through the CLI flow.

[[scenario]]
name = "golden/deploy-defender"
description = "deploy on Defender for Endpoint's stand-in, the golden cases' cassette: sign in, create a rule (its id recorded), then update a recorded id Graph does not know (404): the run stops, the retired rule not attempted."
client = ["/bin/sh", "-c", "cp -R tests/golden/fixtures/deploy-tenants \"$HOME/ws\" && exec {oracle}/opentide --repo \"$HOME/ws\" --json deploy --platform defender_for_endpoint --strategy PREVIEW --strategy RELEASE --all --keep-deprecated"]
tenant = ["{python}", "tests/cassettes/defender/tenant.py"]
routes = ["login.microsoftonline.com", "graph.microsoft.com"]
secrets = ["DEFENDER_CLIENT_SECRET"]
cwd = "repo"
exit = 1

