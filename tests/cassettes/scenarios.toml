# ---- UC-4.2c (#832): the cassettes of `opentide query`'s golden cases ----
# The client is the oracle's command line, on tests/golden/fixtures/tenants (the
# golden fixture `tenants`), against the platforms' stand-in tenants above; the
# case in tests/golden/cases.toml that names the cassette runs the same arguments,
# with a window in 2099 so no retention or clock moves the requests.

[[scenario]]
name = "golden/query-defender"
description = "opentide query on Defender for Endpoint's stand-in, the golden cases' cassette: sign in, then one hunting query whose two rows pass --limit 1."
client = ["{oracle}/opentide", "--repo", "tests/golden/fixtures/tenants", "--json", "query", "--platform", "defender_for_endpoint", "--from", "2099-01-01T00:00:00Z", "--to", "2099-01-01T01:00:00Z", "--limit", "1", "DeviceProcessEvents | project Timestamp, DeviceName"]
tenant = ["{python}", "tests/cassettes/defender/tenant.py"]
routes = ["login.microsoftonline.com", "graph.microsoft.com"]
secrets = ["DEFENDER_CLIENT_SECRET"]
cwd = "repo"

[[scenario]]
name = "golden/query-sentinel-one"
description = "opentide query on SentinelOne's stand-in, the golden cases' cassette: a PowerQuery that finishes at once."
client = ["{oracle}/opentide", "--repo", "tests/golden/fixtures/tenants", "--json", "query", "--platform", "sentinel_one", "--from", "2099-01-01T00:00:00Z", "--to", "2099-01-01T01:00:00Z", "src.process.name = 'cmd.exe'"]
tenant = ["{python}", "tests/cassettes/sentinel_one/tenant.py"]
routes = ["s1.invalid"]
secrets = ["S1_API_TOKEN"]
cwd = "repo"

[[scenario]]
