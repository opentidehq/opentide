client = ["{oracle}/opentide", "--repo", "tests/golden/fixtures/tenants", "--json", "query", "--platform", "splunk", "--from", "2099-01-01T00:00:00Z", "--to", "2099-01-01T01:00:00Z", "--limit", "2", "index=main EventCode=4688"]
tenant = ["{python}", "tests/cassettes/splunk/tenant.py"]
routes = ["splunk.invalid"]
secrets = ["SPLUNK_TOKEN"]
cwd = "repo"

[[scenario]]
name = "golden/query-carbon-black"
description = "opentide query on Carbon Black Cloud's stand-in, the golden cases' cassette: a process search validated, started, polled until complete and read past --limit 2."
client = ["{oracle}/opentide", "--repo", "tests/golden/fixtures/tenants", "--json", "query", "--platform", "carbon_black_cloud", "--from", "2099-01-01T00:00:00Z", "--to", "2099-01-01T01:00:00Z", "--limit", "2", "process_name:cmd.exe"]
tenant = ["{python}", "tests/cassettes/carbon_black/tenant.py"]
