# Generated by opentide. Re-run `opentide setup hooks` to refresh.
repos:
  - repo: local
    hooks:
      - id: opentide-validate
        name: opentide validate
        entry: sh -c 'repo="$(git rev-parse --show-toplevel)"; if [ ! -d "$repo/.opentide" ]; then echo "No opentide workspace at $repo (missing .opentide/). Re-run opentide setup hooks, or set SKIP=opentide-validate to bypass." >&2; exit 1; fi; exec opentide --repo "$repo" validate --strict'
        language: system
        pass_filenames: false
        always_run: true
