# A CI sink: GitHub annotations on stdout.
[[case]]
command = "validate"
variant = "ci-github"
args = ["validate"]
modes = ["plain", "agent"]
fixtures = ["vscode"]
env = { GITHUB_ACTIONS = "true" }

# UC-3.4 (#826): a report printed whole on stdout, without --output. The
# fault workspace's validate reports are not recorded: its deployment-state
# findings name the workspace's absolute path, which differs between two runs
# and so does their fingerprint. lint's are (below); the renderer tests
# compare validate's (crates/opentide-cli/tests/render.rs).
[[case]]
command = "validate"
variant = "sarif-stdout"
args = ["validate", "--format", "sarif"]
modes = ["plain"]
fixtures = ["tide-corpus"]

# The report options' usage errors (exit 2).
[[case]]
command = "validate"
variant = "output-without-format"
args = ["validate", "--output", "report.sarif"]
fixtures = ["tide-corpus"]

# UC-3.4 (#826): the CI sinks of each provider, with its variables set and its
# summary file captured. Annotations go to stdout; json mode has no sinks.
[[case]]
command = "validate"
variant = "ci-sink-github"
args = ["validate"]
modes = ["plain", "agent", "json"]
fixtures = ["fault"]
env = { GITHUB_ACTIONS = "true", GITHUB_WORKSPACE = "<WS>", GITHUB_STEP_SUMMARY = "<TMP>/tmp/github-step-summary.md" }

[[case]]
command = "validate"
variant = "ci-sink-gitlab"
args = ["validate"]
modes = ["plain", "agent", "json"]
fixtures = ["fault"]
env = { GITLAB_CI = "true", CI_PROJECT_DIR = "<WS>" }

[[case]]
command = "validate"
variant = "ci-sink-azure"
args = ["validate"]
modes = ["plain", "agent", "json"]
fixtures = ["fault"]
env = { TF_BUILD = "True", BUILD_SOURCESDIRECTORY = "<WS>", AGENT_TEMPDIRECTORY = "<TMP>/tmp/agent" }

# UC-3.4 (#826): progress events, NDJSON on stderr (vscode-extension CONTRACTS.md).
# Not on the fault workspace: its vocabulary warnings come from worker threads,
# between the events at a different place each run.
[[case]]
command = "validate"
variant = "progress-json"
args = ["validate"]
modes = ["json", "plain"]
fixtures = ["tide-corpus"]
env = { OPENTIDE_PROGRESS = "json" }

