variant = "technique-before-section"
args = ["info", "--technique", "T1059", "coverage"]
fixtures = ["tide-corpus"]

[[case]]
command = "lint"
variant = "file-missing"
args = ["lint", "--file", "objects/rules/example.yaml"]
fixtures = ["tide-corpus"]

[[case]]
command = "validate"
variant = "file-example-missing"
args = ["validate", "--file", "objects/rules/example.yaml"]
fixtures = ["tide-corpus"]

[[case]]
command = "validate"
variant = "check-queries"
args = ["validate", "--check", "queries"]
fixtures = ["tide-corpus"]

[[case]]
command = "query"
variant = "defender-file"
args = ["query", "--platform", "defender_for_endpoint", "--file", "objects/rules/suspicious-lsass.yaml"]
fixtures = ["vscode"]

# Tenant-contacting: the corpus has an elastic tenant; the network is refused.
[[case]]
command = "query"
variant = "elastic-eql"
args = ["query", "--platform", "elastic", "--language", "eql", "--index", "logs-*", "process where process.name == \"cmd.exe\""]
fixtures = ["tide-corpus"]

[[case]]
command = "rules unreviewed"
variant = "default"
args = ["rules", "unreviewed"]
fixtures = ["tide-corpus"]

[[case]]
command = "rules unreviewed"
variant = "hours"
args = ["rules", "unreviewed", "--older-than", "12h"]
fixtures = ["tide-corpus"]

[[case]]
command = "setup"
variant = "platform-ci"
args = ["setup", "--yes", "--platform", "sentinel", "--ci", "github"]
normalise = ["fresh-uuids"]
fixtures = ["none"]

[[case]]
command = "share push"
variant = "default"
args = ["share", "push"]
fixtures = ["tide-corpus"]

# --changed outside a git repository.
[[case]]
command = "share push"
variant = "changed"
args = ["share", "push", "--changed"]
fixtures = ["tide-corpus"]

# docs/cli/share.md: --since names the start, so it runs outside CI; no git repository.
[[case]]
command = "share push"
variant = "changed-since"
args = ["share", "push", "--changed", "--since", "0123456789abcdef0123456789abcdef01234567"]
fixtures = ["tide-corpus"]

# Retract without --uuid may prompt: human mode is left out (interactive prompt).
[[case]]
command = "share retract"
variant = "no-uuid"
args = ["share", "retract"]
modes = ["plain", "json", "agent"]
fixtures = ["tide-corpus"]
