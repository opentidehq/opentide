vars = { rule_file = "objects/rules/rule-0001-sentinel-kql.yaml" }
edits = [{ path = "Objects/Detection Rules/rule-0001-sentinel-kql.yaml", find = "\nseverity: High\n", replace = "\nseverity: high\n" }]

