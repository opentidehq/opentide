# The golden cases: what `cargo xtask golden record` runs through the oracle
# (tests/golden/README.md). Reviewed like code; the recordings under cases/
# are generated from it and never edited.
#
# Each [[case]] runs in every mode of `modes` against every fixture of
# `fixtures` (the defaults below unless it sets its own). `args` follow
# `opentide`; `{name}` is a variable of the fixture, and a fixture without it
# is left out of that case. json mode puts --json right after `opentide`.

[defaults]
modes = ["human", "plain", "json", "agent"]
fixtures = ["tide-corpus", "vscode", "heavy-small", "empty", "none"]
timeout_secs = 180

[fixtures.tide-corpus]
kind = "tide-corpus"
source = "tests/fixtures/tide_corpus/current"
about = "tests/fixtures/tide_corpus, in the .opentide/ layout the Python suite gives it"
vars = { threat = "00000000-0000-4000-8001-000000000001", objective = "00000000-0000-4000-8002-000000000001", rule = "00000000-0000-4000-8003-000000000001", rule_file = "objects/rules/rule-0001-sentinel-kql.yaml" }

[fixtures.tide-corpus-typo]
kind = "tide-corpus"
source = "tests/fixtures/tide_corpus/current"
about = "tide-corpus with one typo `validate --fix` repairs in place (`severity: high`)"
vars = { rule_file = "objects/rules/rule-0001-sentinel-kql.yaml" }
edits = [{ path = "Objects/Detection Rules/rule-0001-sentinel-kql.yaml", find = "\nseverity: High\n", replace = "\nseverity: high\n" }]

[fixtures.vscode-unscoped]
kind = "copy"
source = "tests/golden/fixtures/vscode-workspace"
about = "vscode with signal entities written without their stage or in the wrong case, which `migrate vocab-scope --apply` rewrites in place"
edits = [{ path = "objects/objectives/detect-lsass-access.yaml", find = "\n  tlp: amber\n", replace = "\n  tlp: amber\nobjective:\n  signals:\n    - name: LSASS handle\n      entities:\n        - hostname  # no stage\n        - 'host::command line'\n    - name: Dump\n      entities: [Process, Host::Hostname]\n" }]

[fixtures.vscode-ambiguous]
kind = "copy"
source = "tests/golden/fixtures/vscode-workspace"
about = "vscode with a signal entity defined under several stages (`Account`), which `migrate vocab-scope` leaves for a person (exit 2), beside one it rewrites (`Process`)"
edits = [{ path = "objects/objectives/detect-lsass-access.yaml", find = "\n  tlp: amber\n", replace = "\n  tlp: amber\nobjective:\n  signals:\n    - name: LSASS handle\n      entities:\n        - Account\n        - Process\n" }]

[fixtures.vscode-docs-folder]
kind = "copy"
source = "tests/golden/fixtures/vscode-workspace"
about = "vscode with the legacy `[paths.core]` `docs_folder` set and no documentation.toml `output`: a paths.toml both engines refuse in the step of every `generate` command (#936, #946), and which `setup ci` does not read"
edits = [{ path = ".opentide/configurations/paths.toml", find = "[paths.objects]\n", replace = "[paths.core]\ndocs_folder = \"site\"\n\n[paths.objects]\n" }]

[fixtures.vscode]
kind = "copy"
source = "tests/golden/fixtures/vscode-workspace"
about = "the VS Code extension's fixture workspace, vendored (fixtures/vscode-workspace.SOURCE.toml)"
vars = { objective = "04149254-2a5b-4c1e-9f0e-3c1d2b5a6e7f", rule = "ff8bf67e-64dc-460d-b5df-48db643f3560", rule_file = "objects/rules/suspicious-lsass-access.yaml" }

[fixtures.heavy-small]
kind = "generated"
argv = ["cargo", "xtask", "corpus", "generate", "--seed", "1", "--threats", "30", "--objectives", "30", "--rules", "50", "--out", "{out}"]
about = "UC-0.6's heavy workspace generator, seed 1: 30 threats, 30 objectives, 50 rules; generated at record and check time, never committed"

[fixtures.fault]
kind = "generated"
argv = ["cargo", "xtask", "corpus", "faults", "--out", "{out}"]
about = "UC-0.6's fault workspace: seed 1, 120 threats, 60 objectives, 600 rules, every fault kind not marked isolated applied; generated at record and check time, never committed. Its outputs are recorded as they are, not asserted against the fault manifest"

[fixtures.setup-merge]
kind = "copy"
source = "tests/golden/fixtures/setup-merge"
about = "a workspace whose files `setup` merges into: a .vscode/mcp.json with a byte-order mark, comments and a trailing comma, a .vscode/settings.json with a comment and the yaml.schemas mapping earlier `setup vscode` releases wrote, and a sentinel.toml with `enabled = false`"

[fixtures.empty]
kind = "skeleton"
dirs = [".opentide"]
about = "an empty workspace: .opentide/ and nothing else"

[fixtures.none]
kind = "skeleton"
about = "no workspace at all: an empty directory"

