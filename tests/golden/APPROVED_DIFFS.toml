# The approved-diffs ledger (plan §5.2, #805): every intended difference
# between the oracle (the Python CLI at the tag in ORACLE) and a candidate
# (today's Python against its recordings, or a Rust implementation in
# `OPENTIDE_ENGINE=compare`). Anything that differs and is not here is a bug.
#
# The comparator (crates/opentide-compare) reads this file through
# `cargo xtask compare` and `cargo xtask golden check`. `cargo xtask compare
# --check-ledger` checks it, and xtask/tests/ledger.rs runs that check in CI.
#
# Each entry is a [[diff]] table, and every field is required:
#
#   command    the command path, words one space apart: "generate docs rules"
#   case       a glob over case ids: `*` any run of characters, `?` one
#   target     stdout | stderr | exit_code | file:<path relative to the workspace>
#   rule       json:<JSON pointer> (the value there in the target's JSON
#              document; "json:" alone is the whole document) or text
#   oracle     a json: rule: the oracle's value there, as JSON, or (absent);
#              a text rule: one whole line of the oracle's target, without
#              its line ending;
#              exit_code: the oracle's code
#   candidate  the same, for the candidate
#   reason     why the difference is intended
#   issue      https://github.com/opentidehq/<repository>/issues/<number>
#   changelog  text of the CHANGELOG.md entry that announces it (its bold lead)
#
# An entry applies only where both values are found as written, and only for
# its command, case glob and target: every other difference is still
# reported. A text rule is one whole line on each side, approved where the
# oracle and candidate lines match it at the same line number; part of a line
# approves nothing. An entry that applies to no case in a complete run is stale,
# and fails the run: remove it in the change that makes it stale. Differences
# in a file's presence, mode or deletion have no rule: fix them instead.
#
# [[diff]]
# command = "info"
# case = "json/*"
# target = "stdout"
# rule = "json:/summary/rules"
# oracle = "3"
# candidate = "4"
# reason = "the Rust index counts nested rules"
# issue = "https://github.com/opentidehq/opentide/issues/817"
# changelog = "**Nested rules are counted**"
#
# Intended differences decided but not yet entered (UC-3.3, #825): no golden
# case reaches them through `OPENTIDE_ENGINE=rust` until a command runs on
# the Rust CLI, and an entry that applies to no case is stale and fails the
# run. Each one is entered, with its rule, in the change that routes its
# cases to Rust; the CHANGELOG already announces them under
# "**The Rust command line's framework, `opentide-cli`**":
#
# - `--help` (every command, every mode): clap's layout instead of Typer's
#   boxed panels (UC-3.8, when help leaves the Python launcher).
# - "did you mean": strsim's Jaro similarity at clap's 0.7 threshold after
#   the same first rules, instead of difflib's ratio at 0.6.
# - the crash report: `build: rust (<target>)` for `python: ...` in the
#   crash log and issue link; `error[internal]: panic: <message>`; the crash
#   log's `arguments:` quoted by the shlex crate (`'--x=1'`, `"it's"`).
# - a bare `mcp`, `lsp` or `new` in plain and human mode: clap's help of the
#   group on stdout, exit 2 as before (the `--help` difference above).
#
# Decided by UC-3.4 (#826), the renderers; entered when `validate`, `lint`
# and the other commands route their cases to Rust (UC-3.5). The CHANGELOG
# announces them under "**The Rust command line's renderers**":
#
# - glyphs and frame characters on a stream that cannot encode them: the
#   Rust CLI writes UTF-8 everywhere, with no ASCII fallback (`ok`, `-->`,
#   `|`, `^`) and no `?` for other characters. No golden case runs on such a
#   stream (every case is UTF-8), so no entry may be needed.
# - terminal cell widths from the `unicode-width` crate instead of Rich's
#   tables: a character the two measure differently can move an underline or
#   a wrap point by one cell in `human` mode (a terminal of 100 columns).
#   The fault workspace and every code's frame measure the same today
#   (crates/opentide-cli/tests/render.rs).
# - SARIF rules: the oracle (0.23.0) predates retired codes and the `cql_`
#   reference; development tags `crowdstrike_unsupported` `retired`
#   (#800) and lists the CQL codes, and the Rust catalogue follows
#   development, so `validate --format sarif` and `lint --format sarif`
#   differ from the oracle's recordings there.
# - `-h` (and `-Vh`): clap's short help flag shows the help, exit 0, where the
#   oracle had no `-h` (`No such option: -h`, exit 2).
