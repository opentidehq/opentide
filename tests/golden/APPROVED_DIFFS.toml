# The approved-diffs ledger (plan §5.2, #805): every intended difference
# between the oracle (the Python CLI at the tag in ORACLE) and a candidate
# (today's Python against its recordings, or a Rust implementation in
# `OPENTIDE_ENGINE=compare`). Anything that differs and is not here is a bug.
#
# The comparator (crates/opentide-compare) reads this file through
# `cargo xtask compare` and `cargo xtask golden check`. `cargo xtask compare
# --check-ledger` checks it, and xtask/tests/ledger.rs runs that check in CI.
#
# Each entry is a [[diff]] table, and every field is required:
#
#   command    the command path, words one space apart: "generate docs rules"
#   case       a glob over case ids: `*` any run of characters, `?` one
#   target     stdout | stderr | exit_code | file:<path relative to the workspace>
#   rule       json:<JSON pointer> (the value there in the target's JSON
#              document; "json:" alone is the whole document) or text
#   oracle     a json: rule: the oracle's value there, as JSON, or (absent);
#              a text rule: one whole line of the oracle's target, without
#              its line ending;
#              exit_code: the oracle's code
#   candidate  the same, for the candidate
#   reason     why the difference is intended
#   issue      https://github.com/opentidehq/<repository>/issues/<number>
#   changelog  text of the CHANGELOG.md entry that announces it (its bold lead)
#
# An entry applies only where both values are found as written, and only for
# its command, case glob and target: every other difference is still
# reported. A text rule is one whole line on each side, approved where the
# oracle and candidate lines match it at the same line number; part of a line
# approves nothing. An entry that applies to no case in a complete run is stale,
# and fails the run: remove it in the change that makes it stale. Differences
# in a file's presence, mode or deletion have no rule: fix them instead.
#
# [[diff]]
# command = "info"
# case = "json/*"
# target = "stdout"
# rule = "json:/summary/rules"
# oracle = "3"
# candidate = "4"
# reason = "the Rust index counts nested rules"
# issue = "https://github.com/opentidehq/opentide/issues/817"
# changelog = "**Nested rules are counted**"
#
# Intended differences decided but not yet entered (UC-3.3, #825): no golden
# case reaches them through `OPENTIDE_ENGINE=rust` until a command runs on
# the Rust CLI, and an entry that applies to no case is stale and fails the
# run. Each one is entered, with its rule, in the change that routes its
# cases to Rust; the CHANGELOG already announces them under
# "**The Rust command line's framework, `opentide-cli`**":
#
# - `--help` (every command, every mode): clap's layout instead of Typer's
#   boxed panels (UC-3.8, when help leaves the Python launcher).
# - "did you mean": strsim's Jaro similarity at clap's 0.7 threshold after
#   the same first rules, instead of difflib's ratio at 0.6.
# - the crash report: `build: rust (<target>)` for `python: ...` in the
#   crash log and issue link; `error[internal]: panic: <message>`; the crash
#   log's `arguments:` quoted by the shlex crate (`'--x=1'`, `"it's"`).
# - a bare `mcp`, `lsp` or `new` in plain and human mode: clap's help of the
#   group on stdout, exit 2 as before (the `--help` difference above).
# - `-h` (and `-Vh`): clap's short help flag shows the help, exit 0, where the
#   oracle had no `-h` (`No such option: -h`, exit 2).
#
# The object models (UC-1.3, #809), decided and checked case by case in
# crates/opentide-schema/tests/oracle/objects_cases.toml (`[[difference]]`,
# run by crates/opentide-schema/src/objects/table.rs) and on the fault catalogue
# (xtask/src/corpus/structural.rs `APPROVED`); entered here when `validate`
# routes to Rust (UC-2.x):
#
# - `yaml-1-2-dates`: `created: 2026-01-01 10:00:00` stays as written; an
#   unquoted `reviewed: 2026-02-30` is the field's `schema_validation`
#   (`value_error`), not `yaml_parse` ("**Tide objects are read as YAML 1.2**").
# - `date-fields-are-strings`: `created`/`modified` written as a number, a
#   boolean or null are `string_type` ("**`created` and `modified` are text**").
# - `reviewed-validity-message`: an impossible `reviewed` is explained in
#   jiff's words; year 0000 and an instant outside the years 0001 to 9999 in
#   UTC are refused (the oracle crashed on the offset case); other digits than
#   ASCII's, and padding with U+001C to U+001F (which Python's `strip()`
#   removed), get the shape message ("**An impossible `reviewed` date is
#   explained by the date library**").
# - `public-reference-keys`: a `references.public` key is an integer, or a
#   string of ASCII digits with an optional sign, within i64. A word,
#   whitespace, `_` separators, other digits than ASCII's, a float (which the
#   oracle truncated) or a boolean is `int_parsing` or `int_type` at the
#   key, and an unquoted integer wider than i64 is `yaml_parse`, where the
#   oracle crashed on a word and accepted the rest through `int()` ("**A public reference number must be written as an
#   integer**").
# - `positions`: a `null` value has a `yaml_line`; an error under an integer
#   key is placed at that key ("**Findings point at the key or value they are
#   about**").
# - `strict-types`: `version: 1.5` is `int_type`, not `int_from_float`
#   ("**Field types are checked as declared**").
#
# Intended differences decided but not yet entered (#790, the engine crates'
# one suggestion rule, `opentide_core::suggest`): the engine's suggestions
# reach the recordings only through `validate` and `validate query` on the
# `fault` fixture, and no golden case reaches those commands through
# `OPENTIDE_ENGINE=rust` until they run on the Rust CLI (UC-2.7, UC-3.5), so
# an entry now would apply to no case and fail `golden check --engine
# compare` as stale. They are entered, with these rules, in the change that
# routes `validate` and `validate query` to Rust; the CHANGELOG already
# announces them under "**The query engines suggest by the same rule**".
# Codes, severities and ranges do not change. The rule bounds the edits by a
# third of the words that hold the part that differs, so two edits side by
# side or two characters cut from a long name (`SecurityEve`, a
# `detection_model` UUID) are found as before, and callers with a stated
# bound (`detection_model` two edits, CQL events one) keep it; no recording
# reaches those. The one recorded difference:
# `process.pid::foo` (objects/rules/encoded-downgrade-rule-0170.yaml:53:56,
# `esql_unknown_type`) is three edits from `bool`, more than a third of its
# length, so the shared rule suggests nothing and the help falls back to the
# finding's reference link:
#
# [[diff]]
# command = "validate"
# case = "json/fault/*"
# target = "stdout"
# rule = "json:/report/issues/29/suggestion"
# oracle = '"bool"'
# candidate = "null"
# reason = "the engines' one suggestion rule (opentide_core::suggest) suggests nothing three edits from a three-letter word"
# issue = "https://github.com/opentidehq/opentide/issues/790"
# changelog = "**The query engines suggest by the same rule**"
#
# with the same rule for `json:/report/issues/29/help` ('"try: bool"' →
# '"the ES|QL reference: https://www.elastic.co/docs/reference/query-languages/esql"'),
# a text rule for `validate` in `human/fault/*`, `plain/fault/*` and
# `agent/fault/*` (`   ╰─ help: try: bool` → `   ╰─ help: the ES|QL reference:
# https://www.elastic.co/docs/reference/query-languages/esql`), and the same
# four for `validate query` (`*/fault/default`; its JSON is an array of
# findings, the 0170 one with `"help":"try: bool"`).
#
# Decided by UC-3.4 (#826), the renderers; entered when `validate`, `lint`
# and the other commands route their cases to Rust (UC-3.5). The CHANGELOG
# announces them under "**The Rust command line's renderers**":
#
# - glyphs and frame characters on a stream that cannot encode them: the
#   Rust CLI writes UTF-8 everywhere, with no ASCII fallback (`ok`, `-->`,
#   `|`, `^`) and no `?` for other characters. No golden case runs on such a
#   stream (every case is UTF-8), so no entry may be needed.
# - terminal cell widths from the `unicode-width` crate instead of Rich's
#   tables: a character the two measure differently can move an underline or
#   a wrap point by one cell in `human` mode (a terminal of 100 columns).
#   The fault workspace and every code's frame measure the same today
#   (crates/opentide-cli/tests/render.rs). At a terminal, a frame's message,
#   notes and location are cut by cells, not characters, so a line of wide
#   (CJK) text stays within the terminal's width: its wrap point moves earlier.
# - SARIF rules: the oracle (0.23.0) predates retired codes and the `cql_`
#   reference; development tags `crowdstrike_unsupported` `retired`
#   (#800) and lists the CQL codes, and the Rust catalogue follows
#   development, so `validate --format sarif` and `lint --format sarif`
#   differ from the oracle's recordings there.
# - quoted values (`fix: replace with …`, `fixed: 'a' → 'b'`, `help: did you
#   mean …?`, SARIF `fixes[].description`): a character that is not printable
#   is escaped as Rust's `char::escape_debug` escapes it (`\u{a0}`, `\u{200b}`,
#   `\u{85}`, `\0`, `\u{1b}`) instead of Python's `repr` (`\xa0`, `\u200b`,
#   `\x85`, `\x00`, `\x1b`). Printable text and the quotes are unchanged.
# - the underline of a span that holds a tab covers the tab as the terminal
#   expands it, to the next stop of 8 cells; the oracle counted it as one cell.
# - control characters in a frame or an outcome line (ESC, DEL, NUL and the
#   other C0 controls but tab and newline) are shown as their Unicode control
#   pictures (`␛`, `␡`, `␀`), and C1 controls as `�`, instead of being
#   written raw; a line break inside a message, a note or a label continues
#   on an indented row (under the frame's bar), so no printed line starts
#   with text from a file.
#
# The workspace index (UC-2.1, #816), decided and checked corpus by corpus by
# `cargo xtask registry diff --against python` (xtask/src/registry.rs
# `APPROVED`, `INVALID_DATES`; none may go stale on `--corpus all`); entered
# here when a command reads the Rust index (UC-2.x):
#
# - `yaml-error-text`: a `yaml_parse` load error's text is saphyr's, at the
#   line the oracle names or where the construct it names starts ("**Tide
#   objects are read as YAML 1.2**").
# - `yaml-1-2-scalars`: bodies and signals hold `yes`/`no`/`on`/`off` and
#   timestamps as written ("**Tide objects are read as YAML 1.2**").
# - `yaml-1-2-dates`: a file with an unquoted impossible date is indexed, and
#   its field's check reports it, where the oracle refused the file ("**Tide
#   objects are read as YAML 1.2**").
# - an unreadable file's text is the operating system's as Rust reports it
#   (the corpora hold none: root, which the check may run as, reads every
#   file), and
#   a non-empty list or mapping `uuid` is `missing_uuid` where the oracle
#   crashed ("**The workspace is loaded by the Rust engine**").
