# The MCP sessions `cargo xtask mcp record` sends to the Python server
# (`opentide mcp start`, src/opentide/mcp_server/) and records, one file per
# session, as `<name>.jsonl` beside this file; `cargo xtask mcp replay` sends
# them again to the Python server, the Rust server, or both (UC-3.7, #829).
#
# This file is the reviewed source: the requests. The responses are only ever
# recorded (`cargo xtask mcp record`), never written by hand.
#
# Each session runs against a fresh copy of its fixture (the golden fixtures'
# kinds, xtask/src/golden/fixture.rs), with no network (a proxy on
# 127.0.0.1:9 that refuses it). It starts with `initialize` and
# `notifications/initialized`; then each step is one JSON-RPC message
# (`method` and `params`: the recorder numbers it), sent once the answer to
# the step before it has arrived.
#
# `launch` is how the client starts the server: `workspace` (the default: in
# the workspace, which OPENTIDE_REPO_ROOT and OPENTIDE_TIDE_WORKSPACE name),
# `repo-option` (in an empty folder outside it, as `opentide --repo <ws> mcp
# start`, with no workspace variable) or `plugin-root` (in the fixture as an
# Agent Plugin root, with no workspace variable: a host that names none).

[fixtures.tide-corpus]
kind = "tide-corpus"
source = "tests/fixtures/tide_corpus/current"
about = "tests/fixtures/tide_corpus, in the .opentide/ layout the Python suite gives it"

[fixtures.tide-corpus-typo]
kind = "tide-corpus"
source = "tests/fixtures/tide_corpus/current"
about = "tide-corpus with an unknown TLP on the Sentinel rule: an issue with a fix"
edits = [{ path = "Objects/Detection Rules/rule-0001-sentinel-kql.yaml", find = "  tlp: clear\n", replace = "  tlp: clearr\n" }]

[fixtures.tide-corpus-broken-config]
kind = "tide-corpus"
source = "tests/fixtures/tide_corpus/current"
about = "tide-corpus whose Sentinel platform configuration is not TOML: a workspace that does not open"
edits = [{ path = ".opentide/configurations/platforms/sentinel.toml", find = "[platform]\nenabled = true\n", replace = "[platform]\nenabled = tru\n" }]

[fixtures.agent-plugin]
kind = "copy"
source = "tests/fixtures/agent_plugin_root"
about = "an Agent Plugin root (plugin.json, skills) that is no detection workspace"

# The protocol: the handshake's answer (instructions, capabilities, version
# negotiation), every list, and the protocol errors.
[[session]]
name = "protocol"
fixture = "tide-corpus"
steps = [
    { id = "tools-list", message = '{"method": "tools/list"}' },
    { id = "resources-list", message = '{"method": "resources/list"}' },
    { id = "resource-templates-list", message = '{"method": "resources/templates/list"}' },
    { id = "prompts-list", message = '{"method": "prompts/list"}' },
    { id = "ping", message = '{"method": "ping"}' },
    { id = "unknown-method", message = '{"method": "bogus/method"}' },
    { id = "unknown-tool", message = '{"method": "tools/call", "params": {"name": "no_such_tool", "arguments": {}}}' },
]

# A client that asks for a protocol version the server does not know gets
# the newest one it does.
[[session]]
name = "protocol-old-client"
fixture = "tide-corpus"
protocol_version = "2024-11-05"
steps = [
    { id = "ping", message = '{"method": "ping"}' },
]

[[session]]
name = "protocol-unknown-version"
fixture = "tide-corpus"
protocol_version = "1999-01-01"
steps = [
    { id = "ping", message = '{"method": "ping"}' },
]

