name: Defender columns returned
metadata:
  uuid: 00000000-0000-4000-8185-000000000003
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
description: A custom detection whose query returns exactly the columns its block names.
response:
  alert_severity: High
configurations:
  microsoft_defender:
    status: STAGING
    query: |
      DeviceEvents
      | where ActionType == "PowerShellCommand"
      | project Timestamp, ReportId, DeviceId, InitiatingProcessAccountUpn
    schedule:
      frequency: 1H
    alert:
      title: Defender columns returned
    entities:
      accounts:
        - upn: InitiatingProcessAccountUpn
