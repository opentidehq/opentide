name: Defender columns not returned
metadata:
  uuid: 00000000-0000-4000-8185-000000000001
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
description: A custom detection whose block names columns its query does not return.
response:
  alert_severity: High
configurations:
  microsoft_defender:
    status: STAGING
    query: |
      DeviceEvents
      | where ActionType == "PowerShellCommand"
      | project Timestamp, InitiatingProcessAccountUpn, FileName
    schedule:
      frequency: 1H
    alert:
      title: PowerShell on {{DeviceName}}
      custom_details:
        Folder: FolderPath
    entities:
      hosts:
        - device_id: DevicId
      accounts:
        - upn: InitiatingProcessAccountUpn
