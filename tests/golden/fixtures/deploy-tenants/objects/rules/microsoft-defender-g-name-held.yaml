name: Defender name held rule
metadata:
  uuid: 00000000-0000-4000-8047-0000000000d7
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
description: |
  A rule the Microsoft Defender stand-in tenant receives in a deploy that sends; opentide 1.0.0 left it under its bare uuid, renamed since but with its alert title unchanged: PATCH answers 404, POST 409 and PATCH 404 again, so the rule fails with microsoft_defender_rule_conflict and the run goes on.
response:
  alert_severity: High
configurations:
  microsoft_defender:
    status: STAGING
    query: |
      DeviceProcessEvents
      | take 1
    schedule:
      frequency: 1H
    alert:
      title: Defender name held rule
    entities:
      hosts:
        - device_id: DeviceId
