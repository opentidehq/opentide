name: Defender refused rule
metadata:
  uuid: 00000000-0000-4000-8047-0000000000d6
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
description: |
  A rule the Microsoft Defender stand-in tenant receives in a deploy that sends; the tenant refuses its update (400): the rule fails and the run goes on.
response:
  alert_severity: High
configurations:
  microsoft_defender:
    status: STAGING
    query: |
      DeviceProcessEvents
      // refused
      | take 1
    schedule:
      frequency: 1H
    alert:
      title: Defender refused rule
    entities:
      hosts:
        - device_id: DeviceId
