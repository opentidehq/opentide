description: |
  A rule the Microsoft Defender stand-in tenant receives in a deploy that sends; the tenant holds it: one PATCH updates it.
response:
  alert_severity: High
configurations:
  microsoft_defender:
    status: STAGING
    query: |
      DeviceProcessEvents
      | take 1
    schedule:
      frequency: 1H
