name: Defender odata_type

metadata:
  uuid: 00000000-0000-4000-8005-000000000204
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear

description: Defender rule whose text names odata_type, for the compile corpus.

response:
  alert_severity: Medium

configurations:
  defender_for_endpoint:
    status: STAGING
    query: |
      CloudAppEvents
      | where tostring(RawEventData.odata_type) == "Message"
    scheduling: 1H
    alert:
      title: odata_type seen
      category: Collection
      description: The event's odata_type is Message.
    impacted_entities:
      user: AccountObjectId
    scope:
      selection: All
