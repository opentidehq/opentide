name: "HarfangLab Sigma: Encoded"

metadata:
  uuid: 00000000-0000-4000-8005-000000000601
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
  author: Detection Team

description: HarfangLab Sigma for the compile corpus.

response:
  alert_severity: High

configurations:
  harfanglab:
    status: STAGING
    maturity: Stable
    confidence: Strong
    action: Alert & Block
    tags:
      - attack.execution
      - attack.t1059.001
    sigma:
      logsource:
        category: process_creation
        product: windows
      selections:
        - name: selection_img
          field: Image
          modifiers:
            - endswith
          value: '\powershell.exe'
        - name: selection_img
          field: OriginalFileName
          value: PowerShell.EXE
        - name: selection_cli
          field: CommandLine
          modifiers:
            - contains
            - all
          value:
            - ' -enc'
            - 'yes'
      condition: all of selection_*
      false_positives:
        - Administration scripts
