name: Sysdig Full

metadata:
  uuid: 00000000-0000-4000-8005-000000000101
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear
  author: Detection Team

description: |
  Sysdig Full for the compile corpus.
    Indented second line.
techniques:
  - T1059.004
detection_model: 00000000-0000-4000-8099-000000000001

response:
  alert_severity: High

configurations:
  sysdig:
    enabled: true
    schema: platform::sysdig::1.0
    status: STAGING
    condition: |
      spawned_process
      and container
      and proc.name in (shell_binaries)
      and not allowed_parent
      and not proc.pname in (ci_runners, empty_list)
      and fd.name = shell_binaries
    output: |
      Shell spawned in a container |
        user=%user.name command=%proc.cmdline
    tags: [container, shell, container]
    minimum_engine_version: 26
    exceptions:
    - name: single_field
      fields: proc.name
      comps: " in "
      values: [ci_runners, bash, 5]
    - name: tuple_form
      fields: [proc.name, proc.pname]
      comps: [" = ", in]
      values:
      - [zsh, ci_runners]
      - [fish, [ci_runners, make]]
      - [ksh, sudo]
    - name: default_comps
      fields: [container.image.repository]
      values:
      - [registry.example.org/build]
    macros:
    - name: spawned_process
      condition: evt.type in (execve, execveat) and evt.dir=<
    - name: allowed_parent
      condition: |
        proc.pname in (ci_runners)
        or spawned_process and proc.pname = make
    lists:
    - name: base_shells
      items: [sh, bash]
    - name: shell_binaries
      items: [base_shells, zsh, "fish shell", later_list]
    - name: ci_runners
      items: [gitlab-runner, buildkite-agent]
    - name: empty_list
      items: []
    - name: later_list
      items: [ksh]
