name: Splunk Noisy

metadata:
  uuid: 00000000-0000-4000-8005-000000000304
  schema: rule::1.0
  version: 1
  created: 2026-01-01
  modified: 2026-01-02
  tlp: clear

description: |
  Splunk Noisy for the compile corpus.

response:
  alert_severity: Low

configurations:
  splunk:
    status: PRODUCTION
    flags:
      - noisy
    query: index=main noisy
    scheduling:
      schedule:
        frequency: 15m
      timerange:
        lookback: 1d
    trigger:
      type: For each result
    actions:
      notable:
        security_domain: Network
