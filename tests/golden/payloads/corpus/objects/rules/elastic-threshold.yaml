description: |
  Elastic Threshold for the compile corpus.
  Second line.

response:
  alert_severity: Informational

configurations:
  elastic:
    status: PRODUCTION
    type: threshold
    query: event.category:authentication
    threshold:
      field:
        - user.name
      value: 5
      cardinality:
        value: 2
        field: source.ip
    suppression:
      duration: 90m
    risk: 30
    severity: critical
