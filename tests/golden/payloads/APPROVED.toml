# The oracle faults the probe works around (`fault` in oracle.json): the
# oracle's own client fails before it sends anything, so its deploy fails
# where opentide-compile's sends the bodies. The probe records the failure,
# gives the client what it lacked and compares the bodies the deployer builds.

[[fault]]
platform = "harfanglab"
error = "AttributeError: HarfangLab"
reason = "The 0.23.0 HarfangLab client reads its identifier as Opentide.Configurations.Systems.HarfangLab; the registry snake-cases the name to harfang_lab, but the platform's key is harfanglab, so building the client raises AttributeError on every tenant and no HarfangLab deploy sends anything. opentide-compile builds the Sigma rule or YARA file the deployer means to send; the probe gives the oracle's client its identifier and compares those bodies."
issue = "https://github.com/opentidehq/opentide/issues/895"
changelog = "**A HarfangLab deploy sends its rules**"

