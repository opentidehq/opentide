# The model-dump previews (UC-3.1b, #895): the dry run shows a block it builds
# no body for as the block's model. opentide-compile serialises
# opentide-schema's model with serde instead of Pydantic's
# `model_dump(mode="json", by_alias=True)`; every value is compared, and only
# the classes below are approved. `xtask payloads` judges a class by
# `dump_approval`.
#
# A block opentide-schema's model refuses is shown as written
# (`preview::config_dump`). No entry approves it, since no comparison meets
# it: Pydantic refuses the same block, so the oracle cannot read the rule and
# never previews it (the probe reports it `unloadable`, not compared). The
# CHANGELOG entry below says so.

[[dump]]
rule = "nulls"
platforms = ["defender_for_endpoint", "splunk", "sentinel_one", "crowdstrike", "harfanglab", "carbon_black_cloud", "elastic"]
reason = "Pydantic's model_dump writes every field, an unset optional one as null; serde skips an unset optional field (skip_serializing_if = Option::is_none, the models' YAML writing relies on it). The preview is display output: what it shows of the block is the same, without the nulls."
issue = "https://github.com/opentidehq/opentide/issues/895"
changelog = "**A dry run's preview leaves out unset fields**"

