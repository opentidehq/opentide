# Approved differences between opentide-compile and the oracle's recorded
# compile (UC-3.1, #823): the compile corpus's request bodies and previews
# (`[[diff]]`), the oracle's own faults (`[[fault]]`), the classes of the
# dry run's previews (`[[dump]]`) and of the tenants' writes (`[[writes]]`),
# which opentide-compile's tests/oracle.rs reads; `reason`,
# `issue` and `changelog` are for the reader.
# The `cargo xtask payloads` tool that wrote and checked this file, and the
# dry-run plan entries it compared, were retired with the oracle (#1142).

[[dump]]
rule = "nulls"
platforms = ["elastic"]
reason = "Pydantic's model_dump writes every field, an unset optional one as null; serde skips an unset optional field (skip_serializing_if = Option::is_none, the models' YAML writing relies on it). The preview is display output: what it shows of the block is the same, without the nulls."
issue = "https://github.com/opentidehq/opentide/issues/895"
changelog = "**A dry run's preview leaves out unset fields**"

[[dump]]
rule = "wrapped"
platforms = ["elastic"]
reason = "An Elastic preview's api_request is the deploy body, {\"payload\": <the Kibana rule>, \"block\": <the elastic block>}, which opentide deploy and the SDKs' deploy send: the Elasticsearch checks read the block before the rule is written. The oracle showed the Kibana rule alone; it is the payload, unchanged."
issue = "https://github.com/opentidehq/opentide/issues/1142"
changelog = "**A dry run's Elastic entry is the deploy body**"

[[dump]]
rule = "request"
platforms = ["splunk", "sentinel_one", "crowdstrike", "harfanglab", "carbon_black_cloud"]
reason = "A dry run's api_request for a platform whose deploy writes are built from the tenant is the list of writes the first tenant the run reaches receives, each {method, url, body}, as compile_tenant builds them (tenant:<name>, held to the oracle's writes above), where the oracle showed the rule's block with its model's defaults. A value a deploy learns only as it sends (Splunk's schedule minute and hour, Carbon Black's report timestamp) is a <send-time:NAME> placeholder, and a tenant that cannot take the rule fails the dry run, naming it, as it fails the deploy."
issue = "https://github.com/opentidehq/opentide/issues/1712"
changelog = "**A dry run's `api_request` is the request a deploy sends, on every platform**"

[[writes]]
rule = "url"
platforms = ["splunk", "carbon_black_cloud"]
reason = "A write's url is the whole URL a deploy sends to: Splunk's https://<url>:<port>/servicesNS/nobody/<app>/saved/searches/, with the trailing slash, for the create, and the saved search's percent-encoded name after it for an update; Carbon Black's the tenant's url followed by the org's path. The oracle's probe recorded the path its SDK was given, under the app's namespace (saved/searches/<name>, the name as written) or under the tenant's url. The writes compared to the oracle's are the candidate's with each url cut back to that path, which must start with the tenant's own URL."
issue = "https://github.com/opentidehq/opentide/issues/1712"
changelog = "**A dry run's `api_request` is the request a deploy sends, on every platform**"

[[writes]]
rule = "search"
platforms = ["splunk"]
reason = "Each update of a Splunk saved search sends its `search` first: Splunk's REST API takes it with every update (`SavedSearch.update` adds it), so the tenant receives it, and on a new saved search it is the one just created. The oracle's probe recorded the settings the deployer passed to the SDK, without it. The writes compared to the oracle's are the candidate's with that leading `search`, which must equal the create's, taken out of the first update and moved to the end of the last, where the probe recorded it."
issue = "https://github.com/opentidehq/opentide/issues/1712"
changelog = "**A dry run's `api_request` is the request a deploy sends, on every platform**"

[[writes]]
rule = "watchlist"
platforms = ["carbon_black_cloud"]
reason = "A new Carbon Black report joins its watchlist: the deploy reads the watchlist from the tenant and writes it back with the new report's id added to report_ids (PUT .../watchlists/<id>), as the oracle's SDK did with save_watchlist(). The probe recorded the report alone. The candidate shows that update after the report, its id and body the <tenant-read:watchlist_id> and <tenant-read:watchlist> placeholders, since both are read from the tenant; the writes compared to the oracle's are the candidate's without it."
issue = "https://github.com/opentidehq/opentide/issues/1712"
changelog = "**A dry run's `api_request` is the request a deploy sends, on every platform**"

[[rewrite]]
rule = "splunk_as_written"
platforms = ["splunk"]
reason = "A Splunk saved search is the author's SPL: the oracle's search ended with `| eval MDR_UUID=..., MDR_status=...` and the `soc_macro_auto_mdr_mapping(MDR_UUID)` macro, custom code for one environment, and set `alert.managedBy` to the rule's responders. opentide sends the block's query as written and an empty `alert.managedBy` (Splunk's default, which also clears the responders 0.28.1 wrote on an update), and ends the description with `opentide rule <uuid>`, the marker a deploy finds a renamed rule's old saved search by. The test applies exactly that to the oracle's writes; every other byte is the oracle's. An approved [[diff]] of a Splunk tenant compares against the rewritten oracle."
issue = "https://github.com/opentidehq/opentide/issues/1657"
changelog = "**A Splunk saved search is the query as written**"

[[diff]]
corpus = "payloads"
uuid = "00000000-0000-4000-8005-000000000106"
platform = "sysdig"
what = "preview"
oracle = '''{"uuid":"00000000-0000-4000-8005-000000000106","name":"Sysdig Unknown Status","status":"failed","code":"compile_failed","error":"Sysdig cannot compile this rule: \"Status 'NOT_A_STATUS' is not defined in deployment configuration. Available statuses: DESIGN, DEVELOPMENT, IMPROVING, STAGING, ACCEPTANCE, PRODUCTION, DISABLED, REMOVED.\"","help":null,"file":"<WS>/objects/rules/sysdig-unknown-status.yaml","api_request":null}'''
