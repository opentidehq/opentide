# commands the runner uses offline (validate, lint, deploy migrate-state)
# report them. Each has the evidence; invalid_cve needs the network.

[[unreachable]]
code = "cbc_unknown_field"
reason = "an engine warning; validate keeps only engine errors and lint only warnings with a query prefix (kql_, spl_, esql_, eql_, kuery_, lucene_, ecs_, falco_) or in its advisory lists (cli/services/lint.py _query_findings), so only the language server reports it"

[[unreachable]]
code = "config_check_failed"
reason = "the language server's code for a configuration checker that raised; no CLI path emits it"

[[unreachable]]
code = "defender_output_columns"
reason = "declared in opentide-core's codes but emitted by no crate"

[[unreachable]]
code = "deprecated_field"
reason = "needs a `tide.meta.deprecation` marker in a metaschema; no field of 0.23.0's models carries one (the deprecations catalogue is empty)"

[[unreachable]]
code = "engine_unavailable"
reason = "raised only when opentide._native fails to import (a damaged installation), not by any workspace"

[[unreachable]]
code = "filename_slug"
reason = "an engine warning lint's query filter drops; lint's own filename_mismatch reports the file (KG-03)"

[[unreachable]]
code = "invalid_cve"
reason = "needs Vulnerability-Lookup (vulnerability.circl.lu) to answer 'not found'; offline, and through the runner's dead proxy, the oracle reports cve_lookup_unavailable (kind cve-lookup-unavailable)"

[[unreachable]]
code = "missing_author"
reason = "an engine warning lint's query filter drops; lint's own metadata_recommended reports it (KG-05)"

[[unreachable]]
code = "missing_organisation"
reason = "an engine warning lint's query filter drops; lint's own metadata_recommended reports it (KG-05)"

[[unreachable]]
code = "not_a_configuration_file"
reason = "emitted only by validation.configuration.configuration_file_issues, which no CLI path calls; an extra .opentide/configurations/*.toml is silently ignored (KG-06)"

[[unreachable]]
code = "recommended_field_missing"
reason = "an engine warning lint's query filter drops; language server only (KG-05)"

[[unreachable]]
code = "yaral_meta_duplicate"
reason = "deploy writes a Google SecOps rule's meta: a block's meta keys are YAML keys (a repeated one is yaml_parse), the keys deploy writes itself and values that are not strings are google_secops_meta_key, and the oracle reports nothing in the meta it generates (contributors repeat author there); a search's meta is not checked (yara-l engine: Google ignores it), so only a YARA-L rule the language server reads on its own reports it"

