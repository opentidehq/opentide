# The fault catalogue (UC-0.6, #804; plan §5.3). Each kind mutates its own
# copy of the clean base workspace and names exactly the codes, with their
# severity, that the oracle reports; the expectations are adjusted to what
# opentide 0.28.1 reports, and what surprises is in KNOWN_GAPS.md.
#
#   cargo xtask corpus faults --check --engine python
#   cargo xtask corpus coverage --check
#
# Format and process: README.md. COVERAGE.md maps every code to its kinds.
oracle = "0.28.1"

# The clean workspace: zero findings under every command the kinds use.
[base]
seed = 1
threats = 80
objectives = 30
rules = 135
layout = "explicit"

# The combined fault workspace (`cargo xtask corpus faults --out DIR`, a
# fixture of UC-0.5's goldens): every kind not marked isolated, once.
[combined]
threats = 120
objectives = 60
rules = 600

[[kind]]
id = "uuid-invalid-rule"
codes = ["invalid_uuid"]
severity = "error"
target = { family = "rule" }
ops = [
    { op = "set", path = "metadata.uuid", value = "not-a-uuid-{n}" },
]
gap = "KG-04"
counts = { invalid_uuid = 5 }

