# cargo-deny (https://embarkstudios.github.io/cargo-deny/): the Rust
# workspace's supply-chain gate (#843). `cargo deny check` runs on every pull
# request in ci.yml's `deny` job, with the version CI pins
# (docs/internal/supply-chain.md says why this file says what it says).
#
# Scope: the workspace in the root Cargo.toml and its Cargo.lock, for every
# target. `fuzz/` (its own workspace and lock, never distributed) is checked
# by the same job with this file: `cargo deny --manifest-path fuzz/Cargo.toml
# check advisories bans sources`. Its licences are not: nothing from fuzz/ is
# shipped. The crate that reserves `opentide` on crates.io
# (publishing/placeholders/crates/opentide, its own workspace and lock) is
# published, so the job runs every check on it.

[graph]
# Every target a wheel, a binary or a WebAssembly artifact is built for: an
# empty list means all of them, so a dependency behind `cfg(windows)` or
# `cfg(target_arch = "wasm32")` is gated too.
targets = []
all-features = true

[output]
feature-depth = 1

# RustSec (https://rustsec.org). A vulnerability, an unsound crate, a yanked
# version and an unmaintained crate all fail the check; each exception below
# has its reason and the issue that removes it.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
# An exception is an entry here with its reason and its follow-up issue
# (docs/internal/supply-chain.md). None today: RUSTSEC-2024-0449
# (unsafe-libyaml, through serde_yaml) went with serde_yaml (#850).
ignore = []

# Licences of what we distribute. opentide is EUPL-1.2; every crate compiled
# into the wheel, the npm packages or the binaries must be under a licence
# that lets us distribute it with EUPL-1.2 code. The list is about.toml's
# (cargo-about renders THIRD-PARTY-LICENSES.html from it for each release),
# so the two cannot disagree: tests/test_ci/test_supply_chain.py checks it.
#
# Policy (maintainer, #952): a permissive open-source licence (MIT, MIT-0,
# Apache-2.0, BSD, ISC, Zlib, CC0, CDLA-Permissive, Unicode, BSL-1.0 and the
# like) goes on this list, for every crate, never as a per-crate exception.
# A copyleft (GPL, LGPL, MPL, AGPL, EPL) or field-of-use-restricted licence
# needs a maintainer's decision. docs/internal/supply-chain.md says why.
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "EUPL-1.2",
  "CC0-1.0",
  "MIT-0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Only crates we ship need a licence on this list. dev-dependencies (test
# tools) never leave a checkout. Build dependencies (cc) run at build time
# and are not linked in, as about.toml's ignore-build-dependencies says.
include-dev = false
include-build = false
unused-allowed-license = "allow"

[licenses.private]
# Unpublished members (publish = false: xtask, the binding in bindings/python/,
# opentide-wasm) are skipped. The published opentide-* crates are checked
# like any other and pass as EUPL-1.2.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  # TLS is rustls, never OpenSSL: one TLS stack, no system library to link
  # on every platform the wheel targets, and per-tenant CA settings handled
  # in one place (plan §3.9). The connectors (UC-4) bring the first TLS.
  { crate = "openssl-sys", reason = "TLS is rustls (plan D-8, §3 invariant 9): no OpenSSL to link" },
  { crate = "openssl", reason = "TLS is rustls (plan D-8, §3 invariant 9): no OpenSSL to link" },
  { crate = "native-tls", reason = "TLS is rustls (plan D-8, §3 invariant 9): no OpenSSL to link" },
]
# The crates we ship have one version each today (dev-dependencies are left
# out, cargo-deny's default: test tools never leave a checkout; the ones they
# duplicate are listed in docs/internal/supply-chain.md). A second version
# fails the check until it is removed, or skipped here with its reason.
skip = [
  # xtask (never published or shipped) needs rustix for the golden runner's
  # pseudo-terminals, and tempfile: both bring bitflags 2, beside the bitflags
  # 1 of lsp-types (fluent-uri 0.1).
  { crate = "bitflags@2.13.2", reason = "xtask (rustix, tempfile), opentide-workspace (tempfile; inotify through notify, `--watch`) and opentide-cli (inquire and crossterm, the setup wizard's prompts) use bitflags 2; lsp-types (fluent-uri 0.1) and kqueue-sys (notify on BSD and macOS) still use bitflags 1" },
  # xtask's schema comparison (UC-1.8b, #900; `cargo xtask codegen --check`)
  # validates the corpora with the jsonschema crate, which brings these second
  # versions. Only xtask (tooling, never shipped) depends on jsonschema.
  { crate = "fancy-regex@0.20.1", reason = "only xtask (tooling, never shipped) uses it, through jsonschema; opentide-schema ships fancy-regex 0.14" },
  { crate = "fluent-uri@0.4.1", reason = "only xtask (tooling, never shipped) uses it, through jsonschema's referencing; the shipped crates use fluent-uri 0.1 through lsp-types" },
  { crate = "getrandom@0.3.4", reason = "only xtask (tooling, never shipped) uses it, through jsonschema's ahash; the shipped crates use getrandom 0.4 through gix" },
  { crate = "r-efi@5.3.0", reason = "only xtask (tooling, never shipped) uses it, through getrandom 0.3 (jsonschema's ahash), on UEFI targets" },
  # rmcp (the MCP server, UC-3.7, #829) hashes with sha2 0.11, RustCrypto's
  # digest 0.11 generation, and so does opentide-cli's SARIF fingerprints (one
  # sha2); gix still hashes with sha1 0.10, on digest 0.10. Drop these when gix
  # moves to digest 0.11.
  { crate = "cpufeatures@0.3.1", reason = "sha2 0.11 (rmcp 3.9, opentide-cli) uses cpufeatures 0.3; gix's sha1 0.10 (through sha1-checked) uses cpufeatures 0.2" },
  { crate = "digest@0.11.3", reason = "sha2 0.11 (rmcp 3.9, opentide-cli) is on digest 0.11; gix's sha1 0.10 is on digest 0.10" },
  { crate = "block-buffer@0.12.1", reason = "digest 0.11 (sha2 0.11: rmcp 3.9, opentide-cli) beside digest 0.10 (gix's sha1)" },
  { crate = "crypto-common@0.2.2", reason = "digest 0.11 (sha2 0.11: rmcp 3.9, opentide-cli) beside digest 0.10 (gix's sha1)" },
  # The connectors' HTTP client (UC-4.1, #831): ring 0.17, rustls's crypto
  # provider (chosen over aws-lc-rs: no C build, no OpenSSL licence), still
  # uses getrandom 0.2 and, on Windows, windows-sys 0.52.
  { crate = "getrandom@0.2.17", reason = "ring 0.17 (rustls's provider for the connectors, UC-4.1) uses getrandom 0.2; gix uses 0.4" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 (rustls's provider for the connectors, UC-4.1) uses windows-sys 0.52 on Windows" },
  # wiremock (the recorded-HTTP harness, opentide-cassette: test tooling,
  # never shipped) is on base64 0.22; hyper-util (reqwest) is on 0.23.
  { crate = "base64@0.22.1", reason = "only opentide-cassette (test tooling, never shipped) uses it, through wiremock 0.6; reqwest's hyper-util uses base64 0.23" },
  # Two proc macros convert identifiers' case at compile time: crossterm's
  # derive_more-impl (opentide-cli's setup wizard) with convert_case 0.10, and
  # napi-derive (the Node binding, UC-5.3) with 0.12.
  { crate = "convert_case@0.10.0", reason = "only derive_more-impl 2.1 (crossterm, opentide-cli's setup wizard) uses it, a proc macro run at compile time; napi-derive (the Node binding's TypeScript names) uses convert_case 0.12. Neither links into an artifact" },
  { crate = "syn@2.0.119", reason = "garde_derive 0.23 (opentide-schema's validation derive, plan D-2) depends on syn 2 and no garde release uses syn 3 yet; every other proc macro uses syn 3. Drop this when garde moves" },
  # yara-x-parser 1.23 (opentide-yara's verdict parser, language-server 0.13.0)
  # is pinned exactly (=1.23.0) and brings rowan 0.17, which is on hashbrown
  # 0.14 and rustc-hash 1, and itertools 0.15, a release past ratatui's.
  { crate = "hashbrown@0.14.5", reason = "rowan 0.17 (yara-x-parser 1.23, opentide-yara) uses hashbrown 0.14; indexmap and the rest of the graph use 0.17" },
  { crate = "rustc-hash@1.1.0", reason = "rowan 0.17 (yara-x-parser 1.23, opentide-yara) uses rustc-hash 1; the rest of the graph uses 2" },
  { crate = "itertools@0.14.0", reason = "ratatui-core 0.1 (opentide-cli's tui) uses itertools 0.14; yara-x-parser 1.23 (opentide-yara) uses 0.15" },
]

# Every crate comes from crates.io. A git or another registry's crate fails
# until it is named here with its reason.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
