# The Rust that builds, lints and tests the workspace here and in CI: one exact
# release, so that a new stable's lints (clippy::pedantic gains some with most
# releases, and CI denies warnings) arrive in a change of their own instead of
# failing every open PR on the day it ships. CI installs this file's toolchain
# (`rustup toolchain install` with no name). The crates also declare a floor,
# `rust-version` in Cargo.toml (1.85), which this pin never goes below. That
# floor is declared, not checked: no job builds with it, the code uses let
# chains (stable since Rust 1.88), Cargo.lock's tree-sitter-language 0.1.8
# requires Rust 1.90, and xtask's wait4 0.2 (cargo xtask bench) Rust 1.95.
#
# To move to a newer release, in one PR: change `channel`, then run
# `cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings`
# and `cargo nextest run --workspace --profile ci`; fix what the new lints
# report, or allow one in the root Cargo.toml with its reason (crates/AGENTS.md,
# "Lints"). The sdist leaves this file out (pyproject.toml), so a build from it
# uses whatever toolchain it finds.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
