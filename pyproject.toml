[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opentide"
dynamic = ["version"]
description = "OpenTide — DetectionOps engine (PyPI package)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ruamel.yaml",
    "pydantic",
    "GitPython",
    "toml",
]

[project.optional-dependencies]
sentinel = []
splunk = []
crowdstrike = []
carbon-black = []
cli = []
mcp = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
    "types-toml",
]

[project.scripts]
opentide = "opentide.cli:main"
opentide-mcp = "opentide.mcp:main"

[project.entry-points."opentide.platforms"]
sentinel = "opentide.platforms.sentinel:Platform"
splunk = "opentide.platforms.splunk:Platform"
crowdstrike = "opentide.platforms.crowdstrike:Platform"
carbon-black = "opentide.platforms.carbon_black:Platform"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]

[tool.hatch.build.hooks.vcs]
version-file = "src/opentide/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=opentide", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["opentide"]
omit = ["src/opentide/_version.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [
    "Engines",
    "Configurations",
    "External",
    "Framework",
    "Orchestration",
    "Pipelines",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["opentide"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
