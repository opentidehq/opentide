[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opentide"
dynamic = ["version"]
description = "Spec-driven development for agentic detection engineering: validate, generate, deploy, and document detection-as-code across nine security platforms."
readme = "README.md"
license = "EUPL-1.2"
# NOTICE covers the third-party data the engine compiles in; the licence and notice
# files it cites ship beside it.
license-files = [
    "LICENSE",
    "NOTICE",
    "data/catalogs/ecs/LICENSE.txt",
    "data/catalogs/ecs/NOTICE",
    "data/catalogs/falco/LICENSE.txt",
    "data/catalogs/falco/LICENSE-MIT.txt",
    "data/catalogs/falco/NOTICE",
    "data/catalogs/cql/LICENSE-Apache-2.0.txt",
    "data/catalogs/cql/LICENSE-MIT.txt",
    "data/catalogs/cql/LICENSE-Unlicense.txt",
    "data/catalogs/cql/NOTICE",
]
authors = [
    { name = "opentide", email = "digit-ec-opentide@ec.europa.eu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # The plugin API (opentide.plugins): a platform plugin's configuration_model
    # is a pydantic model, which PlatformPlugin.check_configuration validates a
    # rule's block with. Everything else is the Rust core, compiled into this
    # package (opentide._native, bindings/python/, by hatch_build.py): the
    # command line, the SDK, the Tide models and the platform connectors.
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "tomli>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-console-scripts>=1.4",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    # Drives the console script on a real PTY (the setup wizard's Ctrl-C).
    "pexpect>=4.9",
    # CI's contract tests read the workflows (tests/test_ci/).
    "pyyaml>=6.0",
    "ruff>=0.17.2",
    "ty>=0.0.65",
    "pre-commit>=4.0",
]

[tool.uv]
# Rebuild opentide, which compiles the engine (hatch_build.py), when the Rust
# sources change, as well as on a new commit or tag (the version).
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "bindings/python/Cargo.toml" },
    { file = "bindings/python/build.rs" },
    { file = "bindings/python/src/**/*.rs" },
    { file = "crates/*/Cargo.toml" },
    { file = "crates/*/build.rs" },
    { file = "crates/*/src/**/*.rs" },
    # What the engine crates compile in (include_str!, build.rs).
    { file = "data/catalogs/**" },
    { file = "grammars/*/src/**" },
    { file = "grammars/*/queries/**" },
    { file = "highlights/spec.toml" },
    { file = "highlights/queries/**" },
    { file = "highlights/generated/**" },
    { git = { commit = true, tags = true } },
]

[project.urls]
Homepage = "https://opentide.org"
Documentation = "https://opentide.org/docs/usage/"
Changelog = "https://github.com/opentidehq/opentide/blob/development/CHANGELOG.md"
Releases = "https://opentide.org/docs/usage/releases/"
Repository = "https://github.com/opentidehq/opentide"
Issues = "https://github.com/opentidehq/opentide/issues"

[project.scripts]
opentide = "opentide._cli:main"

[tool.hatch.version]
source = "vcs"

# opentide's versions are its `vX.Y.Z` tags. The engine's releases tag
# `engine-vX.Y.Z` (engine-release.yml), and setuptools-scm's defaults (`git
# describe --match *[0-9]*`, a tag regex that drops any `word-` prefix) would
# read the nearest of those as opentide's version: describe and parse `v` tags
# only (tests/test_package/test_version_tags.py).
[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
tag_regex = '^v(?P<version>[0-9]+(?:\.[0-9]+)*[^+]*)(?:\+.*)?$'

[tool.hatch.build.targets.sdist]
# hatchling 1.32 defaults to Core Metadata 2.5; PyPI/twine still gate on 2.4.
core-metadata-version = "2.4"
# The sdist carries the engine's Rust sources and the hook that compiles them,
# so it builds wherever a Rust toolchain is installed (crates.io dependencies are
# fetched as usual): the Cargo workspace's manifests and lock, every member's
# sources, build script and benches (cargo reads every member's targets), and the
# data the crates compile in (data/catalogs, grammars/*/src and queries,
# highlights/). The rest of the engine's tree stays out: test data and the
# crates' and xtask's integration tests, the fuzz targets, editor samples, npm packages (the
# Node binding's npm side too: bindings/node keeps its manifest, build script and sources), the
# engine's docs and scripts, the grammar sources tree-sitter
# generates parser.c from, and the reference Tide schemas. rust-toolchain.toml
# stays out too, so a build from the sdist uses the toolchain it finds instead of
# asking rustup for components.
# An editable install's compiled module is left out; its stubs (_native/*.pyi) ship.
exclude = [
    "/target",
    "/src/opentide/_native.so",
    "/src/opentide/_native.*.so",
    "/src/opentide/_native.pyd",
    "/src/opentide/_native.*.pyd",
    "/rust-toolchain.toml",
    "/crates/testdata",
    "/crates/*/tests",
    "/xtask/tests",
    "/fuzz",
    "/editors",
    "/packages",
    "/bindings/node/npm",
    "/bindings/node/alias",
    "/bindings/node/test",
    "/bindings/node/*.js",
    "/bindings/node/*.mjs",
    "/bindings/node/*.d.ts",
    "/bindings/node/*.json",
    "/bindings/node/*.md",
    "/bindings/node/LICENSE",
    "/highlights/test",
    "/grammars/*/grammar.js",
    "/grammars/*/package.json",
    "/grammars/*/tree-sitter.json",
    "/data/catalogs/tide/schemas",
    "/docs/engine",
    "/scripts/engine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]
core-metadata-version = "2.4"
# An editable install's compiled module, in src/; a wheel gets its own build.
# The stubs (_native/*.pyi) ship, for type checkers.
exclude = [
    "src/opentide/_native.so",
    "src/opentide/_native.*.so",
    "src/opentide/_native.pyd",
    "src/opentide/_native.*.pyd",
]

# Compiles bindings/python/ (Rust) into opentide/_native: see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.vcs]
version-file = "src/opentide/_version.py"

# Release wheels (.github/workflows/publish-pypi.yml). Each compiles the engine
# (hatch_build.py). The extension uses the stable ABI from CPython 3.10, so one
# build per platform, on 3.10, serves every later CPython.
[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-win32", "*_i686", "*_ppc64le", "*_s390x", "*_armv7l", "*_riscv64"]
# The workflow sets the version from the release tag: the Linux containers
# build from a copy of the checkout.
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION"]
# cryptography publishes no Windows on Arm wheel after 46.0.3, so the test
# install would pick a newer one and compile it: publish-pypi.yml installs
# that wheel itself, with cryptography from a wheel (--only-binary).
test-skip = "*-win_arm64"
test-command = [
    "opentide --version",
    "python -c \"from opentide.analysis import check_query; assert [f.code for f in check_query('SecurityEvent | wher x', language='kql')] == ['kql_unknown_operator']\"",
]

[tool.cibuildwheel.macos]
# rustc's floor for x86_64-apple-darwin is 10.12; cibuildwheel's default (10.9)
# makes delocate reject the extension. arm64 starts at 11.0 regardless.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tool.cibuildwheel.linux]
# The manylinux and musllinux images have no Rust toolchain.
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=opentide",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "cli_e2e: end-to-end tests of the console script (separate CI job, Python 3.14)",
    "cli_smoke: subprocess console-script smoke (same CI job as cli_e2e)",
    "gitlab_ci_lint: glint and gitlab-ci-verify on generated GitLab CI (CI job, needs the binaries)",
    "full_set: too slow for every pull request; CI runs it in the full set only (cli-e2e-full)",
]

[tool.coverage.run]
source = ["src/opentide"]
relative_files = true
omit = [
    "src/opentide/_version.py",
]

[tool.coverage.report]
fail_under = 85.0
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Why each family is here: .agents/skills/ruff/SKILL.md
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "C4", "DTZ", "ERA", "FURB", "G", "ISC", "LOG", "PGH", "PIE", "PLE", "PLW1510", "RUF", "T20",
]
ignore = [
    "C408",    # dict(a=1) vs {"a": 1} is style, not a defect
    "ISC004",  # parenthesising every multi-line string in a list is churn; ISC001-003 stay on
]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.isort]
# The oracle's scripts (tests/cassettes/, scripts/golden/) import modules this
# checkout no longer has: opentide is first-party wherever it comes from.
known-first-party = ["opentide"]

[tool.ruff.lint.per-file-ignores]
# Scripts whose job is to print.
"scripts/**" = ["T201"]
# Tests assert on return codes, and their fakes use class attributes.
"tests/**" = ["PLW1510", "RUF012"]

[tool.ty.src]
include = ["src/opentide"]
