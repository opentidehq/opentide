[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opentide"
dynamic = ["version"]
description = "OpenTide — DetectionOps engine (PyPI package)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "ruamel.yaml",
    "pydantic>=2.0",
    "GitPython",
    "toml",
    "structlog>=24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
sentinel = []
splunk = []
crowdstrike = []
carbon-black = []
cli = []
mcp = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
    "types-toml",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
    "types-toml",
    "pandas>=2.0",
]

[project.scripts]
opentide = "opentide.cli:main"
opentide-mcp = "opentide.mcp_server.server:main"

[project.entry-points."opentide.platforms"]
sentinel = "opentide.platforms.sentinel:declare"
splunk = "opentide.platforms.splunk:declare"
crowdstrike = "opentide.platforms.crowdstrike:declare"
carbon_black_cloud = "opentide.platforms.carbon_black:declare"
defender_for_endpoint = "opentide.platforms.defender_for_endpoint:declare"
sentinel_one = "opentide.platforms.sentinel_one:declare"
harfanglab = "opentide.platforms.harfanglab:declare"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]

[tool.hatch.build.targets.wheel.force-include]
"src/opentide/data" = "opentide/data"
"src/opentide/schemas/data" = "opentide/schemas/data"
"src/opentide/py.typed" = "opentide/py.typed"

[tool.hatch.build.hooks.vcs]
version-file = "src/opentide/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=opentide", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["opentide"]
omit = ["src/opentide/_version.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [
    "Engines",
    "Configurations",
    "External",
    "Framework",
    "Orchestration",
    "Pipelines",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Ported from Engines/framework — behavioural preservation; style cleanup deferred to Phase 9
"src/opentide/generation/schema_pipeline.py" = ["E501", "SIM", "UP", "B", "E712", "E721", "E722", "F841"]
"src/opentide/generation/template_renderer.py" = ["E501", "SIM", "UP", "B", "E712", "E722", "F841"]
"src/opentide/generation/template_engine.py" = ["E501", "SIM", "UP", "B", "E712", "E722", "F841"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["opentide", "opentide.models"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ty.src]
include = ["src/opentide"]

[tool.ty.rules]
# Tide domain models intentionally shadow Pydantic BaseModel.validate (instance delegation).
# Redundant casts retained for mypy migration baseline; ty treats them as warnings.
invalid-method-override = "warn"
redundant-cast = "ignore"
