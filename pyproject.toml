[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opentide"
dynamic = ["version"]
description = "OpenTide — DetectionOps engine (PyPI package)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "ruamel.yaml",
    "pydantic>=2.0",
    "GitPython",
    "toml",
    "structlog>=24.0",
    "rich>=13.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
sentinel = []
splunk = []
crowdstrike = []
carbon-black = []
cli = [
    "typer[all]>=0.12",
]
mcp = [
    "mcp>=1.0",
    "fastmcp>=2.0",
]
dev = [
    "typer[all]>=0.12",
    "mcp>=1.0",
    "fastmcp>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.9",
    "pre-commit>=4.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "typer[all]>=0.12",
    "mcp>=1.0",
    "fastmcp>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.9",
    "pre-commit>=4.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]
docs = [
    "mkdocs-material>=9.0",
]

[project.scripts]
opentide = "opentide.cli:main"
opentide-mcp = "opentide.mcp_server.server:main"

[project.entry-points."opentide.platforms"]
sentinel = "opentide.platforms.sentinel:declare"
splunk = "opentide.platforms.splunk:declare"
crowdstrike = "opentide.platforms.crowdstrike:declare"
carbon_black_cloud = "opentide.platforms.carbon_black:declare"
defender_for_endpoint = "opentide.platforms.defender_for_endpoint:declare"
sentinel_one = "opentide.platforms.sentinel_one:declare"
harfanglab = "opentide.platforms.harfanglab:declare"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]

[tool.hatch.build.targets.wheel.force-include]
"src/opentide/data" = "opentide/data"
"src/opentide/schemas/data" = "opentide/schemas/data"
"src/opentide/py.typed" = "opentide/py.typed"

[tool.hatch.build.hooks.vcs]
version-file = "src/opentide/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=opentide",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["src/opentide"]
relative_files = true
omit = [
    "src/opentide/_version.py",
    "src/opentide/deployment/*",
    "src/opentide/mutation/*",
    "src/opentide/platforms/*/client.py",
    "src/opentide/platforms/*/deployer.py",
    "src/opentide/platforms/*/validator.py",
    "src/opentide/mcp_server/server.py",
]

[tool.coverage.report]
fail_under = 46.9
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [
    # Ported Engines modules — style cleanup tracked separately
    "src/opentide/deployment",
    "src/opentide/mutation",
    "src/opentide/documentation",
    "src/opentide/extraction",
    "src/opentide/export",
    "src/opentide/platforms/carbon_black",
    "src/opentide/platforms/crowdstrike",
    "src/opentide/platforms/defender_for_endpoint",
    "src/opentide/platforms/harfanglab",
    "src/opentide/platforms/sentinel",
    "src/opentide/platforms/sentinel_one",
    "src/opentide/platforms/splunk",
    "src/opentide/platforms/kql.py",
    "src/opentide/platforms/plugins.py",
    "src/opentide/core/index_legacy.py",
    "src/opentide/core/debug.py",
    "src/opentide/core/environment.py",
    "src/opentide/indexing/indexer.py",
    "src/opentide/indexing/revisions.py",
    "src/opentide/indexing/staging_indexer.py",
    "src/opentide/generation/framework.py",
    "src/opentide/generation/vscode_snippets.py",
    "src/opentide/loading/config_loader.py",
    "src/opentide/loading/configurations.py",
    "src/opentide/loading/objects.py",
    "src/opentide/models/object_models.py",
    "src/opentide/models/system_models.py",
    "src/opentide/models/deployment_enums.py",
    "src/opentide/validation/cve.py",
    "src/opentide/validation/legacy.py",
    "src/opentide/validation/tide_schema.py",
    "src/opentide/validation/id_uniqueness.py",
    "src/opentide/validation/uuid_v4.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Ported from Engines/framework — behavioural preservation; style cleanup deferred to Phase 9
"src/opentide/generation/schema_pipeline.py" = ["E501", "SIM", "UP", "B", "E712", "E721", "E722", "F841"]
"src/opentide/generation/template_renderer.py" = ["E501", "SIM", "UP", "B", "E712", "E722", "F841"]
"src/opentide/generation/template_engine.py" = ["E501", "SIM", "UP", "B", "E712", "E722", "F841"]
"src/opentide/cli/__init__.py" = ["B008", "E501"]
"src/opentide/cli/services/*.py" = ["E501", "SIM"]
"tests/test_cli/*.py" = ["E501"]
"tests/test_generation/*.py" = ["E501"]
"src/opentide/mcp_server/server.py" = ["B008", "E501"]
"src/opentide/mcp_server/*.py" = ["E501"]

[tool.ty.src]
include = ["src/opentide"]
exclude = [
    "src/opentide/deployment",
    "src/opentide/mutation",
    "src/opentide/documentation",
    "src/opentide/extraction",
    "src/opentide/export",
    "src/opentide/cli",
    "src/opentide/platforms",
    "src/opentide/indexing",
    "src/opentide/loading/config_loader.py",
    "src/opentide/loading/objects.py",
    "src/opentide/loading/configurations.py",
    "src/opentide/generation/framework.py",
    "src/opentide/generation/schema_pipeline.py",
    "src/opentide/generation/template_engine.py",
    "src/opentide/generation/vscode_snippets.py",
    "src/opentide/models/object_models.py",
    "src/opentide/models/system_models.py",
    "src/opentide/models/deployment_enums.py",
    "src/opentide/models/config_models.py",
    "src/opentide/core/logging",
    "src/opentide/core/debug.py",
    "src/opentide/core/environment.py",
    "src/opentide/core/index_legacy.py",
    "src/opentide/core/index_manager.py",
    "src/opentide/core/registry.py",
    "src/opentide/validation",
]

[tool.ty.rules]
# Tide domain models intentionally shadow Pydantic BaseModel.validate (instance delegation).
invalid-method-override = "warn"
redundant-cast = "ignore"
