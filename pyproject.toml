# maturin, PyO3's build backend, compiles bindings/python/ (Rust) into the
# package as opentide._native ([tool.maturin] below). The version is the Cargo
# workspace's, which bindings/python/ takes (`scripts/engine/release.py bump`);
# a candidate's or a CI build's is written into that crate in the workflow's
# checkout (`scripts/engine/release.py pypi-version`).
[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "opentide"
dynamic = ["version"]
description = "Spec-driven development for agentic detection engineering: validate, generate, deploy, and document detection-as-code across fourteen security platforms."
readme = "README.md"
license = "EUPL-1.2"
# NOTICE covers the third-party data the engine compiles in; the licence and notice
# files it cites ship beside it.
license-files = [
    "LICENSE",
    "NOTICE",
    "data/catalogs/ecs/LICENSE.txt",
    "data/catalogs/ecs/NOTICE",
    "data/catalogs/falco/LICENSE.txt",
    "data/catalogs/falco/LICENSE-MIT.txt",
    "data/catalogs/falco/NOTICE",
    "data/catalogs/cql/LICENSE-Apache-2.0.txt",
    "data/catalogs/cql/LICENSE-MIT.txt",
    "data/catalogs/cql/LICENSE-Unlicense.txt",
    "data/catalogs/cql/NOTICE",
    "data/catalogs/datadog/LICENSE-BSD-3-Clause.txt",
    "data/catalogs/datadog/NOTICE",
    "data/catalogs/bitdefender/NOTICE",
    "data/catalogs/carbon_black/NOTICE",
    "data/catalogs/exabeam/LICENSE-Apache-2.0.txt",
    "data/catalogs/exabeam/NOTICE",
    "data/catalogs/tz/NOTICE",
    "data/catalogs/yara/LICENSE-BSD-3-Clause-libyara.txt",
    "data/catalogs/yara/LICENSE-BSD-3-Clause-YARA-X.txt",
    "data/catalogs/yara/NOTICE",
    "data/catalogs/yaral/NOTICE",
]
authors = [
    { name = "opentide", email = "digit-ec-opentide@ec.europa.eu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# None: the command line, the SDK, the Tide models and the platform connectors
# are the Rust core, compiled into this package (opentide._native,
# bindings/python/, by maturin).
dependencies = []

[project.optional-dependencies]
# The plugin API (opentide.plugins): a platform plugin's configuration_model is
# a pydantic model, which PlatformPlugin.check_configuration validates a rule's
# block with. Nothing else in the package imports pydantic.
plugins = ["pydantic>=2.0"]

[dependency-groups]
dev = [
    "tomli>=2.0",
    # The plugin API's tests and the sample plugin (the `plugins` extra).
    "pydantic>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-console-scripts>=1.4",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    # CI's contract tests read the workflows (tests/test_ci/).
    "pyyaml>=6.0",
    "ruff>=0.17.2",
    "ty>=0.0.65",
    "pre-commit>=4.0",
]
# The language server against real editors' capabilities
# (scripts/engine/clients, the nightly's `clients` job): pytest-lsp, with
# pytest-asyncio. Kept out of `dev`, whose suite does not collect it:
# `uv run --only-group clients` runs it without building the package.
clients = [
    "pytest-lsp==1.0.1",
]

[tool.uv]
# What uv builds of opentide (`uv sync`'s editable install, `uv build`) compile
# the engine with cargo's `develop` profile: optimised, so the engine runs at
# full speed in the test suite, without the release profile's slow link-time
# optimisation. The published wheels are release builds (release-pipeline.yml).
config-settings-package = { opentide = { build-args = "--profile develop" } }
# Rebuild opentide, which compiles the engine (maturin), when the Rust sources
# or what they compile in change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "bindings/python/Cargo.toml" },
    { file = "bindings/python/build.rs" },
    { file = "bindings/python/src/**/*.rs" },
    { file = "crates/*/Cargo.toml" },
    { file = "crates/*/build.rs" },
    { file = "crates/*/src/**/*.rs" },
    { file = "vendor/*/Cargo.toml" },
    { file = "vendor/*/src/**/*.rs" },
    # What the engine crates compile in (include_str!, build.rs).
    { file = "data/catalogs/**" },
    { file = "src/opentide/data/**" },
    { file = "highlights/spec.toml" },
    { file = "highlights/generated/**" },
]

[project.urls]
Homepage = "https://opentide.org"
Documentation = "https://opentide.org/docs/usage/"
Changelog = "https://github.com/opentidehq/opentide/blob/development/CHANGELOG.md"
Releases = "https://opentide.org/docs/usage/releases/"
Repository = "https://github.com/opentidehq/opentide"
Issues = "https://github.com/opentidehq/opentide/issues"

[project.scripts]
opentide = "opentide._cli:main"

# The wheel: src/opentide (python-source: the package data and the stubs of
# _native/*.pyi with it) and bindings/python/ compiled into it as
# opentide/_native (.abi3.so, or .pyd on Windows). The extension uses the stable
# ABI from CPython 3.10 (pyo3's abi3-py310 feature, bindings/python/Cargo.toml),
# so the wheel is tagged cp310-abi3-<platform>: one wheel per platform serves
# every CPython from 3.10 on. A free-threaded CPython (3.14t) has no stable ABI:
# it builds from the sdist, and no cp314t wheel is published. No musllinux
# wheel either: the maintainer decided against musl builds; Alpine builds from
# the sdist too (docs/internal/publishing.md, "The release train").
#
# A wheel builds cargo's `release` profile. Development builds name another:
# `maturin develop --uv --profile develop` (optimised, no link-time
# optimisation; .agents/skills/uv/SKILL.md), and CI's gate `--profile dev`.
[tool.maturin]
python-source = "src"
module-name = "opentide._native"
manifest-path = "bindings/python/Cargo.toml"
bindings = "pyo3"
profile = "release"
# No `locked` here: the sdist's workspace keeps only the members the binding
# needs (maturin trims the rest), so cargo drops their entries from the lock it
# carries; every version it keeps is the lock's. CI's builds pass --locked.
# A development install's compiled module (in src/opentide) stays out of the
# sdist; a wheel gets its own build.
exclude = [
    { path = "src/opentide/_native.so", format = "sdist" },
    { path = "src/opentide/_native.*.so", format = "sdist" },
    { path = "src/opentide/_native.pyd", format = "sdist" },
    { path = "src/opentide/_native.*.pyd", format = "sdist" },
    # The crates' integration tests and the reference Tide schemas: no build reads them.
    { path = "crates/*/tests/**/*", format = "sdist" },
    { path = "data/catalogs/tide/schemas/**/*", format = "sdist" },
    # The engine compiles src/opentide/data and src/opentide/schemas/data in
    # (build.rs, `include_str!`) and the package reads neither at run time, so a
    # wheel carries a binary and no copy; the sdist keeps them for the build.
    { path = "src/opentide/data/**/*", format = "wheel" },
    { path = "src/opentide/schemas/**/*", format = "wheel" },
]
# The sdist carries the engine's Rust sources, so it builds wherever a Rust
# toolchain is installed (crates.io dependencies are fetched as usual): maturin
# packs the binding and every workspace crate it depends on (their `cargo
# package` files) with the workspace manifest and lock; the data the crates
# compile in from the repository root is added here. The rest of the engine's
# tree stays out: test data, the fuzz targets, editors, npm packages, the
# engine's docs and scripts, the reference Tide schemas, and rust-toolchain.toml, so a build from the
# sdist uses the toolchain it finds instead of asking rustup for components.
include = [
    { path = "data/catalogs/**/*", format = "sdist" },
    { path = "highlights/spec.toml", format = "sdist" },
    { path = "highlights/generated/**/*", format = "sdist" },
    # The crates the workspace patches in ([patch.crates-io], vendor/README.md).
    { path = "vendor/**/*", format = "sdist" },
    # The version a build reports (OPENTIDE_BUILD_VERSION, scripts/build/report_version.py).
    { path = ".cargo/config.toml", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=opentide",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "cli_e2e: end-to-end tests of the console script (separate CI job, Python 3.14)",
    "cli_smoke: subprocess console-script smoke (same CI job as cli_e2e)",
    "gitlab_ci_lint: glint and gitlab-ci-verify on generated GitLab CI (CI job, needs the binaries)",
    "full_set: too slow for every pull request; CI runs it on release pull requests and the nightly only (python-matrix)",
]

[tool.coverage.run]
source = ["src/opentide"]
relative_files = true

[tool.coverage.report]
fail_under = 85.0
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Why each family is here: .agents/skills/ruff/SKILL.md
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "C4", "DTZ", "ERA", "FURB", "G", "ISC", "LOG", "PGH", "PIE", "PLE", "PLW1510", "RUF", "T20",
]
ignore = [
    "C408",    # dict(a=1) vs {"a": 1} is style, not a defect
    "ISC004",  # parenthesising every multi-line string in a list is churn; ISC001-003 stay on
]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.isort]
# The oracle's scripts (tests/cassettes/) import modules this
# checkout no longer has: opentide is first-party wherever it comes from.
known-first-party = ["opentide"]

[tool.ruff.lint.per-file-ignores]
# Scripts whose job is to print.
"scripts/**" = ["T201"]
# Tests assert on return codes, and their fakes use class attributes.
"tests/**" = ["PLW1510", "RUF012"]

[tool.ty.src]
include = ["src/opentide"]
