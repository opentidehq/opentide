[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opentide"
dynamic = ["version"]
description = "Spec-driven development for agentic detection engineering: validate, generate, deploy, and document detection-as-code across eight security platforms."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "opentide", email = "digit-ec-opentide@ec.europa.eu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "pydantic>=2.0",
    "dulwich>=1.2.12",
    "orjson>=3.9",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "structlog>=24.0",
    "rich>=13.0",
    "typing_extensions>=4.0",
    # Required by the `opentide` console script (opentide.cli imports typer at import time).
    # Typer 0.27+ ships rich/shellingham/colorama as default deps; extra `all` was removed.
    "typer>=0.27.0",
    "ruamel.yaml",
    "questionary>=2.1.1",
    # `opentide tui`. A dependency, not an extra, because `pip install opentide`
    # is the only install. Imported only by opentide.cli.tui_app when the UI
    # opens, so no command, nor `opentide tui --help`, pays for it at start-up.
    "textual>=8.0",
    "requests>=2.34.2",
    "pymisp>=2.5.34.4",
    # The MCP server (`opentide mcp start`) imports `mcp.server.fastmcp`, which
    # mcp 2.x removed in favour of MCPServer. Standalone `fastmcp` is a
    # different package and unused.
    "mcp>=1.28.1,<2",
    # Platform SDKs. `pip install opentide` is the only install: there are no
    # extras, so live query validation, deploy and import work for every
    # platform out of the box, including in generated CI pipelines.
    # Sentinel deploys through the ARM REST API directly (no
    # azure-mgmt-securityinsight: it is pre-release only, and uv refuses a
    # transitive pre-release).
    "azure-identity>=1.17",
    "azure-monitor-query>=1.4",
    "splunk-sdk>=2.0",
    "pandas>=2.0",
    # pandas writes the playbook map export (`to_excel`) through openpyxl.
    "openpyxl>=3.1",
    "carbon-black-cloud-sdk>=1.0",
    # carbon-black-cloud-sdk requires boto3 unpinned. botocore caps
    # python-dateutil below 3, and once 3.0.0 was out uv's resolver chose it and
    # walked boto3 back to 0.0.3, whose botocore fails on `six.moves`. The floor
    # makes the resolver keep a current boto3 and cap python-dateutil instead.
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "tomli>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-console-scripts>=1.4",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    # Drives the setup wizard on a real PTY; CliRunner never presents a TTY, so
    # the interactive path had no e2e coverage (#260).
    "pexpect>=4.9",
    "syrupy>=5.5.3,<7",
    "ruff>=0.16.1",
    "ty>=0.0.65",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://opentide.org"
Documentation = "https://opentide.org/docs/usage/"
Changelog = "https://github.com/opentidehq/opentide/blob/development/CHANGELOG.md"
Releases = "https://opentide.org/docs/usage/releases/"
Repository = "https://github.com/opentidehq/opentide"
Issues = "https://github.com/opentidehq/opentide/issues"

[project.scripts]
opentide = "opentide.cli:main"

[project.entry-points."opentide.platforms"]
sentinel = "opentide.platforms.sentinel:declare"
splunk = "opentide.platforms.splunk:declare"
crowdstrike = "opentide.platforms.crowdstrike:declare"
carbon_black_cloud = "opentide.platforms.carbon_black:declare"
defender_for_endpoint = "opentide.platforms.defender_for_endpoint:declare"
sentinel_one = "opentide.platforms.sentinel_one:declare"
harfanglab = "opentide.platforms.harfanglab:declare"
elastic = "opentide.platforms.elastic:declare"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
# hatchling 1.32 defaults to Core Metadata 2.5; PyPI/twine still gate on 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]
core-metadata-version = "2.4"

[tool.hatch.build.hooks.vcs]
version-file = "src/opentide/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=opentide",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "cli_e2e: in-process Typer CliRunner end-to-end tests (separate CI job, Python 3.14)",
    "cli_smoke: subprocess console-script smoke (same CI job as cli_e2e)",
    "gitlab_ci_lint: glint and gitlab-ci-verify on generated GitLab CI (CI job, needs the binaries)",
]

[tool.coverage.run]
source = ["src/opentide"]
relative_files = true
omit = [
    "src/opentide/_version.py",
    "src/opentide/deployment/*",
    "src/opentide/mutation/*",
    "src/opentide/platforms/*/client.py",
    "src/opentide/platforms/*/deployer.py",
    "src/opentide/platforms/*/validator.py",
    "src/opentide/mcp_server/server.py",
]

[tool.coverage.report]
fail_under = 85.0
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Why each family is here: .agents/skills/ruff/SKILL.md
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "C4", "DTZ", "ERA", "FURB", "G", "ISC", "LOG", "PGH", "PIE", "PLE", "PLW1510", "RUF", "T20",
    "TID251",
]
ignore = [
    "C408",    # dict(a=1) vs {"a": 1} is style, not a defect
    "ISC004",  # parenthesising every multi-line string in a list is churn; ISC001-003 stay on
]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
# Entry points whose job is to print: the CLI's JSON writer and small `main()`s.
"src/opentide/cli/output.py" = ["T201"]
"src/opentide/cli/findings.py" = ["T201"]
"src/opentide/ci/state_replay.py" = ["T201"]
"src/opentide/mcp_server/launcher.py" = ["T201"]
"src/opentide/vocabulary/sync_upstream.py" = ["T201"]
"scripts/**" = ["T201"]
# Tests assert on return codes, and their fakes use class attributes.
"tests/**" = ["PLW1510", "RUF012"]
# The requests.Session ban guards tenant TLS policy: platform clients only,
# minus transport.py, which defines TenantSession.
"!src/opentide/platforms/**" = ["TID251"]
"src/opentide/platforms/transport.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests.Session".msg = "Platform clients use opentide.platforms.transport.TenantSession, which keeps the tenant's ssl over REQUESTS_CA_BUNDLE and applies a timeout."

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults; they are immutable markers.
extend-immutable-calls = ["typer.Option", "typer.Argument", "opentide.cli.enums.platform_help"]

[tool.ty.src]
include = ["src/opentide"]

[tool.ty.rules]
# Tide domain models intentionally shadow Pydantic BaseModel.validate (instance delegation).
invalid-method-override = "warn"
# Per-platform system configs narrow the nested SystemConfig.Tenant and
# .Tenant.Setup dataclasses so each platform's tenant carries its own setup
# fields (Sentinel gets a workspace, Splunk gets a port, and so on). Narrowing a
# mutable attribute is unsound for writes in the general case, which is what ty
# reports here, but these objects are parsed once from system configuration and
# read thereafter. Metadata.schema and PlatformConfigBase.schema trip the same
# pattern: both deliberately expose the object's `schema` YAML key, which would
# otherwise resolve to the deprecated BaseModel.schema() classmethod.
#
# ty reports these same 19 sites under three overlapping override rules, so
# silencing one surfaces the next -- all three are listed deliberately. The
# names also churn between ty patch releases (0.0.86 used the first two, 0.0.87
# added the third), so a ty bump that reds the lint job is usually a rename
# rather than a new finding: compare the reported sites before changing code.
invalid-property-type-override = "ignore"
invalid-attribute-override = "ignore"
invalid-mutable-override = "ignore"
redundant-cast = "ignore"
