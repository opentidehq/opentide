[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentide"
version = "0.0.0"
description = "OpenTide — DetectionOps engine (PyPI package)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/opentide"]
