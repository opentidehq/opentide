[package]
name = "opentide-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide language server binary (stdio LSP + analyze/highlight CLI)"
readme = "README.md"
keywords = ["lsp", "kql", "spl", "esql", "detection"]
categories = ["development-tools", "command-line-utilities"]
default-run = "opentide-lsp"
# Not published while opentide-schema and opentide-workspace are not (ADR
# 0010's addendum, UC-2.6 #821): the server reads its checks from them, in
# this workspace. `cargo package` leaves it out (ci.yml).
publish = false

[lints]
workspace = true

# `cargo binstall opentide-lsp` downloads the binary each GitHub Release
# carries for the target, instead of compiling the workspace.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[lib]
name = "opentide_lsp"
path = "src/lib.rs"

[[bin]]
name = "opentide-lsp"
path = "src/main.rs"

[dependencies]
opentide-core.workspace = true
opentide-analysis.workspace = true
opentide-highlight.workspace = true
opentide-kql.workspace = true
opentide-spl.workspace = true
opentide-tide.workspace = true
# Tide diagnostics are `validate`'s, and configuration checks the models' (UC-2.6).
opentide-workspace.workspace = true
opentide-schema.workspace = true
# The object files of a root are indexed in parallel on start-up.
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
regex.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
url.workspace = true

[dev-dependencies]
trycmd.workspace = true
