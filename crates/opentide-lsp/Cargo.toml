[package]
name = "opentide-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide language server binary (stdio LSP + analyze/highlight CLI)"
readme = "../../README.md"
keywords = ["lsp", "kql", "spl", "esql", "detection"]
categories = ["development-tools", "command-line-utilities"]
default-run = "opentide-lsp"

# `cargo binstall opentide-lsp` downloads the binary each GitHub Release
# carries for the target, instead of compiling the workspace.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[[bin]]
name = "opentide-lsp"
path = "src/main.rs"

[dependencies]
opentide-core.workspace = true
opentide-analysis.workspace = true
opentide-highlight.workspace = true
opentide-kql.workspace = true
opentide-spl.workspace = true
opentide-tide.workspace = true
serde.workspace = true
serde_json.workspace = true
lsp-types.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_yaml.workspace = true
regex.workspace = true
