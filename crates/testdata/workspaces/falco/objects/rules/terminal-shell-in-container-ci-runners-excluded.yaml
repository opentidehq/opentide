# Tunes the Falco default rule "Terminal shell in container"
# (falcosecurity/rules, rules/falco_rules.yaml): appends a condition and an
# exception. The block's list is expanded at deploy.
name: Terminal shell in container, CI runners excluded
metadata:
  uuid: 9440d222-0a9d-4cf4-b54d-fe8febe33723
  schema: rule::1.0
  version: 1
  created: '2026-11-02'
  modified: '2026-11-02'
  tlp: clear
  author: Detection Engineering
  organisation:
    uuid: 5f3c2a10-7b6e-4c1d-9a8f-2e4b6d0c1a73
    name: Detection Engineering
description: |
  CI runners open shells in build containers on every job.
response:
  alert_severity: Low
configurations:
  sysdig:
    enabled: true
    schema: platform::sysdig::1.0
    status: PRODUCTION
    append_to_rule: Terminal shell in container
    condition: and not proc.pname in (ci_runners)
    exceptions:
    - name: build_namespaces
      fields: k8s.ns.name
      comps: in
      values: [ci, builds]
    lists:
    - name: ci_runners
      items: [gitlab-runner, buildkite-agent]
