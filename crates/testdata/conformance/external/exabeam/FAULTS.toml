# One entry per query in this directory: the fault injected into its
# `.broken.exabeam` twin and the code the twin must report. The queries are
# written for opentide (EUPL-1.2): Exabeam's published rules may not be
# redistributed (../SOURCES.md, docs/EXABEAM.md). See
# crates/opentide-analysis/tests/external_exabeam.rs.

