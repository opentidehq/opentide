# Argument completion checked against the cited Search Reference syntax.
# `source` is the text before the cursor. `expect` must appear; `absent` must not
# (those names are eval functions, so a hit means the completion fell through
# to the full function list).

[[cases]]
command = "tstats"
source = "| tstats "
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"
expect = ["summariesonly", "prestats", "allow_old_summaries", "fillnull_value", "from", "datamodel", "where", "by"]
absent = ["json_extract", "cidrmatch"]

[[cases]]
command = "stats"
source = "| stats "
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Stats"
expect = ["by", "sum", "count"]
absent = ["json_extract", "cidrmatch"]

[[cases]]
command = "rex"
source = "| rex "
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Rex"
expect = ["field", "mode", "max_match", "offset_field"]
absent = ["json_extract", "lower", "cidrmatch"]

[[cases]]
command = "rex"
source = "| rex mode="
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Rex"
expect = ["sed"]
absent = ["field", "json_extract"]

[[cases]]
