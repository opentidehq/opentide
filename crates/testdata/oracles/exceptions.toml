# Known disagreements between the opentide engine and the reference parsers.
# scripts/engine/ci-oracle.sh enforces this file (see scripts/engine/oracles/README.md):
#
# - A query where ours and the reference disagree fails CI unless an entry
#   lists it in `paths`. Paths are repository-relative; a query inside a Tide
#   rule is `<file>#configurations.<platform>.<field>`.
# - A function, plugin or command name the two sides disagree on fails CI
#   unless an entry lists it in `names`.
# - A listed path or name that no longer disagrees fails CI too. Delete it
#   in the change that fixes it.
#
# Every entry has an `id`, a `reason`, and exactly one of `paths` or `names`.
# The references are CI-only. Do not ship Microsoft Kusto.Language, Splunk,
# or a Splunk SDK in any release artifact (scripts/engine/license-scan.sh).

# ---------------------------------------------------------------------------
# KQL: Microsoft Kusto.Language
# ---------------------------------------------------------------------------

# Probes in crates/testdata/oracles/kql/ are one form each, taken from real Sentinel
# and Defender rules. Ours must accept each with no error-severity diagnostic;
# that check cannot be excepted.

# Corpus fixtures labelled invalid that Kusto.Language accepts.

[[kql]]
id = "kql-empty-column-lists"
reason = "Kept on purpose. Kusto.Language parses `T | project`, `project-away` and `project-rename` with no columns; ours reports a syntax error because an empty column list is always a mistake in a detection. (`summarize` with no aggregates parses, since `summarize by x` is valid.)"
paths = [
  "crates/testdata/corpus/kql/project_operator__invalid.kql",
  "crates/testdata/corpus/kql/project_away_operator__invalid.kql",
  "crates/testdata/corpus/kql/project_rename_operator__invalid.kql",
]

[[kql]]
id = "kql-number-suffix"
reason = "Kusto.Language lexes `42x` as a name and rejects it only in semantic analysis (KS142); our lexer rejects it as a malformed number."
paths = ["crates/testdata/corpus/kql/number__invalid.kql"]

[[kql]]
id = "kql-control-command-arguments"
reason = "Kusto.Language parses the whole `.create table X (a:string)` command; our grammar parses only enough of a control command to report kql_control_command_unsupported, which still fires."
paths = ["crates/testdata/corpus/kql/control_command__invalid.kql"]

# Names: data/catalogs/kql/core against Kusto.Language GlobalState.Default.

[[kql]]
id = "kql-log-analytics-functions"
reason = "Log Analytics / Sentinel functions. Kusto.Language's default GlobalState holds Azure Data Explorer functions only."
names = ["_GetWatchlist", "workspace"]

[[kql]]
id = "kql-special-forms"
reason = "Kusto.Language parses `materialize(...)` and `toscalar(...)` as their own syntax, not as function symbols."
names = ["materialize", "toscalar"]

[[kql]]
id = "kql-plugins-missing-from-kusto-language"
reason = "Documented on Learn and in data/catalogs/kql/core/evaluate-plugins.toml, but absent from Kusto.Language 12.4.1."
names = ["diffpatterns_text", "schema_merge"]

[[kql]]
id = "kql-obsolete-without-learn-replacement"
reason = "Obsolete in Kusto.Language, and no Learn article names a replacement, so the catalog has nothing to cite for them."
names = ["cnt", "row_rank", "ai_embed_text"]

[[kql]]
id = "kql-hidden-symbols"
reason = "Hidden in Kusto.Language and undocumented on Learn. Not catalogued on purpose; ours reports them only when they look like a typo of a catalogued name."
names = [
  "current_node_id", "hll_isvalid", "iscolumnexists", "rowstore_ordinal_range",
  "tdigest_isvalid", "make_dictionary", "passthrough", "dax_request", "postgresql_request",
]

[[kql]]
id = "kql-no-learn-article"
reason = "Kusto.Language functions and plugins with no Learn article: graph-match internals (all, map, node_*, inner_nodes), Azure Data Explorer service plugins (execute_query, csharp, identity, ...). Not catalogued until Learn documents them."
names = [
  "all", "array_strcat", "entity_group", "inner_nodes", "map", "node_degree_in",
  "node_degree_out", "node_id", "row_id", "set_equals",
  "csharp", "estimate_rows_count", "execute_query", "execute_show_command",
  "external_datatable", "identity", "identity_v3",
]

# ---------------------------------------------------------------------------
# SPL: Splunk search/parser (scripts/engine/oracles/oracle.py prefixes `search` to
# text that does not start with `|`, as Splunk does; docs/engine/spl/README.md)
# ---------------------------------------------------------------------------

# Probes in crates/testdata/oracles/spl/ are one form each, taken from ESCU
# detections, plus the argumentless commands and empty stages of #135 (their
# `.broken.` twins are the forms Splunk rejects). Ours must accept each with
# no error-severity diagnostic; that check cannot be excepted. Forms Splunk
# accepts that are still mistakes (spl_empty_command, spl_empty_stage,
# spl_command_without_pipe) are not syntax errors, so they never disagree.

# Probes Splunk's parser cannot check with parse_only.

[[spl]]
id = "spl-parse-only-subsearch"
reason = "Splunk's search/parser answers \"This search cannot be parsed when parse_only is set to true\" for a subsearch it would have to run first (`where NOT [| makeresults ...]`). It is a limit of parse_only, not a syntax error: a deployed detection uses the form."
paths = ["crates/testdata/oracles/spl/where_not_subsearch.spl"]

# Names: data/catalogs/spl/commands.toml against Splunk searchbnf.conf.

[[spl]]
id = "spl-public-commands-missing"
reason = "searchbnf marks these usage = public, but no Search Reference page could be cited for them, so they are not catalogued; ours reports spl_unknown_command."
names = ["federate", "ingestpreview", "oldreturn"]

[[spl]]
id = "spl-internal-commands"
reason = "searchbnf marks these usage = internal, debug or deprecated. Not for detections, so not catalogued; Splunk still runs them."
names = [
  "createrss", "debug", "dump", "editinfo", "findkeywords", "makejson", "mcatalog",
  "mrollup", "nokv", "outputraw", "outputtelemetry", "prjob", "rawstats",
  "runshellscript", "showargs", "surrounding",
]

[[spl]]
id = "spl-mltk-commands"
reason = "Splunk Machine Learning Toolkit commands, catalogued with app = \"MLTK\" because detections use them widely. The app is not installed on the reference search head, so Splunk reports them as unknown search commands."
names = ["apply", "deletemodel", "fit", "listmodels", "score", "summary"]

# ---------------------------------------------------------------------------
# Elastic: @elastic/esql, Elasticsearch EqlBase.g4, Kibana grammar.peggy,
# Lucene QueryParser 10.5.2. Ours rejects on error-severity syntax codes only
# (oracle.py REJECT); checks Elasticsearch makes after parsing are not compared.
# ---------------------------------------------------------------------------

[[esql]]
id = "esql-8.19-only-forms"
reason = "8.19-only forms. Ours accepts them with an esql_unavailable warning naming 8.19, because the supported floor is 8.19; @elastic/esql follows Elasticsearch main, which removed them (`FROM x [METADATA ...]`, `COMPLETION ... WITH endpoint`)."
paths = [
  "crates/testdata/corpus/esql/completion_command__valid.endpoint.esql",
  "crates/testdata/corpus/esql/metadata__valid.bracketed.esql",
]

[[eql]]
id = "eql-builder-parsing-exceptions"
reason = "Elasticsearch's LogicalPlanBuilder raises a ParsingException after EqlBase.g4 accepts the text: a sample without join keys, missing events without maxspan, an unknown sequence term option. Ours reports them as eql_parse_error, as Elasticsearch does; the grammar alone cannot see them."
paths = [
  "crates/testdata/corpus/eql/sample__invalid.eql",
  "crates/testdata/corpus/eql/subquery__invalid.eql",
  "crates/testdata/corpus/eql/term_option__invalid.eql",
]

[[lucene]]
id = "lucene-elasticsearch-fuzziness"
reason = "Lucene's QueryParser reads `~0.7` as a legacy similarity; Elasticsearch's query_string parses fuzziness with Fuzziness.fromString and fails on a fraction, so ours reports lucene_fuzzy."
paths = ["crates/testdata/conformance/external/lucene-queryparser/cases.tsv:61"]

# ---------------------------------------------------------------------------
# YARA: YARA-X 1.23.0 (the yara-x wheel), the language (#1225)
# (scripts/engine/oracles/yara/oracle.py). A [[yara]] entry also has `check`:
# `yara_x` (the engine's verdict against YARA-X's) or `portable` (an error a
# refusing profile reports on a case libyara and YARA-X both compile). A
# `cases.json#<origin>` path is a case of
# crates/testdata/conformance/yara/cases.json; crates/opentide-yara/tests/
# conformance.rs reads those entries and fails on one that agrees.
# ---------------------------------------------------------------------------

[[yara]]
id = "yara-x-regexp-size-limit"
check = "yara_x"
reason = "Nested repetitions whose product passes YARA-X's regexp size limit. The limit is YARA-X's own and is not modelled."
paths = [
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/138.in",
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/156.in",
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/167.in",
]

[[yara]]
id = "yara-x-too-many-variables"
check = "yara_x"
reason = "More than about 2,048 variables in one condition (`with` declarations and loop variables): YARA-X's own frame limit (E047), which is not modelled."
paths = [
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/157.in",
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/158.in",
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/159.in",
  "crates/testdata/conformance/yara/cases.json#yara-x:lib/src/compiler/tests/testdata/errors/160.in",
]

[[yara]]
id = "vt-module-not-supported"
check = "yara_x"
reason = "YARA-X builds `vt` by default and compiles `import \"vt\"`; opentide refuses it on purpose (yara_unknown_module): `vt` describes VirusTotal's own scan metadata, which only VirusTotal's scanning fills in (maintainer decision, #1225). xtask/src/yara_modules.rs EXCLUDED leaves it out of the generated catalogue."
paths = [
  "crates/testdata/conformance/yara/cases.json#opentide:modules/vt",
]

# ---------------------------------------------------------------------------
# Datadog search syntax: VRL's grammar (vectordotdev/vrl@1e3e2e8a,
# src/datadog/search/grammar.pest), the Observability Pipelines dialect.
# scripts/engine/oracles/datadog/oracle.py compares accept-or-reject verdicts
# on Datadog's published queries (published.jsonl#<line>) and the corpus.
# docs/internal/rfc-datadog-cloud-siem.md, section 11.2, expects 14
# disagreements on the 3,229 queries it measured, each a query Datadog
# publishes that VRL refuses; 12 of them are in the vendored set (the two
# blog posts with an unescaped `:` are measured, not vendored).
# ---------------------------------------------------------------------------

[[datadog]]
id = "datadog-cidr-ipv6"
reason = "Datadog pipeline filters with `CIDR(…, fc00::/7)`. VRL has no CIDR(): it reads the call as a free-text term and a group, and refuses these because a term cannot hold `:`. Datadog documents CIDR() with IPv4 and IPv6 blocks (RFC 6.6); the engine parses the call and checks each block."
paths = [
  "crates/testdata/conformance/external/datadog/published.jsonl#1917",
  "crates/testdata/conformance/external/datadog/published.jsonl#1918",
  "crates/testdata/conformance/external/datadog/published.jsonl#1923",
  "crates/testdata/corpus/datadog/cidr_block__valid.datadog",
]

[[datadog]]
id = "datadog-full-text-search"
reason = "Datadog's search syntax page documents `*:term`, a search of every attribute; VRL has only `*:*`. The engine accepts it, and warns in a detection rule's query (datadog_full_text_in_rule)."
paths = [
  "crates/testdata/conformance/external/datadog/published.jsonl#224",
  "crates/testdata/conformance/external/datadog/published.jsonl#225",
  "crates/testdata/conformance/external/datadog/published.jsonl#226",
  "crates/testdata/conformance/external/datadog/published.jsonl#227",
  "crates/testdata/corpus/datadog/all_attributes__valid.datadog",
]

[[datadog]]
id = "datadog-leading-plus-value"
reason = "Values starting with `+` (`@process.args:+x`, `@data.message:+*`), which Datadog's docs write. VRL refuses a term starting with `+`; the engine reads `+` there as part of the value."
paths = [
  "crates/testdata/conformance/external/datadog/published.jsonl#133",
  "crates/testdata/conformance/external/datadog/published.jsonl#478",
]

[[datadog]]
id = "datadog-unescaped-colon"
reason = "A RUM docs example with an unescaped `:` in a value (`@http.url:https:\\/\\/*`). VRL refuses a term holding `:`; Datadog's docs say to escape it but its own content does not always, so the engine warns (datadog_unescaped_colon) rather than refuses."
paths = ["crates/testdata/conformance/external/datadog/published.jsonl#423"]

[[datadog]]
id = "datadog-pipelines-forms"
reason = "Observability Pipelines examples VRL's own grammar refuses: a quoted field name (`\"service.status\":disabled`, which the engine warns about as pipelines syntax, datadog_pipelines_only) and a term glued to a phrase (`tags:service\\:\"web-store\"`, which the engine reads as one value without a finding)."
paths = [
  "crates/testdata/conformance/external/datadog/published.jsonl#354",
  "crates/testdata/conformance/external/datadog/published.jsonl#403",
  "crates/testdata/corpus/datadog/quoted_field__valid.datadog",
]

[[datadog]]
id = "datadog-cidr-arguments-checked"
reason = "VRL reads `CIDR(…)` as text and a group, so it accepts any argument; the engine checks the call: an attribute first (`CIDR(network.client.ip, …)` searches a tag) and IPv4 or IPv6 blocks (`10.0.0.300` is none), datadog_cidr."
paths = [
  "crates/testdata/corpus/datadog/cidr_block__invalid.datadog",
  "crates/testdata/corpus/datadog/tag_key__invalid.datadog",
]

[[datadog]]
id = "datadog-stacked-modifiers"
reason = "VRL accepts `NOT NOT a` (and `-NOT a`); the engine refuses stacked modifiers, as VRL refuses `--a`, and no published query uses them (RFC 6.3)."
paths = ["crates/testdata/corpus/datadog/not_expr__invalid.datadog"]
