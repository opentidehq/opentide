[package]
name = "opentide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: Shared types for the opentide language server (I/O-free). Internal: depend on the opentide crate."
readme = "../COMPONENT.md"

[lints]
workspace = true

[features]
# `text::sha256_hex`: SHA-256 in hex. Opt-in: only the command line and xtask
# hash, so the engines, the facade and the hosts never build `sha2` (#2018).
digest = ["dep:sha2"]

[dependencies]
# Elastic durations (`duration`): linear-time patterns, no look-around.
regex.workspace = true
serde.workspace = true
# `json`: an ordered JSON value (objects in insertion order) written and read
# by serde_json, without its `preserve_order` feature (see the module).
serde_json.workspace = true
indexmap = "2"
# `catalog`: one SIMD search of a catalog's text for a multi-line string
# marker (already in the tree through regex).
memchr = "2"
# `node`: a string scalar of up to 24 bytes kept inline (`Value::Str`).
compact_str = "0.9"
toml.workspace = true
thiserror.workspace = true
# `ids`: every crate's UUID reading and recognising (#1938).
uuid.workspace = true
strsim.workspace = true
# `text::sha256_hex` (the `digest` feature): the one SHA-256 digest in hex
# (RustCrypto).
sha2 = { workspace = true, optional = true }
# YAML 1.2 (`node`, the node tree every crate reads YAML with, #850):
# saphyr-parser's events with their spans and saphyr's core-schema scalars.
saphyr.workspace = true
saphyr-parser.workspace = true
