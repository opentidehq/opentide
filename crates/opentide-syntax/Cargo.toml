[package]
name = "opentide-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: Tree-sitter language bindings for opentide KQL, SPL, ES|QL, EQL, kuery, Lucene, Falco, and CQL. Internal: depend on the opentide crate."
readme = "../COMPONENT.md"
build = "build.rs"

# The workspace's lints (root Cargo.toml, [workspace.lints], which gives each
# allowed lint its reason), copied because this crate needs `unsafe`: the tree-sitter FFI
# (each grammar's `tree_sitter_opentide_*()`, `Language::from_raw`).
# `forbid` cannot be relaxed inside a crate, so `unsafe_code` is `deny` here and
# each site allows it with its reason. xtask/tests/lint_policy.rs fails when
# this copy differs from the workspace's table in anything else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
single_match_else = "allow"
assert_is_empty = "allow"

[dependencies]
opentide-core.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
serde_json.workspace = true

# build.rs compiles these. scripts/engine/release.py copies them into assets/ at publish
# time, beside the files the crate's include_str! calls name.
[package.metadata.opentide]
assets = [
    "grammars/tree-sitter-opentide-kql/src",
    "grammars/tree-sitter-opentide-spl/src",
    "grammars/tree-sitter-opentide-esql/src",
    "grammars/tree-sitter-opentide-eql/src",
    "grammars/tree-sitter-opentide-kuery/src",
    "grammars/tree-sitter-opentide-lucene/src",
    "grammars/tree-sitter-opentide-falco/src",
    "grammars/tree-sitter-opentide-cql/src",
]
