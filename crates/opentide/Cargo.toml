[package]
name = "opentide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The opentide Rust SDK: open a Tide workspace, validate and lint it, read its catalogue and coverage, plan a deploy, run the command line. The only opentide crate with a stability promise."
readme = "README.md"
documentation = "https://docs.rs/opentide"
keywords = ["opentide", "detection-as-code", "security", "sigma", "siem"]
categories = ["development-tools", "command-line-utilities"]
# Published by the release train (publish.yml, UC-5.5) with the engine crates it
# wraps, at the product version: `cargo install opentide --features cli`.
# crates.io's `opentide` 0.0.0 was the name's placeholder
# (publishing/placeholders/crates/opentide).

[lints]
workspace = true

[package.metadata.docs.rs]
# Every feature's API on docs.rs (UC-5.1, #836).
all-features = true

[lib]
name = "opentide"
path = "src/lib.rs"

# The command line, as the opentide-cli crate's own binary and the PyPI and
# npm launchers run it: one `main(argv)` (ADR 0003). Only with `cli`: the
# library alone carries no binary.
[[bin]]
name = "opentide"
path = "src/bin/opentide.rs"
required-features = ["cli"]
# The library's documentation is the crate's; the binary has none of its own.
doc = false

# The four examples of the Rust page in docs/sdk (the sdist ships
# examples/, so these entries parse there). Each is also compiled into
# tests/examples.rs, which runs it on a workspace, so CI runs them with the
# tests (`cargo nextest run --workspace`).
[[example]]
name = "validate"
required-features = ["workspace"]

[[example]]
name = "catalog"
required-features = ["workspace"]

[[example]]
name = "deploy_plan"
required-features = ["compile"]

[[example]]
name = "query"
required-features = ["connectors"]

# The integration tests gate themselves on the features they need
# (`#![cfg(feature = "...")]` at each file's top), as cargo discovers them:
# an explicit `[[test]]` would name a file the Python sdist leaves out
# (`/crates/*/tests`, pyproject.toml), and the sdist's manifest would not
# parse. tests/cli.rs and tests/lsp.rs run with every feature (CI's `facade`
# job: `cargo test -p opentide --all-features`).

[features]
default = ["schema", "workspace", "compile"]
# The Tide models: threat vectors, detection objectives, detection rules, each
# revision, the schema identifiers (`opentide::models`).
schema = ["dep:opentide-schema"]
# Opening a workspace, validate, lint, info, the catalogue and coverage.
workspace = ["schema", "dep:opentide-workspace"]
# The deploy plan: what `opentide deploy --dry-run` would send.
compile = ["workspace", "dep:opentide-compile"]
# The offline query engines (KQL, SPL, ES|QL, EQL, Kibana KQL, Lucene, Falco,
# CQL) behind validate's and lint's queries checks. Without them a queries
# check reports `engine_unavailable`, never a skipped check. They come from the
# command line's crate until they move to the domain layer (plan §4), so this
# feature builds opentide-cli.
queries = ["workspace", "dep:opentide-cli"]
# The command line: `opentide::cli::main(argv)`, `opentide::cli::run_json`,
# and the `opentide` binary (`cargo install opentide --features cli`).
cli = ["compile", "queries"]
# The language server (`opentide::lsp`): stdio, or one message at a time.
lsp = ["workspace", "dep:opentide-lsp"]
# Tenant operations (`opentide::connectors`): a query run, a live query check
# and a rule deploy on the tenants a workspace configures, through the
# platform connectors (tokio, reqwest on rustls). Async; not for wasm32.
connectors = [
    "compile",
    "dep:opentide-connectors",
    "dep:tokio-util",
    "dep:jiff",
    "dep:toml",
]

[dependencies]
opentide-schema = { workspace = true, optional = true }
opentide-workspace = { workspace = true, optional = true }
opentide-compile = { workspace = true, optional = true }
opentide-cli = { workspace = true, optional = true }
opentide-lsp = { workspace = true, optional = true }
opentide-connectors = { workspace = true, optional = true }
# `connectors`: a connection's cancellation, a window's time
# (`connectors::Timestamp`), a tenant's setup table.
tokio-util = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# The documents the facade hands back as JSON: the deploy plan's payload,
# `cli::run_json`'s envelope.
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests lay a workspace out under a temporary folder, never in the checkout.
tempfile = "3"
# The goldens' comparator and ledger: the binary's `--json commands` against
# the PyPI CLI's recording (tests/cli.rs).
opentide-compare.workspace = true
# `connectors`: a stand-in tenant (tests/connectors.rs), and the runtime the
# tests await a connection's operations on.
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
