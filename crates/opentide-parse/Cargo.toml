[package]
name = "opentide-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: the language-agnostic parsing toolkit of the pure-Rust parsers (logos token source, event parser, lossless rowan trees). Internal: depend on the opentide crate."
readme = "../COMPONENT.md"

[lints]
workspace = true

[features]
# The old-versus-new differential harness; only dev-dependencies enable it.
differential = ["dep:serde_json"]

[dependencies]
logos.workspace = true
rowan.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[[test]]
name = "differential"
required-features = ["differential"]
