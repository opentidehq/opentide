[package]
name = "opentide-kql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: I/O-free KQL engine (parse, HIR, catalog, profiles). Internal: depend on the opentide crate."
readme = "../COMPONENT.md"

[lints]
workspace = true

[dependencies]
opentide-dataset.workspace = true
opentide-core.workspace = true
strsim.workspace = true
foldhash.workspace = true
# Already in the graph (indexmap): a schema's name index holds positions, not names (#1628).
hashbrown = { version = "0.17", default-features = false }
opentide-highlight.workspace = true
opentide-parse.workspace = true
logos.workspace = true
rowan.workspace = true
serde = { workspace = true, features = ["rc"] }
regex.workspace = true

[dev-dependencies]
toml.workspace = true
insta.workspace = true

[build-dependencies]
opentide-dataset = { workspace = true, features = ["encode"] }
# The Azure Monitor reference and the ASIM schemas are parsed once at build time (`build.rs`, #1743).
serde = { workspace = true, features = ["rc"] }
toml.workspace = true
