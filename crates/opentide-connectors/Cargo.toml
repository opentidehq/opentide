[package]
name = "opentide-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Published with the facade (UC-5.1); internal until then.
publish = false
description = "opentide's tenant connectors: one HTTP client per tenant (TLS, CA, proxy, timeouts, retries), credentials, cancellation and progress"

[lints]
workspace = true

[dependencies]
# `$NAME` and `${NAME}` placeholders: the one parser the workspace's `info` uses.
opentide-workspace.workspace = true
# The platforms (UC-4.2): request bodies and rows keep their key order
# (`opentide_compile::json::Json`); Elastic's durations; the advisory codes;
# Python's float `repr` in messages.
opentide-compile.workspace = true
opentide-core.workspace = true
opentide-schema.workspace = true
jiff.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
backon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
toml.workspace = true

[dev-dependencies]
# The recorded-HTTP harness: the sample connector's cassette is replayed with
# wiremock (tests/harness.rs).
opentide-cassette.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls.workspace = true
tempfile = "3"
