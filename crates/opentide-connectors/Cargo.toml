[package]
name = "opentide-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Published by the release train (publish.yml, UC-5.5), for the facade.
description = "opentide engine component: the tenant connectors (one HTTP client per tenant: TLS, CA, proxy, timeouts, retries; credentials, cancellation, progress). Internal: depend on the opentide facade (its `connectors` feature)."
readme = "README.md"

[lints]
workspace = true

[dependencies]
# The log events a client writes as the Python one does (Splunk's urllib handler):
# the CLI's log layer prints them.
tracing = "0.1"
# `$NAME` and `${NAME}` placeholders: the one parser the workspace's `info` uses.
opentide-workspace.workspace = true
# Elastic's advisory codes (UC-4.2b) and Python's float `repr` in messages.
opentide-core.workspace = true
opentide-schema.workspace = true
# The request and answer types under the transport (src/transport.rs): reqwest's own.
http = "1"
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
backon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
toml.workspace = true
# The platforms (UC-4.2): bodies and rows as ordered JSON, a search's window,
# a gateway page's title, query strings encoded as `requests` encodes them,
# HarfangLab's telemetry words; Elastic's durations (UC-4.2b).
opentide-compile.workspace = true
jiff.workspace = true
regex.workspace = true
percent-encoding = "2"
shlex = "2.0"
# Sentinel (UC-4.3): the request ids MSAL and azure-core stamp their requests with.
uuid = { workspace = true, features = ["v4"] }

# The native transport (src/transport.rs, `ReqwestTransport`): reqwest on rustls
# and the system's certificates, on tokio's multi-thread runtime. Not on WASI,
# whose host gives the process no sockets: there a tenant is reached only
# through the transport `opentide serve` installs (its client's
# `opentide/fetch`), and tokio's net, its threads and ring's C are left out.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
# The Sysdig test compiles the tide corpus's rule as deploy does.
opentide-schema.workspace = true
# The recorded-HTTP harness: the sample connector's cassette is replayed with
# wiremock (tests/harness.rs).
opentide-cassette.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls.workspace = true
tempfile = "3"
