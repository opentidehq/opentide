# --- anchors and aliases ---------------------------------------------------------
[[case]]
group = "alias"
id = "alias"
yaml = """
base: &b
  x: 1
  y: [1, 2]
copy: *b
item: &s hello
again: *s
"""

[[case]]
group = "alias"
id = "alias-undefined"
yaml = "a: *nothing\n"

[[case]]
group = "alias"
id = "alias-recursive"
yaml = "a: &x\n  b: *x\n"

[[case]]
group = "alias"
id = "alias-redefined"
