# The YAML 1.1 resolution table (UC-1.2, #808): every case is a document the
# oracle's loader (`opentide.core.io.parse_yaml`, PyYAML's CSafeLoader with
# opentide's timestamp and duplicate-key handling) reads. `yaml_table.py`
# runs each through the oracle and writes `yaml_table.json`, the expectations
# `tests/yaml_table.rs` holds the Rust loader (`opentide_schema::node`) to.
#
#   <oracle python> crates/opentide-schema/tests/oracle/yaml_table.py
#
# A case is `[[case]]` with an `id`, the document as `yaml` (or `bytes_hex`
# for bytes that TOML cannot hold, such as a BOM) and the `group` of the
# issue's list it belongs to.

# --- yes, no, on, off, y, n -------------------------------------------------
[[case]]
group = "bool"
id = "bool-words"
yaml = """
a: yes
b: Yes
c: YES
d: no
e: No
f: NO
g: on
h: On
i: ON
j: off
k: Off
l: OFF
m: true
n: True
o: TRUE
p: false
q: False
r: FALSE
"""

[[case]]
group = "bool"
id = "bool-not-words"
yaml = """
a: y
b: n
c: Y
d: N
e: yEs
f: tRUE
g: oN
h: 'yes'
i: "no"
j: !!str on
k: t
l: f
"""

[[case]]
group = "bool"
id = "bool-keys"
yaml = """
yes: 1
off: 2
y: 3
"""

[[case]]
group = "bool"
id = "bool-explicit-tag"
yaml = """
a: !!bool yes
b: !!bool false
"""

# --- ~ and null ---------------------------------------------------------------
[[case]]
group = "null"
id = "null-forms"
yaml = """
a: ~
b: null
c: Null
d: NULL
e:
f: nULL
g: 'null'
h: "~"
i: !!null ''
"""

[[case]]
group = "null"
id = "null-in-flow"
yaml = "a: [~, null]\nb: {x: , y: ~}\n"

[[case]]
group = "null"
id = "null-flow-empty-entry"
yaml = "a: [~, , ]\n"

[[case]]
group = "null"
id = "null-key"
yaml = """
~: a
null: b
"""

