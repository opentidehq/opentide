# The YAML resolution table (UC-1.2, #808): each case is a document read by
# the oracle's loader (`opentide.core.io.parse_yaml`: PyYAML's CSafeLoader,
# YAML 1.1, with opentide's timestamp and duplicate-key handling) and by
# opentide-schema's (`opentide_schema::node`: saphyr, YAML 1.2 core schema).
# `yaml_table.py` runs each case through the oracle and writes
# `yaml_table.json`:
#
#   <oracle python> crates/opentide-schema/tests/oracle/yaml_table.py
#
# `tests/yaml_table.rs` compares the two case by case and writes the result to
# `crates/opentide-schema/YAML.md`.
#
# A case is `[[case]]` with an `id`, the document as `yaml` (or `bytes_hex`
# for bytes that TOML cannot hold, such as a BOM), the `group` of the issue's
# list it belongs to, and, where the two loaders read it differently, the
# `difference` that explains why. Each `[[difference]]` gives the reason, the
# bold lead of its CHANGELOG.md entry, and whether it changes how an existing
# workspace file reads (`workspace`).

[[difference]]
id = "booleans"
reason = "YAML 1.2 has two booleans, `true` and `false` (also written `True`, `TRUE`, `False`, `FALSE`). `yes`, `no`, `on`, `off` are strings, which YAML 1.1 read as booleans. A boolean field written `enabled: yes` is now a type error (`bool_type`)."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "timestamps"
reason = "YAML 1.2's core schema has no timestamp type: a date is the string written. The oracle turned a date or timestamp into ISO 8601 text (`2026-01-01 10:00:00` became `2026-01-01T10:00:00`) and refused the file when the date cannot exist (`2026-02-30`). The text is kept as written; checking that a date exists is the date field's own check (UC-1.3), not the YAML reader's."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "integers"
reason = "YAML 1.2 integers are decimal, `0o` octal and `0x` hexadecimal. `017` is 17 (YAML 1.1: 15, octal), `0o17` is 15 (YAML 1.1: a string); `0b101`, `1_000` and sexagesimal `1:20` are strings (YAML 1.1: integers)."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "integer-range"
reason = "An integer is a 64-bit integer. One that does not fit refuses the file, where saphyr alone would read it as an approximate float or a string; the oracle read Python's unbounded `int`. No Tide field holds such a number."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

[[difference]]
id = "floats"
reason = "YAML 1.2 reads `1e3` and `1e+3` as floats; YAML 1.1 needs a dot (`1.0e3`) and read them as strings."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

[[difference]]
id = "duplicate-keys"
reason = "A key is the same key when it is the same type and value, as the YAML specification defines node equality: `null` and `~` collide (the oracle compared the raw text and kept the last), and `1`, `1.0` and `\"1\"` are three keys (the oracle compared Python values or raw text). A repeated key refuses the file, as it did."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "anchors"
reason = "YAML 1.2 lets an anchor be defined again; an alias refers to the latest definition. libyaml refused the file."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

[[difference]]
id = "merge-keys"
reason = "Merge keys (`<<: *base`) are a YAML 1.1 type that YAML 1.2 dropped: `<<` is an ordinary key. A model reports it as an unknown key (`extra_forbidden`); the oracle merged the anchored mapping in."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "bom"
reason = "A byte order mark may start the file; inside a value it refuses the file, as YAML 1.2 says. The oracle kept it in the string."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "tab-after-colon"
reason = "saphyr refuses a tab right after a mapping's `:` (`a:<TAB>1`), which libyaml accepts and the YAML 1.2 grammar allows as separating white space. A space before the tab (`a: <TAB>1`) is read by both."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = true

[[difference]]
id = "tags"
reason = "Tags follow the YAML 1.2 core schema: the non-specific `!` makes a string (`! 12` is the string 12), an explicit `!!int`, `!!float`, `!!bool` or `!!null` must fit its text, and other tags (`!!binary`, `!!set`, `!!omap`, `!!pairs`, `!!timestamp`, local tags) refuse the file, where the oracle constructed Python objects. A plain `=` or `<<` is a string (PyYAML had no constructor for them)."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

[[difference]]
id = "empty-key"
reason = "YAML 1.2 allows an empty implicit key (`: 1` is the key `null`); a model reports it as a key that is not a string. libyaml refused the file."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

[[difference]]
id = "line-breaks"
reason = "YAML 1.2 breaks lines on line feed and carriage return only: NEL (U+0085) and the line and paragraph separators (U+2028, U+2029) are characters of the text. YAML 1.1 broke lines on them."
changelog = "**Tide objects are read as YAML 1.2**"
workspace = false

