"""

# --- merge keys (<<) ---------------------------------------------------------
[[case]]
group = "merge"
id = "merge"
yaml = """
base: &b
  x: 1
  y: 2
item:
  <<: *b
  y: 3
  z: 4
"""

[[case]]
group = "merge"
id = "merge-list"
yaml = """
one: &one {a: 1, b: 1}
two: &two {b: 2, c: 2}
item:
  <<: [*one, *two]
  d: 4
"""

[[case]]
group = "merge"
id = "merge-own-key-first"
yaml = """
