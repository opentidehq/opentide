# The object models against the oracle (UC-1.3, #809): each case is a Tide
# object file and its family, read by the oracle's validate path
# (`parse_yaml`, then `load_object_for_validation`) and by opentide-schema's
# (`node::load`, then `from_node` into the revision `metadata.schema` names).
# `objects_table.py` runs every case, and every object file of
# tests/fixtures/tide_corpus and of the VS Code fixture workspace, through the
# oracle and writes `objects_table.json`:
#
#   <oracle python> crates/opentide-schema/tests/oracle/objects_table.py
#
# `src/objects/table.rs` compares them case by case: each error's type,
# field path, message, input, context, span and `yaml_line`, or the value. A
# case that differs names the `[[difference]]` that explains it (its reason
# and the bold lead of its CHANGELOG.md entry); the platform blocks under
# `configurations` are UC-1.4's (#810) and are not compared. The intended
# differences are listed in tests/golden/APPROVED_DIFFS.toml too.

[[difference]]
id = "yaml-1-2-dates"
reason = "YAML 1.2 has no timestamp type (crates/opentide-schema/YAML.md, `timestamps`): `2026-01-01 10:00:00` stays as written where the oracle rewrote it `2026-01-01T10:00:00`, and `2026-02-30` reaches the field's check, which refuses it as a date that does not exist (`value_error` on `metadata.reviewed`), where the oracle refused the file (`yaml_parse`)."
changelog = "**Tide objects are read as YAML 1.2**"

[[difference]]
id = "date-fields-are-strings"
reason = "`metadata.created` and `metadata.modified` take a string, as the editor schema (`type: string`, `format: date`) says. The oracle turned any value into text first (`_coerce_dates`: `20260101` became `'20260101'`, `true` `'True'`, `null` `'None'`); a number, a boolean or null is now `string_type`. A date written `2026-01-01` is a string in YAML 1.2 and reads as before."
changelog = "**`created` and `modified` are text**"

[[difference]]
id = "reviewed-validity-message"
reason = "A `metadata.reviewed` of the right shape whose date, time or offset cannot exist is refused as before (`value_error`), with jiff's explanation (`metadata.reviewed is not a valid date or time: parameter 'day' for `2026-02` is invalid, must be in range `1..=28``) instead of Python's `datetime` message (`day 30 must be in range 1..28 for month 2 in year 2026`). The year, and the instant in UTC, are 0001 to 9999, as Python's `datetime` holds them: year 0 is refused in the Rust model's words (`the year 0000 is not between 0001 and 9999`, where Python said `year must be in 1..9999, not 0`), and an offset that moves the instant out of those years (`0001-01-01T00:00:00+23:59`, `9999-12-31T23:59:59-23:59`) is `the time in UTC is not between the years 0001 and 9999`, where the oracle crashed (`OverflowError`, no finding). A date written in other digits than ASCII's (`٢٠٢٦-٠٩-٠١`) has the shape message (`must be an ISO 8601 date (YYYY-MM-DD) or datetime`) where Python said `Invalid isoformat string`, and a date padded with a control character U+001C to U+001F, which Python's `strip()` removed and Unicode's `White_Space` (Rust's `trim()`) does not include, is refused with the shape message where the oracle accepted it."
changelog = "**An impossible `reviewed` date is explained by the date library**"

[[difference]]
id = "public-reference-keys"
reason = "A key of `references.public` is a reference number: an integer, or a string of ASCII decimal digits with an optional sign (`\"2\"`, `\"-1\"`, `\"+3\"`), within a 64-bit signed integer. The oracle ran Python's `int()` on every key before validating: it crashed on a word (`ValueError`, no finding) and accepted, and rewrote, keys that are not reference numbers as written: a padded string (`' 12 '`), `_` separators (`'1_000'`), other digits than ASCII's (`'١٢'`), a float, which it truncated (`1.5` became `1`), a boolean (`true` became `1`) and an integer wider than 64 bits. The Rust model reports each of these at the key (`references.public.<key>.[key]`), as Pydantic reports a dictionary key: a string (`'9223372036854775808'` too) is `int_parsing`, a float or a boolean `int_type`; an integer wider than 64 bits written as a number refuses the file (`yaml_parse`, crates/opentide-schema/YAML.md `integer-range`)."
changelog = "**A public reference number must be written as an integer**"

[[difference]]
id = "positions"
reason = "As crates/opentide-schema/tests/oracle/from_node_cases.toml `positions`: positions come from the parser's node marks. A value written `null` has a `yaml_line` (the oracle gave none), and an error under an integer key (`references.public.1`) is found at that key, where the oracle could not find the key and pointed at its parent."
changelog = "**Findings point at the key or value they are about**"

[[difference]]
id = "strict-types"
reason = "As crates/opentide-schema/tests/oracle/from_node_cases.toml `strict-types`: a field takes its declared type. `version: 1.5` was Pydantic's `int_from_float` in the `int` member; it is `int_type`."
changelog = "**Field types are checked as declared**"

[[difference]]
id = "unknown-revision"
reason = "A `metadata.schema` that names a revision of the object's family the registry does not hold (`rule::7.0`, `Rule::1.1`, `threat::1.5`) is checked against the family's newest revision (`rule::1.1`), without the unknown-key check, as the language server already did (ADR 0009). The object still fails: the error at `metadata.schema` stays (`value_error`, `unknown schema identifier: 'rule::7.0'; checked against rule::1.1, the newest rule revision, without the unknown-key check`), followed by every other error the newest revision finds. The oracle stopped at the identifier (`unknown schema identifier: 'rule::7.0'`) and reported nothing else. An identifier of another family, or one that is not `family::major.minor`, is refused as before."
changelog = "**An unknown schema revision is checked against the newest revision of its family**"

