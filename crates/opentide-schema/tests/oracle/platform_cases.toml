# The platform blocks against the oracle (UC-1.4, #810): each case is a rule
# whose `configurations` hold one or more platform blocks, read by the
# oracle's validate path and by opentide-schema's, as objects_cases.toml's
# cases are (`objects_table.py` runs both files and writes
# `objects_table.json`). `src/objects/platform/table.rs` compares them case
# by case: each error's type, field path, message, input, context, span and
# `yaml_line`, or the whole validated value, blocks included. A case that
# differs names the `[[difference]]` that explains it.

[[difference]]
id = "messages-quote-values"
reason = "Every message quotes a value with Rust's string formatting, in double quotes with Rust's escapes (`\"x\"`, `\"a\\u{a0}b\"`), and writes any other value as YAML and JSON write it (`null`, `true`, `1.5`), where the oracle used Python's `repr` (`'x'`, `'a\\xa0b'`, `None`, `True`). Codes, paths and the rest of each message are unchanged."
changelog = "**Messages quote values the same way everywhere**"

[[difference]]
id = "yaml-1-2-booleans"
reason = "As crates/opentide-schema/YAML.md `booleans`: YAML 1.2 has two booleans, `true` and `false`. `on`, `yes` and `no` are strings, so a block written `sentinel: on` is a string (the error's `input` is `on`, where PyYAML read `True`), and a boolean field written `no` or `yes` is `bool_type`, where PyYAML read a boolean."
changelog = "**Tide objects are read as YAML 1.2**"

[[difference]]
id = "strict-types"
reason = "As tests/oracle/objects_cases.toml `strict-types`: a field takes its declared type. Pydantic's lax mode took `1` and `maybe`-like words for booleans (`bool_parsing` for the words it could not read), `1.5` and `\"high\"` for integers (`int_from_float`, `int_parsing`) and `true` for an integer (`threshold.value`, `risk`); each is now the type's error (`bool_type`, `int_type`), and a boolean is no integer."
changelog = "**Field types are checked as declared**"

[[difference]]
id = "positions"
reason = "As tests/oracle/objects_cases.toml `positions`: a key missing from a mapping written on one line (`{column: c}`), or an error about the whole mapping, is spanned over the mapping, from the parser's marks; the oracle spanned its first character."
changelog = "**Findings point at the key or value they are about**"

[[difference]]
id = "suggestions"
reason = "A rejected Sentinel ATT&CK id's hint comes from `opentide_core::suggest` (strsim), not Python's difflib: `T1059.01` suggests `T1059.001` (one edit) where difflib's ratio chose `T1059.013`. Accepted ids and the finding do not change."
changelog = "**\"Did you mean\" suggests what a typo meant, not a word that shares letters**"

[[difference]]
id = "sentinel-durations"
reason = "`scheduling.frequency`, `scheduling.lookback`, `grouping.alert.grouping_lookback` and a string `alert.suppression` must be what Sentinel's deploy converts to ISO 8601: ISO 8601 (`PT1H`, `P1D`, any case) or shorthand (`30m`, `1h10m`), around blanks; empty stays deploy's to judge. The oracle accepted `frequency: hourly` and failed at deploy; the Rust model refuses it as `value_error` on the field (UC-1.4 Known gap). A duration longer than deploy's `timedelta` holds (999999999 days, 23:59:59: `1000000000d`, `P99999999999D`, `P142857143W`) is refused the same way, where the oracle accepted it and deploy crashed with `OverflowError`. Digits are ASCII only."
changelog = "**Sentinel durations are checked when the rule is validated**"

[[difference]]
id = "harfanglab-1-2"
reason = "harfanglab-1.0 1.2 (#899, 0.25.0): a block is a Sigma rule or a YARA rule, not both, so `sigma` beside `yara` is `harfanglab_rule_kind` on the block, where the oracle (0.23.0) deployed the Sigma rule. A `yara` object is a whole `signature` or the decomposed `meta`, `strings` and `condition`; without a `signature` the three are required together, one `value_error` on the object naming the missing keys, where the oracle reported each as `missing`."
changelog = "**A HarfangLab block is a Sigma rule or a YARA rule, not both**"

