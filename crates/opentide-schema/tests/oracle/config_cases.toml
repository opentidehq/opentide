text = "[filenames]\nstyle = \"camel\"\n"

[[case]]
id = "lint-pattern-type"
kind = "lint"
text = "[filenames]\npattern = 5\n"

[[case]]
id = "lint-pattern-empty"
kind = "lint"
text = "[filenames]\npattern = \"\"\n"

[[case]]
id = "lint-pattern-invalid"
kind = "lint"
text = "[filenames]\npattern = \"(\"\n"
difference = "lint-pattern-regex"

[[case]]
id = "lint-pattern-lookahead"
kind = "lint"
text = "[filenames]\npattern = \"^(?!x).+$\"\n"
difference = "lint-pattern-regex"

[[case]]
id = "lint-kinds"
kind = "lint"
text = "[filenames]\nstyle = \"name\"\npattern = '^\\[(SEN|XDR)\\]\\[[^\\]]+\\].+$'\n[filenames.rules]\npattern = '^R-.+'\n[filenames.threats]\nstyle = \"none\"\n"

[[case]]
id = "lint-kind-not-a-table"
kind = "lint"
text = "[filenames]\nrules = 1\n"

[[case]]
id = "lint-kind-unknown-key"
kind = "lint"
text = "[filenames.rules]\ncolour = 1\n"

[[case]]
id = "lint-kind-style"
kind = "lint"
text = "[filenames.objectives]\nstyle = \"x\"\n"

# --- sharing-config (validate) ---------------------------------------------------------

[[case]]
id = "sharing-config-clean"
kind = "sharing"
files = { "sharing.toml" = "[[misp]]\nname = \"circl\"\nurl = \"https://misp.example\"\napi_key = \"${MISP_API_KEY}\"\nmax_tlp = \"amber\"\n" }

[[case]]
id = "sharing-config-findings"
kind = "sharing"
files = { "sharing.toml" = "[[misp]]\nname = \"Bad Name\"\nurl = \"ftp://x\"\napi_key = \"literal\"\nmax_tlp = \"purple\"\nrule_statuses = [\"NOPE\"]\nobject_types = [\"widget\"]\nverify_ssl = \"maybe\"\n" }

[[case]]
id = "sharing-config-statuses"
kind = "sharing"
files = { "deployment.toml" = "[[statuses]]\nname = \"ONLY\"\ndescription = \"d\"\nstrategy = \"RELEASE\"\n", "sharing.toml" = "[[misp]]\nname = \"a\"\nurl = \"https://a\"\napi_key = \"${K}\"\nmax_tlp = \"red\"\nrule_statuses = [\"ONLY\", \"PRODUCTION\"]\n" }

[[case]]
id = "sharing-config-folder"
kind = "sharing"
files = { "sharing/misp.toml" = "x = 1\n" }

[[case]]
id = "sharing-config-parent"
kind = "sharing"
files = { "sharing.toml" = "[[misp]]\nname = \"a\"\nenabled = true\n" }
parent = { "sharing.toml" = "[[misp]]\nname = \"a\"\nurl = \"https://a\"\napi_key = \"${K}\"\nmax_tlp = \"clear\"\n" }

[[case]]
id = "sharing-config-unparsable"
kind = "sharing"
files = { "sharing.toml" = "[[misp]\n" }
difference = "toml-parse-message"
