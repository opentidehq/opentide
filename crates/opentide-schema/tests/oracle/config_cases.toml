# The configuration table (UC-1.5, #811): configuration files checked by the
# oracle (`config_table.py`, opentide 0.23.0) and by
# `opentide_schema::configuration` (`tests/configuration.rs`), case by case.
#
# Kinds:
# - `text`: `configuration_text_issues(path, text, ...)` against
#   `checks::text_issues`; `earlier` / `later` are layer texts,
#   `status_names`, `partial` and `sharing_directory` the keyword arguments;
# - `workspace`: a workspace whose `.opentide/configurations` holds `files`
#   (and a parent instance holding `parent`): the resolved configuration as
#   JSON (`resolve_configurations`) and `workspace_configuration_issues`,
#   or the error resolution stops on;
# - `lint`: `lint.toml` merged onto the bundled one, then
#   `parse_lint_config`;
# - `sharing`: `validate --check sharing-config`'s findings (`load_sharing`)
#   for a workspace holding `files`.
#
# A case whose Rust result differs names the `difference` that explains it
# (its reason and the bold lead of its CHANGELOG.md entry), or a list of
# them whose fields it may change together. A difference's
# `fields` are the members it may change, at any depth of the result; every
# other member (code, severity, field path, file, line, column, context) is
# still compared with the oracle's. The test fails when such a case no longer
# differs, when it differs outside its difference's `fields`, or when a
# difference no case names.

[[difference]]
id = "lint-error-quotes-values"
reason = "A `lint.toml` that cannot be used is refused with its error, which quotes each value in double quotes with Rust's escapes (`unknown check(s) \"alpha\"`), where the oracle used Python's `repr` (`'alpha'`)."
fields = ["error"]
changelog = "**Messages quote values the same way everywhere**"

[[difference]]
id = "messages-quote-values"
reason = "Every message quotes a value with Rust's string formatting, in double quotes with Rust's escapes (`\"x\"`, `\"a\\u{a0}b\"`), and writes any other value as YAML and JSON write it (`null`, `true`, `1.5`), where the oracle used Python's `repr` (`'x'`, `'a\\xa0b'`, `None`, `True`). Codes, paths and the rest of each message are unchanged."
fields = ["message"]
changelog = "**Messages quote values the same way everywhere**"

[[difference]]
id = "toml-parse-message"
reason = "A configuration file that is not TOML is refused by the toml_edit crate, which says what is wrong (`expected `=``, `invalid table header`) where the oracle said `TOMLDecodeError` or tomllib's own words; the position is the crate's."
fields = ["message"]
changelog = "**Configuration files are read as TOML 1.0**"

[[difference]]
id = "lint-pattern-regex"
reason = "A `[filenames]` `pattern` is compiled by the Rust `regex` crate, which has no look-around or back-reference: such a pattern is refused with the crate's reason, where Python's `re` compiled it; an invalid pattern's reason is the crate's. A refused pattern's outcome is an error where the oracle's was the settings."
fields = ["error", "checks", "filenames", "required_metadata"]
changelog = "**Configuration files are read as TOML 1.0**"

[[difference]]
id = "toml-integer-range"
reason = "TOML 1.0 integers are 64-bit: toml_edit refuses an integer outside the i64 range (`number too large to fit in target type`), so the file is a `config_parse` error and resolution stops, where tomllib read it as a Python int."
fields = ["resolved", "issues", "error"]
changelog = "**Configuration files are read as TOML 1.0**"

[[difference]]
id = "toml-datetime-text"
reason = "A TOML date-time is kept as toml_datetime writes it, losslessly: fractional seconds as written (`.5`, nanoseconds), a `-00:00` offset as `+00:00`. The oracle rounded to microseconds, padded the fraction to six digits and wrote UTC as `Z`; a message quotes the value as a string (`'1979-05-27T07:32:00Z'`) where the oracle wrote `datetime.datetime(...)`."
fields = ["dt_fraction", "dt_offset", "time_nanos", "error", "message"]
changelog = "**Configuration files are read as TOML 1.0**"

