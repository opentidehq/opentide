# The structural conversion's table (UC-1.2, #808): documents checked against
# the models of `from_node_table.py` (Pydantic, the oracle) and of
# `tests/from_node_table.rs` (the Rust derive). `from_node_table.py` writes
# what the oracle reports into `from_node_table.json`; the test compares the
# Rust result with it case by case.
#
# Where they differ, the case lists the `difference` entries that explain it;
# each `[[difference]]` gives the reason and the bold lead of its CHANGELOG.md
# entry.

[[difference]]
id = "messages-quote-values"
reason = "Every message quotes a value with Rust's string formatting, in double quotes with Rust's escapes (`\"x\"`, `\"a\\u{a0}b\"`), and writes any other value as YAML and JSON write it (`null`, `true`, `1.5`), where the oracle used Python's `repr` (`'x'`, `'a\\xa0b'`, `None`, `True`). Codes, paths and the rest of each message are unchanged."
changelog = "**Messages quote values the same way everywhere**"

[[difference]]
id = "strict-types"
reason = "A field takes its declared type and nothing else, as the generated JSON Schemas say: an integer field an integer, a boolean field `true` or `false`, a string field a string, a number field an integer or a float. Pydantic's lax mode coerced `\"42\"`, `\" 7 \"` and `3.0` into integers, `\"yes\"`, `1` and `0.0` into booleans and `\"2.5\"` into a float, and gave each failed coercion its own error type (`int_parsing`, `bool_parsing`, `float_parsing`, `int_from_float`, `finite_number`, `int_parsing_size`). Each is now the type's one error (`int_type`, `bool_type`, `float_type`) with its message."
changelog = "**Field types are checked as declared**"

[[difference]]
id = "positions"
reason = "Positions come from the parser's node marks. A value written `null` or `~` has a `yaml_line` (the oracle gave none); a value left empty points at its key (the oracle pointed at whatever the next line held); a key that is not a string is found and pointed at; a collection in a list written on one line is spanned whole; an empty list item points at its `-`; an error on the document itself has `yaml_line` 0; a scalar's `yaml_line` is its key's line."
changelog = "**Findings point at the key or value they are about**"

[[difference]]
id = "yaml-1-2"
reason = "The document is read as YAML 1.2 (crates/opentide-schema/YAML.md): `yes` is a string key, `<<` an ordinary key, an integer beyond 64 bits refuses the file."
changelog = "**Tide objects are read as YAML 1.2**"

