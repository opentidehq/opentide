# The structural conversion's table (UC-1.2, #808): documents checked against
# the models of `from_node_table.py` (Pydantic, the oracle) and of
# `tests/from_node_table.rs` (the Rust derive). `from_node_table.py` writes
# what the oracle reports into `from_node_table.json`.

[[case]]
id = "valid-minimal"
model = "Probe"
yaml = "text: hello\n"

[[case]]
id = "valid-everything"
model = "Probe"
yaml = """
text: hello
number: 7
ratio: 1.5
flag: false
items: [a, b]
inners:
  - label: x
    count: 1
  - label: y
inner: {label: z}
mapping: {a: 1, b: 2}
choice: two
kind: beta
either: 3
some: [p, q]
schema: s
vocab: [v]
"""

