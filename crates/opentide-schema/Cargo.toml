[package]
name = "opentide-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: the Tide model as Rust code (serde, garde, schemars, PyO3). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while it is a skeleton: scripts/engine/release.py publishes
# every member without `publish = false`. The first change that makes a
# published crate depend on it (UC-1.3, #809, or the facade, UC-5.1, #836)
# removes this line, and a maintainer publishes the new name (NEW_CRATE_TOKEN).
# Until then `cargo package` leaves it out (ci.yml, engine-release.yml): the
# vocabularies it compiles in come from src/opentide/data (build.rs,
# OPENTIDE_ASSETS), which `release.py vendor` copies only into a published crate.
publish = false

[lints]
workspace = true

[features]
# The Python classes (`#[pyclass(frozen, get_all)]`), for the PyO3 binding.
# abi3-py310: one build serves CPython 3.10 and later, as analysis/ does.
python = ["dep:pyo3"]
# The wasm32-unknown-unknown hosts. The skeleton adds no code behind it yet:
# the TypeScript types arrive with UC-5.3 (#838). CI builds the crate for
# wasm32 with it so that no dependency of the model stops compiling there.
wasm = []
# Reading a rule whose platform blocks are not checked yet: the blocks are
# UC-1.4's (#810), and until they arrive `RuleV1_0`, `RuleV1_1` and
# `RuleConfigurations` read only with this feature. Tests and xtask's oracle
# comparisons turn it on; nothing that ships may (UC-1.4 removes it).
unchecked-platform-blocks = []

[dependencies]
opentide-core.workspace = true
serde.workspace = true
schemars.workspace = true
garde.workspace = true
thiserror.workspace = true
# Vocabularies (`vocab`): the documents, pin files and Sentinel's ATT&CK list.
toml.workspace = true
serde_json.workspace = true
# Entries in document order, looked up by key. The version Cargo.lock holds.
indexmap = { version = "2", features = ["serde"] }
# Which characters a quoted value escapes (`vocab::quote`).
unicode-properties.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
serde-saphyr.workspace = true
opentide-schema-derive.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310"], optional = true }
# `metadata.reviewed` (UC-1.3): the shape, then whether the date, the time and
# the offset exist (jiff's civil types; no time zone database).
regex.workspace = true
jiff = { workspace = true }

[dev-dependencies]
# The crate's own tests read rules: the feature on, for tests only.
opentide-schema = { path = ".", features = ["unchecked-platform-blocks"] }
insta.workspace = true
strsim.workspace = true
serde_yaml.workspace = true
trybuild.workspace = true
proptest.workspace = true
