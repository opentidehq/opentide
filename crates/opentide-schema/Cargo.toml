[package]
name = "opentide-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: the Tide model as Rust code (serde, garde, schemars, PyO3). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while it is a skeleton: scripts/engine/release.py publishes
# every member without `publish = false`. The first change that makes a
# published crate depend on it (UC-1.3, #809, or the facade, UC-5.1, #836)
# removes this line, and a maintainer publishes the new name (NEW_CRATE_TOKEN).
# Until then `cargo package` leaves it out (ci.yml, engine-release.yml): the
# vocabularies it compiles in come from src/opentide/data (build.rs,
# OPENTIDE_ASSETS), which `release.py vendor` copies only into a published crate.
publish = false

[lints]
workspace = true

[features]
# The Python classes (`#[pyclass(frozen, get_all)]`), for the PyO3 binding.
# abi3-py310: one build serves CPython 3.10 and later, as analysis/ does.
python = ["dep:pyo3"]
# The classes' type hints for the generated stubs (`cargo xtask stubs`, UC-1.9):
# PyO3's introspection data, which only the stub build compiles in.
stubs = ["python", "pyo3/experimental-inspect"]
# The wasm32-unknown-unknown hosts. The skeleton adds no code behind it yet:
# the TypeScript types arrive with UC-5.3 (#838). CI builds the crate for
# wasm32 with it so that no dependency of the model stops compiling there.
wasm = []

[dependencies]
opentide-core.workspace = true
serde.workspace = true
schemars.workspace = true
garde.workspace = true
thiserror.workspace = true
# Vocabularies (`vocab`): the documents, pin files and Sentinel's ATT&CK list.
toml.workspace = true
serde_json.workspace = true
# Entries in document order, looked up by key. The version Cargo.lock holds.
indexmap = { version = "2", features = ["serde"] }
# Which characters a quoted value escapes (`vocab::quote`).
unicode-properties.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
serde-saphyr.workspace = true
opentide-schema-derive.workspace = true
# Configuration TOML with every item's span (UC-1.5): the version the
# workspace already locks for opentide-analysis.
toml_edit.workspace = true
# Pattern constraints and the lint `pattern`, as pydantic-core does; the
# shape of `metadata.reviewed` (UC-1.3).
regex.workspace = true
# The lint `pattern` anchored on its parsed form, verbose comments and all.
regex-syntax.workspace = true
# The oracle's Markdown patterns of the editor annotations (`generate::annotate`).
fancy-regex.workspace = true
# An all-lower-case vocabulary name, title-cased in a dropdown (`generate::schema`).
titlecase.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310", "indexmap"], optional = true }
# `metadata.reviewed` (UC-1.3): whether the date, the time and the offset
# exist (jiff's civil types; no time zone database).
jiff = { workspace = true }

[dev-dependencies]
insta.workspace = true
strsim.workspace = true
serde_yaml.workspace = true
trybuild.workspace = true
proptest.workspace = true
