[package]
name = "opentide-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: the Tide model as Rust code (serde, garde, schemars, PyO3). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Published by the release train (publish.yml, UC-5.5), for the facade. The
# vocabularies and configurations it compiles in come from src/opentide/data
# (build.rs, OPENTIDE_ASSETS), which `release.py vendor` copies into the package.

[lints]
workspace = true

[build-dependencies]
opentide-dataset = { workspace = true, features = ["encode"] }
opentide-core = { workspace = true, features = ["markdown"] }
# The offers of the bundled vocabularies are worked out by build.rs from the same modules the crate
# compiles (`src/vocab/offer.rs` and what it reads: the documents, the Markdown clean-up).
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
indexmap = { version = "2", features = ["serde"] }
regex.workspace = true
titlecase.workspace = true

# The bundled vocabularies are split and compressed by build.rs (the `text!` literals name only
# the other data): `scripts/engine/release.py vendor` copies the folder into the published crate.
[package.metadata.opentide]
assets = ["src/opentide/data/vocabulary"]

[features]
# The Python classes (`#[pyclass(frozen, get_all)]`), for the PyO3 binding.
# abi3-py310: one build serves CPython 3.10 and later, as bindings/python/ does.
python = ["dep:pyo3"]
# The classes' type hints for the generated stubs (`cargo xtask stubs`, UC-1.9):
# PyO3's introspection data, which only the stub build compiles in.
stubs = ["python", "pyo3/experimental-inspect"]

[dependencies]
opentide-dataset.workspace = true
opentide-core = { workspace = true, features = ["markdown"] }
serde.workspace = true
schemars.workspace = true
garde.workspace = true
thiserror.workspace = true
# Vocabularies (`vocab`): the documents, pin files and Sentinel's ATT&CK list.
toml.workspace = true
serde_json.workspace = true
# Entries in document order, looked up by key. The version Cargo.lock holds.
indexmap = { version = "2", features = ["serde"] }
serde-saphyr.workspace = true
opentide-schema-derive.workspace = true
# Configuration TOML with every item's span (UC-1.5): the version the
# workspace already locks for opentide-analysis.
toml_edit.workspace = true
# Pattern constraints and the lint `pattern`, as pydantic-core does; the
# shape of `metadata.reviewed` (UC-1.3).
regex.workspace = true
# The lint `pattern` anchored on its parsed form, verbose comments and all.
regex-syntax.workspace = true
# An all-lower-case vocabulary name, title-cased in a dropdown (`generate::schema`).
titlecase.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310", "indexmap"], optional = true }
# `metadata.reviewed` (UC-1.3): whether the date, the time and the offset
# exist (jiff's civil types; no time zone database).
jiff = { workspace = true }
# Exabeam's rule names compare as `str.casefold()` does (`exabeam_name_duplicate`):
# full Unicode case folding, the crate the Exabeam connector matches names with.
caseless = "0.2"

[dev-dependencies]
# The oracle's sentence-end pattern, with its look-ahead: the tests hold
# `generate::annotate`'s hand-written match to it.
fancy-regex.workspace = true
insta.workspace = true
strsim.workspace = true
trybuild.workspace = true
proptest.workspace = true
