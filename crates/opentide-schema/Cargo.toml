[package]
name = "opentide-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: the Tide model as Rust code (serde, garde, schemars, PyO3). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while it is a skeleton: scripts/engine/release.py publishes
# every member without `publish = false`. The first change that makes a
# published crate depend on it (UC-1.3, #809, or the facade, UC-5.1, #836)
# removes this line, and a maintainer publishes the new name (NEW_CRATE_TOKEN).
publish = false

[lints]
workspace = true

[features]
# The Python classes (`#[pyclass(frozen, get_all)]`), for the PyO3 binding.
# abi3-py310: one build serves CPython 3.10 and later, as analysis/ does.
python = ["dep:pyo3"]
# The wasm32-unknown-unknown hosts. The skeleton adds no code behind it yet:
# the TypeScript types arrive with UC-5.3 (#838). CI builds the crate for
# wasm32 with it so that no dependency of the model stops compiling there.
wasm = []

[dependencies]
serde.workspace = true
schemars.workspace = true
garde.workspace = true
thiserror.workspace = true
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
trybuild.workspace = true
