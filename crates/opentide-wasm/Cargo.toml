[package]
name = "opentide-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "wasm32-unknown-unknown build: highlight(), legend() and the language server (no WASI mix-in)"
# Ships as the opentide-wasm-web zip on each GitHub Release, not as a crate.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The facade, and only the facade (ADR 0005, UC-5.1 #836), without its
# default features: `analysis` (highlight, the legend) and `lsp` (the language
# server one message at a time).
opentide = { path = "../opentide", default-features = false, features = ["analysis", "lsp"] }
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
