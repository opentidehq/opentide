[package]
name = "opentide-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "wasm32-unknown-unknown build: highlight(), legend() and the language server (no WASI mix-in)"
# Ships as the opentide-wasm-web zip on each GitHub Release, not as a crate.
publish = false

# The workspace's lints (root Cargo.toml, [workspace.lints], which gives each
# allowed lint its reason), copied because this crate needs `unsafe`: the wasm32 libc shims
# (src/libc_syscalls.rs, `#[unsafe(no_mangle)]` symbols).
# `forbid` cannot be relaxed inside a crate, so `unsafe_code` is `deny` here and
# each site allows it with its reason. xtask/tests/lint_policy.rs fails when
# this copy differs from the workspace's table in anything else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
unnecessary_wraps = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
format_push_string = "allow"
needless_raw_string_hashes = "allow"
items_after_statements = "allow"
single_match_else = "allow"
assert_is_empty = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opentide-core.workspace = true
opentide-analysis.workspace = true
opentide-highlight.workspace = true
opentide-lsp.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
