# Generated by opentide — regenerate with `opentide setup ci github`
# Platform credentials are read from the environment. Set these in the CI secret store:
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_SUBSCRIPTION_ID
#   AZURE_TENANT_ID
#   AZURE_WORKSPACE_ID
#   CBC_ORG_KEY
#   CBC_TOKEN
#   CBC_URL
#   ELASTIC_PROD_API_KEY
#   ELASTIC_STAGING_API_KEY
#   EXABEAM_CLIENT_ID
#   EXABEAM_CLIENT_SECRET
#   GOOGLE_SECOPS_CREDENTIALS
#   GRAVITYZONE_API_KEY
#   GRAYLOG_TOKEN
#   HARFANGLAB_API_TOKEN
#   MDE_CLIENT_ID
#   MDE_CLIENT_SECRET
#   MDE_TENANT_ID
#   SENTINEL_ONE_API_TOKEN
#   SPLUNK_APP
#   SPLUNK_PORT
#   SPLUNK_TOKEN
#   SPLUNK_URL
#   SYSDIG_SECURE_API_TOKEN
name: opentide

on:
  pull_request:
  push:
    branches:
      - release/v1.2

env:
  OPENTIDE_REPO_ROOT: ${{ github.workspace }}
  OPENTIDE_VERSION: "1.0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_WORKSPACE_ID: ${{ secrets.AZURE_WORKSPACE_ID }}
      CBC_ORG_KEY: ${{ secrets.CBC_ORG_KEY }}
      CBC_TOKEN: ${{ secrets.CBC_TOKEN }}
      CBC_URL: ${{ secrets.CBC_URL }}
      ELASTIC_PROD_API_KEY: ${{ secrets.ELASTIC_PROD_API_KEY }}
      ELASTIC_STAGING_API_KEY: ${{ secrets.ELASTIC_STAGING_API_KEY }}
      EXABEAM_CLIENT_ID: ${{ secrets.EXABEAM_CLIENT_ID }}
      EXABEAM_CLIENT_SECRET: ${{ secrets.EXABEAM_CLIENT_SECRET }}
      GOOGLE_SECOPS_CREDENTIALS: ${{ secrets.GOOGLE_SECOPS_CREDENTIALS }}
      GRAVITYZONE_API_KEY: ${{ secrets.GRAVITYZONE_API_KEY }}
      GRAYLOG_TOKEN: ${{ secrets.GRAYLOG_TOKEN }}
      HARFANGLAB_API_TOKEN: ${{ secrets.HARFANGLAB_API_TOKEN }}
      MDE_CLIENT_ID: ${{ secrets.MDE_CLIENT_ID }}
      MDE_CLIENT_SECRET: ${{ secrets.MDE_CLIENT_SECRET }}
      MDE_TENANT_ID: ${{ secrets.MDE_TENANT_ID }}
      SENTINEL_ONE_API_TOKEN: ${{ secrets.SENTINEL_ONE_API_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SPLUNK_PORT: ${{ secrets.SPLUNK_PORT }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - run: opentide validate --strict --format sarif --output opentide-reports/validate.sarif
      - run: opentide lint --strict --format sarif --output opentide-reports/lint.sarif
      - name: Validate queries on reviewed tenants
        if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.pull_request.title, '[skip deploy]') && !contains(github.event.pull_request.labels.*.name, 'skip-deploy') }}
        run: |
          rm -rf -- .opentide/configurations
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --depth=1 origin release/v1.2; else git fetch origin release/v1.2; fi
          if ! git cat-file -e FETCH_HEAD:.opentide/configurations 2>/dev/null; then echo "The default branch has no .opentide/configurations yet, so no tenant is reviewed. Skipped without using platform credentials."; exit 0; fi
          git checkout FETCH_HEAD -- .opentide/configurations
          if grep -qs '^[^#]*tenants' .opentide/configurations/platforms/sentinel.toml; then if [ -z "$AZ_SECRET" ] || [ -z "$AZ_TENANT" ]; then echo skip sentinel live query validation AZ_SECRET AZ_TENANT; exit 2; else opentide validate query --platform sentinel --live --changed; fi; else echo "The default branch has no sentinel tenant yet, so no tenant is reviewed. Skipped sentinel live query validation without using platform credentials."; fi
          if grep -qs '^[^#]*tenants' .opentide/configurations/platforms/elastic.toml; then opentide validate query --platform elastic --live --changed; else echo "The default branch has no elastic tenant yet, so no tenant is reviewed. Skipped elastic live query validation without using platform credentials."; fi
      - name: Upload opentide reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: opentide-reports
          path: opentide-reports/
          if-no-files-found: ignore
  code_scanning:
    name: Code scanning
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !cancelled() && !github.event.repository.private }}
    permissions:
      security-events: write
    steps:
      - name: Download opentide reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: opentide-reports
          path: opentide-reports/
      - name: Upload validate findings to code scanning
        if: ${{ hashFiles('opentide-reports/validate.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: opentide-reports/validate.sarif
      - name: Upload lint findings to code scanning
        if: ${{ hashFiles('opentide-reports/lint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: opentide-reports/lint.sarif
  generate:
    name: Generate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - run: opentide generate
  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: generate
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'release/v1.2' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.pull_request.title, '[skip deploy]') && !contains(github.event.pull_request.labels.*.name, 'skip-deploy') }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_WORKSPACE_ID: ${{ secrets.AZURE_WORKSPACE_ID }}
      CBC_ORG_KEY: ${{ secrets.CBC_ORG_KEY }}
      CBC_TOKEN: ${{ secrets.CBC_TOKEN }}
      CBC_URL: ${{ secrets.CBC_URL }}
      ELASTIC_PROD_API_KEY: ${{ secrets.ELASTIC_PROD_API_KEY }}
      ELASTIC_STAGING_API_KEY: ${{ secrets.ELASTIC_STAGING_API_KEY }}
      EXABEAM_CLIENT_ID: ${{ secrets.EXABEAM_CLIENT_ID }}
      EXABEAM_CLIENT_SECRET: ${{ secrets.EXABEAM_CLIENT_SECRET }}
      GOOGLE_SECOPS_CREDENTIALS: ${{ secrets.GOOGLE_SECOPS_CREDENTIALS }}
      GRAVITYZONE_API_KEY: ${{ secrets.GRAVITYZONE_API_KEY }}
      GRAYLOG_TOKEN: ${{ secrets.GRAYLOG_TOKEN }}
      HARFANGLAB_API_TOKEN: ${{ secrets.HARFANGLAB_API_TOKEN }}
      MDE_CLIENT_ID: ${{ secrets.MDE_CLIENT_ID }}
      MDE_CLIENT_SECRET: ${{ secrets.MDE_CLIENT_SECRET }}
      MDE_TENANT_ID: ${{ secrets.MDE_TENANT_ID }}
      SENTINEL_ONE_API_TOKEN: ${{ secrets.SENTINEL_ONE_API_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SPLUNK_PORT: ${{ secrets.SPLUNK_PORT }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - name: Deploy staging to reviewed tenants
        run: |
          rm -rf -- .opentide/configurations
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --depth=1 origin release/v1.2; else git fetch origin release/v1.2; fi
          if ! git cat-file -e FETCH_HEAD:.opentide/configurations 2>/dev/null; then echo "The default branch has no .opentide/configurations yet, so no tenant is reviewed. Skipped without using platform credentials."; exit 0; fi
          git checkout FETCH_HEAD -- .opentide/configurations
          opentide deploy --dry-run --strategy PREVIEW
          opentide deploy --strategy PREVIEW --skip-unconfigured
  inflight_shards:
    name: Update inflight preview shards
    needs: generate
    if: github.event_name == 'pull_request' && github.base_ref == 'release/v1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - name: Merge inflight shards from default branch
        run: |
          git fetch origin release/v1.2
          rm -rf .opentide/inflight
          git rev-parse "origin/release/v1.2" > "$(git rev-parse --git-path opentide-inflight-base)"
          git checkout "$(cat "$(git rev-parse --git-path opentide-inflight-base)")" -- .opentide/inflight 2>/dev/null || mkdir -p .opentide/inflight
      - name: Write inflight shards for changed objects
        run: opentide generate inflight
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}
      - name: Push inflight shards to default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shards_repo="$PWD"
          shards_base="$(mktemp -d)"
          git worktree add --detach "$shards_base" "$(cat "$(git rev-parse --git-path opentide-inflight-base)")"
          trap 'cd "$shards_repo" && git worktree remove --force "$shards_base"' EXIT
          rm -rf "$shards_base/.opentide/inflight"
          mkdir -p "$shards_base/.opentide"
          cp -R .opentide/inflight "$shards_base/.opentide/inflight"
          cd "$shards_base" || exit
          mkdir -p .opentide/inflight
          git add .opentide/inflight/
          if git diff --staged --quiet; then
            echo "No inflight shard changes"
            exit 0
          fi
          git commit -m "ci: update inflight preview shards [skip ci]"
          push_attempt=1
          until git push origin "HEAD:release/v1.2"; do
            if [ "$push_attempt" -ge 5 ]; then
              echo "Push rejected $push_attempt times; giving up." >&2
              exit 1
            fi
            push_attempt=$((push_attempt + 1))
            git fetch origin release/v1.2
            git rebase FETCH_HEAD
          done
  inflight_prune:
    name: Prune inflight preview shards
    needs: generate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - name: Prune superseded inflight shards
        run: opentide generate inflight prune
        env:
          OPENTIDE_REPO_ROOT: ${{ github.workspace }}
      - name: Push pruned inflight shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .opentide/inflight
          git add .opentide/inflight/
          if git diff --staged --quiet; then
            echo "No inflight prune changes"
            exit 0
          fi
          git commit -m "ci: prune inflight preview shards [skip ci]"
          push_attempt=1
          until git push origin HEAD:release/v1.2; do
            if [ "$push_attempt" -ge 5 ]; then
              echo "Push rejected $push_attempt times; giving up." >&2
              exit 1
            fi
            push_attempt=$((push_attempt + 1))
            git fetch origin release/v1.2
            git rebase FETCH_HEAD
          done
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: generate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v1.2' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.pull_request.title, '[skip deploy]') && !contains(github.event.pull_request.labels.*.name, 'skip-deploy') }}
    permissions:
      contents: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_WORKSPACE_ID: ${{ secrets.AZURE_WORKSPACE_ID }}
      CBC_ORG_KEY: ${{ secrets.CBC_ORG_KEY }}
      CBC_TOKEN: ${{ secrets.CBC_TOKEN }}
      CBC_URL: ${{ secrets.CBC_URL }}
      ELASTIC_PROD_API_KEY: ${{ secrets.ELASTIC_PROD_API_KEY }}
      ELASTIC_STAGING_API_KEY: ${{ secrets.ELASTIC_STAGING_API_KEY }}
      EXABEAM_CLIENT_ID: ${{ secrets.EXABEAM_CLIENT_ID }}
      EXABEAM_CLIENT_SECRET: ${{ secrets.EXABEAM_CLIENT_SECRET }}
      GOOGLE_SECOPS_CREDENTIALS: ${{ secrets.GOOGLE_SECOPS_CREDENTIALS }}
      GRAVITYZONE_API_KEY: ${{ secrets.GRAVITYZONE_API_KEY }}
      GRAYLOG_TOKEN: ${{ secrets.GRAYLOG_TOKEN }}
      HARFANGLAB_API_TOKEN: ${{ secrets.HARFANGLAB_API_TOKEN }}
      MDE_CLIENT_ID: ${{ secrets.MDE_CLIENT_ID }}
      MDE_CLIENT_SECRET: ${{ secrets.MDE_CLIENT_SECRET }}
      MDE_TENANT_ID: ${{ secrets.MDE_TENANT_ID }}
      SENTINEL_ONE_API_TOKEN: ${{ secrets.SENTINEL_ONE_API_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SPLUNK_PORT: ${{ secrets.SPLUNK_PORT }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SYSDIG_SECURE_API_TOKEN: ${{ secrets.SYSDIG_SECURE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - name: Use the default branch's deployment state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin release/v1.2
          rm -rf -- .opentide/states/deployment
          git rm -r -q --cached --ignore-unmatch -- .opentide/states/deployment
          if git cat-file -e "FETCH_HEAD:.opentide/states/deployment" 2>/dev/null; then
            git checkout FETCH_HEAD -- .opentide/states/deployment
          fi
          if git diff --cached --quiet -- .opentide/states/deployment; then
            state_base=$(git rev-parse HEAD)
          else
            state_base=$(git commit-tree "$(git write-tree)" -p HEAD -m "opentide: deployment state of the default branch")
          fi
          echo "$state_base" > "$(git rev-parse --git-path opentide-state-base)"
      - run: opentide deploy --dry-run --strategy RELEASE
      - name: Deploy
        id: deploy
        run: opentide deploy --strategy RELEASE --skip-unconfigured
      - name: Commit deployment write-backs
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "$(git rev-parse --git-path opentide-state-base)" ]; then
            git reset -q --soft "$(cat "$(git rev-parse --git-path opentide-state-base)")"
          fi
          writeback_status=0
          if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
            git add -A -- .opentide/states/deployment
          fi
          git diff -z --name-only -- detections/rules > "$(git rev-parse --git-path opentide-rule-files)"
          set --
          while IFS= read -r -d '' rule_file; do
            set -- "$@" --file "$rule_file"
          done < "$(git rev-parse --git-path opentide-rule-files)"
          if [ "$#" -gt 0 ]; then
            if opentide validate --strict "$@"; then
              git add -u -- detections/rules
            else
              echo "opentide validate --strict failed on the deployed rule files: committing the deployment state only, not the rule files." >&2
              writeback_status=1
            fi
          fi
          if git diff --staged --quiet; then
            echo "No deployment write-backs to commit"
            exit "$writeback_status"
          fi
          git commit -q -m "ci: record production deployment [skip ci]"
          git reset -q --hard HEAD
          state_commit=$(git rev-parse HEAD)
          state_published=0
          # shellcheck disable=SC2317,SC2329 # run by the EXIT trap below
          opentide_state_exit() {
            exit_status=$?
            if [ "$state_published" -ne 1 ]; then
              echo "The deployment state did not reach the default branch. The vendor ids this run recorded are printed below and pushed to refs/opentide/deployment-state/<commit>; record them before the next deploy." >&2
              git --no-pager diff "$state_commit^" "$state_commit" -- .opentide/states/deployment >&2 || true
              git push origin "$state_commit:refs/opentide/deployment-state/$state_commit" >&2 || true
            fi
            exit "$exit_status"
          }
          trap opentide_state_exit EXIT
          push_attempt=1
          until git push origin "HEAD:release/v1.2"; do
            if [ "$push_attempt" -ge 5 ]; then
              echo "Push rejected $push_attempt times; giving up." >&2
              exit 1
            fi
            push_attempt=$((push_attempt + 1))
            git fetch origin release/v1.2
            if ! git rebase -q --onto FETCH_HEAD HEAD~1; then
              git rebase --abort
              echo "The rule write-back conflicts with the default branch: pushing the deployment state alone so no vendor id is lost." >&2
              writeback_status=1
              git reset -q --hard FETCH_HEAD
              if ! opentide deploy replay-state "$state_commit"; then
                echo "Could not replay the deployment state onto the default branch." >&2
                exit 1
              fi
              if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
                git add -A -- .opentide/states/deployment
              fi
              if git diff --staged --quiet; then
                echo "The default branch already holds this deployment state." >&2
                state_published=1
                exit 1
              fi
              git commit -q -m "ci: record production deployment [skip ci]"
              state_commit=$(git rev-parse HEAD)
            fi
          done
          state_published=1
          exit "$writeback_status"
  document:
    name: Document
    runs-on: ubuntu-latest
    needs: generate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opentide==$OPENTIDE_VERSION"
      - run: opentide generate docs --output docs
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: opentide-docs
          path: "docs/"
