# Generated by opentide — regenerate with `opentide setup ci gitlab`
# Platform credentials are read from the environment. Set these in the CI secret store:
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_SUBSCRIPTION_ID
#   AZURE_TENANT_ID
#   AZURE_WORKSPACE_ID
#   CBC_ORG_KEY
#   CBC_TOKEN
#   CBC_URL
#   ELASTIC_PROD_API_KEY
#   ELASTIC_STAGING_API_KEY
#   EXABEAM_CLIENT_ID
#   EXABEAM_CLIENT_SECRET
#   GOOGLE_SECOPS_CREDENTIALS
#   GRAVITYZONE_API_KEY
#   GRAYLOG_TOKEN
#   HARFANGLAB_API_TOKEN
#   MDE_CLIENT_ID
#   MDE_CLIENT_SECRET
#   MDE_TENANT_ID
#   SENTINEL_ONE_API_TOKEN
#   SPLUNK_APP
#   SPLUNK_PORT
#   SPLUNK_TOKEN
#   SPLUNK_URL
#   SYSDIG_SECURE_API_TOKEN

# Merge request and default-branch pipelines only. Every job then runs in
# merge request pipelines, and a push to a branch with an open merge request
# starts one pipeline, not two.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  OPENTIDE_REPO_ROOT: $CI_PROJECT_DIR
  OPENTIDE_VERSION: "1.0"

stages:
  - validate
  - generate
  - deploy
  - document

default:
  image: python:3.12-slim

validate:
  stage: validate
  image: python:3.12-slim
  artifacts:
    when: always
    expose_as: opentide reports
    paths:
      - opentide-reports/
    reports:
      codequality: opentide-reports/codequality.json
  before_script:
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - opentide validate --strict --format codequality --output opentide-reports/validate.codequality.json
    - opentide lint --strict --format codequality --output opentide-reports/lint.codequality.json
  after_script:
    - python -m opentide.ci.codequality --output opentide-reports/codequality.json opentide-reports/validate.codequality.json opentide-reports/lint.codequality.json

generate:
  stage: generate
  image: python:3.12-slim
  before_script:
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - opentide generate
  needs:
    - validate
    - job: validate_query_sentinel
      optional: true
    - job: validate_query_elastic
      optional: true

validate_query_sentinel:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_TITLE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)skip-deploy(,|$)/
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: "0"
  artifacts:
    when: always
    expose_as: opentide query sentinel
    paths:
      - opentide-reports/summary.md
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - rm -rf -- .opentide/configurations
    - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --depth=1 origin "$CI_DEFAULT_BRANCH"; else git fetch origin "$CI_DEFAULT_BRANCH"; fi
    - if ! git cat-file -e FETCH_HEAD:.opentide/configurations 2>/dev/null; then echo "The default branch has no .opentide/configurations yet, so no tenant is reviewed. Skipped without using platform credentials."; exit 0; fi
    - git checkout FETCH_HEAD -- .opentide/configurations
    - if grep -qs '^[^#]*tenants' .opentide/configurations/platforms/sentinel.toml; then if [ -z "$AZ_SECRET" ] || [ -z "$AZ_TENANT" ]; then echo skip sentinel live query validation AZ_SECRET AZ_TENANT; exit 2; else opentide validate query --platform sentinel --live --changed; fi; else echo "The default branch has no sentinel tenant yet, so no tenant is reviewed. Skipped sentinel live query validation without using platform credentials."; fi

validate_query_elastic:
  stage: validate
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_TITLE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)skip-deploy(,|$)/
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: "0"
  artifacts:
    when: always
    expose_as: opentide query elastic
    paths:
      - opentide-reports/summary.md
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - rm -rf -- .opentide/configurations
    - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --depth=1 origin "$CI_DEFAULT_BRANCH"; else git fetch origin "$CI_DEFAULT_BRANCH"; fi
    - if ! git cat-file -e FETCH_HEAD:.opentide/configurations 2>/dev/null; then echo "The default branch has no .opentide/configurations yet, so no tenant is reviewed. Skipped without using platform credentials."; exit 0; fi
    - git checkout FETCH_HEAD -- .opentide/configurations
    - if grep -qs '^[^#]*tenants' .opentide/configurations/platforms/elastic.toml; then opentide validate query --platform elastic --live --changed; else echo "The default branch has no elastic tenant yet, so no tenant is reviewed. Skipped elastic live query validation without using platform credentials."; fi

deploy_staging:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_TITLE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)skip-deploy(,|$)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  environment:
    name: staging/mr-$CI_MERGE_REQUEST_IID
    deployment_tier: staging
    auto_stop_in: 1 week
  artifacts:
    when: always
    expose_as: opentide staging plan
    paths:
      - opentide-reports/summary.md
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - rm -rf -- .opentide/configurations
    - if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --depth=1 origin "$CI_DEFAULT_BRANCH"; else git fetch origin "$CI_DEFAULT_BRANCH"; fi
    - if ! git cat-file -e FETCH_HEAD:.opentide/configurations 2>/dev/null; then echo "The default branch has no .opentide/configurations yet, so no tenant is reviewed. Skipped without using platform credentials."; exit 0; fi
    - git checkout FETCH_HEAD -- .opentide/configurations
    - opentide deploy --dry-run --strategy PREVIEW
    - opentide deploy --strategy PREVIEW --skip-unconfigured
  needs:
    - generate

deploy_production:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_TITLE =~ /\[skip deploy\]/
      when: never
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)skip-deploy(,|$)/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  resource_group: opentide-production
  environment:
    name: production
    deployment_tier: production
  artifacts:
    when: always
    paths:
      - opentide-reports/summary.md
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - |
      if [ -n "${OPENTIDE_PUSH_SSH_KEY:-}" ]; then
        if [ ! -f "$OPENTIDE_PUSH_SSH_KEY" ]; then
          echo "OPENTIDE_PUSH_SSH_KEY must be a CI/CD variable of type File holding the private key." >&2
          exit 1
        fi
        if [ ! -s "${OPENTIDE_PUSH_SSH_KNOWN_HOSTS:-}" ]; then
          echo "OPENTIDE_PUSH_SSH_KEY is set, but OPENTIDE_PUSH_SSH_KNOWN_HOSTS is not a File variable holding the server's known_hosts lines; refusing to push to an unchecked host." >&2
          exit 1
        fi
        command -v ssh-keygen > /dev/null || apt-get install -y -qq --no-install-recommends openssh-client > /dev/null
        chmod 600 "$OPENTIDE_PUSH_SSH_KEY"
        git config core.sshCommand "ssh -i \"$OPENTIDE_PUSH_SSH_KEY\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$OPENTIDE_PUSH_SSH_KNOWN_HOSTS\""
        git config gpg.format ssh
        git config user.signingkey "$OPENTIDE_PUSH_SSH_KEY"
        git config commit.gpgsign true
        echo 'Pushing and signing with the OPENTIDE_PUSH_SSH_KEY key.'
      fi
    - git config user.email "gitlab-ci@opentide.local"
    - git config user.name "gitlab-ci"
    - |
      git fetch origin "$CI_DEFAULT_BRANCH"
      rm -rf -- .opentide/states/deployment
      git rm -r -q --cached --ignore-unmatch -- .opentide/states/deployment
      if git cat-file -e "FETCH_HEAD:.opentide/states/deployment" 2>/dev/null; then
        git checkout FETCH_HEAD -- .opentide/states/deployment
      fi
      if git diff --cached --quiet -- .opentide/states/deployment; then
        state_base=$(git rev-parse HEAD)
      else
        state_base=$(git commit-tree "$(git write-tree)" -p HEAD -m "opentide: deployment state of the default branch")
      fi
      echo "$state_base" > "$(git rev-parse --git-path opentide-state-base)"
    - opentide deploy --dry-run --strategy RELEASE
    - |
      deploy_status=0
      touch "$(git rev-parse --git-path opentide-deploy-started)"
      opentide deploy --strategy RELEASE --skip-unconfigured || deploy_status=$?
      if [ "$deploy_status" -ne 0 ]; then
        echo "Deploy failed (exit $deploy_status); committing what it recorded before it stopped." >&2
      fi
      set +e
      (
      set -e
      if [ -f "$(git rev-parse --git-path opentide-state-base)" ]; then
        git reset -q --soft "$(cat "$(git rev-parse --git-path opentide-state-base)")"
      fi
      writeback_status=0
      if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
        git add -A -- .opentide/states/deployment
      fi
      git diff -z --name-only -- detections/rules > "$(git rev-parse --git-path opentide-rule-files)"
      set --
      while IFS= read -r -d '' rule_file; do
        set -- "$@" --file "$rule_file"
      done < "$(git rev-parse --git-path opentide-rule-files)"
      if [ "$#" -gt 0 ]; then
        if opentide validate --strict "$@"; then
          git add -u -- detections/rules
        else
          echo "opentide validate --strict failed on the deployed rule files: committing the deployment state only, not the rule files." >&2
          writeback_status=1
        fi
      fi
      if git diff --staged --quiet; then
        echo "No deployment write-backs to commit"
        exit "$writeback_status"
      fi
      git commit -q -m "ci: record production deployment [skip ci]"
      git reset -q --hard HEAD
      state_commit=$(git rev-parse HEAD)
      state_published=0
      # shellcheck disable=SC2317,SC2329 # run by the EXIT trap below
      opentide_state_exit() {
        exit_status=$?
        if [ "$state_published" -ne 1 ]; then
          echo "The deployment state did not reach the default branch. The vendor ids this run recorded are printed below and pushed to refs/opentide/deployment-state/<commit>; record them before the next deploy." >&2
          git --no-pager diff "$state_commit^" "$state_commit" -- .opentide/states/deployment >&2 || true
          git push "${OPENTIDE_PUSH_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" "$state_commit:refs/opentide/deployment-state/$state_commit" >&2 || true
        fi
        exit "$exit_status"
      }
      trap opentide_state_exit EXIT
      push_attempt=1
      until git push "${OPENTIDE_PUSH_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" "HEAD:$CI_DEFAULT_BRANCH"; do
        if [ "$push_attempt" -ge 5 ]; then
          echo "Push rejected $push_attempt times; giving up." >&2
          exit 1
        fi
        push_attempt=$((push_attempt + 1))
        git fetch origin "$CI_DEFAULT_BRANCH"
        if ! git rebase -q --onto FETCH_HEAD HEAD~1; then
          git rebase --abort
          echo "The rule write-back conflicts with the default branch: pushing the deployment state alone so no vendor id is lost." >&2
          writeback_status=1
          git reset -q --hard FETCH_HEAD
          if ! opentide deploy replay-state "$state_commit"; then
            echo "Could not replay the deployment state onto the default branch." >&2
            exit 1
          fi
          if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
            git add -A -- .opentide/states/deployment
          fi
          if git diff --staged --quiet; then
            echo "The default branch already holds this deployment state." >&2
            state_published=1
            exit 1
          fi
          git commit -q -m "ci: record production deployment [skip ci]"
          state_commit=$(git rev-parse HEAD)
        fi
      done
      state_published=1
      exit "$writeback_status"
      )
      writeback_exit=$?
      touch "$(git rev-parse --git-path opentide-writeback-done)"
      set -e
      if [ "$deploy_status" -ne 0 ]; then
        exit "$deploy_status"
      fi
      exit "$writeback_exit"
  after_script:
    - |
      if [ -f "$(git rev-parse --git-path opentide-deploy-started)" ] && [ ! -f "$(git rev-parse --git-path opentide-writeback-done)" ]; then
        echo "The job stopped after the deploy started and before its write-back: committing what the deploy recorded." >&2
        git rebase --abort 2>/dev/null || true
      (
      set -e
      if [ -f "$(git rev-parse --git-path opentide-state-base)" ]; then
        git reset -q --soft "$(cat "$(git rev-parse --git-path opentide-state-base)")"
      fi
      writeback_status=0
      if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
        git add -A -- .opentide/states/deployment
      fi
      git diff -z --name-only -- detections/rules > "$(git rev-parse --git-path opentide-rule-files)"
      set --
      while IFS= read -r -d '' rule_file; do
        set -- "$@" --file "$rule_file"
      done < "$(git rev-parse --git-path opentide-rule-files)"
      if [ "$#" -gt 0 ]; then
        if opentide validate --strict "$@"; then
          git add -u -- detections/rules
        else
          echo "opentide validate --strict failed on the deployed rule files: committing the deployment state only, not the rule files." >&2
          writeback_status=1
        fi
      fi
      if git diff --staged --quiet; then
        echo "No deployment write-backs to commit"
        exit "$writeback_status"
      fi
      git commit -q -m "ci: record production deployment [skip ci]"
      git reset -q --hard HEAD
      state_commit=$(git rev-parse HEAD)
      state_published=0
      # shellcheck disable=SC2317,SC2329 # run by the EXIT trap below
      opentide_state_exit() {
        exit_status=$?
        if [ "$state_published" -ne 1 ]; then
          echo "The deployment state did not reach the default branch. The vendor ids this run recorded are printed below and pushed to refs/opentide/deployment-state/<commit>; record them before the next deploy." >&2
          git --no-pager diff "$state_commit^" "$state_commit" -- .opentide/states/deployment >&2 || true
          git push "${OPENTIDE_PUSH_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" "$state_commit:refs/opentide/deployment-state/$state_commit" >&2 || true
        fi
        exit "$exit_status"
      }
      trap opentide_state_exit EXIT
      push_attempt=1
      until git push "${OPENTIDE_PUSH_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" "HEAD:$CI_DEFAULT_BRANCH"; do
        if [ "$push_attempt" -ge 5 ]; then
          echo "Push rejected $push_attempt times; giving up." >&2
          exit 1
        fi
        push_attempt=$((push_attempt + 1))
        git fetch origin "$CI_DEFAULT_BRANCH"
        if ! git rebase -q --onto FETCH_HEAD HEAD~1; then
          git rebase --abort
          echo "The rule write-back conflicts with the default branch: pushing the deployment state alone so no vendor id is lost." >&2
          writeback_status=1
          git reset -q --hard FETCH_HEAD
          if ! opentide deploy replay-state "$state_commit"; then
            echo "Could not replay the deployment state onto the default branch." >&2
            exit 1
          fi
          if [ -d .opentide/states/deployment ] || [ -n "$(git ls-files -- .opentide/states/deployment)" ]; then
            git add -A -- .opentide/states/deployment
          fi
          if git diff --staged --quiet; then
            echo "The default branch already holds this deployment state." >&2
            state_published=1
            exit 1
          fi
          git commit -q -m "ci: record production deployment [skip ci]"
          state_commit=$(git rev-parse HEAD)
        fi
      done
      state_published=1
      exit "$writeback_status"
      )
      fi
  needs:
    - generate

inflight_shards:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - pip install "opentide==$OPENTIDE_VERSION"
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - rm -rf .opentide/inflight
    - git rev-parse "origin/$CI_DEFAULT_BRANCH" > "$(git rev-parse --git-path opentide-inflight-base)"
    - git checkout "$(cat "$(git rev-parse --git-path opentide-inflight-base)")" -- .opentide/inflight 2>/dev/null || mkdir -p .opentide/inflight
    - export OPENTIDE_REPO_ROOT="$CI_PROJECT_DIR"
    - opentide generate inflight
    - |
      if [ -n "${OPENTIDE_PUSH_SSH_KEY:-}" ]; then
        if [ ! -f "$OPENTIDE_PUSH_SSH_KEY" ]; then
          echo "OPENTIDE_PUSH_SSH_KEY must be a CI/CD variable of type File holding the private key." >&2
          exit 1
        fi
        if [ ! -s "${OPENTIDE_PUSH_SSH_KNOWN_HOSTS:-}" ]; then
          echo "OPENTIDE_PUSH_SSH_KEY is set, but OPENTIDE_PUSH_SSH_KNOWN_HOSTS is not a File variable holding the server's known_hosts lines; refusing to push to an unchecked host." >&2
          exit 1
        fi
        command -v ssh-keygen > /dev/null || apt-get install -y -qq --no-install-recommends openssh-client > /dev/null
        chmod 600 "$OPENTIDE_PUSH_SSH_KEY"
        git config core.sshCommand "ssh -i \"$OPENTIDE_PUSH_SSH_KEY\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$OPENTIDE_PUSH_SSH_KNOWN_HOSTS\""
        git config gpg.format ssh
        git config user.signingkey "$OPENTIDE_PUSH_SSH_KEY"
        git config commit.gpgsign true
        echo 'Pushing and signing with the OPENTIDE_PUSH_SSH_KEY key.'
      fi
    - git config user.email "gitlab-ci@opentide.local"
    - git config user.name "gitlab-ci"
    - |
      shards_repo="$PWD"
      shards_base="$(mktemp -d)"
      git worktree add --detach "$shards_base" "$(cat "$(git rev-parse --git-path opentide-inflight-base)")"
      trap 'cd "$shards_repo" && git worktree remove --force "$shards_base"' EXIT
      rm -rf "$shards_base/.opentide/inflight"
      mkdir -p "$shards_base/.opentide"
      cp -R .opentide/inflight "$shards_base/.opentide/inflight"
      cd "$shards_base" || exit
      mkdir -p .opentide/inflight
      git add .opentide/inflight/
      if git diff --staged --quiet; then
        echo "No inflight shard changes"
        exit 0
      fi
      git commit -m "ci: update inflight preview shards [skip ci]"
      push_attempt=1
      until git push "${OPENTIDE_PUSH_URL:-https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" "HEAD:$CI_DEFAULT_BRANCH"; do
        if [ "$push_attempt" -ge 5 ]; then
          echo "Push rejected $push_attempt times; giving up." >&2
          exit 1
        fi
        push_attempt=$((push_attempt + 1))
        git fetch origin "$CI_DEFAULT_BRANCH"
        git rebase FETCH_HEAD
      done
  needs:
    - generate

