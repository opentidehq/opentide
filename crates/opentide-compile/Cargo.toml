[package]
name = "opentide-compile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: deploy compile and plan (request bodies per platform, status strategies, rule selection). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while opentide-workspace, which it builds on, is not
# (crates/opentide-schema/Cargo.toml says when that changes).
publish = false

[lints]
workspace = true

[dependencies]
# "did you mean" for --strategy (strsim, clap's measure).
opentide-core.workspace = true
opentide-schema.workspace = true
# generate docs: the catalogue checks each object against its model's constraints.
garde.workspace = true
opentide-workspace.workspace = true
# The git baseline (UC-3.1): gitoxide's crates read the repository without
# the git program: the checkout's discovery, the reference store, the object
# database, the tree diff (without its blob diff: filters, attributes), the
# rev-spec parser and the merge base. The
# crates, not the `gix` facade, whose object cache brings a second hashbrown
# (clru), which deny.toml's multiple-versions ban refuses.
gix-discover = "0.55"
# The rev-spec parser's delegate reports failures as gix-error's Exn.
gix-error = "0.3"
gix-hash = { version = "0.26", features = ["sha1"] }
gix-object = "0.64"
# The checkout's configuration (`generate docs`: the origin remote's host picks the
# Markdown flavour; a branch's upstream is a `--changed` baseline).
gix-config = { version = "0.60", default-features = false }
gix-odb = "0.84"
gix-ref = "0.67"
gix-diff = { version = "0.67", default-features = false, features = ["sha1"] }
gix-revwalk = "0.35"
gix-revision = { version = "0.49", default-features = false, features = ["merge_base"] }
# generate docs --changed reads the work tree as `git diff` and `git ls-files
# --others --exclude-standard` do: the index's entries and their stat data
# (gix-index), the exclude files and `.gitattributes` (gix-worktree's stack,
# gix-ignore, gix-attributes) and the clean filters a file goes through before
# it is compared (gix-filter: autocrlf, eol, ident, working-tree-encoding and
# configured filter drivers).
gix-index = "0.55"
gix-worktree = { version = "0.56", default-features = false, features = ["attributes"] }
gix-ignore = "0.22"
gix-attributes = "0.35"
gix-filter = "0.34"
gix-fs = "0.22"
gix-path = "0.12"
gix-command = "0.10"
# Paths without Windows' verbatim prefix (`\\?\`), which git, the oracle
# and a user's own paths do not use: the messages name paths that way.
dunce = "1"
# CrowdStrike's delete names the rule in its query string, encoded as a form.
form_urlencoded = "1"
# HarfangLab's Sigma rule is YAML (the crate opentide-schema writes models with).
serde-saphyr.workspace = true
# Request bodies keep the order their keys are built in, as the oracle's dicts do.
indexmap = { version = "2", features = ["serde"] }
# generate: a phase's files written in parallel (UC-3.2).
rayon.workspace = true
# generate exports: the Navigator layer lists objects by name under full
# Unicode case folding, as the oracle's `str.casefold()` sorts them.
caseless = "0.2"
# generate docs (UC-3.2b): the pages are minijinja templates
# (`src/generate/docs/templates/`), Mermaid labels wrapped by textwrap, CVE
# identifiers read with regex and quoted into links with percent-encoding,
# heading anchors by Unicode general category.
minijinja = { version = "2.24", default-features = false, features = ["builtins", "macros", "multi_template", "custom_syntax", "serde", "std_collections"] }
textwrap = { version = "0.16", default-features = false }
regex.workspace = true
percent-encoding = "2"
unicode-properties.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Log events (a rule without a status), written by the host's layer.
tracing = "0.1"
# `setup ci`'s pipelines are templates too (UC-3.2c, #916; `custom_syntax`
# above): `[[ ]]` delimits a value, since GitHub Actions spells its own
# expressions `${{ }}`.
# Shell words in the pipelines, quoted as the oracle's `shlex.quote` quotes them.
shlex = "2.0"
# `setup ci` reads each enabled platform's tenants for the variables its
# live query check needs; the oracle test reads its approved differences
# (tests/golden/payloads/APPROVED.toml) with it too.
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
# Repositories the git baseline's tests build (the version xtask locks).
tempfile = "3"
