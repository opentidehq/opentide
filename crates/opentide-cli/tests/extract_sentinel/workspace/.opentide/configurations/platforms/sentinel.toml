# The workspace `generate extract sentinel` runs in (UC-4.4e, #834): one
# tenant of the stand-in of tests/cassettes/sentinel/tenant.py, whose
# workspace `extract` holds the analytics rules the importer pulls.

[platform]
enabled = true
name = "Microsoft Sentinel"

[[tenants]]
name = "soc"
strategies = ["PREVIEW"]
[tenants.setup]
ssl = true
resource_group = "soc-rg"
workspace_name = "extract"
workspace_id = "11111111-2222-4333-8444-555555555555"
azure_tenant_id = "contoso-tenant-id"
azure_subscription_id = "sub-0001"
azure_client_id = "opentide-app-id"
azure_client_secret = "$AZURE_CLIENT_SECRET"
