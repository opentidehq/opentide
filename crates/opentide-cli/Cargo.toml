[package]
name = "opentide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Published with content, once commands run on it (docs/internal/publishing.md).
publish = false
# The renderers' oracle data (tests/render.rs) is CI-only, like the vendor
# oracles: the explain pages it holds quote vendor SDK names the licence scan
# keeps out of release artifacts (scripts/engine/license-scan.sh).
exclude = ["tests/render/", "tests/render.rs"]
description = "The opentide command line: command tree, output modes, JSON envelope, exit codes, crash handler"

[lints]
workspace = true

[lib]
name = "opentide_cli"
path = "src/lib.rs"

[[bin]]
name = "opentide"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env", "string"] }
ctrlc = "3.4"
# The query lines of a code frame, coloured as the editor colours them.
opentide-analysis.workspace = true
form_urlencoded = "1.2"
# Percent-encoded paths in links and SARIF URIs.
percent-encoding = "2.3"
humantime = "2.4"
regex.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
# SARIF and Code Quality fingerprints (RustCrypto).
sha2 = "0.10"
shlex = "2.0"
strsim = "0.11"
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
toml.workspace = true
tracing = "0.1"
unicode-width = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
# The goldens' case.toml and outcome.toml (tests/framework_goldens.rs).

# The renderers' snapshots, written by the oracle (tests/render.rs).
insta.workspace = true
