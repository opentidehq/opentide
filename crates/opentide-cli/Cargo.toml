[package]
name = "opentide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Published by the release train (publish.yml, UC-5.5), for the facade's `cli`
# feature. Its explain pages and MCP templates come from src/opentide/data
# (build.rs, OPENTIDE_ASSETS), which `release.py vendor` copies into the package.
# The renderers' oracle data (tests/render.rs) is CI-only, like the vendor
# oracles: the explain pages it holds quote vendor SDK names the licence scan
# keeps out of release artifacts (scripts/engine/license-scan.sh).
# `generate extract sentinel`'s oracle files (tests/extract_sentinel.rs) are
# CI-only too: the test replays a cassette of the repository's tests/.
exclude = [
    "tests/render/",
    "tests/render.rs",
    "tests/extract_sentinel/",
    "tests/extract_sentinel.rs",
]
description = "opentide engine component: the command line (command tree, output modes, JSON envelope, exit codes, crash handler). Internal: depend on the opentide facade (its `cli` feature)."
readme = "README.md"

# The explain pages build.rs compiles in, which `scripts/engine/release.py
# vendor` copies into the published crate (its `include_str!`s of
# OPENTIDE_ASSETS, the MCP host templates, are found in the sources).
[package.metadata.opentide]
assets = ["src/opentide/data/diagnostics"]

[lints]
workspace = true

[lib]
name = "opentide_cli"
path = "src/lib.rs"

# Named `opentide-cli`, not `opentide`: the facade's binary (crates/opentide,
# with `cli`) is `opentide`, and on Windows two packages linking one
# `target/debug/deps/opentide.exe` at once fail with LNK1104 (cargo#6313).
# It runs the same `main(argv)`, so it prints `opentide` as its name.
[[bin]]
name = "opentide-cli"
path = "src/main.rs"
# Not documented: its page would take the path of the opentide facade's
# library (target/doc/opentide, cargo#6313), whose docs are the binary's too.
doc = false

[dependencies]
clap = { workspace = true, features = ["env", "string"] }
# Shell completion (#841): `--show-completion` and `--install-completion`
# write clap_complete's registration for each shell, and a Tab press runs the
# binary with `_OPENTIDE_COMPLETE` set (`CompleteEnv`), which completes the
# command line from the clap tree and the workspace's values from the
# completers in `commands/completion/values.rs`. `unstable-dynamic` is the
# feature that holds `CompleteEnv` and `ArgValueCompleter`: outside
# clap_complete's semver promise, so the version is pinned to the minor.
clap_complete = { version = "~4.6.11", features = ["unstable-dynamic"] }
# The boxed tables of `info` (the rows, columns and wrapping are the crate's).
comfy-table = { version = "7.2", default-features = false }
ctrlc = "3.4"
# The query lines of a code frame, coloured as the editor colours them.
opentide-analysis.workspace = true
# The commands ported onto the framework (UC-2.4): the workspace, its
# catalogue, coverage, tenants and review dates, and the one suggestion rule;
# the queries check of validate on the query engines (src/queries.rs, UC-2.5):
# the workspace and its one Diagnostic, and the quoting of a suggestion.
opentide-core.workspace = true
# `generate` (UC-3.2): the files it writes; `deploy --dry-run` (UC-3.1c): the
# plan, the compiled bodies, the git baseline.
opentide-compile.workspace = true
opentide-schema.workspace = true
opentide-workspace.workspace = true
# `lsp start` (UC-3.6b, #947): the language server the command line hosts,
# the tier below this crate in xtask/layers.toml.
opentide-lsp.workspace = true
anyhow.workspace = true
# `opentide tui` (UC-3.6d, #951) uses the same tier for what the language
# server reports on each object file (`ObjectFindings`, the findings
# `opentide lsp start` publishes).
# `opentide tui`'s terminal UI: ratatui, drawn through crossterm; and the
# output of a command run from it, printed by the renderers as SGR runs at a
# terminal, read back into ratatui's text for the Results tab.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
ansi-to-tui = { version = "8.0", default-features = false }
indexmap = "2"
# `validate`'s queries check analyses the objects on every core (#817).
rayon.workspace = true
jiff.workspace = true
form_urlencoded = "1.2"
# `doctor` (UC-3.5c): VS Code's and the MCP hosts' JSON with comments and
# trailing commas, as VS Code reads them.
jsonc-parser = { version = "0.26", features = ["cst", "serde"] }
# `setup`'s paths: a path shown relative to another (`os.path.relpath`), and
# a path resolved where it exists and kept where it does not (`Path.resolve()`).
pathdiff = "0.2"
soft-canonicalize = { version = "0.5", default-features = false, features = ["dunce"] }
# Percent-encoded paths in links and SARIF URIs.
percent-encoding = "2.3"
# `opentide explain <code>` in human mode: the page's Markdown, parsed for the terminal.
pulldown-cmark = { version = "0.13", default-features = false }
humantime = "2.4"
regex.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
# SARIF and Code Quality fingerprints (RustCrypto).
sha2 = "0.11"
shlex = "2.0"
strsim = "0.11"
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
toml.workspace = true
tracing = "0.1"
unicode-width = "0.2"
# The `setup` wizard (UC-3.6c, #951): its questions at a terminal, on
# crossterm (Linux, macOS and Windows consoles).
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
# `new`'s fresh object identifiers.
uuid = { workspace = true, features = ["v4"] }
# `generate extract elastic --include-prebuilt` (UC-4.4b, #834): the UUID a
# prebuilt rule's id derives (`uuid.uuid5`), from SHA-1 (RustCrypto).
sha1 = "0.10"
# `generate extract elastic` (UC-4.4b, #834): the extracted rule written as
# YAML by serde-saphyr's emitter, as `opentide-compile` writes Sigma rules.
serde-saphyr.workspace = true
# `doctor`'s opentide_latest (UC-4.4, #834): PEP 440 versions ordered as
# `packaging.version.Version` orders them.
pep440_rs = { version = "0.7", default-features = false }
# `doctor` (UC-3.5c): whether git and an MCP server's command are on PATH.
which = "7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# `mcp start` (UC-3.7, #829): the official Rust MCP SDK serves the protocol on
# stdio, on a current-thread tokio runtime (stdin, and the duplicate of stdout
# the frames go to).
rmcp = { version = "3.9", default-features = false, features = ["server"] }
tokio = { version = "1.48", default-features = false, features = ["rt", "io-std", "io-util", "fs"] }
# `setup skills` (UC-4.1, #831): the opentidehq/skills catalogue, fetched with
# the connectors' HTTP client, through the proxy and CA bundle the
# environment names.
opentide-connectors.workspace = true
reqwest.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
# `mcp start` points descriptor 1 at stderr while it serves, so nothing but a
# frame reaches stdout (`dup2`, safely).
rustix = { version = "1.1", default-features = false, features = ["std", "stdio"] }
# `serve` (UC-3.8, #830): SIGTERM and SIGHUP end the session as the end of
# input does, so the run in progress is cancelled and cleans up.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[target.'cfg(unix)'.dev-dependencies]
# `tests/tui_terminal.rs`: the pseudo-terminals `tui` runs in at a terminal;
# `tests/lsp_start.rs`: the Ctrl-C (SIGINT) a person sends `lsp start`.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "pty", "termios"] }
# `tests/tui_pty.rs`: `opentide tui` driven in a pseudo-terminal (open, run
# validate, quit) through portable-pty, as a person at a terminal runs it.
# vt100 reads what the UI drew back into a screen: ratatui writes only the
# cells that changed.
vt100 = "0.18"

[dev-dependencies]
# The goldens' recorded HTTP (UC-4.1): the replaying proxy of a cassette case.
opentide-cassette.workspace = true
# The goldens' normalisation, for the generate cases (tests/generate_goldens.rs).
opentide-compare.workspace = true
tempfile = "3"
# The pseudo-terminal tests (tests/setup_wizard.rs, tests/tui_pty.rs), on
# wezterm's portable-pty: a pty on Unix, ConPTY on Windows. The one crate
# that drives a run at a terminal.
portable-pty = "0.9"
# The goldens' case.toml and outcome.toml (tests/framework_goldens.rs).

# The renderers' snapshots, written by the oracle (tests/render.rs).
insta.workspace = true
