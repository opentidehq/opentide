[package]
name = "opentide-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: loading a Tide workspace into one shared index (discovery, configuration, parallel parse, invalidation). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while opentide-schema, which it builds on, is not
# (crates/opentide-schema/Cargo.toml says when that changes).
publish = false

[lints]
workspace = true

[dependencies]
opentide-schema.workspace = true
# Objects in the order the registry meets them, looked up by UUID.
indexmap = { version = "2", features = ["serde"] }
# Each object file is read and parsed on its own thread.
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
