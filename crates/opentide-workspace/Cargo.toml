[package]
name = "opentide-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "opentide engine component: loading a Tide workspace into one shared index (discovery, configuration, parallel parse, invalidation). Internal: depend on the opentide facade."
readme = "../COMPONENT.md"
# Not published while opentide-schema, which it builds on, is not
# (crates/opentide-schema/Cargo.toml says when that changes).
publish = false

[lints]
workspace = true

[dependencies]
opentide-core.workspace = true
opentide-schema.workspace = true
# The revisions' JSON Schemas, whose `tide.vocab` keys the vocabulary check reads.
schemars.workspace = true
serde.workspace = true
# The object vocabularies (threat, objective, rule) are built as vocabulary tables.
toml.workspace = true
# UUID v4 and canonical forms (`uuid-format`, deployment state shards).
uuid.workspace = true
# Objects in the order the registry meets them, looked up by UUID.
indexmap = { version = "2", features = ["serde"] }
# Each object file is read and parsed on its own thread.
rayon.workspace = true
serde_json.workspace = true
# `rules unreviewed`: review instants and the window (the date library
# opentide-schema checks `metadata.reviewed` with).
jiff.workspace = true
thiserror.workspace = true
# The catalogue's text fallbacks and `$VAR` references, as the oracle's
# patterns; lint's placeholder markers and top-level keys; watch's UUID scan.
regex.workspace = true
# `validate --fix --dry-run`'s unified diff (the user's rule: a crate, never a
# port of Python's difflib). Version 2, as xtask uses: `similar` 3 would be
# a second shipped copy, which cargo-deny's bans refuse.
similar = "2.7"
# `validate --fix` writes through a temporary file renamed into place.
tempfile = "3"
# `lint --fix`'s next step quotes its flags as a shell would read them.
shlex = "2.0"

# `--watch`'s change detection. The language server and the WebAssembly
# build have no file watcher of their own to need.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
notify = "8.2"

[dev-dependencies]
proptest.workspace = true
# The process session's test opens a workspace on the disk.
tempfile = "3"
