[package]
name = "opentide-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "EUPL-1.2"
description = "cargo-fuzz targets for the opentide engines and the LSP host (#182)."

[package.metadata]
cargo-fuzz = true

# Not a member of the repository's workspace: cargo-fuzz builds it on nightly
# with sanitizer flags, and its lock file is its own.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
opentide-analysis = { path = "../crates/opentide-analysis" }
opentide-cli = { path = "../crates/opentide-cli" }
opentide-core = { path = "../crates/opentide-core" }
opentide-lsp = { path = "../crates/opentide-lsp" }
# The fuzzer converts into the rule models, platform blocks included, and
# ships nothing.
opentide-schema = { path = "../crates/opentide-schema" }
serde = "1"
opentide-tide = { path = "../crates/opentide-tide" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "kql"
path = "fuzz_targets/kql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spl"
path = "fuzz_targets/spl.rs"
test = false
doc = false
bench = false

