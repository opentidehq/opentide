# cargo-mutants (https://mutants.rs) for the weekly mutation run
# (.github/workflows/mutants.yml, UC-X.2 #844) and for a local run:
#
#   cargo mutants -p opentide-analysis                  one crate, every mutant
#   git diff origin/development... > /tmp/pr.diff
#   cargo mutants -p opentide-analysis --in-diff /tmp/pr.diff   what a change touches
#
# Which crates the weekly run mutates, and when their survivors become issues,
# is xtask/mutants.toml; docs/internal/test-strength.md explains the scores.
# There is no exclude list here: a mutant that cannot be killed is recorded as
# equivalent in a comment on its crate's issue, not hidden from the run.

# The tests of the mutated package, through nextest (the default profile of
# .config/nextest.toml). Doctests are not run.
test_tool = "nextest"
# The tooling never rewrites Cargo.lock, as `cargo xtask` does.
additional_cargo_args = ["--locked"]
# A lint that a mutant trips (an unused variable, say) is not a reason to call
# the mutant unviable: only a build error is.
cap_lints = true
