# cargo-mutants (https://mutants.rs) settings for a run by hand. Mutation
# testing is not a recurring job here: #844 ran it once, as a time-boxed
# experiment, and docs/internal/test-strength.md records what it found.
#
#   cargo mutants -p opentide-schema --cap-lints false   one crate, every mutant
#   git diff origin/development... > /tmp/pr.diff
#   cargo mutants -p opentide-workspace --in-diff /tmp/pr.diff   what a change touches
#
# `--cap-lints false` keeps the build's RUSTFLAGS, so the workspace is not
# rebuilt from scratch (cap_lints below changes them).

# The tests of the mutated package, through nextest (the default profile of
# .config/nextest.toml). Doctests are not run.
test_tool = "nextest"
# The tooling never rewrites Cargo.lock, as `cargo xtask` does.
additional_cargo_args = ["--locked"]
# A lint that a mutant trips (an unused variable, say) is not a reason to call
# the mutant unviable: only a build error is.
cap_lints = true
