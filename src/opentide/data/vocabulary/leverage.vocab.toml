name = "Leverage"
field = "leverage"
description = "Technical aftermath of the attack from the target perspective, differentiated from impact as it does not consider the value of the consequence, only what increased control the vector execution provides to the adversary."
reference = "https://owasp.org/www-community/Threat_Modeling_Process#stride, http://veriscommunity.net/enums.html#section-attributes"

key = "name"
[[keys]]
name = "Spoofing"

description = "Threat action aimed at accessing and use of another user’s credentials, such as username and password."

[[keys]]
name = "Tampering"

description = "Threat action intending to maliciously change or modify persistent data, such as records in a database, and the alteration of data in transit between two computers over an open network, such as the Internet."

[[keys]]
name = "Repudiation"

description = "Threat action aimed at performing prohibited operations in a system that lacks the ability to trace the operations."

[[keys]]
name = "Infrastructure Compromise"

description = "The compromised target is likely to be used to further expand the sphere of influence of the attacker and allow more potent vectors to be executed."

[[keys]]
name = "Information Disclosure"

description = "Threat action intending to read a file that one was not granted access to, or to read data in transit."

[[keys]]
name = "Dwelling"

description = "Active or passive extended presence in the target, which performs adversarial operations continuously."

[[keys]]
name = "Denial of Service"

description = "Threat action attempting to deny access to valid users, such as by making a web server temporarily unavailable or unusable."

[[keys]]
name = "Elevation of privilege"

description = "Capacity to augment leverage over the target system by upgrading the compromised access rights"

[[keys]]
name = "New Accounts"

description = "Ability to create new arbitrary user accounts."

[[keys]]
name = "Hardware tampering"

description = "Hardware tampering or physical alteration"

[[keys]]
name = "Alter behavior"

description = "Influence or alter human behavior"

[[keys]]
name = "Fraudulent transaction"

description = "Initiate fraudulent transaction"

[[keys]]
name = "Log tampering"

description = "Log tampering or modification"

[[keys]]
name = "Modify configuration"

description = "Modify configuration or services"

[[keys]]
name = "Modify privileges"

description = "Modify privileges or permissions"

[[keys]]
name = "Modify data"

description = "Modify stored data or content"

[[keys]]
name = "Software installation"

description = "Software installation or code modification"

[[keys]]
name = "Information Gathering"

description = "Gathering information about the target system, network, or environment to inform subsequent attack phases."

[[keys]]
name = "Process Manipulation"

description = "Ability to interfere with or alter physical process operations in industrial control environments."

[[keys]]
name = "Safety Bypass"

description = "Circumvention or disabling of safety instrumented systems or protective controls."
