name = "Indicator Type"
field = "indicators"
description = "Define the status of the rule implementation according to use case development life cycle process."
icon = "🧬"
key = "id"
[[keys]]
id = "email"
name = "Email Address"
icon = "📧"
description = "Standard email format, such as described in [🔗 RFC 5322](https://datatracker.ietf.org/doc/html/rfc5322)\n- ✅ wave@tide.mec - ✅ tide.governance@tide.babel - ❌ tide@10.0.0.19\n💡 Any Top-Level Domain (`tld`) is accepted, as long as the `user@domain.tld` format is respected."

[[keys]]
id = "url"
name = "URL Address"
icon = "🔗"
description = "Standard URL format, such as described in [🔗 URL Living Standard](https://url.spec.whatwg.org/)\n💡 For simple domain validation with no URI, use the _domain_ instead.\n👉 Expects the standard pattern `FQDN/URI`, meaning `[ftp | http | https]://(subdomain.)domain.tld/resource`"

[[keys]]
id = "domain"
name = "Domain Name"
icon = "🌐"
description = "Standard domain name format, such as described in [🔗 RFC 1034](https://datatracker.ietf.org/doc/html/rfc1034)\n💡A full FQDN (containing protocol) is not expected. For full `FQDN` + `URI`, use _url_ instead\n👉 Expects the standard pattern `FQDN/URI`, meaning `[ftp | http | https]://(subdomain.)domain.tld/resource`"

