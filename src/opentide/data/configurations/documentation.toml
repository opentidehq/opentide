scope = [ "threat", "objective", "rule" ]
skip_model_keys = ["description",
                            "guidelines",
                            "terrain",
                            "surface",
                            "tuning",
                            "att&ck",
                            "actors",
                            "vectors",
                            "justification",
                            "chaining",
                            "cve"]

folder_index_pages = true

[flavor]
default = "generic"

[gitlab]
uuid_permalinks = true

[diagrams]
relations_direction = "both"

[index]
relation_counts = true
icons = false

[cve]
# CIRCL Vulnerability-Lookup aggregates CVE, GHSA, CSAF, NVD, and other feeds.
base_url = "https://vulnerability.circl.lu"
default_db_link = "https://vulnerability.circl.lu/vuln/"
retrieve_details = true
proxy = false

[object_names]
threat = "Threat Vectors"
objective = "Detection Objectives"
signal = "Detection Objective Signals"
rule = "Detection Rules"
