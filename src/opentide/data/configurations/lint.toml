# `opentide lint` checks. Override any key in .opentide/configurations/lint.toml;
# tables merge, and a list (such as `required`) replaces the default wholesale.
# `opentide lint --check <name>` runs that check even when it is disabled here.
# `--strict` fails on errors and warnings. A missing optional field is a note
# ("info"): it never fails a run, and `opentide lint --verbose` prints it.

[filenames]
enabled = true
# Replace every finding's severity: "error", "warning" or "info".
# severity = "warning"
# How the file stem derives from the object's name:
#   "slug" (default)  the stem is slugify(name), e.g. "simulated-actor"
#   "name"            the stem is the name with characters a file name cannot hold removed
#   "none"            the stem is not compared with the name
style = "slug"
# A regular expression the whole stem (no extension) must match, applied with `style`.
# A stem that does not match is a non-fixable `filename_pattern` finding.
# pattern = '^\[(SEN|XDR)\]\[[^\]]+\].+$'
# A kind of object can have its own `style` and `pattern`; a key it leaves unset
# comes from [filenames]. Kinds: threats, objectives, rules.
# [filenames.rules]
# style = "name"
# pattern = '^\[(SEN|XDR)\]\[.+'

[metadata]
enabled = true
# Metadata keys every object must fill. Generated templates leave these keys
# uncommented, so a scaffolded object shows each one lint asks for.
required = ["author", "organisation"]
# These fields are optional, so a missing one is a note ("info"). Set
# "warning" or "error" to make `--strict` and the editor treat it as a problem.
# severity = "warning"

[recommended]
# Fields the templates ask for and opentide validate does not require: today a
# rule's `configurations` and `response`. A missing one is a note, as above.
enabled = true
# severity = "warning"

[placeholders]
enabled = true
# severity = "warning"

[queries]
# The analysis engine's warnings and notes on rule queries (slow shapes,
# deprecated commands) and Elastic block settings. A query the platform would
# reject is opentide validate's error, not lint's.
enabled = true
# severity = "warning"
