# GravityZone custom detection rules, through the Incidents API (JSON-RPC). The
# GravityZone rule id is kept in .opentide/states/deployment/ (commit it). url is
# the Control Center API Access URL, ending in /api:
# https://cloudgz.gravityzone.bitdefender.com/api (instance 1, EU),
# https://cloud.gravityzone.bitdefender.com/api (instance 2),
# https://cloudap.gravityzone.bitdefender.com/api (instance 3), or a partner
# console's. The key needs the Incidents API. key_type: personal (HTTP Basic) or
# service (X-API-Key). Ids are 24 lower-case hex digits.
#[[tenants]]
#name = "gravityzone-eu"
#description = "GravityZone cloud instance 1 (EU)"
#strategies = ["RELEASE"]
#[tenants.setup]
#ssl = true
#url = "https://cloudgz.gravityzone.bitdefender.com/api"
#api_key = "$GRAVITYZONE_API_KEY"
#key_type = "personal"
#automatic_actions = true
#tags = ["managed-by-opentide"]
