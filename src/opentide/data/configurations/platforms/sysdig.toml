#[tenants.setup]
#ssl = true
#delivery = "api"
#url = "https://eu1.app.sysdig.com"
#api_token = "$SYSDIG_SECURE_API_TOKEN"
#policies = ["opentide managed detections"]
#tags = ["opentide"]

