[platform]
enabled = false
name = "Google Security Operations"
description = "YARA-L 2.0 detection rules for Google SecOps SIEM."

#[[modifiers]]
#name = "Modifier Demo"
#description = "Example of using modifiers as a development lifecycle automation"
#[modifiers.conditions]
#status = ["STAGING"]
#[modifiers.modifications]
#severity = "Low"

# Google SecOps (formerly Chronicle) custom rules, through the Chronicle API v1.
# The rule id (ru_<uuid>) is kept in .opentide/states/deployment/ (commit it).
# project is the Google Cloud project bound to the instance; location its region
# (us, eu, europe, or a Google Cloud region such as europe-west2); instance the
# SecOps customer id. Requests go to https://<location>-chronicle.googleapis.com
# unless endpoint says otherwise. credentials is an environment variable holding
# a service-account key (JSON) or the path to one; without it, Application
# Default Credentials (workload identity, gcloud auth application-default login).
# The principal needs chronicle.rules.{verifyRuleText,create,get,update,delete},
# chronicle.ruleDeployments.{get,update} and, for opentide query,
# chronicle.events.udmSearch. On DELETION, deletion = "archive" disables and
# archives the rule; "delete" deletes it, never with its detections.
#[[tenants]]
#name = "secops-eu"
#description = "Google SecOps, EU multi-region"
#strategies = ["PREVIEW", "RELEASE"]
#[tenants.setup]
#ssl = true
#project = "acme-secops"
#location = "eu"
#instance = "3f0ac524-5ae1-4bfd-b86d-53afc953e7e6"
#credentials = "$GOOGLE_SECOPS_CREDENTIALS"
#data_access_scope = "global-scope"
#deletion = "archive"
