[package]
name = "xtask"
# The repository's tooling, run with `cargo xtask` (.cargo/config.toml); never
# published, so it keeps no version of the engine's.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The repository's Rust tooling: cargo xtask check-layers, compare, golden and bench, and the codegen command to come"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
opentide-compare.workspace = true
# The object models' oracle comparisons (`corpus faults --engine rust`,
# `schema diff`), the rules' platform blocks included (UC-1.4).
opentide-schema = { workspace = true }
# `registry diff` (UC-2.1, #816) and the `load` benchmark.
opentide-workspace.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
wait4.workspace = true
regex.workspace = true
# xtask golden (src/golden/): only the tooling uses these, at the versions
# Cargo.lock already holds for the engine's dev-dependencies.
glob = "0.3"
similar = "2.7"
tempfile = "3"
# xtask vocab (src/vocab/) also reads opentide-schema's vocabularies.
indexmap = "2"

[target.'cfg(unix)'.dependencies]
# The pseudo-terminals of human mode and killing a case's process group.
rustix = { version = "1.1", features = ["fs", "process", "pty", "termios"] }

[dev-dependencies]
# tests/sysdig_engines.rs: the language server's Sysdig findings against the
# model's, on the model's oracle cases.
opentide-tide = { workspace = true }
trycmd.workspace = true
strsim.workspace = true
