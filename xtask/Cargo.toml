[package]
name = "xtask"
# The repository's tooling, run with `cargo xtask` (.cargo/config.toml); never
# published, so it keeps no version of the engine's.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The repository's Rust tooling: cargo xtask check-layers, codegen, corpus, bench and the rest (xtask/AGENTS.md)"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# Workspace paths without Windows' verbatim prefix (`\\?\`): a path joined
# with `/` does not resolve under it.
dunce = "1"
opentide-compare.workspace = true
# `cargo xtask cassettes` (UC-4.1, #831): the cassettes.
opentide-cassette.workspace = true
# `codegen` (the generated artifacts) and the corpus generator.
opentide-schema = { workspace = true }
# `lsp parity` and the `load` benchmark.
opentide-workspace.workspace = true
# `codegen`: the diagnostics reference (`opentide_cli::explain`).
opentide-cli.workspace = true
# `lsp parity` (UC-2.6): the language server in this process, and the
# engine's own analysis it adds to validate's findings.
opentide-lsp.workspace = true
opentide-analysis.workspace = true
opentide-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
wait4.workspace = true
regex.workspace = true
# At the versions Cargo.lock already holds for the engine's dev-dependencies.
glob = "0.3"
# `stubs --check`: the drift shown as a diff.
similar = "2.7"
tempfile = "3"
# xtask vocab (src/vocab/) also reads opentide-schema's vocabularies.
indexmap = { version = "2", features = ["serde"] }
# xtask stubs (UC-1.9, #815): the stubs of opentide._native.models, read from
# the introspection data PyO3 compiles into the extension (`maturin
# generate-stubs` uses the same crate). Its version is PyO3's.
pyo3-introspection = "0.30.1"
# xtask vocab malapi (src/vocab/malapi/): malapi.io's pages, parsed with
# html5ever (the parser scraper wraps) into markup5ever_rcdom's tree. Not
# scraper itself: its selectors and cssparser are MPL-2.0, which deny.toml's
# licence policy leaves to a maintainer's decision.
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"

[dev-dependencies]
trycmd.workspace = true
