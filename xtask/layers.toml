# The crate layer table: plan §4 (docs/internal/unified-core.md, "Crates"), as
# `cargo xtask check-layers` enforces it. This file is the one place the table
# is written down; AGENTS.md and the crates' guides cite it.
#
# Layers go from the bottom up, and each layer's tiers from the bottom up. A
# crate may depend only on a crate of a lower layer, or of a lower tier of its
# own layer: never on one of its own tier, nor on one above it. Normal, build
# and dev dependencies all count, on every target. Every workspace member is
# placed exactly once, and every crate placed here is a member, so a new crate
# fails the check until a change places it here and says why.
#
# The mapping of today's crates is a decision for the maintainer (UC-0.4, #802):
#
# - The plan names no tiers. Foundation crates depend on one another today (the
#   query engines on core, syntax and highlight; ES|QL and EQL on Lucene), so
#   foundation has four tiers read off `cargo metadata`, and a fifth, from the
#   plan's row order, for opentide-schema (below); domain has two.
# - opentide-tide and opentide-analysis are Domain: the plan folds both into
#   opentide-workspace (UC-2.x), and opentide-analysis depends on opentide-tide.
# - Bindings sit above the facade, not at the bottom where the plan's table
#   lists them: they wrap the facade (D-5), so they depend on everything below
#   it. Today they depend on opentide-analysis and opentide-lsp; that each
#   depends on the facade alone is the facade's rule (UC-5.1, #836).
# - xtask is Tooling, the top layer: it may read any crate, and no crate may
#   depend on it.
# - analysis/ is the package `opentide-native` (bindings/python in the plan).
# - opentide-compare (UC-0.7, #805) is foundation tier 0: the differential
#   comparator depends on no workspace crate, and both xtask (`compare`,
#   `golden check --engine compare`) and opentide-native (the CLI's
#   `OPENTIDE_ENGINE=compare`) use it. It is not in the plan's table: it
#   serves the migration and goes when compare mode does (UC-6.2, #841).
# - opentide-schema (UC-1.1, #807) is the top foundation tier: the plan's
#   table puts it in the row above core, syntax, highlight and the query
#   crates, so it may build on any of them (spans, UC-1.2) and none of them
#   may depend on the model; every domain crate may.
# - opentide-cli (UC-3.3, #825) is an application, the host the plan and
#   ADR 0003 make it: the command line, which owns the terminal, the process
#   and the filesystem. It is the application tier above opentide-lsp
#   (UC-3.6b, #947, decided on #828): `opentide lsp start` hosts the language
#   server, a library the command line serves on stdio, as the plan and
#   ADR 0003 describe it; the server never reaches back into the command
#   line. The bindings (`main(argv)` from Python and npm, ADR 0003) sit above
#   both.
# - opentide-schema-derive (UC-1.2, #808) is foundation tier 0: the
#   `#[derive(FromNode)]` proc-macro opentide-schema uses depends on no
#   workspace crate (syn, quote), and its expansion names opentide-schema's
#   paths, which only opentide-schema and the crates above it use.
# - opentide-workspace (UC-2.1, #816) is domain tier 0, beside opentide-tide:
#   the plan's domain crate that loads a workspace builds on opentide-schema
#   (the node tree, the configuration) and on no other domain crate. The
#   language server (UC-2.6, #821) and the command line come to it from above;
#   opentide-analysis and opentide-tide fold into it later (plan §4).
# - opentide-compile (UC-3.1, #823) is domain tier 1, beside
#   opentide-analysis: the plan's domain crate that compiles request bodies and
#   the deploy plan reads the workspace opentide-workspace loads.

[[layer]]
name = "foundation"
tiers = [
    ["opentide-core", "opentide-compare", "opentide-schema-derive"],
    ["opentide-syntax", "opentide-highlight", "opentide-ecs"],
    ["opentide-kql", "opentide-spl", "opentide-kuery", "opentide-lucene", "opentide-falco", "opentide-cql"],
    ["opentide-esql", "opentide-eql"],
    ["opentide-schema"],
]

[[layer]]
name = "domain"
tiers = [
    ["opentide-tide", "opentide-workspace"],
    ["opentide-analysis", "opentide-compile"],
]

[[layer]]
name = "application"
tiers = [
    ["opentide-lsp"],
    ["opentide-cli"],
]

# The `opentide` facade crate: UC-5.1 (#836) places it here.
[[layer]]
name = "facade"
tiers = []

[[layer]]
name = "bindings"
tiers = [
    ["opentide-native", "opentide-wasm"],
]

[[layer]]
name = "tooling"
tiers = [
    ["xtask"],
]
