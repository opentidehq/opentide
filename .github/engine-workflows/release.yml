name: Release

# A release is either a pushed vX.Y.Z tag, or "Run workflow" on main, which
# releases the version in Cargo.toml and creates its tag with the GitHub
# Release. "Run workflow" with publish_only resumes crates.io publishing for a
# version whose GitHub Release already exists: it builds and releases nothing,
# checks the published assets as a release does, and publishes only the crates
# crates.io does not have yet.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Resume crates.io publishing for the already-released version in Cargo.toml"
        type: boolean
        default: false

# Read-only unless a job asks for more: only release writes the repository,
# and only attest, crates and npm hold an OIDC token.
permissions:
  contents: read

jobs:
  # The tag, the crate pins, and CHANGELOG.md agree, and every crate builds from
  # its packaged sources, before anything is built or published.
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            # A re-run of the tag push would rebuild assets that do not
            # reproduce byte for byte and upload them over the published ones.
            python3 scripts/engine/release.py unpublished "${tag}"
          else
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Run the release from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            tag="v$(python3 scripts/engine/release.py version)"
            if [ "${PUBLISH_ONLY}" = "true" ]; then
              if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                echo "::error::publish_only resumes a released version, and ${tag} has no GitHub Release"
                exit 1
              fi
              # The crates are published from this commit: their sources must be the tag's.
              git fetch --quiet --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
              if ! git diff --quiet "${tag}" HEAD -- crates data/catalogs grammars highlights Cargo.toml Cargo.lock LICENSE NOTICE; then
                echo "::error::the crate sources changed since ${tag}; publish_only would publish different crates"
                exit 1
              fi
            elif gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::${tag} is already released; bump the version first (scripts/engine/release.py bump)"
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/engine/release.py check "${{ steps.tag.outputs.tag }}"
      - run: python3 scripts/engine/release.py vendor
      - run: cargo package --workspace --exclude opentide-native --allow-dirty
      - name: license scan (no oracle references)
        run: bash scripts/engine/license-scan.sh target/package/*.crate

  native:
    needs: verify
    if: ${{ !inputs.publish_only }}
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # GitHub retired the Intel macOS runners; cross-compile on Apple silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), then the target the job builds:
      # rustup ignores `--target` on an install with no name, and `rustup target
      # add` with none adds to the pinned release. bash on every image, so that
      # a failed install stops the step (pwsh, Windows's default, runs on).
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
      - name: musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release -p opentide-lsp --target ${{ matrix.target }}
      - name: size budget
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -name 'opentide-lsp*' ! -name '*.d' ! -name '*.pdb' | head -n 1)
          test -n "$bin"
          size=$(wc -c < "$bin")
          echo "$bin is $size bytes"
          test "$size" -lt 31457280
      # Every target's binary is named opentide-lsp: name each by its target, or
      # the release job's merged download keeps only one.
      - name: rename
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/opentide-lsp${ext}" "dist/opentide-lsp-${TAG}-${{ matrix.target }}${ext}"
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: opentide-lsp-${{ matrix.target }}
          path: dist/*

  wasm:
    needs: verify
    if: ${{ !inputs.publish_only }}
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), then the targets the job builds
      # (`rustup target add`, which adds to the pinned release).
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.128
      - run: bash scripts/engine/build-wasm.sh
      - name: package
        run: |
          set -euo pipefail
          VERSION="${TAG}"
          mkdir -p dist
          cp target/wasm32-wasip1/release/opentide-lsp.wasm "dist/opentide-lsp-wasm32-wasip1.wasm"
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/opentide_wasm.wasm
          cp LICENSE NOTICE pkg/
          cp -r licenses pkg/licenses
          (cd pkg && zip -r "../dist/opentide-wasm-web-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: opentide-wasm
          path: dist/*

  highlights:
    needs: verify
    if: ${{ !inputs.publish_only }}
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - run: cargo run -p opentide-lsp -- generate-highlights
      - name: zip
        run: |
          VERSION="${TAG}"
          mkdir -p dist
          cp highlights/spec.toml highlights/generated/* highlights/queries/kql/highlights.scm highlights/queries/spl/highlights.scm highlights/queries/tide/highlights.scm dist/ || true
          (cd highlights && zip -r "../highlights-${VERSION}.zip" spec.toml generated queries)
          zip -j "highlights-${VERSION}.zip" LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: highlights-zip
          path: highlights-v*.zip

  # Every asset, with the licences and SHA256SUMS. No OIDC token here: crates.io
  # and npm trust release.yml as a whole, so a token minted in any of its jobs
  # can publish, and cargo-about builds third-party crates (their build.rs run).
  assets:
    needs: [verify, native, wasm, highlights]
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: license scan (no oracle references)
        run: bash scripts/engine/license-scan.sh dist
      # The binaries embed third-party code and data: ship the notices with
      # them. NOTICE covers ECS, Lucene, dk.brics, and the wasi-libc the WASM
      # builds link (texts in licenses/wasi-libc, shipped as WASI-LIBC-LICENSES.txt); cargo-about lists every Rust
      # crate in the workspace, the browser build's included, and fails on a
      # licence about.toml does not accept.
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - name: licences and notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about --version 0.8.4
          cargo about generate --workspace about.hbs -o dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE
          for f in licenses/wasi-libc/*; do
            printf '==> %s <==\n\n' "$f"; cat "$f"; printf '\n'
          done > dist/WASI-LIBC-LICENSES.txt
      - name: every asset is there
        run: |
          set -euo pipefail
          test -n "$(find dist -name 'highlights-*.zip' -print -quit)"
          test -s dist/THIRD-PARTY-LICENSES.html && test -s dist/NOTICE && test -s dist/WASI-LIBC-LICENSES.txt
      # Last, once dist holds every asset (#196): a consumer runs
      # `sha256sum -c SHA256SUMS` on what it downloads.
      - name: SHA256SUMS
        run: python3 scripts/engine/release.py sums dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

  # Sigstore-signed SLSA provenance for every asset, SHA256SUMS included (#196).
  # The one job besides crates and npm that holds an OIDC token: it downloads
  # the assets and runs the attest action, nothing else.
  attest:
    needs: assets
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    needs: [verify, attest]
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: attach GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/engine/release.py notes "${TAG}" > notes.md
          # From "Run workflow", the tag does not exist yet: the release creates it
          # on the commit this run built.
          if ! gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "opentide-lsp ${TAG}" \
            --notes-file notes.md; then
            # The release exists: created by hand, with notes only. Never upload
            # over assets it already has (a re-run of this job): consumers
            # pinned their digests, and this run's differ. Without --clobber, an
            # asset that appeared meanwhile fails the upload too.
            python3 scripts/engine/release.py unpublished "${TAG}"
            gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}"
          fi

  # What a consumer downloads checks out: the sums, and each asset's
  # attestation (#196). It runs after the release, and on its own for
  # publish_only, which resumes a release whose check may have failed: crates
  # and npm publish only once it passed.
  verify-assets:
    needs: [verify, release]
    if: ${{ always() && needs.verify.result == 'success' && (needs.release.result == 'success' || (inputs.publish_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # `gh attestation verify` reads the repository's attestations with this
    # job's token.
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir published
          # sha256sum checks the names SHA256SUMS lists; verify-sums also fails on
          # an asset it leaves out.
          (cd published && sha256sum --check --strict SHA256SUMS)
          python3 scripts/engine/release.py verify-sums published
          # --repo alone accepts an attestation any workflow of the repository
          # signed, on any branch: each asset's must come from release.yml run
          # from main or from this tag.
          repo_re="${GITHUB_REPOSITORY//./\\.}"
          tag_re="${TAG//./\\.}"
          identity="^https://github\\.com/${repo_re}/\\.github/workflows/release\\.yml@refs/(heads/main|tags/${tag_re})\$"
          for asset in published/*; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" --cert-identity-regex "${identity}"
          done

  # crates.io is permanent: publish only once the GitHub Release exists and its
  # assets verified (verify-assets). The crates go up in dependency order, each
  # pinned to this version; a crate already published is skipped, so a re-run
  # resumes. `cargo publish --no-verify` builds nothing here, where the OIDC
  # token and the registry tokens are: a build runs every dependency's build
  # script. `verify` built each package, without them. crates.io rate-limits
  # new crates (one every ten minutes after the first few), which only the
  # first release meets.
  #
  # Trusted publishing: once every crate exists, `release.py trust` registers
  # this workflow as a trusted publisher for each (with CARGO_REGISTRY_TOKEN,
  # which needs the trusted-publishing scope), and later releases log in with
  # the workflow's OIDC identity instead of the token. The token then only
  # publishes a crate that does not exist yet, which crates.io requires.
  crates:
    needs: [verify, release, verify-assets]
    # After the release, or on its own for publish_only (the release job is
    # skipped then); either way only once the published assets verified.
    if: ${{ always() && needs.verify.result == 'success' && needs.verify-assets.result == 'success' && (needs.release.result == 'success' || (inputs.publish_only && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/engine/release.py vendor
      # Fails until trusted publishing is registered; the token covers that.
      - name: crates.io login (trusted publishing)
        id: trusted
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: publish to crates.io
        env:
          TRUSTED_TOKEN: ${{ steps.trusted.outputs.token }}
          STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Trusted publishing cannot create a crate: release.py publishes a crate
          # crates.io does not have yet with the stored token.
          NEW_CRATE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TRUSTED_TOKEN}" ]; then
            echo "Publishing with trusted publishing"
            export CARGO_REGISTRY_TOKEN="${TRUSTED_TOKEN}"
          elif [ -n "${STORED_TOKEN}" ]; then
            echo "Publishing with CARGO_REGISTRY_TOKEN"
            export CARGO_REGISTRY_TOKEN="${STORED_TOKEN}"
          else
            echo "::error::No trusted publishing and no CARGO_REGISTRY_TOKEN; the crates were not published"
            exit 1
          fi
          python3 scripts/engine/release.py publish
      - name: register trusted publishing
        env:
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/engine/release.py trust release.yml

  # npm (#167): @opentide/lsp-client and @opentide/lsp-worker at the tag's
  # version, with npm trusted publishing (the workflow's OIDC identity, no
  # token). It runs only once the repository variable NPM_PUBLISH is "true",
  # set after the two packages are registered with this workflow as their
  # trusted publisher; until then it is skipped. A version already on npm is
  # skipped, so a re-run resumes.
  npm:
    needs: [verify, release, verify-assets]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: build and check the packs
        run: |
          for p in lsp-client lsp-worker; do (cd "packages/$p" && npm ci); done
          node scripts/engine/check-npm-packs.mjs
      - name: publish
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for p in lsp-client lsp-worker; do
            name="@opentide/$p"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              continue
            fi
            (cd "packages/$p" && npm version "$VERSION" --no-git-tag-version --allow-same-version && npm publish --provenance --access public)
          done
