name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release -p opentide-lsp --target ${{ matrix.target }}
      - name: size budget
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -name 'opentide-lsp*' ! -name '*.d' ! -name '*.pdb' | head -n 1)
          test -n "$bin"
          size=$(wc -c < "$bin")
          echo "$bin is $size bytes"
          test "$size" -lt 31457280
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: opentide-lsp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/opentide-lsp*

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.128
      - run: bash scripts/build-wasm.sh
      - name: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp target/wasm32-wasip1/release/opentide-lsp.wasm "dist/opentide-lsp-wasm32-wasip1.wasm"
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/opentide_wasm.wasm
          cp LICENSE NOTICE pkg/
          cp -r licenses pkg/licenses
          (cd pkg && zip -r "../dist/opentide-wasm-web-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: opentide-wasm
          path: dist/*

  highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p opentide-lsp -- generate-highlights
      - name: zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp highlights/spec.toml highlights/generated/* highlights/queries/kql/highlights.scm highlights/queries/spl/highlights.scm highlights/queries/tide/highlights.scm dist/ || true
          (cd highlights && zip -r "../highlights-${VERSION}.zip" spec.toml generated queries)
          zip -j "highlights-${VERSION}.zip" LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: highlights-zip
          path: highlights-v*.zip

  # Wheel is always attached to the GitHub Release. PyPI upload runs when
  # PYPI_API_TOKEN is set. abi3-py310; 3.14 free-threaded stays best-effort.
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.7,<2"
      - run: maturin build --release -m crates/opentide-lsp/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: opentide-lsp-wheel
          path: target/wheels/*.whl
      - name: publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${MATURIN_PYPI_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is unset; the wheel is attached to the GitHub Release only"
            exit 0
          fi
          maturin publish -m crates/opentide-lsp/Cargo.toml

  release:
    needs: [native, wasm, highlights, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: license scan (no oracle references)
        run: bash scripts/license-scan.sh dist
      # The binaries embed third-party code and data: ship the notices with
      # them. NOTICE covers ECS, Lucene, dk.brics, and the wasi-libc the WASM
      # builds link (texts in licenses/wasi-libc, shipped as WASI-LIBC-LICENSES.txt); cargo-about lists every Rust
      # crate in the workspace, the browser build's included, and fails on a
      # licence about.toml does not accept.
      - uses: dtolnay/rust-toolchain@stable
      - name: licences and notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about --version 0.8.4
          cargo about generate --workspace about.hbs -o dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE
          for f in licenses/wasi-libc/*; do
            printf '==> %s <==\n\n' "$f"; cat "$f"; printf '\n'
          done > dist/WASI-LIBC-LICENSES.txt
      - name: attach GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$(find dist -name 'highlights-*.zip' -print -quit)"
          test -s dist/THIRD-PARTY-LICENSES.html && test -s dist/NOTICE && test -s dist/WASI-LIBC-LICENSES.txt
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "opentide language server ${GITHUB_REF_NAME}. Tags are independent of the opentide package. npm @opentide/lsp-client is tracked separately." \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
