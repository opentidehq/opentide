name: opentide canary

# The bundled Tide catalogs come from opentide's own generator
# (scripts/sync_opentide_schemas.py runs opentide.generation.lsp_catalog).
# This job runs it from opentide's development branch, so a model change
# there (a field, a revision, a vocabulary pin) shows up here before it is
# released, and the test suite runs against the catalogs it would generate.
#
# Drift fails the scheduled and manual runs, so a failed run notifies; on a
# pull request it is a warning, since opentide may be ahead on purpose. The
# summary says what would change; `python3 scripts/sync_opentide_schemas.py`
# with that opentide applies it. A script that errors, or a test that fails
# against the regenerated catalogs, fails every run.
on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths:
      - "catalogs/tide/**"
      - "crates/opentide-highlight/**"
      - "crates/opentide-tide/**"
      - "scripts/sync_opentide_schemas.py"
      - "scripts/pydantic_object_issues.py"
      - ".github/workflows/opentide-canary.yml"
  workflow_dispatch:
    inputs:
      opentide_ref:
        description: opentide branch, tag or commit
        default: development

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: opentidehq/opentide
          ref: ${{ inputs.opentide_ref || 'development' }}
          path: opentide-src
          # setuptools-scm names the version from the tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install opentide from its development branch
        # Builds opentide and the engine revision it pins.
        run: |
          uv sync --project opentide-src
          echo "$PWD/opentide-src/.venv/bin" >> "$GITHUB_PATH"
          opentide-src/.venv/bin/python -c "import opentide; print('opentide', opentide.__version__)"
      - name: Do the bundled catalogs match opentide development?
        id: drift
        # Exit 1 is drift, reported below; any other failure is the script's.
        run: |
          set +e
          python scripts/sync_opentide_schemas.py --check 2> drift.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then
            cat drift.txt
            exit "$code"
          fi
      - name: Regenerate them, and test against them
        run: |
          python scripts/sync_opentide_schemas.py
          git diff --stat
          cargo test --workspace
      - name: Summary
        if: always()
        run: |
          {
            echo "### opentide canary"
            echo
            echo "opentide: \`$(python -c 'import opentide; print(opentide.__version__)')\`"
            echo
            if [ "${{ steps.drift.outputs.code }}" = "0" ]; then
              echo "The bundled catalogs match opentide's models."
            elif [ "${{ steps.drift.outputs.code }}" != "1" ]; then
              echo "The check did not run to the end:"
              echo
              echo '```'
              cat drift.txt
              echo '```'
            else
              echo "The bundled catalogs differ from opentide's models:"
              echo
              echo '```'
              cat drift.txt
              echo '```'
              echo
              echo "Regenerate with \`python3 scripts/sync_opentide_schemas.py\` using that opentide."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Drift fails a scheduled or manual run
        if: steps.drift.outputs.code == '1'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::The bundled catalogs differ from opentide development (see the summary)"
          else
            echo "::error::The bundled catalogs differ from opentide development (see the summary)"
            exit 1
          fi
