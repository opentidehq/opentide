name: CI

on:
  push:
    branches: [main, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: io-free engines
        run: bash scripts/check-io-free.sh
      - name: names
        run: bash scripts/check-names.sh
      - name: test
        run: cargo test --workspace
      - name: generate-highlights --check
        run: cargo run -p opentide-lsp -- generate-highlights --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "maturin>=1.7,<2"
      - run: maturin build

  grammars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix /tmp/ts-cli tree-sitter-cli@0.25.10
      - run: bash scripts/check-grammars.sh

  oracle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-oracle.sh
