name: Oracle

# CI-only differential oracles (scripts/oracles/README.md). The engine is
# compared with Microsoft Kusto.Language, Splunk's search parser, Falco's own
# `falco --validate`, libyara and YARA-X (yara-python, the yara-x wheel), and the Elastic and Lucene parsers (@elastic/esql, EqlBase.g4, Kibana's kuery
# grammar, Lucene's QueryParser). A
# disagreement not listed in testdata/oracles/exceptions.toml is a red build,
# and so is a listed one that is gone. The references never ship; release.yml
# runs scripts/license-scan.sh on every artifact.
on:
  push:
    branches: [main, development]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "crates/**"
      - "grammars/**"
      - "catalogs/kql/**"
      - "catalogs/spl/**"
      - "catalogs/esql/**"
      - "catalogs/eql/**"
      - "catalogs/carbon_black/**"
      - "catalogs/falco/**"
      - "catalogs/yara/**"
      - "testdata/**"
      - "scripts/oracles/**"
      - "scripts/ci-oracle.sh"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:
  schedule:
    # The Carbon Black Cloud tenant is checked weekly, not on every push.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  OPENTIDE_ORACLE_REQUIRED: "1"

jobs:
  kql:
    name: Kusto.Language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Every oracle builds the same debug opentide-lsp: one cache, saved by
      # this job on a branch push (not a tag), read by the others.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bash scripts/ci-oracle.sh kql

  spl:
    name: Splunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Not a service container: splunkd takes minutes to start and the runner's
      # readiness check needs a health status, so start.sh runs it and
      # oracle.py waits. Starting it accepts the Splunk General Terms for this
      # throwaway instance, bound to 127.0.0.1, which only answers search/parser.
      - name: Splunk oracle
        run: |
          eval "$(bash scripts/oracles/splunk/start.sh)"
          bash scripts/ci-oracle.sh spl

  falco:
    # Every case of testdata/oracles/falco/cases.yaml and every Falco default
    # rule condition (with its broken twin) through the real Falco, one
    # `falco --validate` per case, beside the engine's verdict. The pins are
    # recorded in scripts/oracles/README.md; bump them together.
    name: Falco ${{ matrix.falco }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        falco: ["0.45.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: falcosecurity/rules
          ref: e7b066bfbc8d81226ca5fa3e95ffd4dee38a2428
          path: falco-rules
          sparse-checkout: rules
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: docker pull falcosecurity/falco:${{ matrix.falco }}
      - name: Falco oracle
        run: >
          python3 scripts/oracles/falco/oracle.py
          --rules falco-rules
          --docker falcosecurity/falco:${{ matrix.falco }}
          --report falco-oracle-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falco-oracle-report-${{ matrix.falco }}
          path: falco-oracle-report.json

  yara:
    # Every recorded verdict of testdata/conformance/yara/cases.json, and every
    # YARA file of the repository through the engine, libyara 4.5.4
    # (yara-python) and YARA-X 1.23.0 (the yara-x wheel). The pins are in
    # scripts/oracles/yara/oracle.py and scripts/oracles/README.md.
    name: libyara and YARA-X
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yara-python==4.5.4 yara-x==1.23.0
      - run: bash scripts/ci-oracle.sh --manifests-only
      - run: cargo build -p opentide-lsp
      - name: YARA oracle
        run: python3 scripts/oracles/yara/oracle.py --report yara-oracle-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yara-oracle-report
          path: yara-oracle-report.json

  elastic:
    name: Elastic and Lucene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Elastic's public rules (ELv2), read at CI time and never vendored.
      # Elasticsearch accepts every one, so they are queries the engine must
      # not reject. Same pin as the elastic-sweep job in ci.yml.
      - uses: actions/checkout@v4
        with:
          repository: elastic/detection-rules
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Elastic oracles
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: bash scripts/ci-oracle.sh esql eql kuery lucene

  elasticsearch:
    # The oldest and newest recorded release lines. probes.py fails when a
    # verdict in testdata/oracles/elasticsearch/expected.tsv no longer holds;
    # esql_catalog.py fails when a catalogs/esql `versions` list is wrong.
    name: Live Elasticsearch ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.19.23", "9.5.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start Elasticsearch
        shell: bash  # with pipefail, so a failed start fails the step
        run: bash scripts/oracles/elasticsearch/start.sh ${{ matrix.version }} | sed "s/^export //" >> "$GITHUB_ENV"
      - name: Probes
        run: python3 scripts/oracles/elasticsearch/probes.py
      - name: ES|QL catalog versions
        run: python3 scripts/oracles/elasticsearch/esql_catalog.py
      - name: Stop Elasticsearch
        if: always()
        run: docker rm -f opentide-es-oracle-9200

  # Carbon Black Cloud (#162): every Carbon Black query through a tenant's
  # search_validation. It needs a tenant: OPENTIDE_CBC_URL, OPENTIDE_CBC_ORG_KEY
  # and OPENTIDE_CBC_TOKEN (`<api secret>/<api id>`, org.search.events READ) as
  # secrets. Weekly and on demand only, never on a pull request, so a fork
  # never sees them; without them the job says so and passes.
  carbon_black:
    name: Carbon Black Cloud
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENTIDE_ORACLE_REQUIRED: "0"
      OPENTIDE_CBC_URL: ${{ secrets.OPENTIDE_CBC_URL }}
      OPENTIDE_CBC_ORG_KEY: ${{ secrets.OPENTIDE_CBC_ORG_KEY }}
      OPENTIDE_CBC_TOKEN: ${{ secrets.OPENTIDE_CBC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: bash scripts/ci-oracle.sh carbon_black
