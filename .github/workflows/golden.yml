name: Golden

# The goldens of the frozen Python CLI, the oracle every Rust port is checked
# against (tests/golden/README.md, plan §5.1, UC-0.5). Both jobs install the
# oracle from PyPI by its wheel's SHA-256 (tests/golden/ORACLE) and run every
# case of tests/golden/cases.toml through it:
#
# - check: `cargo xtask golden check --engine python`, the recordings against
#   a fresh run, plus COVERAGE.md and no missing or orphaned recording.
# - determinism: `cargo xtask golden lock` must reproduce the committed
#   oracle-requirements.txt; then `cargo xtask golden record
#   --check-determinism` runs every case twice and fails unless both runs
#   agree byte for byte, and the recordings it wrote must be the committed ones.
#
# `cargo xtask golden check --engine compare` (UC-0.7) runs in ci.yml's
# `golden-compare` job instead: it checks this repository's code, so it runs
# on every pull request.
#
# When each job runs on a pull request (tests/test_ci/test_golden_workflow.py).
# The pull_request trigger has no path filter, so that the checks can be
# required on integration/unified-core; the `changes` job filters by path
# instead, and a job skipped by its `if` reports success to branch protection:
#
# - check (about 20 minutes) runs on a pull request with the `full-ci` label
#   or one that changes GOLDEN_PATHS, and when `changes` did not succeed: the
#   filter fails open. It ran on every pull request into
#   integration/unified-core (#803) while the Python implementation in this
#   repository could change the oracle; since UC-6.2 (#841) the oracle is a
#   frozen PyPI release, so a pull request that touches none of its inputs
#   cannot change its result. It still runs on every push, schedule and Run
#   workflow, and a skipped run reports success, so integration/unified-core
#   still requires it by name (the maintainer's decision, 2026-11-13).
# - determinism (recording twice, about 26 minutes) is in the full set
#   (ci.yml's header): nightly, every push to integration/unified-core and
#   development, Run workflow, and a pull request with the `full-ci` label.
#   It is not a required check.
#
# Nothing here publishes or writes to the repository.

on:
  push:
    # integration/unified-core collects the unified-core work (epic #790) before development.
    branches: [development, integration/unified-core, "train/catchup-*"]
  pull_request:
    # All base branches and all paths: the `changes` job below holds the path
    # filter, so that integration/unified-core can require the checks.
  schedule:
    # Nightly, so a change outside the repository (PyPI, the runner image)
    # shows, with the determinism run. GitHub runs a schedule on the default
    # branch only.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  # A pull request's new push cancels its stale run; every other run (a push
  # to development, integration/unified-core or main, the nightly, Run
  # workflow) has a group of its own, its run id, so none cancels another and
  # each push to a base branch gets a complete run (tests/test_ci/test_concurrency.py).
  group: golden-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the pull request changes a path the goldens depend on. Bash
  # patterns, one a line; `*` matches `/` too. Anything but a pull request,
  # and a checkout that is not the pull request's merge commit, counts as a
  # change.
  changes:
    name: Golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      golden: ${{ steps.paths.outputs.golden }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch's tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changes to the goldens' inputs
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          GOLDEN_PATHS: |
            tests/golden/*
            tests/fixtures/tide_corpus/*
            scripts/golden/*
            crates/opentide-cli/tests/render/*
            tests/corpora/*
            xtask/src/golden/*
            xtask/src/corpus/*
            xtask/src/compare.rs
            xtask/src/parallel.rs
            crates/opentide-compare/*
            .github/workflows/golden.yml
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "golden=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          golden=false
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            while IFS= read -r pattern; do
              # Unquoted on the right: a pattern, not a string.
              # shellcheck disable=SC2053
              if [[ -n "${pattern}" && "${file}" == ${pattern} ]]; then
                echo "Golden input changed: ${file}"
                golden=true
              fi
            done <<<"${GOLDEN_PATHS}"
          done <<<"${changed}"
          echo "golden=${golden}" >> "$GITHUB_OUTPUT"

  check:
    name: Golden check (python)
    needs: changes
    # The full set, or a pull request that changes a golden input.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.golden == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The uv that wrote oracle-requirements.txt (`golden lock` must reproduce it).
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: tests/golden/oracle-requirements.txt

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          workspaces: . -> target

      - name: Check the goldens against the oracle
        run: cargo xtask golden check --engine python

      # UC-3.4 (#826): what the oracle's renderers print for the inputs in
      # crates/opentide-cli/tests/render/, which tests/render.rs compares the
      # Rust renderers with. A snapshot updated from the Rust side would pass
      # there; here it must still be the oracle's.
      - name: The renderer snapshots are the oracle's
        run: |
          set -euo pipefail
          python="$(echo target/golden/oracle-*/bin/python)"
          work="$(mktemp -d)"
          cargo xtask corpus faults --out "${work}/fault"
          mkdir "${work}/scratch"
          HOME="${work}" "${python}" -I scripts/golden/render_oracle.py \
            --fault "${work}/fault" --scratch "${work}/scratch" \
            --out crates/opentide-cli/tests/render --check

  determinism:
    name: Golden determinism
    # The full set: recording twice takes about 26 minutes.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The uv that wrote oracle-requirements.txt (`golden lock` must reproduce it).
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: tests/golden/oracle-requirements.txt

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          workspaces: . -> target

      - name: The oracle's lock file is the one golden lock writes
        run: |
          set -euo pipefail
          cargo xtask golden lock
          if ! git diff --exit-code -- tests/golden/oracle-requirements.txt; then
            echo "::error::cargo xtask golden lock changed tests/golden/oracle-requirements.txt: run it and commit the result"
            exit 1
          fi

      - name: Record every case twice
        run: cargo xtask golden record --check-determinism

      - name: The recordings are the committed ones
        run: |
          set -euo pipefail
          git add --intent-to-add tests/golden
          if ! git diff --quiet -- tests/golden; then
            git diff --stat -- tests/golden
            echo "::error::recording again changed tests/golden: run cargo xtask golden record and review the diff"
            exit 1
          fi
