name: Golden

# The goldens of the frozen Python CLI, the oracle every Rust port is checked
# against (tests/golden/README.md, plan §5.1, UC-0.5). `check` installs the
# oracle from PyPI by its wheel's SHA-256 (tests/golden/ORACLE) and runs every
# case of tests/golden/cases.toml through it: `cargo xtask golden check
# --engine python`, the recordings against a fresh run, plus COVERAGE.md and
# no missing or orphaned recording, and the renderers' oracle snapshots.
#
# `cargo xtask golden check --engine compare` (UC-0.7) runs in ci.yml's
# `golden-compare` job instead: it checks this repository's code, so it runs
# on every pull request.
#
# When it runs (tests/test_ci/test_golden_workflow.py). The oracle is a frozen,
# pinned PyPI release (UC-6.2, #841), so only a change to what it is fed, how
# it is run or what it is compared with can change the result: GOLDEN_PATHS
# below (the recordings, ORACLE and oracle-requirements.txt under
# tests/golden/, the inputs the cases read, and the harness). It runs on a
# pull request that changes one of them, when the `changes` filter did not
# succeed (it fails open), weekly, and on Run workflow; not on a push, the
# nightly or a `full-ci` pull request (the maintainer's decision, 2026-11-14:
# about 16 minutes of the full set's 45 for a result that cannot change). The
# pull_request trigger has no path filter, so that integration/unified-core
# can require `Golden check (python)` by name: a job its `if` skips reports
# success.
#
# `cargo xtask golden record --check-determinism` (every case recorded twice,
# about 26 minutes) is not run here: whoever re-records the goldens runs it,
# with `golden lock`, before opening the pull request (tests/golden/README.md,
# the golden skill), whose recordings this check then holds.
#
# Nothing here publishes or writes to the repository.

on:
  pull_request:
    # All base branches and all paths: the `changes` job below holds the path
    # filter, so that integration/unified-core can require the check.
  schedule:
    # Weekly, so a change outside the repository (PyPI, the runner image)
    # shows. GitHub runs a schedule on the default branch only.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  # A pull request's new push cancels its stale run; every other run (the
  # weekly schedule, Run workflow) has a group of its own, its run id, so none
  # cancels another (tests/test_ci/test_concurrency.py).
  group: golden-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the pull request changes a path the goldens depend on. Bash
  # patterns, one a line; `*` matches `/` too. Anything but a pull request,
  # and a checkout that is not the pull request's merge commit, counts as a
  # change.
  changes:
    name: Golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      golden: ${{ steps.paths.outputs.golden }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch's tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changes to the goldens' inputs
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          GOLDEN_PATHS: |
            tests/golden/*
            tests/fixtures/tide_corpus/*
            scripts/golden/*
            crates/opentide-cli/tests/render/*
            tests/corpora/*
            xtask/src/golden/*
            xtask/src/corpus/*
            xtask/src/compare.rs
            xtask/src/parallel.rs
            crates/opentide-compare/*
            .github/workflows/golden.yml
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "golden=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          golden=false
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            while IFS= read -r pattern; do
              # Unquoted on the right: a pattern, not a string.
              # shellcheck disable=SC2053
              if [[ -n "${pattern}" && "${file}" == ${pattern} ]]; then
                echo "Golden input changed: ${file}"
                golden=true
              fi
            done <<<"${GOLDEN_PATHS}"
          done <<<"${changed}"
          echo "golden=${golden}" >> "$GITHUB_OUTPUT"

  check:
    name: Golden check (python)
    needs: changes
    # A pull request that changes a golden input (or whose filter failed),
    # the weekly schedule and Run workflow.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.golden == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The uv that wrote oracle-requirements.txt (`golden lock` must reproduce it).
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: tests/golden/oracle-requirements.txt

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          workspaces: . -> target

      - name: Check the goldens against the oracle
        run: cargo xtask golden check --engine python

      # UC-3.4 (#826): what the oracle's renderers print for the inputs in
      # crates/opentide-cli/tests/render/, which tests/render.rs compares the
      # Rust renderers with. A snapshot updated from the Rust side would pass
      # there; here it must still be the oracle's.
      - name: The renderer snapshots are the oracle's
        run: |
          set -euo pipefail
          python="$(echo target/golden/oracle-*/bin/python)"
          work="$(mktemp -d)"
          cargo xtask corpus faults --out "${work}/fault"
          mkdir "${work}/scratch"
          HOME="${work}" "${python}" -I scripts/golden/render_oracle.py \
            --fault "${work}/fault" --scratch "${work}/scratch" \
            --out crates/opentide-cli/tests/render --check
