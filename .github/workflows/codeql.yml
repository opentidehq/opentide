# GitHub Actions workflow scanning only — Python CodeQL runs via Code Quality
# (Settings → Code security → Code Quality; dynamic "Code Quality" workflow).
# Do not add python here or it scans twice. See AGENTS.md.
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.28.6
        with:
          languages: actions
          queries: security-extended

      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.28.6
        with:
          category: /language:actions
