# CodeQL for python + GitHub Actions workflows. Restores /language:python in this
# workflow so PR code-scanning comparison matches the configuration registered on
# development (Code Quality dynamic scans alone do not satisfy that category).
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.28.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        if: matrix.language == 'python'
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: uv sync --group dev

      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.28.6
        with:
          category: /language:${{ matrix.language }}
