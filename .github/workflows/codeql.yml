# Advanced CodeQL — requires GitHub repo "default setup" to be disabled
# (Settings → Code security → CodeQL → Switch to advanced / Disable default).
# See: https://docs.github.com/en/code-security/code-scanning/troubleshooting-sarif-uploads/default-setup-enabled
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
    # All base branches — stacked PRs and feature bookmarks
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: astral-sh/setup-uv@v5
        if: matrix.language == 'python'
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: uv sync --group dev

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
