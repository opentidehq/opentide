# CodeQL for python + GitHub Actions workflows. Restores /language:python in this
# workflow so PR code-scanning comparison matches the configuration registered on
# development (Code Quality dynamic scans alone do not satisfy that category).
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.language == 'python'
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: uv sync --group dev

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
