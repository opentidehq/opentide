# GitHub Actions workflow scanning only — Python CodeQL runs via Code Quality
# (Settings → Code security → Code Quality; dynamic "CodeQL - Code Quality" workflow).
# Do not add python here or it scans twice. See AGENTS.md.
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
    # All base branches — stacked PRs and feature bookmarks
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:actions
