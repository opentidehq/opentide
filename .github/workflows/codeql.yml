# CodeQL for python + GitHub Actions workflows. Restores /language:python in this
# workflow so PR code-scanning comparison matches the configuration registered on
# development (Code Quality dynamic scans alone do not satisfy that category).
name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: matrix.language == 'python'
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: uv sync --group dev

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
