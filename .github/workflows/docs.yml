name: Docs

# Content-only checks in opentide. Build and deploy live in opentidehq/website (Fumadocs).
#
# In the full set (ci.yml's header): nightly, every push to development and
# integration/unified-core, Run workflow, and a pull request with the
# `full-ci` label. Not a required check.

on:
  push:
    branches: [development, integration/unified-core]
  pull_request:
  schedule:
    - cron: "53 1 * * *"
  workflow_dispatch:

concurrency:
  # A pull request's new push cancels its stale run; every other run (a push
  # to development, integration/unified-core or main, the nightly, Run
  # workflow) has a group of its own, its run id, so none cancels another and
  # each push to a base branch gets a complete run (tests/test_ci/test_concurrency.py).
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs structure
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Fumadocs-ready content
        run: scripts/validate-docs.sh
