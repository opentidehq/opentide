name: Engine release build

# Builds every asset of opentide's GitHub Release into one artifact,
# `release-assets`: the `opentide` and `opentide-lsp` binaries per target, their
# installer (publishing/installers/), the WASI module, the browser build
# (opentide-wasm-web-<v>.zip), the highlights zip, the licences and NOTICE, the
# CycloneDX SBOMs (scripts/engine/sbom.py), and SHA256SUMS last. It publishes,
# attests and uploads to no release: the caller does. Two callers:
#
# - publish.yml, the release train (UC-5.5), with the release's tag (`vX.Y.Z`
#   or `vX.Y.Z-rc.N`) and the wheel's version;
# - ci.yml in its full set, with no tag (dry-run): the workspace version's tag,
#   so the asset set a release would publish is proven before one does
#   (`release.py check-assets`: language-server's last release's names with the
#   version substituted, the `opentide` binaries, installer and SBOMs added,
#   the Windows binaries left out).
#
# No musl target: the maintainer decided against musl builds (docs/internal/
# publishing.md, "The release train"). No Windows target either: a downloaded
# Windows executable would need Authenticode signing, so Windows installs
# opentide from PyPI or npm (`opentide lsp start` is its language server);
# scripts/engine/release.py BINARY_TARGETS. The wheels and npm packages for
# Windows are build-packages.yml's.
#
# Only the dry run restores a Rust cache: a release builds from nothing. The
# dry run's is sccache, one family per runner for the binaries and one for the
# WebAssembly builds, saved by the nightly and pushes to development (the
# default branch, whose caches every branch reads) once a week; the small
# jobs (highlights, licences, SBOMs) build without one, so that the caches
# pull requests restore stay within the 10 GB GitHub keeps.
on:
  workflow_call:
    inputs:
      tag:
        description: "vX.Y.Z or vX.Y.Z-rc.N; empty for the dry run (the workspace version)"
        type: string
        default: ""
      wheel-version:
        description: "The PyPI wheel's version, for its SBOM (0.24.0, 0.24.0rc1); empty: the workspace's"
        type: string
        default: ""
      dry-run:
        description: "Built for a pull request or a push: a Rust cache may be restored"
        type: boolean
        default: false
      av-gate:
        description: "Scan the assets (markers, sizes, ClamAV, YARA, Microsoft Defender: av-gate.yml) before the caller may publish them; the release tier and the release train set it"
        type: boolean
        default: false
    outputs:
      version:
        description: "The version the binaries report (`opentide --version`): the tag without its v."
        value: ${{ jobs.meta.outputs.semver }}

permissions:
  contents: read

jobs:
  # The tag, the version the asset names carry (`v0.24.0`, `v0.24.0-rc.1`), and
  # the one the binaries report (`0.24.0-rc.1`, OPENTIDE_BUILD_VERSION).
  meta:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      semver: ${{ steps.tag.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="$(python3 scripts/engine/release.py tag)"
          fi
          version="$(python3 scripts/engine/release.py asset-version "${tag}")"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "semver=${version#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Assets of ${tag}, named ${version}"

  # `opentide-lsp` and `opentide` (the facade with `cli`, as `cargo install
  # opentide --features cli` builds it) for each target, two cargo builds so
  # that neither takes the other's features. `opentide` reports the release's
  # version (OPENTIDE_BUILD_VERSION, which a release candidate's crates cannot carry).
  native:
    name: Binaries ${{ matrix.target }}
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      OPENTIDE_BUILD_VERSION: ${{ needs.meta.outputs.semver }}
    strategy:
      fail-fast: false
      matrix:
        # scripts/engine/release.py BINARY_TARGETS lists the same targets
        # (scripts/engine/test_release.py). No musl, no Windows (the header).
        # `saves`: the one cell per runner that saves its compiler cache.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            saves: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            saves: true
          - os: macos-latest
            target: aarch64-apple-darwin
            saves: true
          # GitHub retired the Intel macOS runners; cross-compile on Apple silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
            saves: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), and the target the job builds.
      # Installing the file's toolchain (no name) ignores `--target`: add it after.
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
      # The dry run only (a release builds from nothing): sccache, by content,
      # one family per Linux runner, which the cell marked `saves` saves on
      # development and by the nightly. macOS keeps none: its
      # families crowded the ones pull requests restore out of the 10 GB
      # GitHub keeps (#841, tests/test_ci/test_workflows.py).
      - name: Install sccache
        if: inputs.dry-run
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - name: Wrap rustc in sccache
        if: inputs.dry-run
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_workflows.py).
      - name: Compiler cache week
        id: week
        if: inputs.dry-run && runner.os == 'Linux'
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        if: inputs.dry-run && runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: build opentide-lsp
        shell: bash
        run: cargo build --locked --release -p opentide-lsp --target ${{ matrix.target }}
      - name: build opentide
        shell: bash
        run: cargo build --locked --release -p opentide --features cli --bin opentide --target ${{ matrix.target }}
      # opentide-lsp: 40 MiB. language-server's 30 MiB held until the 0.16
      # import (E1) added YARA (yara-x-parser), YARA-L and the Exabeam Query
      # Language with their catalogs to a server that also validates objects
      # here: 29.8 MB on x86_64 Linux then.
      # opentide, which also carries the connectors' HTTP and TLS stack, gets
      # 80 MiB.
      - name: size budget
        shell: bash
        run: |
          set -euo pipefail
          for budget in opentide-lsp:41943040 opentide:83886080; do
            name="${budget%%:*}"
            bin="target/${{ matrix.target }}/release/${name}"
            test -f "$bin"
            size=$(wc -c < "$bin")
            echo "$bin is $size bytes"
            test "$size" -lt "${budget#*:}"
          done
      # Every target's binaries have one name: name each by its target, or the
      # assets job's merged download keeps only one.
      - name: rename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist product
          cp "target/${{ matrix.target }}/release/opentide-lsp" "dist/opentide-lsp-${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/opentide" "product/opentide-${VERSION}-${{ matrix.target }}"
      - name: Save the compiler cache
        if: (github.event_name == 'schedule' || github.ref == 'refs/heads/development') && inputs.dry-run && runner.os == 'Linux' && steps.sccache.outputs.cache-hit != 'true' && matrix.saves
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
      - name: upload opentide-lsp
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-opentide-lsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      # The command line carries opentide's own package data, which the
      # assets job scans as a product (license-scan.sh --product).
      - name: upload opentide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-asset-opentide-${{ matrix.target }}
          path: product/*
          if-no-files-found: error

  wasm:
    name: WebAssembly builds
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), with the targets the job builds.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      # The dry run only (a release builds from nothing): sccache, by content,
      # under one stable key per runner (tests/test_ci/test_workflows.py).
      - name: Install sccache
        if: inputs.dry-run
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - name: Wrap rustc in sccache
        if: inputs.dry-run
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_workflows.py).
      - name: Compiler cache week
        id: week
        if: inputs.dry-run
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        if: inputs.dry-run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-release-wasm-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-release-wasm-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # A release restores no cache (setup-node may turn one on by itself).
          package-manager-cache: false
      # The prebuilt release, as ci.yml's wasm job installs it; its
      # version must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.128
      - run: bash scripts/engine/build-wasm.sh
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wasm32-wasip1/wasi-lsp/opentide-lsp.wasm "dist/opentide-lsp-wasm32-wasip1.wasm"
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/opentide_wasm.wasm
          # LICENSE, NOTICE and every licence file NOTICE cites, at the paths it names.
          python3 scripts/engine/release.py legal pkg
          cp -r licenses pkg/licenses
          (cd pkg && zip -r "../dist/opentide-wasm-web-${VERSION}.zip" .)
      - name: Save the compiler cache
        if: (github.event_name == 'schedule' || github.ref == 'refs/heads/development') && inputs.dry-run && steps.sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-release-wasm-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-wasm
          path: dist/*
          if-no-files-found: error

  highlights:
    name: Highlights zip
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - run: cargo run --locked -p opentide-lsp -- generate-highlights
      - name: zip
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd highlights && zip -r "../dist/highlights-${VERSION}.zip" spec.toml generated)
          zip -j "dist/highlights-${VERSION}.zip" LICENSE NOTICE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-highlights
          path: dist/*
          if-no-files-found: error

  # The binaries embed third-party code and data: ship the notices with them.
  # NOTICE covers the embedded data, Lucene, dk.brics, and the wasi-libc the WASI
  # builds link (texts in licenses/wasi-libc, shipped as WASI-LIBC-LICENSES.txt);
  # the licence files NOTICE cites ship as THIRD-PARTY-DATA-LICENSES.txt;
  # cargo-about lists every Rust crate in the workspace, the browser build's
  # included, and fails on a licence about.toml does not accept. No OIDC token
  # anywhere in this workflow: cargo-about builds third-party crates (their
  # build.rs run).
  licences:
    name: Licences and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - name: licences and notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about --version 0.8.4
          mkdir -p dist
          cargo about generate --workspace about.hbs -o dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE
          for f in licenses/wasi-libc/*; do
            printf '==> %s <==\n\n' "$f"; cat "$f"; printf '\n'
          done > dist/WASI-LIBC-LICENSES.txt
          # The licence and notice files NOTICE cites for the data the binaries embed.
          python3 scripts/engine/release.py legal-bundle dist/THIRD-PARTY-DATA-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-licences
          path: dist/*
          if-no-files-found: error

  # A CycloneDX SBOM for each artifact (#843), each a release asset: the
  # opentide-lsp binaries and WASI build, the browser build (pure Rust), the
  # lsp npm packages (engine assets); the `opentide` binaries and
  # crate, @opentide/opentide, and the PyPI wheel built from the same commit
  # (its extras' Python dependencies, pydantic of `plugins`, and the crates in
  # opentide._native), which are the product's. Its SBOM is scanned like the
  # rest of the product's. Each SBOM is checked against the
  # CycloneDX 1.5 schema. SOURCE_DATE_EPOCH (the commit's time) fixes their
  # timestamps.
  sbom:
    name: SBOMs
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no
      # name), with the browser build's target cargo-cyclonedx resolves for.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
      # setup-uv caches by default on GitHub's runners ("auto"); a release
      # builds from nothing (tests/test_ci/test_workflows.py).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.10
      - name: generate and validate
        env:
          WHEEL_VERSION: ${{ inputs.wheel-version }}
          NPM_VERSION: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          # The version the wheel carries: the release's, or for the dry run
          # the workspace's, which maturin builds a wheel at (pyproject.toml).
          # WHEEL_VERSION is the step's env (the release's version, or empty).
          # shellcheck disable=SC2153
          wheel_version="${WHEEL_VERSION}"
          if [ -z "${wheel_version}" ]; then
            wheel_version="$(python3 scripts/engine/release.py version)"
          fi
          python3 scripts/engine/sbom.py generate dist --wheel-version "${wheel_version}" --npm-version "${NPM_VERSION}"
          python3 scripts/engine/sbom.py validate dist/*.cdx.json
          mkdir -p product
          mv dist/opentide.cdx.json dist/opentide-node.cdx.json dist/opentide-wheel.cdx.json product/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-sbom
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-asset-sbom
          path: product/*
          if-no-files-found: error

  # Every asset, the licence scan over all of them, the installer with the
  # tag written in, and SHA256SUMS last.
  assets:
    name: Release assets
    needs: [meta, native, wasm, highlights, licences, sbom]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: engine-asset-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: product
          pattern: product-asset-*
          merge-multiple: true
      # The engine's assets carry no oracle reference at all. The `opentide`
      # binaries carry opentide's package data, as the wheel does: its
      # `platform_sdk` explain page names the Splunk client's Python module
      # (license-scan.sh --product). Every product asset is scanned, the
      # wheel's SBOM included: the wheel has no Python dependency, and its SBOM
      # lists the `plugins` extra's pydantic.
      - name: license scan (no oracle references)
        run: |
          set -euo pipefail
          bash scripts/engine/license-scan.sh dist
          bash scripts/engine/license-scan.sh --product product
      # The repository's installer names no release: each published copy
      # installs its own tag by default. Linux and macOS only: no Windows
      # binary ships (the header).
      - name: installer
        run: |
          set -euo pipefail
          sed "s/__OPENTIDE_TAG__/${TAG}/" publishing/installers/opentide-installer.sh > product/opentide-installer.sh
          grep -qF "${TAG}" product/opentide-installer.sh
          mv product/* dist/
      - name: every asset is there
        run: |
          set -euo pipefail
          test -s dist/THIRD-PARTY-LICENSES.html && test -s dist/NOTICE && test -s dist/WASI-LIBC-LICENSES.txt
          test -s dist/THIRD-PARTY-DATA-LICENSES.txt
      # Last, once dist holds every asset (language-server#196): a consumer runs
      # `sha256sum -c SHA256SUMS` on what it downloads.
      - name: SHA256SUMS
        run: python3 scripts/engine/release.py sums dist
      # The names language-server's releases carried, with this tag's version:
      # editors pin them (opentidehq/vscode-extension pins.json).
      - name: the asset set
        run: |
          set -euo pipefail
          python3 scripts/engine/release.py check-assets dist "${TAG}"
          python3 scripts/engine/release.py verify-sums dist
          {
            echo "### Release assets of ${TAG}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # The antivirus gate over every asset (#1743): ClamAV, YARA, Microsoft
  # Defender and the marker and size checks (av-gate.yml). Only for the release
  # tier and the release train; a failure fails this workflow's caller, so
  # nothing downstream of it (the internal release, the attestations, the
  # registries) runs.
  av-gate-assets:
    name: AV gate (release assets)
    needs: assets
    if: inputs.av-gate
    permissions:
      contents: read
    uses: ./.github/workflows/av-gate.yml
    with:
      artifacts: release-assets
      # No standalone Windows executable ships (#1747): nothing here to read imports from.
      windows-binaries: false
