name: Engine release build

# Builds every asset of opentide's GitHub Release into one artifact,
# `release-assets`: the `opentide` and `opentide-lsp` binaries per target, their
# installers (publishing/installers/), the WASI module, the browser build
# (opentide-wasm-web-<v>.zip), the highlights zip, the licences and NOTICE, the
# CycloneDX SBOMs (scripts/engine/sbom.py), and SHA256SUMS last. It publishes,
# attests and uploads to no release: the caller does. Two callers:
#
# - publish.yml, the release train (UC-5.5), with the release's tag (`vX.Y.Z`
#   or `vX.Y.Z-rc.N`) and the wheel's version;
# - ci.yml in its full set, with no tag (dry-run): the workspace version's tag,
#   so the asset set a release would publish is proven before one does
#   (`release.py check-assets`: language-server's last release's names with the
#   version substituted, the `opentide` binaries, installers and SBOMs added).
#
# No musl target: the maintainer decided against musl builds (docs/internal/
# publishing.md, "The release train"); scripts/engine/release.py TARGETS.
#
# Only the dry run restores a Rust cache: a release builds from nothing.
on:
  workflow_call:
    inputs:
      tag:
        description: "vX.Y.Z or vX.Y.Z-rc.N; empty for the dry run (the workspace version)"
        type: string
        default: ""
      wheel-version:
        description: "The PyPI wheel's version, for its SBOM (0.24.0, 0.24.0rc1); empty: hatch-vcs's"
        type: string
        default: ""
      dry-run:
        description: "Built for a pull request or a push: a Rust cache may be restored"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The tag, the version the asset names carry (`v0.24.0`, `v0.24.0-rc.1`), and
  # the one the binaries report (`0.24.0-rc.1`, OPENTIDE_VERSION).
  meta:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      semver: ${{ steps.tag.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="$(python3 scripts/engine/release.py tag)"
          fi
          version="$(python3 scripts/engine/release.py asset-version "${tag}")"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "semver=${version#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Assets of ${tag}, named ${version}"

  # `opentide-lsp` and `opentide` (the facade with `cli`, as `cargo install
  # opentide --features cli` builds it) for each target, two cargo builds so
  # that neither takes the other's features. `opentide` reports the release's
  # version (OPENTIDE_VERSION, which a release candidate's crates cannot carry).
  native:
    name: Binaries ${{ matrix.target }}
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      OPENTIDE_VERSION: ${{ needs.meta.outputs.semver }}
    strategy:
      fail-fast: false
      matrix:
        # scripts/engine/release.py TARGETS lists the same targets
        # (scripts/engine/test_release.py). No musl (the header).
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # GitHub retired the Intel macOS runners; cross-compile on Apple silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), and the target the job builds.
      # windows-11-arm's image may lack rustup (build-packages.yml installs it there
      # too). The other images carry rustup; this one may not.
      - name: Rust on Windows on Arm
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --profile minimal --default-toolchain none
            Join-Path $env:USERPROFILE '.cargo\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      # Installing the file's toolchain (no name) ignores `--target`: add it after.
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
      # The dry run only: one cache per target (rust-cache's key does not hold
      # the matrix). A release never restores one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.dry-run
        with:
          # Saved from pushes only: a pull request's cache serves no other (#841).
          save-if: ${{ github.event_name == 'push' }}
          shared-key: engine-release
          key: ${{ matrix.target }}
      - name: build opentide-lsp
        shell: bash
        run: cargo build --locked --release -p opentide-lsp --target ${{ matrix.target }}
      - name: build opentide
        shell: bash
        run: cargo build --locked --release -p opentide --features cli --bin opentide --target ${{ matrix.target }}
      # opentide-lsp: 40 MiB. language-server's 30 MiB held until the 0.16
      # import (E1) added YARA (yara-x-parser), YARA-L and the Exabeam Query
      # Language with their catalogs to a server that also validates objects
      # here: 29.8 MB on x86_64 Linux and 33.8 MB on x86_64 Windows then.
      # opentide, which also carries the connectors' HTTP and TLS stack, gets
      # 80 MiB.
      - name: size budget
        shell: bash
        run: |
          set -euo pipefail
          for budget in opentide-lsp:41943040 opentide:83886080; do
            name="${budget%%:*}"
            ext=""
            case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
            bin="target/${{ matrix.target }}/release/${name}${ext}"
            test -f "$bin"
            size=$(wc -c < "$bin")
            echo "$bin is $size bytes"
            test "$size" -lt "${budget#*:}"
          done
      # Every target's binaries have one name: name each by its target, or the
      # assets job's merged download keeps only one.
      - name: rename
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p dist product
          cp "target/${{ matrix.target }}/release/opentide-lsp${ext}" "dist/opentide-lsp-${VERSION}-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/opentide${ext}" "product/opentide-${VERSION}-${{ matrix.target }}${ext}"
      - name: upload opentide-lsp
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-opentide-lsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      # The command line carries opentide's own package data, which the
      # assets job scans as a product (license-scan.sh --product).
      - name: upload opentide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-asset-opentide-${{ matrix.target }}
          path: product/*
          if-no-files-found: error

  wasm:
    name: WebAssembly builds
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins, which cargo runs in this checkout
      # (`rustup toolchain install` with no name), with the targets the job builds.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.dry-run
        with:
          # Saved from pushes only: a pull request's cache serves no other (#841).
          save-if: ${{ github.event_name == 'push' }}
          shared-key: engine-release
          key: wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # A release restores no cache (setup-node may turn one on by itself).
          package-manager-cache: false
      # The prebuilt release, as ci.yml's engine-wasm job installs it; its
      # version must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.128
      - run: bash scripts/engine/build-wasm.sh
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wasm32-wasip1/release/opentide-lsp.wasm "dist/opentide-lsp-wasm32-wasip1.wasm"
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/opentide_wasm.wasm
          cp LICENSE NOTICE pkg/
          cp -r licenses pkg/licenses
          (cd pkg && zip -r "../dist/opentide-wasm-web-${VERSION}.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-wasm
          path: dist/*
          if-no-files-found: error

  highlights:
    name: Highlights zip
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.dry-run
        with:
          # Saved from pushes only: a pull request's cache serves no other (#841).
          save-if: ${{ github.event_name == 'push' }}
          shared-key: engine-release
          key: highlights
      - run: cargo run --locked -p opentide-lsp -- generate-highlights
      - name: zip
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd highlights && zip -r "../dist/highlights-${VERSION}.zip" spec.toml generated queries)
          zip -j "dist/highlights-${VERSION}.zip" LICENSE NOTICE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-highlights
          path: dist/*
          if-no-files-found: error

  # The binaries embed third-party code and data: ship the notices with them.
  # NOTICE covers ECS, Lucene, dk.brics, and the wasi-libc the WASM builds link
  # (texts in licenses/wasi-libc, shipped as WASI-LIBC-LICENSES.txt);
  # cargo-about lists every Rust crate in the workspace, the browser build's
  # included, and fails on a licence about.toml does not accept. No OIDC token
  # anywhere in this workflow: cargo-about builds third-party crates (their
  # build.rs run).
  licences:
    name: Licences and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no name).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.dry-run
        with:
          # Saved from pushes only: a pull request's cache serves no other (#841).
          save-if: ${{ github.event_name == 'push' }}
          shared-key: engine-release
          key: licences
      - name: licences and notices
        run: |
          set -euo pipefail
          cargo install --locked cargo-about --version 0.8.4
          mkdir -p dist
          cargo about generate --workspace about.hbs -o dist/THIRD-PARTY-LICENSES.html
          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE
          for f in licenses/wasi-libc/*; do
            printf '==> %s <==\n\n' "$f"; cat "$f"; printf '\n'
          done > dist/WASI-LIBC-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-licences
          path: dist/*
          if-no-files-found: error

  # A CycloneDX SBOM for each artifact (#843), each a release asset: the
  # opentide-lsp binaries and WASI build, the browser build with the wasi-libc
  # it links, the lsp npm packages (engine assets); the `opentide` binaries and
  # crate, @opentide/opentide, and the PyPI wheel built from the same commit
  # (its Python dependencies and the crates in opentide._native), which are the
  # product's. Since UC-6.2 the wheel depends on pydantic alone, so its SBOM
  # is scanned like the rest of the product's. Each SBOM is checked against the
  # CycloneDX 1.5 schema. SOURCE_DATE_EPOCH (the commit's time) fixes their
  # timestamps.
  sbom:
    name: SBOMs
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, for the wheel's version (hatch-vcs).
          fetch-depth: 0
      # The release rust-toolchain.toml pins (`rustup toolchain install` with no
      # name), with the browser build's target cargo-cyclonedx resolves for.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.dry-run
        with:
          # Saved from pushes only: a pull request's cache serves no other (#841).
          save-if: ${{ github.event_name == 'push' }}
          shared-key: engine-release
          key: sbom
      # setup-uv caches by default on GitHub's runners ("auto"); a release
      # builds from nothing (tests/test_ci/test_rust_caches.py).
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.10
      - name: generate and validate
        env:
          WHEEL_VERSION: ${{ inputs.wheel-version }}
          NPM_VERSION: ${{ needs.meta.outputs.semver }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          # The version the wheel carries: the release's, or for the dry run
          # the one hatch-vcs gives this commit. hatch-vcs reads any tag ending
          # in a version, the old `engine-v*` too: drop those from this job's
          # own clone so only opentide's `v*` tags count.
          # WHEEL_VERSION is the step's env (the release's version, or empty).
          # shellcheck disable=SC2153
          wheel_version="${WHEEL_VERSION}"
          if [ -z "${wheel_version}" ]; then
            git tag --list 'engine-v*' | xargs -r git tag -d >/dev/null
            wheel_version="$(uvx --quiet --from hatch==1.18.2 --with hatch-vcs==0.5.0 hatch version)"
          fi
          python3 scripts/engine/sbom.py generate dist --wheel-version "${wheel_version}" --npm-version "${NPM_VERSION}"
          python3 scripts/engine/sbom.py validate dist/*.cdx.json
          mkdir -p product
          mv dist/opentide.cdx.json dist/opentide-node.cdx.json dist/opentide-wheel.cdx.json product/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-asset-sbom
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-asset-sbom
          path: product/*
          if-no-files-found: error

  # Every asset, the licence scan over all of them, the installers with the
  # tag written in, and SHA256SUMS last.
  assets:
    name: Release assets
    needs: [meta, native, wasm, highlights, licences, sbom]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: engine-asset-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: product
          pattern: product-asset-*
          merge-multiple: true
      # The engine's assets carry no oracle reference at all. The `opentide`
      # binaries carry opentide's package data, as the wheel does: its
      # `platform_sdk` explain page names the Splunk client's Python module
      # (license-scan.sh --product). Every product asset is scanned, the
      # wheel's SBOM included: the wheel depends on pydantic alone (UC-6.2).
      - name: license scan (no oracle references)
        run: |
          set -euo pipefail
          bash scripts/engine/license-scan.sh dist
          bash scripts/engine/license-scan.sh --product product
      # The repository's installers name no release: each published copy
      # installs its own tag by default.
      - name: installers
        run: |
          set -euo pipefail
          for installer in opentide-installer.sh opentide-installer.ps1; do
            sed "s/__OPENTIDE_TAG__/${TAG}/" "publishing/installers/${installer}" > "product/${installer}"
            grep -qF "${TAG}" "product/${installer}"
          done
          mv product/* dist/
      - name: every asset is there
        run: |
          set -euo pipefail
          test -s dist/THIRD-PARTY-LICENSES.html && test -s dist/NOTICE && test -s dist/WASI-LIBC-LICENSES.txt
      # Last, once dist holds every asset (language-server#196): a consumer runs
      # `sha256sum -c SHA256SUMS` on what it downloads.
      - name: SHA256SUMS
        run: python3 scripts/engine/release.py sums dist
      # The names language-server's releases carried, with this tag's version:
      # editors pin them (opentidehq/vscode-extension pins.json).
      - name: the asset set
        run: |
          set -euo pipefail
          python3 scripts/engine/release.py check-assets dist "${TAG}"
          python3 scripts/engine/release.py verify-sums dist
          {
            echo "### Release assets of ${TAG}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
