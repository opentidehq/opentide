# The plan section 11 benchmarks with their budgets (UC-0.8, #806): `cargo xtask bench`
# (xtask/src/bench/) on the heavy workspace, held by `cargo xtask bench --check` to
# tests/bench/budgets.toml and to the last development result.
#
# When: nightly on the default branch (development), on demand, and on a pull request
# that carries the `perf` label (adding the label starts a run; every push then reruns
# it). A run measures each command as fresh processes on one runner class,
# ubuntu-24.04 (4 vCPU, the class the baseline in budgets.toml was recorded on):
# numbers from another class are not comparable.
#
# The last development result: the bench-<engine> artifact of the newest successful
# run of this workflow on development (a nightly or a manual run). A run that failed
# its check is never the reference, so a regression stays red until it is fixed or
# the budgets are re-recorded on purpose. Each run keeps its own results as the
# bench-<engine> artifact for 90 days.
#
# Safety: `pull_request`, never `pull_request_target`: a PR's code runs with a
# read-only token and no secrets, and the label only decides whether the job runs.
# The benchmarks reach no tenant: `deploy` runs with --dry-run, and every measured
# process gets proxies that lead nowhere (xtask/src/bench/measure.rs).
name: Benchmarks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmarks (${{ matrix.engine }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # gh run list and gh run download: the last development result
    strategy:
      fail-fast: false
      matrix:
        # python: the oracle, opentide 0.23.0 from PyPI. rust: what has a Rust
        # implementation (today the language server); the rest reports "no Rust yet".
        engine: [python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench-${{ matrix.engine }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false

      - name: Build xtask
        run: cargo build --locked --package xtask

      - name: Run the benchmarks
        env:
          ENGINE: ${{ matrix.engine }}
        run: cargo xtask bench --engine "$ENGINE" --scale 1 --json --out bench.json > /dev/null

      - name: Find the last development result
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml \
            --branch development --status success --limit 20 \
            --json databaseId,event \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful development run yet: checking against the budgets alone."
            exit 0
          fi
          echo "Last development result: run $run_id"
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "bench-$ENGINE" --dir previous; then
            echo "::warning::run $run_id kept no bench-$ENGINE artifact (expired?): checking against the budgets alone."
            rm -rf previous
          fi

      - name: Check against the budgets
        run: |
          previous=()
          if [ -f previous/bench.json ]; then
            previous=(--previous previous/bench.json)
          fi
          cargo xtask bench --check tests/bench/budgets.toml bench.json "${previous[@]}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.engine }}
          path: bench.json
          if-no-files-found: ignore
          retention-days: 90
