# Mutation testing, weekly (plan §5.4 "Strength", UC-X.2 #844): cargo-mutants
# changes the code of the crates xtask/mutants.toml lists, one mutant at a time,
# and runs their tests; a mutant every test still passes "survives". The report
# compares each crate's score with the recorded baseline
# (xtask/mutants-baseline.toml) and, on the schedule only, opens or updates one
# issue per crate whose survivors exceed its threshold.
#
# Permissions: everything runs read-only except `issues`, the one job that
# writes issues. It runs only on the schedule (never on a pull request or a
# manual run, which have no trigger here anyway or report only), checks out
# nothing and runs no code from the repository: it reads the Markdown the
# `report` job wrote and calls `gh issue`.
name: Mutants

on:
  schedule:
    # Mondays 02:41 UTC, before the week's work; the oracles run at 04:17.
    - cron: "41 2 * * 1"
  # A manual run measures and reports; it files no issue.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"
  # Shards per run: the `mutate` matrix below lists 0 to SHARDS - 1.
  SHARDS: "8"

jobs:
  plan:
    name: Crates to mutate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # The workspace members xtask/mutants.toml lists; a pending crate
      # (not a member yet) is left out until its work item creates it.
      - id: crates
        run: |
          crates=$(cargo xtask mutants crates | tr '\n' ' ')
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "Mutating: $crates" >> "$GITHUB_STEP_SUMMARY"

  mutate:
    name: Mutate (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # opentide-analysis's corpus test runs the Pydantic models with .venv's
      # interpreter (crates/AGENTS.md, "Tests").
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: mutants
          # The shards build the same tree: one saves it.
          save-if: ${{ matrix.shard == 0 }}

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148

      - name: Install dependencies
        run: uv sync --group dev

      # .cargo/mutants.toml holds the run's settings (nextest, --locked).
      # cargo-mutants exits 2 when a mutant survived and 3 when one timed out:
      # both are results for the report, not failures of the job. Anything
      # else (1 usage, 4 the unmutated tree failed) fails it.
      - name: cargo mutants
        env:
          CRATES: ${{ needs.plan.outputs.crates }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=()
          for crate in $CRATES; do args+=(--package "$crate"); done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::xtask/mutants.toml lists no workspace member"
            exit 1
          fi
          status=0
          cargo mutants "${args[@]}" --shard "$SHARD/$SHARDS" --in-place --no-shuffle || status=$?
          echo "cargo mutants exited $status"
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac

      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Report
    needs: mutate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-shard-*
          path: shards

      # The scores against the baseline in the job summary; issues/<crate>.md
      # for each crate above its threshold; this run as a candidate baseline
      # (mutants-baseline.toml in the artifact: committing it is a reviewed
      # change, `docs/internal/test-strength.md`).
      - name: Report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          outcomes=()
          for file in shards/*/outcomes.json; do outcomes+=(--outcomes "$file"); done
          cargo xtask mutants report "${outcomes[@]}" \
            --baseline xtask/mutants-baseline.toml \
            --issues report/issues \
            --run-url "$RUN_URL" \
            --write-baseline report/mutants-baseline.toml --commit "$COMMIT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          cat shards/*/missed.txt | sort > report/missed.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: report/
          if-no-files-found: error
          retention-days: 90

  issues:
    name: File surviving mutants
    needs: report
    # The schedule only: a manual run reports and files nothing.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-report
          path: report

      # One open issue per crate, found by its exact title: updated when it
      # exists, opened otherwise. The bodies are Markdown the report job wrote
      # from cargo-mutants' outcomes; they are passed as files, never
      # interpolated into the script.
      - name: Open or update one issue per crate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          for body in report/issues/*.md; do
            crate=$(basename "$body" .md)
            title="Mutation testing: surviving mutants in $crate"
            number=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$body"
              echo "Updated #$number ($crate)" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create --title "$title" --body-file "$body"
              echo "Opened an issue for $crate" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
