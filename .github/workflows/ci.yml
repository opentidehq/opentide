name: CI
# A push's run names the commit's first line, which for a merge is "Merge pull
# request #N from ...": a failure on a base branch names the pull request
# that brought it.
run-name: >-
  ${{ github.event_name == 'push'
  && format('CI on {0}: {1}', github.ref_name, github.event.head_commit.message)
  || '' }}

# One workflow, four tiers (.github/AGENTS.md, "What runs where";
# tests/test_ci/test_workflows.py). `changes` decides which, and what each
# run checks (scripts/ci/changes.py):
#
# - The PR gate, on a pull request into integration/unified-core,
#   development or train/*: Linux only, and only what the change affects.
#   The changed workspace crates and their reverse dependencies are built
#   ONCE (`build`: their tests, which it runs), and the `_native` extension
#   once (`native`), on which the Python suite and E2E run. Each
#   specialised job (Node, WASI, grammars, TextMate, GitLab CI
#   lint, the facade's semver checks, cargo deny, docs) runs only when its
#   paths change. One required check, `PR gate`, passes when every job that
#   was needed passed and every other was skipped.
# - A push to a base branch, and Run workflow (scope `full`): the same jobs
#   with every path filter on, Linux only. This keeps the trunk fully checked.
# - A release pull request (into development from integration/unified-core
#   or release/*, or labelled `release`), and Run workflow (scope `release`):
#   the gate plus every package on every target, an install smoke test of
#   each on its OS, the publish dry run and the docs.
# - The nightly (schedule, and Run workflow with scope `nightly`): everything
#   above, plus macOS and Windows, Python 3.10-3.13, the full E2E set, the
#   packages, fuzz smoke, coverage, benchmarks, the vendor-parser oracles,
#   the schema checks, the Elastic sweep and the rest. It never gates; a
#   failure opens or updates one issue labelled `nightly-failure`.
#
# Byte-for-byte comparison with the frozen Python CLI is no requirement
# anywhere: the oracle's comparisons (golden, corpus, MCP replay, the payload,
# config, validate and lint diffs) run by hand only (`cargo xtask golden`,
# `compare`, `corpus`; the replay tests are #[ignore]d), tests/golden/README.md.

on:
  push:
    # integration/unified-core: the Unified Core PRs merge there before development.
    # train/*: a release train that pull requests target; its pushes save
    # the caches those pull requests restore (a pull request reads only its base
    # branch's caches and the default branch's).
    branches: [main, development, integration/unified-core, "train/*"]
  # Every base: integration/unified-core, development, a train/*, or the
  # branch below a stacked pull request.
  pull_request:
    # `labeled`: labelling a pull request `release` runs the release tier.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      scope:
        description: "full: the push's jobs (Linux, everything); release: plus every package and smoke test; nightly: the nightly set"
        type: choice
        options: [full, release, nightly]
        default: full
  schedule:
    # Nightly on the default branch (development).
    - cron: "11 1 * * *"

concurrency:
  # A pull request's new push cancels its stale run; every other run (a push
  # to a base branch, the nightly, Run workflow) has a group of its own, its
  # run id, so none cancels another and each push to a base branch gets a
  # complete run (tests/test_ci/test_workflows.py).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The Python of the gate's Python jobs (and the coverage gate).
  COVERAGE_PYTHON: "3.14"

# Compiler caches (tests/test_ci/test_workflows.py): sccache (RUSTC_WRAPPER)
# in .sccache/, restored by .github/actions/rust-setup (`cache:`) and saved by
# .github/actions/sccache-save, kept by actions/cache under
# `sccache-<family>-<hash of rust-toolchain.toml>-<ISO week>`, restored with the
# family and toolchain as restore-keys and saved by exactly one job when the
# key missed (once a week): from a push or Run workflow (the nightly, for the
# nightly's families), and from a pull request only when it found no copy of
# the family at all (its base branch has none yet: a new family or
# toolchain), so that its next push is warm. sccache is content-addressed, so a copy a few days old still
# serves every crate that did not change. Linux only.
#
#   build           `build`: the tests, xtask and the language server
#   native          `native`: the `_native` extension
#   stubs           `stubs`: the extension with PyO3's introspection, xtask
#   engine-check    `engine-lint`: clippy (native and wasm32) and rustdoc
#   wasm            `wasm`: the browser module, the WASI server and command line
#   full-set-Linux  `node`, `facade` and the nightly's Linux Rust jobs:
#                   `conformance` saves it, by the nightly and on pushes to
#                   development and integration/unified-core
#
# The one rust-cache left: `fuzz` (fuzz-smoke). macOS and Windows build
# without one: theirs crowded the Linux families out of the 10 GB (#841).

jobs:

  # What this run checks: the tier, the affected crates and the areas
  # (scripts/ci/changes.py). Standard library and `cargo metadata --no-deps`
  # only, so it takes seconds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      release: ${{ steps.plan.outputs.release }}
      crates: ${{ steps.plan.outputs.crates }}
      packages: ${{ steps.plan.outputs.packages }}
      features: ${{ steps.plan.outputs.features }}
      filter: ${{ steps.plan.outputs.filter }}
      native: ${{ steps.plan.outputs.native }}
      rust: ${{ steps.plan.outputs.rust }}
      python: ${{ steps.plan.outputs.python }}
      lint: ${{ steps.plan.outputs.lint }}
      pylint: ${{ steps.plan.outputs.pylint }}
      ci: ${{ steps.plan.outputs.ci }}
      skills: ${{ steps.plan.outputs.skills }}
      docs: ${{ steps.plan.outputs.docs }}
      node: ${{ steps.plan.outputs.node }}
      wasm: ${{ steps.plan.outputs.wasm }}
      ts_packages: ${{ steps.plan.outputs.ts_packages }}
      grammars: ${{ steps.plan.outputs.grammars }}
      textmate: ${{ steps.plan.outputs.textmate }}
      gitlab: ${{ steps.plan.outputs.gitlab }}
      facade: ${{ steps.plan.outputs.facade }}
      deny: ${{ steps.plan.outputs.deny }}
      vocab: ${{ steps.plan.outputs.vocab }}
      fields: ${{ steps.plan.outputs.fields }}
      schema_ui: ${{ steps.plan.outputs.schema_ui }}
      stubs: ${{ steps.plan.outputs.stubs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's head and base, for `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false
      - name: What this run checks
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The runner's stable cargo reads the manifests: no toolchain install.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci/changes.py

  # Each step when its inputs change: ruff, ty (on the checked-in stubs of
  # `_native`: no Rust build) when a Python file does (twine checks the sdist
  # in the release tier);
  # actionlint and the CI contracts (tests/test_ci) when a workflow or they do;
  # the skills; the engine's invariant scripts when a crate does.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYLINT: ${{ needs.changes.outputs.pylint }}
      CI_CONTRACTS: ${{ needs.changes.outputs.ci }}
      SKILLS: ${{ needs.changes.outputs.skills }}
      RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tools and the dependencies, not opentide itself: nothing compiles.
      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      - name: Ruff check
        if: env.PYLINT == 'true'
        run: uv run --no-sync ruff check src/opentide tests scripts --output-format github

      - name: Ruff format
        if: env.PYLINT == 'true'
        run: uv run --no-sync ruff format --check src/opentide tests scripts

      # src/opentide/_native/*.pyi stand for the extension.
      - name: Ty type check
        if: env.PYLINT == 'true'
        run: uv run --no-sync ty check src/opentide --output-format github

      # The workflows themselves, with shellcheck over their scripts;
      # .github/actionlint.yaml names what this version does not know.
      - name: actionlint
        if: env.CI_CONTRACTS == 'true'
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "${RUNNER_TEMP}/bin/actionlint" -color

      - name: Engine invariants (I/O-free crates, names)
        run: |
          bash scripts/engine/check-io-free.sh
          bash scripts/engine/check-names.sh

      - name: The agent skills
        if: env.SKILLS == 'true'
        run: bash scripts/engine/validate-skills.sh

      - name: The engine release script's tests
        if: env.PYLINT == 'true'
        run: python -m unittest discover -s scripts/engine -p "test_*.py"

      # The CI contracts (tests/test_ci): plain Python over the workflows and
      # scripts/ci/changes.py, no extension.
      - name: CI contracts
        if: env.CI_CONTRACTS == 'true'
        run: uv run --no-sync pytest tests/test_ci -q --no-cov -p no:cacheprovider

  # rustfmt, clippy and rustdoc, workspace-wide whatever changed: with a warm
  # cache, clippy re-checks only what changed.
  engine-lint:
    name: Engine lint (fmt, clippy, doc)
    needs: changes
    # The wasm32 clippy alone when only build-wasm.sh or what the `wasm` job
    # reads changed (`wasm` without `rust`).
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml pins, with the rustfmt and clippy it lists.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: engine-check

      - name: rustfmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # opentide-cli as xtask and the WASI build compile it, without its
      # `terminal` feature: the workspace-wide run above unifies it on.
      - name: clippy without the terminal feature
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --package opentide-cli --no-default-features --locked -- -D warnings

      # The code only wasm32 compiles (libc_syscalls.rs, the wasip1 paths of
      # opentide-lsp and opentide-cli), which the native clippy never sees:
      # when the `wasm` job runs, with build-wasm.sh's wasi-sdk.
      - name: clippy on the WebAssembly targets
        if: needs.changes.outputs.wasm == 'true'
        run: bash scripts/engine/build-wasm.sh clippy

      # opentide-schema for the hosts the workspace run does not lint
      # (UC-1.1): its `stubs` feature (PyO3's introspection, as `native`'s
      # stubs check builds it) and the browser target, when
      # opentide-schema is affected. The workspace run already unifies its
      # `python` feature on (the binding turns it on).
      - name: clippy on opentide-schema (stubs, wasm32)
        if: contains(format(' {0} ', needs.changes.outputs.crates), ' opentide-schema ')
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --locked -p opentide-schema --all-targets --features stubs -- -D warnings
          cargo clippy --locked -p opentide-schema --target wasm32-unknown-unknown -- -D warnings

      # Broken intra-doc links and the like fail the build.
      - name: rustdoc
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --locked

      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && steps.sccache.outputs.save == 'true' }}

  # opentide's wheel, built by maturin as a release's is (#1157), for the
  # Python jobs, which install it without compiling: a job of its own, so they
  # start after this short build instead of after the tests (a push's Python
  # job waited 8.4 min for the build, its tests included). Its own compiler
  # cache family: maturin's environment and the extension's features are not
  # the tests'. A `linux` tag (no manylinux audit): it is installed on this
  # runner image only.
  native:
    name: Build the opentide wheel
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings -Clink-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # One interpreter for PyO3's configuration: the binding is abi3, so the
      # extension serves every Python from 3.10.
      PYO3_PYTHON: /usr/bin/python3
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # maturin as a prebuilt binary: `pipx run` took 7 s to install it.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0,maturin@1.16.0
          cache: native-v2

      - name: Install mold
        run: sudo apt-get install -y -q --no-install-recommends mold || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mold; }

      # `v2`: maturin's compiles (its environment is in their sccache keys)
      # replaced cargo's; bump it with the build's settings, or the week's
      # copy, already saved, keeps the old compiles and none is saved: #1157's
      # wheel took 94 s to compile against the week's copy of cargo's.
      - name: Build the opentide wheel
        run: maturin build --locked --profile dev --compatibility linux --out "${RUNNER_TEMP}/native"

      - name: Upload the opentide wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native/opentide-*.whl
          if-no-files-found: error
          retention-days: 3


      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && steps.sccache.outputs.save == 'true' }}

  # The stubs of opentide._native.models and opentide._native.sdk, which
  # `lint`'s ty reads, are generated from the extension (UC-1.9, ADR 0011;
  # UC-5.2b): xtask builds it with PyO3's introspection data, as Python 3.10
  # (the abi3 floor) sees it, and fails when a committed stub differs. When
  # the binding, opentide-schema, the facade, the stubs or the generator
  # change (`stubs`: scripts/ci/changes.py), and on every push and nightly.
  # A job of its own, not a step of `native`: the Python jobs wait for
  # `native`, and this build (xtask, then the extension in the develop
  # profile) took 8 minutes cold (#1141's regression). Its own compiler cache:
  # neither the profile nor PYO3_PYTHON is another job's.
  stubs:
    name: Generated stubs (_native)
    needs: changes
    if: needs.changes.outputs.stubs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings -Clink-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: stubs

      - name: Install mold
        run: sudo apt-get install -y -q --no-install-recommends mold || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mold; }

      - name: Python 3.10
        id: python310
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Generated stubs are up to date
        env:
          PYO3_PYTHON: ${{ steps.python310.outputs.python-path }}
        run: cargo xtask stubs --check

      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && steps.sccache.outputs.save == 'true' }}

  # The gate's one build of the tests, and the Rust tests run where they were
  # built: the affected crates' tests, xtask and the language server with one
  # compiler cache; the generated-artifact and layer checks; the tests
  # (`cargo nextest run`), the doctests and opentide-schema's compile-fail
  # cases. No test archive: moving one to test jobs cost more than the
  # partitions saved (measured on a leaf change, 2026-11-14: a 1.5 GB archive,
  # 18 s to pack, 15-33 s to download and 41 s to extract per partition,
  # against 42-48 s of tests each).
  build:
    name: Build and Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # mold links the test binaries, the build's longest step warm.
      RUSTFLAGS: "-Dwarnings -Clink-arg=-fuse-ld=mold"
      # No debuginfo, stripped at link: about 130 statically linked test
      # binaries link and write faster without it. A panic still names its
      # file:line; a backtrace names functions only (rerun locally for lines).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
      # One interpreter for PyO3's configuration: the binding is abi3, so the
      # extension serves every Python from 3.10.
      PYO3_PYTHON: /usr/bin/python3
      # sccache without CARGO_PRIMARY_PACKAGE (the script says why).
      RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci/rustc-wrapper/sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      SCCACHE_IDLE_TIMEOUT: "0"
      PACKAGES: ${{ needs.changes.outputs.packages }}
      FEATURES: ${{ needs.changes.outputs.features }}
      # The affected crates' tests: the build also compiles the anchors
      # (scripts/ci/changes.py, ANCHORS), whose tests run only when affected.
      FILTER: ${{ needs.changes.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `v5`: the build's settings (RUSTFLAGS, the profile's debuginfo and
      # strip, the wrapper) are in every compile's sccache key: bump it with them, or the
      # week's copy, already saved, keeps the old compiles and none is saved.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0,cargo-nextest@0.9.148
          cache: build-v5

      - name: Install mold
        run: sudo apt-get install -y -q --no-install-recommends mold || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mold; }

      - name: Runner CPU
        run: grep -m1 "model name" /proc/cpuinfo

      # The affected crates' test binaries, with the binaries their tests run
      # (CARGO_BIN_EXE_*). `--timings`: the report is uploaded below.
      - name: Build the Rust tests
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest run --no-run --locked "${pkg_args[@]}" "${feature_args[@]}" --timings

      # The tests' build left the binaries its tests run in target/debug,
      # with the tests' features: xtask and the language server when they are
      # affected (a change that reaches neither changes nothing they check).
      # Building them again without those features recompiled for minutes.
      - name: Which checks the build can run
        id: bins
        env:
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          for bin in xtask opentide-lsp; do
            if [[ -x "target/debug/${bin}" ]]; then found=true; else found=false; fi
            # An affected crate's binary is always built: never skip its checks.
            if [[ "${found}" == false && " ${CRATES} " == *" ${bin} "* ]]; then
              echo "::error::${bin} is affected but the tests' build left no target/debug/${bin}."
              exit 1
            fi
            echo "${bin}=${found}" >> "$GITHUB_OUTPUT"
          done

      # Every dependency between workspace crates points down the layer table
      # (xtask/layers.toml).
      - name: Crate layers
        if: steps.bins.outputs.xtask == 'true'
        run: target/debug/xtask check-layers

      # The deploy cassettes (tests/cassettes): one per scenario of
      # scenarios.toml, none edited by hand. It reads the files only.
      - name: Deploy cassettes
        if: steps.bins.outputs.xtask == 'true'
        run: target/debug/xtask cassettes check

      # The artifacts generated from the Rust model are the committed ones:
      # the platform and editor templates, the editor schemas, the language
      # server's catalogs and the diagnostics reference. `--oracle` (the
      # comparisons with the oracle's recordings) runs by hand only.
      - name: Generated artifacts
        if: steps.bins.outputs.xtask == 'true'
        run: target/debug/xtask codegen --check

      - name: Generated highlights
        if: steps.bins.outputs.opentide-lsp == 'true'
        run: target/debug/opentide-lsp generate-highlights --check

      # The vocabulary bundle and pins against the specifications repository,
      # and the models' field descriptions against its field tables: when
      # their inputs change (`vocab`, `fields`: scripts/ci/changes.py), and on
      # every push and nightly.
      - name: Checkout specifications
        if: steps.bins.outputs.xtask == 'true' && (needs.changes.outputs.vocab == 'true' || needs.changes.outputs.fields == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/specifications
          ref: main
          path: specifications
          persist-credentials: false

      # Without a specifications clone, --check would only compare the
      # lockfile with the bundle.
      - name: Vocabulary and pin sync drift
        if: steps.bins.outputs.xtask == 'true' && needs.changes.outputs.vocab == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
        run: target/debug/xtask vocab sync --check

      # It exits 2 without a checkout and 1 when fewer than 100 rows match a
      # field, so it cannot pass by not running.
      - name: Model field descriptions against the specifications
        if: steps.bins.outputs.xtask == 'true' && needs.changes.outputs.fields == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
        run: target/debug/xtask spec-fields

      # uv for the tests that provision a tool with it (nothing is synced),
      # and the Python the test that compares with difflib runs
      # (OPENTIDE_PYTHON): after the build, which reads PYO3_PYTHON only.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tests, the doctests and the compile-fail cases write under a
      # temporary folder, never in the checkout (#931); noted after the
      # specifications' checkout.
      - name: Note the checkout's state
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-before"

      # The CLI's snapshot cases on the generated workspaces (`fault`,
      # `heavy-small`, UC-0.6): xtask writes them, which the crate's tests
      # cannot; the tests fail without them when the variable is set.
      # A Linux gate by design: the nightly `engine-test-os` (macOS, Windows)
      # runs `cli_snapshots` without these workspaces, so the 101 generated
      # cases print "skipped" there. Writing them costs minutes
      # of debug-build CPU per OS for output the snapshots (Linux's) already
      # hold.
      - name: Generated workspaces for the CLI snapshots
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          if [[ " ${pkg_args[*]} " == *" opentide-cli "* || " ${pkg_args[*]} " == *" --workspace "* ]]; then
            [[ -x target/debug/xtask ]] || cargo build --locked -p xtask
            out="$RUNNER_TEMP/generated-workspaces"
            target/debug/xtask corpus faults --out "$out/fault"
            target/debug/xtask corpus generate --seed 1 --threats 30 --objectives 30 --rules 50 --out "$out/heavy-small"
            echo "OPENTIDE_REPLAY_FIXTURES=fault=$out/fault,heavy-small=$out/heavy-small" >> "$GITHUB_ENV"
            echo "OPENTIDE_SNAPSHOT_REQUIRE_GENERATED=1" >> "$GITHUB_ENV"
          fi

      # The compile-fail cases run below, when their inputs change.
      - name: cargo nextest (profile ci)
        env:
          OPENTIDE_PYTHON: python
          # Twice the runner's four cores: many tests wait on the processes and
          # servers they start (#1141, a one-line opentide-yara change: 85 s at
          # eight threads; 90-120 s at four, by the runner's CPU).
          NEXTEST_TEST_THREADS: "8"
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest run --locked --profile ci "${pkg_args[@]}" "${feature_args[@]}" \
            --no-tests=pass -E "(${FILTER}) and not binary_id(/^opentide-schema::ui\$/)"

      # nextest runs no doctests.
      - name: Doctests
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo test --locked --doc "${pkg_args[@]}" "${feature_args[@]}"

      # opentide-schema's compile-fail cases (trybuild) compile at test time,
      # so they run here, where the dependencies are: when their inputs (the
      # derive, the crate, the cases, the lockfile, the toolchain) change
      # (`schema_ui`: scripts/ci/changes.py), and on every push and nightly.
      - name: opentide-schema's compile-fail cases
        if: needs.changes.outputs.schema_ui == 'true'
        # The build's own packages and features (opentide-schema is among them
        # whenever a case's input changed): nothing is built again.
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest run --locked --profile ci "${pkg_args[@]}" "${feature_args[@]}" -E 'binary_id(opentide-schema::ui)'

      - name: The checks and tests left the checkout as they found it
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-after"
          if ! diff -u "$RUNNER_TEMP/tree-before" "$RUNNER_TEMP/tree-after"; then
            echo "::error::A check or test wrote into the checkout (lines starting with +): write under a temporary folder (tempfile::tempdir) instead."
            exit 1
          fi

      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate.
        continue-on-error: true
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          retention-days: 14

      - name: Upload the build's timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          retention-days: 7

      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && steps.sccache.outputs.save == 'true' }}

  # The Python package as a package (Python is the packaging layer): its
  # surface (the SDK, the models, the plugin API, the console script) and the
  # console script end to end (CLI, MCP and LSP over stdio), on the build's
  # opentide wheel (abi3), in ONE pytest run with the coverage gate. On a pull
  # request only when the Python surface changes (src/opentide, the binding,
  # the facade's API, pyproject, uv.lock, tests/ but test_ci and
  # the wheel-less docs tests): a Rust-only change builds no wheel and runs no
  # pytest, the Rust tests cover it. Every push runs it; a release pull
  # request and the nightly add Python 3.10-3.13 and the `full_set` E2E tests.
  python:
    name: Python (3.14, package and E2E, coverage)
    needs: [changes, native]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      code-quality: write
    env:
      # opentide is the build's wheel: `uv run` builds nothing, and the
      # tests that install opentide's wheel take it.
      UV_NO_SYNC: "1"
      OPENTIDE_TEST_WHEELHOUSE: ${{ github.workspace }}/.native
    steps:
      # The pull request's head commit (not the merge commit), so coverage
      # line numbers map to the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # cargo for the tests that read the workspace's metadata (nothing is
      # compiled): the pinned toolchain, which rustup no longer installs on
      # first use.
      - name: Set up Rust
        uses: ./.github/actions/rust-setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      # The dependencies, then opentide from the build's wheel: nothing
      # compiles (UV_NO_SYNC keeps `uv run` from building the project).
      - name: Install dependencies and the build's wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps .native/opentide-*.whl
          # The tests import opentide from src/ (tests/conftest.py), as from an
          # editable install: the wheel's module goes beside the sources.
          unzip -j -o .native/opentide-*.whl 'opentide/_native.abi3.so' -d src/opentide

      # `-n 6` on the runner's four cores: the E2E tests wait on the
      # subprocesses they start (measured on one E2E shard: -n 4 62 s, -n 6
      # 51 s; ten workers hit a memory cliff, 137 s).
      # Coverage is combined across the xdist workers by pytest-cov, so the
      # gate reads the same number as a serial run.
      - name: Pytest with coverage (unit and E2E)
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_ci \
            -m "not full_set and not gitlab_ci_lint" \
            -n 6 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Enforce coverage threshold
        run: uv run coverage report

      - name: Upload coverage to GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Pytest (${{ env.COVERAGE_PYTHON }})
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

  # The pipeline `opentide setup ci gitlab` renders, linted with glint and
  # gitlab-ci-verify: when the renderer, the test or the linters change.
  gitlab-ci-lint:
    name: GitLab CI lint
    needs: [changes, native]
    if: needs.changes.outputs.gitlab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # opentide is the build's wheel: `uv run` builds nothing, and the
      # tests that install opentide's wheel take it.
      UV_NO_SYNC: "1"
      OPENTIDE_TEST_WHEELHOUSE: ${{ github.workspace }}/.native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      - name: Install dependencies and the build's wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps .native/opentide-*.whl
          # The tests import opentide from src/ (tests/conftest.py), as from an
          # editable install: the wheel's module goes beside the sources.
          unzip -j -o .native/opentide-*.whl 'opentide/_native.abi3.so' -d src/opentide

      - name: Install GitLab CI linters
        run: |
          bash scripts/install-gitlab-ci-linters.sh "${RUNNER_TEMP}/gitlab-ci-linters"
          echo "${RUNNER_TEMP}/gitlab-ci-linters" >> "$GITHUB_PATH"

      - name: Lint generated GitLab CI
        run: uv run pytest tests/test_ci/test_gitlab_pipeline_lint.py -m gitlab_ci_lint -q --no-cov
        env:
          OPENTIDE_GITLAB_CI_LINT: "1"

  # The documentation's structure (Fumadocs-ready content; the site builds in
  # opentidehq/website). A docs-only pull request runs this job alone.
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Fumadocs-ready content
        run: scripts/validate-docs.sh

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # The docs tests that need no wheel (the pages' structure, links,
      # snippets' syntax, the changelog); the two that run the command line
      # and the SDK (test_docs_commands_golden.py, test_sdk_snippets.py) are
      # the Python job's.
      - name: Docs tests (no wheel)
        run: |
          uv sync --group dev --no-install-project
          uv run --no-sync pytest tests/test_docs -q --no-cov -n 4 -p no:cacheprovider \
            --ignore=tests/test_docs/test_docs_commands_golden.py \
            --ignore=tests/test_docs/test_sdk_snippets.py


  # The opentide facade crate (UC-5.1, #836), when its public API changes
  # (crates/opentide/): its docs with every feature, as docs.rs builds them,
  # and its API against the branch it merges into (cargo-semver-checks). Its
  # tests and doctests run in `build` with the tests'
  # features (every feature but `stubs`, which `native`'s stubs check builds).
  facade:
    name: Facade crate (every feature's docs, semver checks)
    needs: changes
    if: needs.changes.outputs.facade == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent (a pull request's base
          # branch, or the branch before a push): the semver baseline.
          fetch-depth: 2
          persist-credentials: false

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-semver-checks@0.51.0

      # docs.rs builds every feature (`[package.metadata.docs.rs]`).
      - name: rustdoc, every feature
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p opentide --all-features --no-deps --locked

      # Against the first parent until the crate is on crates.io; then the
      # last published version is the baseline (docs/sdk/rust.md, Stability).
      # A commit that adds the crate has no baseline to compare with. The
      # baseline is checked out on its own and only its crates/opentide is
      # handed over: --baseline-rev searches the whole tree for the package,
      # and publishing/placeholders/crates/opentide is a second `opentide`.
      - name: API against the base (cargo semver-checks)
        run: |
          baseline="$(git rev-parse HEAD^1)"
          if git cat-file -e "${baseline}:crates/opentide/Cargo.toml" 2>/dev/null; then
            git worktree add --detach "${RUNNER_TEMP}/opentide-baseline" "${baseline}"
            # -p names the crate: semver-checks skips a `publish = false`
            # crate it is not asked for by name, and still exits 0.
            cargo semver-checks -p opentide --manifest-path crates/opentide/Cargo.toml --all-features \
              --baseline-root "${RUNNER_TEMP}/opentide-baseline/crates/opentide"
          else
            echo "::notice::crates/opentide is new in this change: no baseline API to check against"
          fi

  # The Node binding (bindings/node, UC-5.3, #838): @opentide/opentide built
  # with napi-rs for linux-x64-gnu (the other seven targets are declared, and
  # built and installed in UC-5.3b); the loader and declarations napi-rs
  # generates against the committed ones; the package's tests (the SDK, the
  # bin, the packages, the TypeScript page's snippets and a `tsc --noEmit`
  # consumer); and its command line against this repository's console
  # script's: `--json commands` byte for byte. Nightly and on Run workflow.
  # (`cargo xtask golden check --runner node`, the ported golden cases
  # through the Node bin, is no gate since the oracle policing left CI; it
  # stays runnable by hand.)
  node:
    name: Node package (napi-rs build, tests)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      # The other side of the comparisons: this repository's PyPI CLI, whose
      # version the addon is built to report, so that the two documents can
      # be equal byte for byte.
      # The workspace version, as the conformance suite builds the addon: Node
      # compiles its own addon, so this job starts beside `build`, not after it.
      - name: The workspace version
        run: echo "OPENTIDE_VERSION=$(python3 scripts/engine/release.py version)" >> "$GITHUB_ENV"

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # The develop profile (optimised, without the release profile's
      # link-time optimisation), as `uv sync` builds the Python binding.
      - name: Build the addon (linux-x64-gnu)
        working-directory: bindings/node
        run: node build.mjs --profile develop

      - name: The generated loader and declarations are the committed ones
        run: |
          if ! git diff --exit-code -- bindings/node/index.js bindings/node/index.d.ts; then
            echo "::error::bindings/node/index.js or index.d.ts differs from what napi-rs generates: run \`npm run build\` in bindings/node and commit them."
            exit 1
          fi

      - name: The package's tests
        working-directory: bindings/node
        run: npm test


  # Every WebAssembly artifact in one job, one wasi-sdk and one compiler cache:
  # scripts/engine/build-wasm.sh builds the browser module (opentide-wasm,
  # wasm-bindgen), the WASI language server and the WASI command line, the
  # one module the VS Code extension runs (ADR 0007's amendment), whose
  # deflated size is held to the .vsix's 15 MiB; then tenant commands through
  # that module with @opentide/wasi-host performing their requests from the
  # cassettes, and the npm packages build and pack. When the parser layer, a
  # query-language crate, the WebAssembly crate, a WASI shim or the scripts
  # change (the `wasm` area of changes.py: a C dependency gained or lost and
  # the stack a deep parse needs show only here), and on every push and
  # nightly. The native language server and command line, and the TypeScript
  # client's tests against the native, worker and WASI servers, only when
  # packages/ or the browser module change (`ts_packages`) and on every push and nightly: they check
  # the client, not the parser. The WebAssembly targets' clippy is
  # `engine-lint`'s. (`cargo xtask golden check --runner wasi`, every golden
  # case through the module, is no gate since the oracle policing left CI; it
  # stays runnable by hand.)
  wasm:
    name: WebAssembly (browser, WASI, npm packages)
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # build-wasm.sh adds its link arguments to these flags.
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `wasm` family: the wasm32 compiles, which no other family holds
      # (the full set's is native), saved from a push to a base branch.
      # wasm-bindgen is the prebuilt release; its version must match the
      # wasm-bindgen crate in Cargo.lock.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown wasm32-wasip1
          tools: sccache@0.19.0,wasm-bindgen@0.2.128
          cache: wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # One wasi-sdk for the three: the browser module and the WASI language
      # server (smoke-tested), then the command line, which fails over its
      # budget; the sizes go to the step summary.
      - name: The WebAssembly modules (browser, WASI server, WASI command line)
        run: bash scripts/engine/build-wasm.sh browser wasi cli

      # Tenant commands under `opentide serve` in Node's WASI, every request
      # made by @opentide/wasi-host's FetchHost and answered from the golden
      # cassettes (no network in the module; the extension host performs the
      # requests).
      - name: Tenant commands through the host's opentide/fetch, in the WASI module
        env:
          OPENTIDE_WASI_CLI: target/wasm32-wasip1/wasi/opentide.wasm
        run: |
          (cd packages/wasi-host && npm ci)
          node --experimental-strip-types --test --test-name-pattern='^serve \(wasi\)' packages/wasi-host/src/index.test.ts

      - name: npm packages build and pack
        run: |
          for p in lsp-client lsp-worker; do (cd "packages/$p" && npm ci); done
          node scripts/engine/check-npm-packs.mjs

      - name: Native language server and command line
        if: needs.changes.outputs.ts_packages == 'true'
        run: cargo build --locked -p opentide-lsp -p opentide-cli

      # The extension host's half of `opentide/fetch` (W2): its HTTP stack on
      # the loopback, the protocol, and `opentide serve` running tenant
      # commands whose requests the host answers from the golden cassettes.
      - name: wasi-host (opentide/fetch against opentide serve)
        if: needs.changes.outputs.ts_packages == 'true'
        env:
          OPENTIDE_BIN: target/debug/opentide-cli
        run: node --experimental-strip-types --test packages/wasi-host/src/index.test.ts

      # node:wasi's path_open is a V8 fast API call whose allocation can start
      # a GC inside the call, which segfaults node 22 once the WASI instances
      # hold enough memory; plain calls do not.
      - name: lsp-client (stdio, worker, wasi)
        if: needs.changes.outputs.ts_packages == 'true'
        env:
          OPENTIDE_LSP_BIN: target/debug/opentide-lsp
          OPENTIDE_WASI_BIN: target/wasm32-wasip1/release/opentide-lsp.wasm
          OPENTIDE_WASM_GLUE: target/wasm-bindgen/opentide_wasm.js
        run: >-
          node --no-turbo-fast-api-calls --experimental-strip-types
          --test packages/lsp-client/src/index.test.ts

      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && steps.sccache.outputs.save == 'true' }}

  # The vendored parser.c of every grammar is what tree-sitter-cli generates
  # from its grammar.js (crates/AGENTS.md: never hand-edited).
  grammars:
    name: Grammars regenerate
    needs: changes
    if: needs.changes.outputs.grammars == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --prefix /tmp/ts-cli tree-sitter-cli@0.25.10
      - run: bash scripts/engine/check-grammars.sh

  # The generated grammars as VS Code reads them (language-server#171).
  textmate:
    name: TextMate grammars (vscode-textmate)
    needs: changes
    if: needs.changes.outputs.textmate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: TextMate grammars (vscode-textmate)
        working-directory: highlights/test
        run: npm ci && npm test

  # The supply-chain gate (#843, deny.toml): licences of what we ship,
  # RustSec advisories (vulnerable, unsound, unmaintained, yanked), a second
  # version of a shipped crate, OpenSSL, and any source but crates.io. fuzz/
  # (its own lock, never shipped) is checked for advisories, bans and
  # sources with the same deny.toml; the publishing/ placeholder crate (its
  # own lock, published) for everything. The advisory database is fetched fresh,
  # so a new advisory fails the next pull request until it is fixed or
  # excepted with a reason in deny.toml. cargo-deny is the prebuilt release,
  # checksum-checked, at the version pinned here.
  deny:
    name: Supply chain (cargo deny)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # cargo-deny only reads `cargo metadata`, but every cargo job here denies
    # warnings (tests/test_ci/test_workflows.py).
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins: cargo-deny reads the graph with
      # `cargo metadata`.
      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          tools: cargo-deny@0.20.2
          fallback: none
      - name: cargo deny (workspace)
        run: cargo deny --config deny.toml --locked check
      - name: cargo deny (fuzz/)
        run: cargo deny --config deny.toml --manifest-path fuzz/Cargo.toml --locked check advisories bans sources
      # The crate that reserves `opentide` on crates.io: a workspace and lock of
      # its own, published, so every check applies.
      - name: cargo deny (publishing/ placeholder crate)
        run: cargo deny --config deny.toml --manifest-path publishing/placeholders/crates/opentide/Cargo.toml --locked check

  # ---------------------------------------------------------------------------
  # The release tier: a release pull request, Run workflow with scope
  # `release`, and the nightly (the packages only). Every package on every
  # target, then each installed on its OS as a user installs it.
  # ---------------------------------------------------------------------------

  # Everything a release ships, built and smoke-tested as publish.yml builds
  # it (release-build.yml, which publish.yml calls too): the wheels (each run
  # on its own OS), the npm packages, the GitHub Release's assets (binaries,
  # installers, WebAssembly, SBOMs), the sdist and the crate packages, at a
  # development version of the workspace's (PyPI X.Y.Z.devN, npm
  # X.Y.Z-dev.N), kept 14 days as this run's artifacts
  # (docs/internal/publishing.md, "Testing a build without publishing"); then
  # one smoke matrix: the installer and `npm install` on each of the six
  # platforms, a build from the sdist and `cargo install` from the crates.
  release:
    name: Release build
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      revision: ${{ github.sha }}
      dry-run: true
      retention-days: 14

  # Every publish this repository makes, rehearsed with --dry-run and no
  # token (publish-dry-run.yml).
  publish-dry-run:
    name: Publish dry run
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-dry-run.yml

  # ---------------------------------------------------------------------------
  # The nightly set: never on a pull request or a push, so it never gates.
  # ---------------------------------------------------------------------------

  # The workspace's tests on macOS and Windows, built there (no archive
  # crosses an OS), without a compiler cache. The 101 generated-workspace
  # cases of `cli_snapshots` print "skipped" here by design: they are a
  # Linux-gate check (see "Generated workspaces for the CLI snapshots").
  engine-test-os:
    name: Engine tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
      OPENTIDE_PYTHON: python
      FEATURES: ${{ needs.changes.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          tools: cargo-nextest@0.9.148
      # The cli_snapshots cases hold `Objects/` and `objects/` side by side,
      # which are one folder on macOS's default (case-insensitive) volume, and
      # the harness stops there. A small case-sensitive volume, at a short
      # mount point (tests/golden/README.md, "Snapshots"), holds their roots.
      - name: Case-sensitive volume for the snapshot cases
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 2g -fs 'Case-sensitive APFS' -volname cs -type SPARSE "${RUNNER_TEMP}/cs.sparseimage"
          hdiutil attach "${RUNNER_TEMP}/cs.sparseimage" -mountpoint /Volumes/cs
          sudo chown "$(id -u)" /Volumes/cs
          echo "OPENTIDE_CASE_ROOT=/Volumes/cs" >> "${GITHUB_ENV}"
      - name: cargo nextest (profile ci)
        shell: bash
        run: |
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest run --locked --profile ci --workspace "${feature_args[@]}"
      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # The other supported Pythons, the oldest (3.10) included, on the build's
  # abi3 wheel: `python`'s run without coverage.
  test-full:
    name: Python (${{ matrix.python-version }})
    needs: [changes, native]
    if: needs.changes.outputs.mode == 'nightly' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # opentide is the build's wheel: `uv run` builds nothing, and the
      # tests that install opentide's wheel take it.
      UV_NO_SYNC: "1"
      OPENTIDE_TEST_WHEELHOUSE: ${{ github.workspace }}/.native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # cargo for the test that reads the workspace's metadata.
      - name: Set up Rust
        uses: ./.github/actions/rust-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native
      - name: Install dependencies and the build's wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps .native/opentide-*.whl
          # The tests import opentide from src/ (tests/conftest.py), as from an
          # editable install: the wheel's module goes beside the sources.
          unzip -j -o .native/opentide-*.whl 'opentide/_native.abi3.so' -d src/opentide
      - name: Pytest
        run: uv run pytest tests/ --ignore=tests/test_ci --no-cov -q -n 4 -m "not full_set and not gitlab_ci_lint"

  # The E2E tests too slow for every pull request, marked `full_set`: the
  # platform plugin on opentide installed from its wheel (UC-4.5c, #835),
  # whose `uv build` alone takes minutes.
  e2e-full:
    name: E2E (3.14, full set)
    needs: [changes, native]
    if: needs.changes.outputs.mode == 'nightly' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # opentide is the build's wheel: `uv run` builds nothing, and the
      # tests that install opentide's wheel take it.
      UV_NO_SYNC: "1"
      OPENTIDE_TEST_WHEELHOUSE: ${{ github.workspace }}/.native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}
      # The tests build wheels of their own.
      - name: Set up Rust
        uses: ./.github/actions/rust-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native
      - name: Install dependencies and the build's wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps .native/opentide-*.whl
          # The tests import opentide from src/ (tests/conftest.py), as from an
          # editable install: the wheel's module goes beside the sources.
          unzip -j -o .native/opentide-*.whl 'opentide/_native.abi3.so' -d src/opentide
      - name: E2E pytest (full set)
        run: uv run pytest tests/ -m full_set -q --no-cov

  # Coverage, the benchmarks, the vendor-parser oracles (Kusto.Language,
  # Splunk, Elasticsearch, Lucene, Falco) and the schema checks: workflows of
  # their own, run as part of the nightly.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml

  benchmarks:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
      # bench.yml reads the base branch's last result (gh run list, download).
      actions: read
    uses: ./.github/workflows/bench.yml

  oracle:
    name: Vendor-parser oracles
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/oracle.yml
    secrets: inherit

  # The cross-SDK conformance suite (UC-5.4, #839): every operation of
  # tests/conformance/manifest.json on the tide corpus, the heavy workspace,
  # the fault workspace and each configuration fault, through the Rust, Python
  # and Node SDKs, byte for byte (`cargo xtask conformance`); then the suite's
  # own test, a deliberate divergence of one runner that it must catch. On the
  # three operating systems. It builds the facade three times (the Python and
  # Node bindings, the Rust runner), so it is in the full set.
  conformance:
    name: SDK conformance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: ${{ runner.os == 'Linux' && 'full-set-Linux' || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      # The Python SDK: opentide._native, the develop profile.
      - name: Install dependencies
        run: uv sync --group dev

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # The Node SDK, the develop profile as the Python binding's, reporting
      # the workspace's version as the Rust and Python builds do (the npm
      # package's own is 0.0.0 until the release sets it).
      - name: Build the addon
        working-directory: bindings/node
        shell: bash
        run: |
          OPENTIDE_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../Cargo.toml | head -n 1)"
          export OPENTIDE_VERSION
          node build.mjs --profile develop

      # rust-cache saves target/ and restores it on the next run without the
      # marker of the runs' folder, target/conformance, which `conformance`
      # then refuses to empty: a restored copy is no run of this job's.
      - name: Drop a restored runs' folder
        shell: bash
        run: rm -rf target/conformance

      - name: Every operation on every corpus, byte for byte
        run: cargo xtask conformance --runners rust,python,node

      - name: A divergence in one runner is caught
        run: cargo xtask conformance --runners rust,python,node --corpus tide_corpus --diverge node

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate.
        continue-on-error: true
        with:
          name: conformance-${{ matrix.os }}
          path: target/conformance/report.json
          if-no-files-found: ignore

      # The full set's Linux compiler cache, which the other full-set jobs
      # restore: saved by the nightly and pushes to development (the default
      # branch, whose caches every branch reads), and by pushes to
      # integration/unified-core, whose full set is the one that runs while
      # development's ci.yml predates this family (it saves none, so every
      # full-set job built cold there, #841). Once a week. Not on a release
      # train: a copy per base branch did not fit beside the core families
      # in the 10 GB GitHub keeps.
      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/sccache-save
        with:
          key: ${{ steps.sccache.outputs.key }}
          save: ${{ job.status == 'success' && ((github.event_name == 'schedule' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/integration/unified-core') && steps.sccache.outputs.cache-hit != 'true' && runner.os == 'Linux') }}

  # The npm packages as a user installs them, as publish.yml's smoke-npm
  # does before a release: the tree's packages at the workspace version
  # (`release.py npm-version`), the addon built for linux-x64-gnu only (the
  # other five native packages packed as stand-ins without an addon, so that
  # npm still has to choose by os/cpu/libc), published to a throwaway local
  # registry (Verdaccio, no uplink), then `npm install @opentide/opentide` in
  # a clean project: exactly the host's native package, `npx opentide
  # --version`, the SDK, `runJson` and `tsc` against index.d.ts, and the same
  # through the `opentide` alias (scripts/engine/npm-local-registry/test.mjs).
  # It reads the node job's Rust cache.
  npm-install:
    name: npm install from a local registry (linux-x64-gnu)
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            scripts/engine/npm-local-registry/package-lock.json

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # Before the build: napi-rs writes the version into the loader.
      - name: The npm packages at the workspace version
        run: |
          set -euo pipefail
          version="$(python3 scripts/engine/release.py version)"
          python3 scripts/engine/release.py npm-version "${version}"
          python3 scripts/engine/release.py lockstep "${version}" --npm "${version}"
          echo "NPM_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the addon (linux-x64-gnu)
        working-directory: bindings/node
        run: OPENTIDE_VERSION="${NPM_VERSION}" node build.mjs --profile develop

      - name: Pack, publish to a local registry, npm install, npx, SDK and types
        run: node scripts/engine/npm-local-registry/test.mjs --version "${NPM_VERSION}" --pack "${RUNNER_TEMP}/npm"

  # Every public Elastic rule passes Elasticsearch's parser, so any engine
  # error on them is an engine bug (language-server#82). The rules are ELv2:
  # checked out here at a pinned commit (the one oracle.yml reads), never
  # vendored.
  elastic-sweep:
    name: Elastic detection-rules sweep
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # engine-test's environment: the same rust-cache key, so this job reads
      # the Linux cell's cache.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elastic/detection-rules
          persist-credentials: false
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      # engine-test's compiler cache, as its rust-cache (RUSTC_WRAPPER is in that key).
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}
      - name: detection-rules sweep
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: cargo test --locked -p opentide-analysis --test elastic_detection_rules -- --nocapture

  # Each fuzz target (fuzz/, cargo-fuzz on nightly) for 60 seconds from its
  # seeds and saved regressions: a panic or a timeout fails here, in the full
  # set. engine-fuzz.yml runs each for ten minutes a night with the corpus
  # it keeps.
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.targets }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every target of fuzz/fuzz_targets/ (tests/test_ci/test_workflows.py),
        # up to three to a runner: one build serves them all.
        targets: ["kql spl esql", "eql kuery lucene", "falco tide protocol", "config framing serve", "cql", "yara exabeam yaral", "cli", "from_node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dated nightly fuzz/NIGHTLY pins, which scripts/engine/fuzz.sh also
      # reads: a new nightly reaches this check in a change of its own.
      - name: Set up Rust (nightly)
        id: nightly
        run: |
          echo "FUZZ_TOOLCHAIN=$(cat fuzz/NIGHTLY)" >> "$GITHUB_ENV"
          FUZZ_TOOLCHAIN="$(cat fuzz/NIGHTLY)"
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --no-self-update
          echo "version=$(rustc +"${FUZZ_TOOLCHAIN}" -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # fuzz/ is a workspace of its own; cargo-fuzz builds into fuzz/target.
      # rust-cache also keeps ~/.cargo/bin, so cargo-fuzz installs once. Its key
      # hashes the pinned stable (rust-toolchain.toml), not the nightly that
      # builds here: `key` names the nightly, so a new one saves a new tree.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          shared-key: fuzz
          key: ${{ steps.nightly.outputs.version }}
          workspaces: fuzz -> target
      - run: cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked --version 0.13.2
      - name: fuzz ${{ matrix.targets }} (60 s each)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            echo "::group::fuzz ${target}"
            bash scripts/engine/fuzz.sh "${target}" 60
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate: an outage of GitHub's artifact
        # service must not fail a job whose checks passed.
        continue-on-error: true
        with:
          name: fuzz-smoke-artifacts-${{ strategy.job-index }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Real clients against the server (language-server#185 P2.8): pytest-lsp
  # replays the capabilities VS Code, Neovim and Emacs send and checks each
  # response against them, and Neovim's own client must show each diagnostic
  # once. Informational while the recorded capabilities and Ubuntu's Neovim move.
  clients:
    name: LSP clients (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    # The full set (the workflow's header).
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    env:
      # engine-test's environment: the same rust-cache key, so this job reads
      # the Linux cell's cache.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # engine-test's compiler cache, as its rust-cache (RUSTC_WRAPPER is in that key).
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo build --locked -p opentide-lsp
      - name: pytest-lsp (VS Code, Neovim, Emacs capabilities)
        env:
          OPENTIDE_LSP_BIN: ${{ github.workspace }}/target/debug/opentide-lsp
        run: |
          pip install -r scripts/engine/clients/requirements.txt
          cd scripts/engine/clients && python -m pytest -q
      - name: Neovim headless
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q neovim
          nvim --headless --clean -l scripts/engine/nvim-smoke.lua target/debug/opentide-lsp

  # analyze() per language and hover in a 1,000-object workspace
  # (language-server#181). The numbers go in the job summary for comparing
  # runs; they gate nothing.
  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - name: Set up Rust
        id: sccache
        uses: ./.github/actions/rust-setup
        with:
          tools: sccache@0.19.0
          cache: full-set-${{ runner.os }}
      - name: cargo bench (opentide-analysis)
        run: |
          cargo bench --locked -p opentide-analysis --bench analyze | tee bench.txt
          { echo '### analyze() per language'; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"




  cli-windows-smoke:
    name: CLI Windows smoke
    # The full set (the workflow's header): `Engine tests (windows-latest)`
    # covers Windows on every pull request.
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: windows-latest
    # Also not gated on `test`: a 36 s job that waited ~5 min for a matrix it
    # shares nothing with. Left serial — two small test files, so workers would
    # only add startup cost.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # `uv sync` compiles the analysis engine (bindings/python/, Rust) into opentide (maturin).
      # rustup installs the toolchain rust-toolchain.toml pins. No compiler cache:
      # macOS's and Windows's (a gigabyte each) crowded the Linux families every
      # pull request restores out of the 10 GB GitHub keeps (#841).
      - name: Set up Rust
        uses: ./.github/actions/rust-setup

      - name: Install dependencies
        run: uv sync --group dev

      - name: Console launcher and redirect smoke
        run: >-
          uv run pytest tests/test_cli/e2e/test_console_script_smoke.py
          -m cli_smoke -q --no-cov

      # Ctrl-C through the console script (opentide._cli:main, UC-3.8b, #960): a
      # CTRL_BREAK_EVENT to `serve` in a process group of its own; SIGTERM is POSIX's.
      - name: Ctrl-C through the console script
        run: >-
          uv run pytest tests/test_cli/e2e/test_launcher_signals_e2e.py
          -m cli_smoke -q --no-cov

  # opentidehq/vscode-extension pins the highlights zip, the browser build and
  # THIRD-PARTY-LICENSES.html of an engine release (pins.json): its own grammar
  # and engine scripts, at a pinned commit, must accept this run's assets as
  # they would a release of this repository.
  engine-release-consumers:
    name: Engine release assets in vscode-extension
    needs: [changes, release]
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/vscode-extension
          ref: 9888813d5484dffe663c9a57c07aad80a0897181
          path: vscode-extension
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: vscode-extension's grammar and engine scripts accept the assets
        run: >-
          node scripts/engine/check-vscode-extension.mjs
          vscode-extension release-assets "$(python3 scripts/engine/release.py tag)"
  # ---------------------------------------------------------------------------
  # The one required check.
  # ---------------------------------------------------------------------------

  # Passes when `changes` succeeded and every other job it needs either
  # succeeded or was skipped: a job is skipped exactly when `changes` found it
  # not needed (or its build was), and a failed or cancelled job fails the
  # gate. `always()`: a failed job must not skip this one, since a skipped
  # required check passes. Branch protection requires this name alone
  # (.github/AGENTS.md, "Required checks").
  gate:
    name: PR gate
    needs:
      - stubs
      - changes
      - lint
      - engine-lint
      - native
      - build
      - python
      - gitlab-ci-lint
      - docs
      - facade
      - node
      - wasm
      - grammars
      - textmate
      - deny
      - release
      - publish-dry-run
      - test-full
      - e2e-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {job: need["result"] for job, need in needs.items()
                 if need["result"] not in ("success", "skipped")}
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]
          for job, need in sorted(needs.items()):
              print(f"{need['result']:>9}  {job}")
          if bad:
              print(f"::error::failed or cancelled: {', '.join(sorted(bad))}")
              sys.exit(1)
          PY

  # The nightly's one issue: on a failure, open (or comment on) the issue
  # labelled `nightly-failure`, with the failing jobs; nothing when it passed.
  nightly-report:
    name: Nightly report
    needs:
      - changes
      - gate
      - engine-test-os
      - coverage
      - benchmarks
      - oracle
      - conformance
      - wasm
      - npm-install
      - elastic-sweep
      - fuzz-smoke
      - clients
      - bench
      - cli-windows-smoke
      - engine-release-consumers
    if: always() && needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed="$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url)): \(.conclusion)"')"
          if [[ -z "${failed}" ]]; then
            echo "The nightly passed."
            exit 0
          fi
          body="$(printf 'The nightly on %s (%s) failed: %s\n\n%s\n' "${REF}" "${SHA:0:12}" "${RUN_URL}" "${failed}")"
          echo "${body}" >> "$GITHUB_STEP_SUMMARY"
          gh label create nightly-failure --color B60205 --description "The nightly CI run failed" 2>/dev/null || true
          issue="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --body "${body}"
          else
            gh issue create --title "Nightly CI failure" --label nightly-failure --body "${body}"
          fi
