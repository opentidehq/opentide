name: CI
# A push's run names the commit's first line, which for a merge is "Merge pull
# request #N from ...": a failure on a base branch names the pull request
# that brought it.
run-name: >-
  ${{ github.event_name == 'push'
  && format('CI on {0}: {1}', github.ref_name, github.event.head_commit.message)
  || '' }}

# One workflow, four tiers (.github/AGENTS.md, "What runs where";
# tests/test_ci/test_ci_scope.py). `changes` decides which, and what each
# run checks (scripts/ci/changes.py):
#
# - The PR gate, on a pull request into integration/unified-core,
#   development or train/*: Linux only, and only what the change affects.
#   The changed workspace crates and their reverse dependencies are built
#   ONCE (`build`: a nextest archive of their tests and the `_native`
#   extension), and every other job runs from that build: the Rust tests in
#   partitions of the archive, the Python suite and E2E on the prebuilt
#   extension. Each specialised job (Node, WASI, grammars, TextMate, GitLab CI
#   lint, the facade's semver checks, cargo deny, docs) runs only when its
#   paths change. One required check, `PR gate`, passes when every job that
#   was needed passed and every other was skipped.
# - A push to a base branch, and Run workflow (scope `full`): the same jobs
#   with every path filter on, Linux only. This keeps the trunk fully checked.
# - A release pull request (into development from integration/unified-core
#   or release/*, or labelled `release`), and Run workflow (scope `release`):
#   the gate plus every package on every target, an install smoke test of
#   each on its OS, the publish dry run and the docs.
# - The nightly (schedule, and Run workflow with scope `nightly`): everything
#   above, plus macOS and Windows, Python 3.10-3.13, the full E2E set, the
#   packages, fuzz smoke, coverage, benchmarks, the vendor-parser oracles,
#   the schema checks, the Elastic sweep and the rest. It never gates; a
#   failure opens or updates one issue labelled `nightly-failure`.
#
# Byte-for-byte comparison with the frozen Python CLI is no requirement
# anywhere: the oracle's comparisons (golden, corpus, MCP replay, the payload,
# config, validate and lint diffs) run by hand only (`cargo xtask golden`,
# `compare`, `corpus`; the replay tests are #[ignore]d), tests/golden/README.md.

on:
  push:
    # integration/unified-core: the Unified Core PRs merge there before development.
    # train/*: a release train that pull requests target; its pushes save
    # the caches those pull requests restore (a pull request reads only its base
    # branch's caches and the default branch's).
    branches: [main, development, integration/unified-core, "train/*"]
  pull_request:
    branches: [integration/unified-core, development, "train/*"]
    # `labeled`: labelling a pull request `release` runs the release tier.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      scope:
        description: "full: the push's jobs (Linux, everything); release: plus every package and smoke test; nightly: the nightly set"
        type: choice
        options: [full, release, nightly]
        default: full
  schedule:
    # Nightly on the default branch (development).
    - cron: "11 1 * * *"

concurrency:
  # A pull request's new push cancels its stale run; every other run (a push
  # to a base branch, the nightly, Run workflow) has a group of its own, its
  # run id, so none cancels another and each push to a base branch gets a
  # complete run (tests/test_ci/test_concurrency.py).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The Python of the gate's Python jobs (and the coverage gate).
  COVERAGE_PYTHON: "3.14"

# Compiler caches (tests/test_ci/test_rust_caches.py): sccache (RUSTC_WRAPPER)
# in .sccache/, kept by actions/cache under
# `sccache-<family>-<hash of rust-toolchain.toml>-<ISO week>`, restored with the
# family and toolchain as restore-keys and saved by exactly one job, from a
# push (or the nightly, for the nightly's families), only when the key missed:
# once a week. sccache is content-addressed, so a copy a few days old still
# serves every crate that did not change. Linux only.
#
#   build           `build`: the test archive, xtask, the language server and
#                   the `_native` extension (the gate's one build)
#   engine-check    `engine-lint`: clippy and rustdoc
#   wasi            `wasi`: the WASI module
#   full-set-Linux  `node`, `facade` and the nightly's Linux Rust jobs:
#                   `conformance` saves it, by the nightly and on pushes to
#                   development and integration/unified-core
#
# The one rust-cache left: `fuzz` (fuzz-smoke). macOS and Windows build
# without one: theirs crowded the Linux families out of the 10 GB (#841).

jobs:

  # What this run checks: the tier, the affected crates and the areas
  # (scripts/ci/changes.py). Standard library and `cargo metadata --no-deps`
  # only, so it takes seconds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      release: ${{ steps.plan.outputs.release }}
      crates: ${{ steps.plan.outputs.crates }}
      packages: ${{ steps.plan.outputs.packages }}
      features: ${{ steps.plan.outputs.features }}
      partitions: ${{ steps.plan.outputs.partitions }}
      build: ${{ steps.plan.outputs.build }}
      rust: ${{ steps.plan.outputs.rust }}
      python: ${{ steps.plan.outputs.python }}
      lint: ${{ steps.plan.outputs.lint }}
      docs: ${{ steps.plan.outputs.docs }}
      node: ${{ steps.plan.outputs.node }}
      wasi: ${{ steps.plan.outputs.wasi }}
      grammars: ${{ steps.plan.outputs.grammars }}
      textmate: ${{ steps.plan.outputs.textmate }}
      gitlab: ${{ steps.plan.outputs.gitlab }}
      facade: ${{ steps.plan.outputs.facade }}
      deny: ${{ steps.plan.outputs.deny }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's head and base, for `git diff base...head`.
          fetch-depth: 0
          persist-credentials: false
      - name: What this run checks
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The runner's stable cargo reads the manifests: no toolchain install.
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/ci/changes.py

  # ruff, ty (on the checked-in stubs of `_native`: no Rust build), actionlint,
  # the sdist and twine, the skills and the engine's invariant scripts.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tools and the dependencies, not opentide itself: nothing compiles.
      - name: Install dependencies
        run: uv sync --group dev --no-install-project

      # The sdist first: hatch-vcs writes src/opentide/_version.py, which ty
      # resolves; the engine is compiled for a wheel only.
      - name: Build the sdist
        run: uv build --sdist

      - name: Ruff check
        run: uv run --no-sync ruff check src/opentide tests scripts --output-format github

      - name: Ruff format
        run: uv run --no-sync ruff format --check src/opentide tests scripts

      # src/opentide/_native/*.pyi stand for the extension.
      - name: Ty type check
        run: uv run --no-sync ty check src/opentide --output-format github

      # The workflows themselves, with shellcheck over their scripts;
      # .github/actionlint.yaml names what this version does not know.
      - name: actionlint
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "${RUNNER_TEMP}/bin/actionlint" -color

      - name: Twine check
        run: uvx twine check dist/*

      - name: Engine invariants (I/O-free crates, names, skills)
        run: |
          bash scripts/engine/check-io-free.sh
          bash scripts/engine/check-names.sh
          bash scripts/engine/validate-skills.sh

      - name: The engine release script's tests
        run: python -m unittest discover -s scripts/engine -p "test_*.py"

  # rustfmt, clippy and rustdoc, workspace-wide whatever changed: with a warm
  # cache, clippy re-checks only what changed.
  engine-lint:
    name: Engine lint (fmt, clippy, doc)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml pins, with the rustfmt and clippy it lists.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: rustfmt
        run: cargo fmt --all --check

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-engine-check-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-engine-check-${{ hashFiles('rust-toolchain.toml') }}-

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Broken intra-doc links and the like fail the build.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --locked

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      - name: Save the compiler cache
        if: github.event_name == 'push' && steps.sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-engine-check-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}

  # The gate's one build. The affected crates' tests as a nextest archive,
  # xtask and the language server, and the `_native` extension, with one
  # compiler cache; uploaded first, so the test jobs start while this job
  # goes on to what needs its target directory: the generated-artifact and
  # layer checks, the doctests, and opentide-schema's compile-fail cases.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # mold links the test binaries, the build's longest step warm.
      RUSTFLAGS: "-Dwarnings -Clink-arg=-fuse-ld=mold"
      # Line tables, not full debuginfo: backtraces keep file:line, and the
      # archive stays small.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
      # One interpreter for PyO3's configuration: the binding is abi3, so the
      # extension serves every Python from 3.10.
      PYO3_PYTHON: /usr/bin/python3
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      SCCACHE_IDLE_TIMEOUT: "0"
      RUST: ${{ needs.changes.outputs.rust }}
      PYTHON: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.gitlab == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.mode == 'nightly' }}
      PACKAGES: ${{ needs.changes.outputs.packages }}
      FEATURES: ${{ needs.changes.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent: the compile-fail cases'
          # inputs are read from what the pull request changed.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0,cargo-nextest@0.9.148

      - name: Install mold
        run: sudo apt-get install -y -q --no-install-recommends mold || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mold; }

      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-build-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-build-${{ hashFiles('rust-toolchain.toml') }}-

      # As hatch_build.py builds it, in the profile the tests are built in, first:
      # the Python jobs start while the tests build, on the same dependencies.
      - name: Build the _native extension
        if: env.PYTHON == 'true'
        env:
          PYO3_BUILD_EXTENSION_MODULE: "1"
        run: |
          cargo build --locked -p opentide-native --lib
          mkdir -p "${RUNNER_TEMP}/native"
          cp target/debug/lib_native.so "${RUNNER_TEMP}/native/_native.abi3.so"

      - name: Upload the _native extension
        if: env.PYTHON == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: ${{ runner.temp }}/native/_native.abi3.so
          retention-days: 3

      # The affected crates' test binaries, with the binaries their tests run
      # (CARGO_BIN_EXE_*) and their build scripts' output.
      - name: Build the Rust tests (nextest archive)
        if: env.RUST == 'true'
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest archive --locked "${pkg_args[@]}" "${feature_args[@]}" --archive-file "${RUNNER_TEMP}/tests.tar.zst"

      - name: Upload the test archive
        if: env.RUST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 3
          compression-level: 0

      # --- With the test jobs running: what needs this target directory. ---

      - name: Build xtask and the language server
        if: env.RUST == 'true'
        run: cargo build --locked -p xtask -p opentide-lsp

      # Every dependency between workspace crates points down the layer table
      # (xtask/layers.toml).
      - name: Crate layers
        if: env.RUST == 'true'
        run: target/debug/xtask check-layers

      # The deploy cassettes (tests/cassettes): one per scenario of
      # scenarios.toml, none edited by hand. It reads the files only.
      - name: Deploy cassettes
        if: env.RUST == 'true'
        run: target/debug/xtask cassettes check

      # The artifacts generated from the Rust model are the committed ones:
      # the platform and editor templates, the editor schemas, the language
      # server's catalogs and the diagnostics reference. `--oracle` (the
      # comparisons with the oracle's recordings) runs by hand only.
      - name: Generated artifacts
        if: env.RUST == 'true'
        run: target/debug/xtask codegen --check

      - name: Generated highlights
        if: env.RUST == 'true'
        run: target/debug/opentide-lsp generate-highlights --check

      # The vocabulary bundle and pins against the specifications repository,
      # and the models' field descriptions against its field tables: when
      # their inputs change, and on every push and nightly.
      - name: Whether the specifications are read
        id: specs
        if: env.RUST == 'true'
        env:
          MODE: ${{ needs.changes.outputs.mode }}
        run: |
          set -euo pipefail
          vocab=true; fields=true
          if [[ "${MODE}" == pr ]] && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            grep -qE '^(src/opentide/data/vocabulary/.*\.vocab\.toml|src/opentide/data/pins/.*\.toml|data/specifications\.lock\.json|xtask/src/vocab/sync\.rs)$' <<<"${changed}" || vocab=false
            grep -qE '^(crates/opentide-schema/src/objects/.*|xtask/src/spec_fields\.rs)$' <<<"${changed}" || fields=false
          fi
          echo "vocab=${vocab}" >> "$GITHUB_OUTPUT"
          echo "fields=${fields}" >> "$GITHUB_OUTPUT"

      - name: Checkout specifications
        if: steps.specs.outputs.vocab == 'true' || steps.specs.outputs.fields == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/specifications
          ref: main
          path: specifications
          persist-credentials: false

      # Without a specifications clone, --check would only compare the
      # lockfile with the bundle.
      - name: Vocabulary and pin sync drift
        if: steps.specs.outputs.vocab == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
        run: target/debug/xtask vocab sync --check

      # It exits 2 without a checkout and 1 when fewer than 100 rows match a
      # field, so it cannot pass by not running.
      - name: Model field descriptions against the specifications
        if: steps.specs.outputs.fields == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
        run: target/debug/xtask spec-fields

      # nextest runs no doctests.
      - name: Doctests
        if: env.RUST == 'true'
        run: |
          read -ra pkg_args <<< "${PACKAGES}"
          read -ra feature_args <<< "${FEATURES}"
          cargo test --locked --doc "${pkg_args[@]}" "${feature_args[@]}"

      # opentide-schema's compile-fail cases (trybuild) compile at test time,
      # so they run here, where the dependencies are: when their inputs (the
      # derive, the crate, the cases, the toolchain) change, and on every
      # push and nightly.
      - name: Whether to run opentide-schema's compile-fail cases
        id: ui
        if: env.RUST == 'true'
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          UI_PATHS: |
            crates/opentide-schema-derive/*
            crates/opentide-schema/src/*
            crates/opentide-schema/tests/ui*
            crates/opentide-schema/Cargo.toml
            Cargo.lock
            rust-toolchain.toml
        run: |
          set -euo pipefail
          run=true
          if [[ "${MODE}" == pr ]] && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            run=false
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              while IFS= read -r pattern; do
                # Unquoted on the right: a pattern, not a string.
                # shellcheck disable=SC2053
                if [[ -n "${pattern}" && "${file}" == ${pattern} ]]; then
                  echo "compile-fail input changed: ${file}"
                  run=true
                fi
              done <<<"${UI_PATHS}"
            done < <(git diff --no-renames --name-only HEAD^1 HEAD)
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: opentide-schema's compile-fail cases
        if: steps.ui.outputs.run == 'true'
        run: cargo nextest run --locked --profile ci -p opentide-schema --features opentide-schema/python -E 'binary_id(opentide-schema::ui)'

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      - name: Save the compiler cache
        if: github.event_name == 'push' && steps.sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-build-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}

  # The affected crates' tests, from the build's archive, in partitions
  # (`changes` picks two when the heavy crates are affected, else one). No
  # compilation: nextest runs the archived binaries against this checkout.
  rust-tests:
    name: Rust tests (${{ matrix.partition }}/${{ strategy.job-total }})
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.partitions) }}
    env:
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
      # The test that compares with Python's difflib runs this interpreter.
      OPENTIDE_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv for the tests that provision a tool with it; nothing is synced.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # cargo and rustc for the tests that run them (xtask's).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.148

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      # A test writes under a temporary folder, never in the checkout (#931).
      - name: Note the checkout's state
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-before"

      # The compile-fail cases run in `build`, which has their dependencies.
      - name: cargo nextest (profile ci)
        env:
          PARTITION: ${{ matrix.partition }}
          TOTAL: ${{ strategy.job-total }}
        run: >-
          cargo nextest run --profile ci
          --archive-file "${RUNNER_TEMP}/tests.tar.zst"
          --workspace-remap "${GITHUB_WORKSPACE}"
          --partition "count:${PARTITION}/${TOTAL}"
          --no-tests=pass
          -E 'not binary_id(/^opentide-schema::ui$/)'

      - name: The tests left the checkout as they found it
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-after"
          if ! diff -u "$RUNNER_TEMP/tree-before" "$RUNNER_TEMP/tree-after"; then
            echo "::error::A test wrote into the checkout (lines starting with +): write under a temporary folder (tempfile::tempdir) instead."
            exit 1
          fi

      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate.
        continue-on-error: true
        with:
          name: nextest-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # What the Python package holds: the SDK, the models, the plugin API, the
  # console script, the docs' snippets and CI's contracts, on the build's
  # `_native` extension, with the coverage gate.
  python:
    name: Python (3.14, coverage)
    needs: [changes, build]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      code-quality: write
    env:
      OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
    steps:
      # The pull request's head commit (not the merge commit), so coverage
      # line numbers map to the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      # hatch_build.py installs the prebuilt extension (OPENTIDE_ENGINE_PREBUILT):
      # nothing compiles.
      - name: Install dependencies
        run: uv sync --group dev

      # `-n 4` for the runner's four cores. Coverage is combined across the
      # xdist workers by pytest-cov, so the gate reads the same number as a
      # serial run.
      - name: Pytest with coverage
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ \
            -m "not cli_e2e and not cli_smoke and not gitlab_ci_lint" \
            -n 4 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Enforce coverage threshold
        run: uv run coverage report

      - name: Upload coverage to GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Pytest (${{ env.COVERAGE_PYTHON }})
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

  # The console script end to end (CLI, MCP and LSP over stdio), on the
  # build's extension, in two shards balanced by .test_durations_e2e (a test
  # missing from it is assigned the average). `-n 4`: measured, more workers
  # hit a memory cliff on the 4-vCPU runner. The tests marked `full_set` (a
  # wheel built per test) run in the nightly.
  e2e:
    name: E2E (3.14, ${{ matrix.shard }}/2)
    needs: [changes, build]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the length of this list equal to `--splits` below
        # (tests/test_ci/test_own_ci_workflow.py).
        shard: [1, 2]
    env:
      OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      - name: Install dependencies
        run: uv sync --group dev

      - name: E2E pytest (CLI + MCP stdio)
        run: >-
          uv run pytest tests/ -m "(cli_e2e or cli_smoke) and not full_set" -q --no-cov -n 4
          --splits 2
          --group ${{ matrix.shard }}
          --durations-path .test_durations_e2e

  # The pipeline `opentide setup ci gitlab` renders, linted with glint and
  # gitlab-ci-verify: when the renderer, the test or the linters change.
  gitlab-ci-lint:
    name: GitLab CI lint
    needs: [changes, build]
    if: needs.changes.outputs.gitlab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install GitLab CI linters
        run: |
          bash scripts/install-gitlab-ci-linters.sh "${RUNNER_TEMP}/gitlab-ci-linters"
          echo "${RUNNER_TEMP}/gitlab-ci-linters" >> "$GITHUB_PATH"

      - name: Lint generated GitLab CI
        run: uv run pytest tests/test_ci/test_gitlab_pipeline_lint.py -m gitlab_ci_lint -q --no-cov
        env:
          OPENTIDE_GITLAB_CI_LINT: "1"

  # The documentation's structure (Fumadocs-ready content; the site builds in
  # opentidehq/website). A docs-only pull request runs this job alone.
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Fumadocs-ready content
        run: scripts/validate-docs.sh


  # The opentide facade crate (UC-5.1, #836) with every feature: its tests and
  # doctests (the `opentide` binary's `--json commands` against the PyPI CLI's
  # recording, `cli::run_json`, the language server), its docs as docs.rs
  # builds them, and its API against the branch it merges into
  # (cargo-semver-checks). engine-test runs its default features on every
  # pull request; this job builds opentide-cli and opentide-lsp a second time
  # with the facade's features, so it is in the full set.
  facade:
    name: Facade crate (every feature, docs, semver checks)
    needs: changes
    if: needs.changes.outputs.facade == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent (a pull request's base
          # branch, or the branch before a push): the semver baseline.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Tests and doctests, every feature
        run: cargo test -p opentide --all-features --locked

      # docs.rs builds every feature (`[package.metadata.docs.rs]`).
      - name: rustdoc, every feature
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p opentide --all-features --no-deps --locked

      # Against the first parent until the crate is on crates.io; then the
      # last published version is the baseline (docs/sdk/rust.md, Stability).
      # A commit that adds the crate has no baseline to compare with. The
      # baseline is checked out on its own and only its crates/opentide is
      # handed over: --baseline-rev searches the whole tree for the package,
      # and publishing/placeholders/crates/opentide is a second `opentide`.
      - name: API against the base (cargo semver-checks)
        run: |
          baseline="$(git rev-parse HEAD^1)"
          if git cat-file -e "${baseline}:crates/opentide/Cargo.toml" 2>/dev/null; then
            git worktree add --detach "${RUNNER_TEMP}/opentide-baseline" "${baseline}"
            # -p names the crate: semver-checks skips a `publish = false`
            # crate it is not asked for by name, and still exits 0.
            cargo semver-checks -p opentide --manifest-path crates/opentide/Cargo.toml --all-features \
              --baseline-root "${RUNNER_TEMP}/opentide-baseline/crates/opentide"
          else
            echo "::notice::crates/opentide is new in this change: no baseline API to check against"
          fi

  # The Node binding (bindings/node, UC-5.3, #838): @opentide/opentide built
  # with napi-rs for linux-x64-gnu (the other seven targets are declared, and
  # built and installed in UC-5.3b); the loader and declarations napi-rs
  # generates against the committed ones; the package's tests (the SDK, the
  # bin, the packages, the TypeScript page's snippets and a `tsc --noEmit`
  # consumer); and its command line against this repository's console
  # script's: `--json commands` byte for byte. Nightly and on Run workflow.
  # (`cargo xtask golden check --runner node`, the ported golden cases
  # through the Node bin, is no gate since the oracle policing left CI; it
  # stays runnable by hand.)
  node:
    name: Node package (napi-rs build, tests)
    needs: [changes, build]
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      # The other side of the comparisons: this repository's PyPI CLI, whose
      # version the addon is built to report, so that the two documents can
      # be equal byte for byte.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native

      # On the build's extension (hatch_build.py, OPENTIDE_ENGINE_PREBUILT).
      - name: Install this repository's CLI
        env:
          OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
        run: |
          uv sync --group dev
          echo "OPENTIDE_VERSION=$(.venv/bin/opentide --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # The develop profile (optimised, without the release profile's
      # link-time optimisation), as `uv sync` builds the Python binding.
      - name: Build the addon (linux-x64-gnu)
        working-directory: bindings/node
        run: node build.mjs --profile develop

      - name: The generated loader and declarations are the committed ones
        run: |
          if ! git diff --exit-code -- bindings/node/index.js bindings/node/index.d.ts; then
            echo "::error::bindings/node/index.js or index.d.ts differs from what napi-rs generates: run \`npm run build\` in bindings/node and commit them."
            exit 1
          fi

      - name: The package's tests
        working-directory: bindings/node
        run: npm test

      # The issue's acceptance criterion: the same command tree, byte for
      # byte, but for the run's own wall time (`duration_ms`).
      - name: npx --json commands is the PyPI CLI's
        working-directory: bindings/node
        run: |
          zero='s/"duration_ms":[0-9]+/"duration_ms":0/g'
          npx --no-install . --json commands | sed -E "$zero" > "$RUNNER_TEMP/node.json"
          ../../.venv/bin/opentide --json commands | sed -E "$zero" > "$RUNNER_TEMP/pypi.json"
          cmp "$RUNNER_TEMP/node.json" "$RUNNER_TEMP/pypi.json"

  # The WASI build of the command line, the one module the VS Code extension
  # runs (ADR 0007's amendment): wasm32-wasip1 with the wasi-sdk
  # build-wasm.sh pins, its deflated size held to the .vsix's 15 MiB, and
  # tenant commands through the module with @opentide/wasi-host performing
  # their requests from the cassettes. Nightly and on Run workflow.
  # (`cargo xtask golden check --runner wasi`, every golden case through the
  # module, is no gate since the oracle policing left CI; it stays runnable
  # by hand.)
  wasi:
    name: WASI command line (size, serve)
    needs: changes
    if: needs.changes.outputs.wasi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0,wasmtime@33.0.0
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # A family of its own (#841): the module's crates for wasm32-wasip1 in
      # the `wasi` profile, which no other job builds. Saved by the nightly
      # (and pushes to development), whose caches every branch reads.
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-wasi-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-wasi-${{ hashFiles('rust-toolchain.toml') }}-

      # Builds target/wasm32-wasip1/wasi/opentide.wasm and fails over the
      # budget; the sizes go to the step summary.
      - name: The WASI module and its size
        run: bash scripts/engine/build-wasm.sh cli

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The cases that need the network, through the WASI module: tenant
      # commands under `opentide serve` in Node's WASI, every request made by
      # @opentide/wasi-host's FetchHost and answered from the golden cassettes
      # (no network in the module; the extension host performs the requests).
      - name: Tenant commands through the host's opentide/fetch, in the WASI module
        env:
          OPENTIDE_WASI_CLI: target/wasm32-wasip1/wasi/opentide.wasm
        run: |
          (cd packages/wasi-host && npm ci)
          node --experimental-strip-types --test --test-name-pattern='^serve \(wasi\)' packages/wasi-host/src/index.test.ts

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      - name: Save the compiler cache
        if: (github.event_name == 'schedule' || github.ref == 'refs/heads/development') && steps.sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-wasi-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}

  # The vendored parser.c of every grammar is what tree-sitter-cli generates
  # from its grammar.js (crates/AGENTS.md: never hand-edited).
  grammars:
    name: Grammars regenerate
    needs: changes
    if: needs.changes.outputs.grammars == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --prefix /tmp/ts-cli tree-sitter-cli@0.25.10
      - run: bash scripts/engine/check-grammars.sh

  # The generated grammars as VS Code reads them (language-server#171).
  textmate:
    name: TextMate grammars (vscode-textmate)
    needs: changes
    if: needs.changes.outputs.textmate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: TextMate grammars (vscode-textmate)
        working-directory: highlights/test
        run: npm ci && npm test

  # The supply-chain gate (#843, deny.toml): licences of what we ship,
  # RustSec advisories (vulnerable, unsound, unmaintained, yanked), a second
  # version of a shipped crate, OpenSSL, and any source but crates.io. fuzz/
  # (its own lock, never shipped) is checked for advisories, bans and
  # sources with the same deny.toml; the publishing/ placeholder crate (its
  # own lock, published) for everything. The advisory database is fetched fresh,
  # so a new advisory fails the next pull request until it is fixed or
  # excepted with a reason in deny.toml. cargo-deny is the prebuilt release,
  # checksum-checked, at the version pinned here.
  deny:
    name: Supply chain (cargo deny)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # cargo-deny only reads `cargo metadata`, but every cargo job here denies
    # warnings (tests/test_ci/test_one_ci.py).
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins: cargo-deny reads the graph with
      # `cargo metadata`.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: cargo deny (workspace)
        run: cargo deny --config deny.toml --locked check
      - name: cargo deny (fuzz/)
        run: cargo deny --config deny.toml --manifest-path fuzz/Cargo.toml --locked check advisories bans sources
      # The crate that reserves `opentide` on crates.io: a workspace and lock of
      # its own, published, so every check applies.
      - name: cargo deny (publishing/ placeholder crate)
        run: cargo deny --config deny.toml --manifest-path publishing/placeholders/crates/opentide/Cargo.toml --locked check

  # ---------------------------------------------------------------------------
  # The release tier: a release pull request, Run workflow with scope
  # `release`, and the nightly (the packages only). Every package on every
  # target, then each installed on its OS as a user installs it.
  # ---------------------------------------------------------------------------

  # The sdist, for its build smoke test (`lint` checks it with twine).
  sdist:
    name: Sdist
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # A build from the sdist, with the runner image's stable Rust (the sdist
  # leaves rust-toolchain.toml out), as on a platform without a wheel; as
  # publish.yml's smoke-sdist.
  smoke-sdist:
    name: Smoke build from the sdist
    needs: [changes, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: ${{ runner.temp }}/sdist
      - name: pip install the sdist, then the version, validate on the tide corpus and the SDK
        run: |
          set -euo pipefail
          cargo --version
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install --quiet --no-binary opentide "${RUNNER_TEMP}"/sdist/opentide-*.tar.gz
          version="$("${RUNNER_TEMP}/venv/bin/python" -c 'import importlib.metadata as m; print(m.version("opentide"))')"
          "${RUNNER_TEMP}/venv/bin/python" -I scripts/build/smoke_package.py "${version}"

  # The wheels and the npm tarballs a release builds (build-packages.yml,
  # which publish.yml calls too), at a development version of the
  # workspace's (PyPI X.Y.Z.devN, npm X.Y.Z-dev.N), kept 14 days as this run's
  # artifacts (docs/internal/publishing.md, "Testing a build without
  # publishing"). Each wheel is installed and run on its platform as it is
  # built ([tool.cibuildwheel]).
  packages:
    name: Installable packages
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/build-packages.yml
    with:
      revision: ${{ github.sha }}
      retention-days: 14

  # `pip install` each wheel on its OS, then scripts/build/smoke_package.py,
  # as publish.yml's smoke-wheel.
  smoke-wheel:
    name: Smoke pip install (${{ matrix.os }})
    needs: [changes, packages]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      PYPI_VERSION: ${{ needs.packages.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/wheels
          pattern: wheels-*
          merge-multiple: true
      - name: pip install, then the version, validate on the tide corpus and the SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/venv"
          if [[ -x "${RUNNER_TEMP}/venv/Scripts/python.exe" ]]; then bin="${RUNNER_TEMP}/venv/Scripts"; else bin="${RUNNER_TEMP}/venv/bin"; fi
          "${bin}/python" -m pip install --quiet --find-links "${RUNNER_TEMP}/wheels" --only-binary opentide "opentide==${PYPI_VERSION}"
          "${bin}/python" -I scripts/build/smoke_package.py "${PYPI_VERSION}"

  # The npm packages installed from a throwaway local registry on each OS, as
  # publish.yml's smoke-npm (scripts/engine/npm-local-registry/test.mjs).
  smoke-npm:
    name: Smoke npm install (${{ matrix.os }})
    needs: [changes, packages]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NPM_VERSION: ${{ needs.packages.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
      - name: Publish to a local registry, npm install, npx, SDK and types
        shell: bash
        run: node scripts/engine/npm-local-registry/test.mjs --version "${NPM_VERSION}" --tarballs "${RUNNER_TEMP}/npm"

  # The GitHub Release's assets (the `opentide` and `opentide-lsp` binaries per
  # target, their installers, the WebAssembly builds, the SBOMs, SHA256SUMS),
  # built as publish.yml builds them, with the workspace version's tag.
  engine-release-dry-run:
    name: Engine release (dry run)
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/engine-release-build.yml
    with:
      dry-run: true

  # The binary installers against the assets this run built, on each OS, as
  # publish.yml's smoke-installer.
  smoke-installer:
    name: Smoke binary installer (${{ matrix.os }})
    needs: [changes, engine-release-dry-run]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.engine-release-dry-run.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: opentide-installer.sh, then opentide --version
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          OPENTIDE_DOWNLOAD_URL="file://$(pwd)/release-assets" OPENTIDE_INSTALL_DIR="${RUNNER_TEMP}/bin" \
            sh release-assets/opentide-installer.sh
          out="$("${RUNNER_TEMP}/bin/opentide" --version)"
          echo "${out}"
          grep -qF "${VERSION}" <<< "${out}"
          "${RUNNER_TEMP}/bin/opentide-lsp" --version
      - name: opentide-installer.ps1, then opentide --version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:OPENTIDE_DOWNLOAD_URL = (Resolve-Path release-assets).Path
          $env:OPENTIDE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          & ./release-assets/opentide-installer.ps1
          $out = & (Join-Path $env:OPENTIDE_INSTALL_DIR 'opentide.exe') --version
          Write-Output $out
          if (-not ($out -like "*$env:VERSION*")) { throw "opentide --version printed $out, not $env:VERSION" }
          & (Join-Path $env:OPENTIDE_INSTALL_DIR 'opentide-lsp.exe') --version

  # `cargo install opentide --features cli` from the crates' packages
  # (engine-package), before crates.io has this version, as publish.yml's
  # smoke-cargo.
  smoke-cargo:
    name: Smoke cargo install opentide --features cli
    needs: [changes, engine-package]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates
          path: crates-packages
      - name: cargo install from the packages, then opentide --version
        run: |
          set -euo pipefail
          version="$(python3 scripts/engine/release.py version)"
          config="$(python3 scripts/engine/release.py crate-patch crates-packages "${RUNNER_TEMP}/packages")"
          cargo install --config "${config}" --path "${RUNNER_TEMP}/packages/opentide-${version}" \
            --features cli --debug --root "${RUNNER_TEMP}/cargo"
          out="$("${RUNNER_TEMP}/cargo/bin/opentide" --version)"
          echo "${out}"
          grep -qF "${version}" <<< "${out}"

  # Every publish this repository makes, rehearsed with --dry-run and no
  # token (publish-dry-run.yml).
  publish-dry-run:
    name: Publish dry run
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-dry-run.yml

  # ---------------------------------------------------------------------------
  # The nightly set: never on a pull request or a push, so it never gates.
  # ---------------------------------------------------------------------------

  # The workspace's tests on macOS and Windows, built there (no archive
  # crosses an OS), without a compiler cache.
  engine-test-os:
    name: Engine tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
      OPENTIDE_PYTHON: python
      FEATURES: ${{ needs.changes.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo nextest (profile ci)
        shell: bash
        run: |
          read -ra feature_args <<< "${FEATURES}"
          cargo nextest run --locked --profile ci --workspace "${feature_args[@]}"
      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # The other supported Pythons, the oldest (3.10) included, on the build's
  # abi3 extension: `python`'s run without coverage.
  test-full:
    name: Python (${{ matrix.python-version }})
    needs: [changes, build]
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native
      - name: Install dependencies
        run: uv sync --group dev
      - name: Pytest
        run: uv run pytest tests/ --no-cov -q -n 4 -m "not cli_e2e and not cli_smoke and not gitlab_ci_lint"

  # The E2E tests too slow for every pull request, marked `full_set`: the
  # platform plugin on opentide installed from its wheel (UC-4.5c, #835),
  # whose `uv build` alone takes minutes.
  e2e-full:
    name: E2E (3.14, full set)
    needs: [changes, build]
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENTIDE_ENGINE_PREBUILT: ${{ github.workspace }}/.native/_native.abi3.so
      PYO3_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}
      # The tests build wheels of their own.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: .native
      - name: Install dependencies
        run: uv sync --group dev
      - name: E2E pytest (full set)
        run: uv run pytest tests/ -m full_set -q --no-cov

  # Coverage, the benchmarks, the vendor-parser oracles (Kusto.Language,
  # Splunk, Elasticsearch, Lucene, Falco) and the schema checks: workflows of
  # their own, run as part of the nightly.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/coverage.yml

  benchmarks:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
      # bench.yml reads the base branch's last result (gh run list, download).
      actions: read
    uses: ./.github/workflows/bench.yml

  oracle:
    name: Vendor-parser oracles
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/oracle.yml
    secrets: inherit

  schema:
    name: Schema
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    permissions:
      contents: read
    uses: ./.github/workflows/schema.yml


  # Every engine crate builds from its packaged sources, as it will from
  # crates.io: a crate that reads a file outside OPENTIDE_ASSETS fails here, not
  # at release. The binding (bindings/python/, opentide-native), the tooling (xtask)
  # and the differential comparator (opentide-compare, which only they use)
  # are not crates to publish. The packages carry the embedded catalogs, so the licence scan
  # catches an oracle reference here rather than at release time.
  engine-package:
    name: Engine crates package and licence scan
    needs: changes
    if: needs.changes.outputs.release == 'true' || needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A compiler warning fails the build, as in engine-ci.yml (workflow-wide there).
      RUSTFLAGS: "-Dwarnings"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/engine/release.py vendor
      # Every crate the release train publishes (publish.yml, UC-5.5), built
      # from its package. Left out: the members with `publish = false` (the
      # PyO3 and Node.js bindings, xtask, the test harnesses opentide-compare
      # and opentide-cassette, and opentide-wasm, which ships as a release
      # asset), whose sources are scanned instead
      # (tests/test_ci/test_own_ci_workflow.py holds both to it). opentide-cli
      # carries opentide's package data, its explain pages, as the wheel does:
      # scanned as a product (license-scan.sh --product).
      - run: cargo package --locked --workspace --exclude opentide-native --exclude xtask --exclude opentide-compare --exclude opentide-cassette --exclude opentide-wasm --exclude opentide-node --allow-dirty
      - name: license scan (no oracle references)
        run: |
          set -euo pipefail
          find target/package -maxdepth 1 -name '*.crate' ! -name 'opentide-cli-*' -print0 | xargs -0 bash scripts/engine/license-scan.sh
          bash scripts/engine/license-scan.sh --product target/package/opentide-cli-*.crate
          bash scripts/engine/license-scan.sh crates/opentide-compare crates/opentide-cassette crates/opentide-wasm bindings/node bindings/python
      # For smoke-cargo, in the release tier.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 14


  # The cross-SDK conformance suite (UC-5.4, #839): every operation of
  # tests/conformance/manifest.json on the tide corpus, the heavy workspace,
  # the fault workspace and each configuration fault, through the Rust, Python
  # and Node SDKs, byte for byte (`cargo xtask conformance`); then the suite's
  # own test, a deliberate divergence of one runner that it must catch. On the
  # three operating systems. It builds the facade three times (the Python and
  # Node bindings, the Rust runner), so it is in the full set.
  conformance:
    name: SDK conformance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        if: runner.os == 'Linux'
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      # The Python SDK: opentide._native, the develop profile.
      - name: Install dependencies
        run: uv sync --group dev

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # The Node SDK, the develop profile as the Python binding's, reporting
      # the workspace's version as the Rust and Python builds do (the npm
      # package's own is 0.0.0 until the release sets it).
      - name: Build the addon
        working-directory: bindings/node
        shell: bash
        run: |
          OPENTIDE_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../Cargo.toml | head -n 1)"
          export OPENTIDE_VERSION
          node build.mjs --profile develop

      # rust-cache saves target/ and restores it on the next run without the
      # marker of the runs' folder, target/conformance, which `conformance`
      # then refuses to empty: a restored copy is no run of this job's.
      - name: Drop a restored runs' folder
        shell: bash
        run: rm -rf target/conformance

      - name: Every operation on every corpus, byte for byte
        run: cargo xtask conformance --runners rust,python,node

      - name: A divergence in one runner is caught
        run: cargo xtask conformance --runners rust,python,node --corpus tide_corpus --diverge node

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate.
        continue-on-error: true
        with:
          name: conformance-${{ matrix.os }}
          path: target/conformance/report.json
          if-no-files-found: ignore

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      # The full set's Linux compiler cache, which the other full-set jobs
      # restore: saved by the nightly and pushes to development (the default
      # branch, whose caches every branch reads), and by pushes to
      # integration/unified-core, whose full set is the one that runs while
      # development's ci.yml predates this family (it saves none, so every
      # full-set job built cold there, #841). Once a week. Not on a release
      # train: a copy per base branch did not fit beside the core families
      # in the 10 GB GitHub keeps.
      - name: Save the compiler cache
        if: (github.event_name == 'schedule' || github.ref == 'refs/heads/development' || github.ref == 'refs/heads/integration/unified-core') && steps.sccache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}

  # scripts/engine/build-wasm.sh builds both WebAssembly artifacts with the
  # wasi-sdk it pins and smoke-tests them; the npm packages build and pack only
  # what they publish; the TypeScript client runs against the native, worker
  # and WASI servers.
  engine-wasm:
    name: Engine WebAssembly and npm packages
    # The full set (the workflow's header); the release dry run builds the
    # WebAssembly assets too.
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # build-wasm.sh adds its link arguments to these flags.
      RUSTFLAGS: "-Dwarnings"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml pins, with the rustfmt and clippy it lists,
      # then the targets the job builds: rustup ignores `--target` on an install
      # with no name, and `rustup target add` with none adds to the pinned release.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The prebuilt release; its version must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.128

      - name: WebAssembly engine (browser and WASI)
        run: bash scripts/engine/build-wasm.sh

      # The code only wasm32 compiles: the engine job's clippy never sees it.
      - name: clippy on the WebAssembly targets
        run: bash scripts/engine/build-wasm.sh clippy

      - name: npm packages build and pack
        run: |
          for p in lsp-client lsp-worker wasi-host; do (cd "packages/$p" && npm ci); done
          node scripts/engine/check-npm-packs.mjs

      - name: Native language server and command line
        run: cargo build --locked -p opentide-lsp -p opentide-cli

      # The extension host's half of `opentide/fetch` (W2): its HTTP stack on
      # the loopback, the protocol, and `opentide serve` running tenant
      # commands whose requests the host answers from the golden cassettes.
      - name: wasi-host (opentide/fetch against opentide serve)
        env:
          OPENTIDE_BIN: target/debug/opentide-cli
        run: node --experimental-strip-types --test packages/wasi-host/src/index.test.ts

      # node:wasi's path_open is a V8 fast API call whose allocation can start
      # a GC inside the call, which segfaults node 22 once the WASI instances
      # hold enough memory; plain calls do not.
      - name: lsp-client (stdio, worker, wasi)
        env:
          OPENTIDE_LSP_BIN: target/debug/opentide-lsp
          OPENTIDE_WASI_BIN: target/wasm32-wasip1/release/opentide-lsp.wasm
          OPENTIDE_WASM_GLUE: target/wasm-bindgen/opentide_wasm.js
        run: >-
          node --no-turbo-fast-api-calls --experimental-strip-types
          --test packages/lsp-client/src/index.test.ts


  # The npm packages as a user installs them, as publish.yml's smoke-npm
  # does before a release: the tree's packages at the workspace version
  # (`release.py npm-version`), the addon built for linux-x64-gnu only (the
  # other five native packages packed as stand-ins without an addon, so that
  # npm still has to choose by os/cpu/libc), published to a throwaway local
  # registry (Verdaccio, no uplink), then `npm install @opentide/opentide` in
  # a clean project: exactly the host's native package, `npx opentide
  # --version`, the SDK, `runJson` and `tsc` against index.d.ts, and the same
  # through the `opentide` alias (scripts/engine/npm-local-registry/test.mjs).
  # It reads the node job's Rust cache.
  npm-install:
    name: npm install from a local registry (linux-x64-gnu)
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            scripts/engine/npm-local-registry/package-lock.json

      - name: npm ci
        working-directory: bindings/node
        run: npm ci

      # Before the build: napi-rs writes the version into the loader.
      - name: The npm packages at the workspace version
        run: |
          set -euo pipefail
          version="$(python3 scripts/engine/release.py version)"
          python3 scripts/engine/release.py npm-version "${version}"
          python3 scripts/engine/release.py lockstep "${version}" --npm "${version}"
          echo "NPM_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the addon (linux-x64-gnu)
        working-directory: bindings/node
        run: OPENTIDE_VERSION="${NPM_VERSION}" node build.mjs --profile develop

      - name: Pack, publish to a local registry, npm install, npx, SDK and types
        run: node scripts/engine/npm-local-registry/test.mjs --version "${NPM_VERSION}" --pack "${RUNNER_TEMP}/npm"

  # Every public Elastic rule passes Elasticsearch's parser, so any engine
  # error on them is an engine bug (language-server#82). The rules are ELv2:
  # checked out here at a pinned commit (the one oracle.yml reads), never
  # vendored.
  elastic-sweep:
    name: Elastic detection-rules sweep
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # engine-test's environment: the same rust-cache key, so this job reads
      # the Linux cell's cache.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elastic/detection-rules
          persist-credentials: false
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # engine-test's compiler cache, as its rust-cache (RUSTC_WRAPPER is in that key).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: detection-rules sweep
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: cargo test --locked -p opentide-analysis --test elastic_detection_rules -- --nocapture

  # Each fuzz target (fuzz/, cargo-fuzz on nightly) for 60 seconds from its
  # seeds and saved regressions: a panic or a timeout fails here, in the full
  # set. engine-fuzz.yml runs each for ten minutes a night with the corpus
  # it keeps.
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.targets }})
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every target of fuzz/fuzz_targets/ (tests/test_ci/test_one_ci.py),
        # up to three to a runner: one build serves them all.
        targets: ["kql spl esql", "eql kuery lucene", "falco tide protocol", "config framing serve", "cql", "yara exabeam yaral", "cli", "from_node"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dated nightly fuzz/NIGHTLY pins, which scripts/engine/fuzz.sh also
      # reads: a new nightly reaches this check in a change of its own.
      - name: Set up Rust (nightly)
        id: nightly
        run: |
          echo "FUZZ_TOOLCHAIN=$(cat fuzz/NIGHTLY)" >> "$GITHUB_ENV"
          FUZZ_TOOLCHAIN="$(cat fuzz/NIGHTLY)"
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --no-self-update
          echo "version=$(rustc +"${FUZZ_TOOLCHAIN}" -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # fuzz/ is a workspace of its own; cargo-fuzz builds into fuzz/target.
      # rust-cache also keeps ~/.cargo/bin, so cargo-fuzz installs once. Its key
      # hashes the pinned stable (rust-toolchain.toml), not the nightly that
      # builds here: `key` names the nightly, so a new one saves a new tree.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          shared-key: fuzz
          key: ${{ steps.nightly.outputs.version }}
          workspaces: fuzz -> target
      - run: cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked --version 0.13.2
      - name: fuzz ${{ matrix.targets }} (60 s each)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            echo "::group::fuzz ${target}"
            bash scripts/engine/fuzz.sh "${target}" 60
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A report for reading, not a gate: an outage of GitHub's artifact
        # service must not fail a job whose checks passed.
        continue-on-error: true
        with:
          name: fuzz-smoke-artifacts-${{ strategy.job-index }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Real clients against the server (language-server#185 P2.8): pytest-lsp
  # replays the capabilities VS Code, Neovim and Emacs send and checks each
  # response against them, and Neovim's own client must show each diagnostic
  # once. Informational while the recorded capabilities and Ubuntu's Neovim move.
  clients:
    name: LSP clients (informational)
    runs-on: ubuntu-latest
