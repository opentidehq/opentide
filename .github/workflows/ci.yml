      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # engine-test's compiler cache, as its rust-cache (RUSTC_WRAPPER is in that key).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo build --locked -p opentide-lsp
      - name: pytest-lsp (VS Code, Neovim, Emacs capabilities)
        env:
          OPENTIDE_LSP_BIN: ${{ github.workspace }}/target/debug/opentide-lsp
        run: |
          pip install -r scripts/engine/clients/requirements.txt
          cd scripts/engine/clients && python -m pytest -q
      - name: Neovim headless
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q neovim
          nvim --headless --clean -l scripts/engine/nvim-smoke.lua target/debug/opentide-lsp

  # analyze() per language and hover in a 1,000-object workspace
  # (language-server#181). The numbers go in the job summary for comparing
