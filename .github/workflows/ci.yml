    env:
      RUSTFLAGS: "-Dwarnings"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
      # The server stays up for the whole job: its statistics are the run's.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # The full set's compiler cache for this OS; `conformance` saves it.
      # By content: a stale one still serves every crate that did not change.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: sccache@0.19.0
      # The compiler cache's week: its key is the toolchain and the ISO week,
      # so a family is saved once a week (tests/test_ci/test_rust_caches.py).
      - name: Compiler cache week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.week.outputs.week }}
          restore-keys: sccache-full-set-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo bench (opentide-analysis)
        run: |
          cargo bench --locked -p opentide-analysis --bench analyze | tee bench.txt
          { echo '### analyze() per language'; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"




  cli-windows-smoke:
    name: CLI Windows smoke
    # The full set (the workflow's header): `Engine tests (windows-latest)`
    # covers Windows on every pull request.
    needs: changes
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: windows-latest
    # Also not gated on `test`: a 36 s job that waited ~5 min for a matrix it
    # shares nothing with. Left serial — two small test files, so workers would
    # only add startup cost.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # `uv sync` compiles the analysis engine (bindings/python/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins. No compiler cache:
      # macOS's and Windows's (a gigabyte each) crowded the Linux families every
      # pull request restores out of the 10 GB GitHub keeps (#841).
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install dependencies
        run: uv sync --group dev

      - name: Console launcher and redirect smoke
        run: >-
          uv run pytest tests/test_cli/e2e/test_console_script_smoke.py
          -m cli_smoke -q --no-cov

      # Ctrl-C through the console script (opentide._cli:main, UC-3.8b, #960): a
      # CTRL_BREAK_EVENT to `serve` in a process group of its own; SIGTERM is POSIX's.
      - name: Ctrl-C through the console script
        run: >-
          uv run pytest tests/test_cli/e2e/test_launcher_signals_e2e.py
          -m cli_smoke -q --no-cov

  # opentidehq/vscode-extension pins the highlights zip, the browser build and
  # THIRD-PARTY-LICENSES.html of an engine release (pins.json): its own grammar
  # and engine scripts, at a pinned commit, must accept this run's assets as
  # they would a release of this repository.
  engine-release-consumers:
    name: Engine release assets in vscode-extension
    needs: [changes, engine-release-dry-run]
    if: needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/vscode-extension
          ref: 9888813d5484dffe663c9a57c07aad80a0897181
          path: vscode-extension
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: vscode-extension's grammar and engine scripts accept the assets
        run: >-
          node scripts/engine/check-vscode-extension.mjs
          vscode-extension release-assets "$(python3 scripts/engine/release.py tag)"
  # ---------------------------------------------------------------------------
  # The one required check.
  # ---------------------------------------------------------------------------

  # Passes when `changes` succeeded and every other job it needs either
  # succeeded or was skipped: a job is skipped exactly when `changes` found it
  # not needed (or its build was), and a failed or cancelled job fails the
  # gate. `always()`: a failed job must not skip this one, since a skipped
  # required check passes. Branch protection requires this name alone
  # (.github/AGENTS.md, "Required checks").
  gate:
    name: PR gate
    needs:
      - changes
      - lint
      - engine-lint
      - build
      - rust-tests
      - python
      - e2e
      - gitlab-ci-lint
      - docs
      - facade
      - node
      - wasi
      - grammars
      - textmate
      - deny
      - sdist
      - smoke-sdist
      - packages
      - smoke-wheel
      - smoke-npm
      - engine-release-dry-run
      - smoke-installer
      - engine-package
      - smoke-cargo
      - publish-dry-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {job: need["result"] for job, need in needs.items()
                 if need["result"] not in ("success", "skipped")}
          if needs["changes"]["result"] != "success":
              bad["changes"] = needs["changes"]["result"]
          for job, need in sorted(needs.items()):
              print(f"{need['result']:>9}  {job}")
          if bad:
              print(f"::error::failed or cancelled: {', '.join(sorted(bad))}")
              sys.exit(1)
          PY

  # The nightly's one issue: on a failure, open (or comment on) the issue
  # labelled `nightly-failure`, with the failing jobs; nothing when it passed.
  nightly-report:
    name: Nightly report
    needs:
      - changes
      - gate
      - engine-test-os
      - test-full
      - e2e-full
      - coverage
      - benchmarks
      - oracle
      - schema
      - conformance
      - engine-wasm
      - npm-install
      - elastic-sweep
      - fuzz-smoke
      - clients
      - bench
      - cli-windows-smoke
      - engine-release-consumers
    if: always() && needs.changes.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed="$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url)): \(.conclusion)"')"
          if [[ -z "${failed}" ]]; then
            echo "The nightly passed."
            exit 0
          fi
          body="$(printf 'The nightly on %s (%s) failed: %s\n\n%s\n' "${REF}" "${SHA:0:12}" "${RUN_URL}" "${failed}")"
          echo "${body}" >> "$GITHUB_STEP_SUMMARY"
          gh label create nightly-failure --color B60205 --description "The nightly CI run failed" 2>/dev/null || true
          issue="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --body "${body}"
          else
            gh issue create --title "Nightly CI failure" --label nightly-failure --body "${body}"
          fi
