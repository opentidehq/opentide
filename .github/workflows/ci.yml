name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # All base branches — required for jj stacks (PRs target parent bookmarks, not only development)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

env:
  # Single matrix cell runs coverage (line hits are version-agnostic; use latest supported).
  COVERAGE_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check tests src/opentide

      - name: Ruff format
        run: uv run ruff format --check tests src/opentide

      - name: Ty type check
        run: uv run ty check src/opentide --output-format github

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      code-quality: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # PR head commit (not merge commit) so coverage line numbers map to the diff.
      - uses: actions/checkout@v4
        if: matrix.python-version == env.COVERAGE_PYTHON
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/checkout@v4
        if: matrix.python-version != env.COVERAGE_PYTHON
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pytest
        if: matrix.python-version != env.COVERAGE_PYTHON
        run: uv run pytest tests/ --no-cov -q

      - name: Pytest with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: |
          uv run pytest tests/ \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Enforce coverage threshold
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: uv run coverage report

      - name: Upload coverage to GitHub Code Quality
        if: >-
          matrix.python-version == env.COVERAGE_PYTHON &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false

      - name: Publish test report
        if: always() && matrix.python-version == env.COVERAGE_PYTHON
        uses: dorny/test-reporter@v1
        with:
          name: Pytest (${{ env.COVERAGE_PYTHON }})
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload HTML coverage report
        if: matrix.python-version == env.COVERAGE_PYTHON
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14
