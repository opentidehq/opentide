name: CI

on:
  push:
    # integration/unified-core: the Unified Core PRs merge there before development.
    branches: [main, development, integration/unified-core]
  # Run workflow, as language-server's engine CI had.
  workflow_dispatch:
  pull_request:
    # All base branches: a stacked PR targets the branch below it, not development.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

env:
  # Single matrix cell runs coverage (line hits are version-agnostic; use latest supported).
  COVERAGE_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # `uv sync` compiles the analysis engine (analysis/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins; the cache keeps the
      # compiled engine crates between runs.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The binding `uv sync` builds: the `test` job's cache (3.14), read here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: python-engine
          save-if: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/opentide tests scripts --output-format github

      - name: Ruff format
        run: uv run ruff format --check src/opentide tests scripts

      - name: Ty type check
        run: uv run ty check src/opentide --output-format github

      # The wheel is built from the sdist in a directory of its own, so this
      # also proves the sdist carries everything the engine's build reads.
      - name: Build sdist and wheel
        run: uv build

      - name: Twine check
        run: uvx twine check dist/*

      - name: Detect vocabulary bundle, pin, lockfile or model changes
        id: vocab_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA}"
          else
            base_ref="${PUSH_BEFORE}"
          fi

          if [[ -z "$base_ref" || "$base_ref" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "fields=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_ref" "${HEAD_SHA}")"
          # grep, not rg: ripgrep is not installed on GitHub-hosted runners, and a
          # missing command in an `if` reads as "no match" and skips the gate.
          if grep -qE "^(src/opentide/data/vocabulary/.*\\.vocab\\.toml|src/opentide/data/pins/.*\\.toml|data/specifications\\.lock\\.json|xtask/src/vocab/sync\\.rs)$" <<<"$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Model field docstrings are the editor hovers; they are checked against
          # the field tables in the specifications repository.
          if grep -qE "^(src/opentide/models/.*|tests/test_models/test_spec_field_descriptions\\.py|\\.github/workflows/ci\\.yml)$" <<<"$changed_files"; then
            echo "fields=true" >> "$GITHUB_OUTPUT"
          else
            echo "fields=false" >> "$GITHUB_OUTPUT"
          fi

      # Without a specifications clone, --check only compares the lockfile with the
      # bundle, so pins edited by hand and relocked would pass.
      - name: Checkout specifications
        if: steps.vocab_changes.outputs.changed == 'true' || steps.vocab_changes.outputs.fields == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/specifications
          ref: main
          path: specifications
          persist-credentials: false

      # `cargo xtask vocab sync --check` (xtask/src/vocab/sync.rs, UC-1.6 #812).
      # RUSTFLAGS on the step, not the job: the job's environment keys the
      # binding's cache it reads (python-engine), built without it.
      - name: Check vocabulary and pin sync drift
        if: steps.vocab_changes.outputs.changed == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
          RUSTFLAGS: "-Dwarnings"
        run: cargo xtask vocab sync --check

      # OPENTIDE_REQUIRE_SPECIFICATIONS turns the test's "no checkout" skip into a
      # failure, so this guard cannot pass by not running.
      - name: Check model field descriptions against the specifications
        if: steps.vocab_changes.outputs.fields == 'true'
        env:
          OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
          OPENTIDE_REQUIRE_SPECIFICATIONS: "1"
        run: uv run pytest tests/test_models/test_spec_field_descriptions.py --no-cov -q

  # ---------------------------------------------------------------------------
  # The Cargo workspace: the engine crates (crates/, imported from
  # opentidehq/language-server) and their PyO3 binding (analysis/).
  #
  # Rust caches (Swatinem/rust-cache), one strategy for the whole file
  # (tests/test_ci/test_rust_caches.py): every cache names a `shared-key`, and
  # each shared-key/key pair has exactly one job that saves it, whose
  # CARGO*/RUST* environment and runner its readers repeat (rust-cache hashes
  # both into the key).
  #
  #   engine-check    `engine`: clippy, rustdoc and the invariants (check builds)
  #   engine-dev      `engine-test` per OS (nextest's debug tree); `clients` and
  #                   `elastic-sweep` read the Linux one
  #   engine-package  `engine-package`
  #   engine-bench    `bench`
  #   engine-wasm     `engine-wasm`
  #   fuzz            `fuzz-smoke` (fuzz/NIGHTLY's nightly, fuzz/target)
  #   python-engine   the Python jobs' `uv sync` build of the binding: `test`
  #                   (3.14) saves it, the other Linux Python jobs read it
  #   golden-compare  `golden-compare` (the binding and xtask, -Dwarnings)
  #   engine-release  the release dry run (engine-release-build.yml), per target
  # ---------------------------------------------------------------------------

  # rustfmt, clippy, rustdoc, the crate layers and the engine's invariants.
  engine:
    name: Engine lint (fmt, clippy, doc, layers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A compiler warning fails the build, as in language-server's CI.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The release rust-toolchain.toml pins, with the rustfmt and clippy it lists.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-check

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every dependency between workspace crates points down the layer table
      # (xtask/layers.toml, plan §4).
      - name: crate layers
        run: cargo xtask check-layers

      # Broken intra-doc links and the like fail the build.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --locked

      - name: Engine invariants (I/O-free crates, names, skills, generated highlights)
        run: |
          bash scripts/engine/check-io-free.sh
          bash scripts/engine/check-names.sh
          bash scripts/engine/validate-skills.sh
          cargo run --locked -p opentide-lsp -- generate-highlights --check

      - name: Install dependencies
        run: uv sync --group dev

      # The Tide catalog the engine compiles in is what the models generate
      # (scripts/engine/sync_opentide_schemas.py), until UC-1.8 generates it in Rust.
      - name: The engine's bundled Tide catalog matches the models
        run: uv run pytest tests/test_generation/test_bundled_tide_catalog.py --no-cov -q

      - name: The engine release script's tests
        run: uv run python -m unittest discover -s scripts/engine -p "test_*.py"

  # Every test of the workspace with nextest (.config/nextest.toml, profile
  # `ci`) on Linux, macOS and Windows; the doctests (which nextest does not
  # run) on Linux. pydantic_object_issues_are_subset_of_lsp runs src/opentide's
  # models with the interpreter `uv sync` installs (.venv), so every OS syncs.
  engine-test:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: "-Dwarnings"
      # Line tables, not full debuginfo, for the workspace's ~90 test binaries:
      # backtraces keep file:line, and target/ stays a few GB on the runner.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      # insta compares snapshots and never writes one here: a missing or
      # changed snapshot fails the test (crates/AGENTS.md, Snapshots).
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # Dependencies only: rust-cache drops the workspace crates before saving.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-dev
          key: ${{ matrix.os }}

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.148

      - name: Install dependencies
        run: uv sync --group dev

      - name: cargo nextest (profile ci)
        run: cargo nextest run --workspace --locked --profile ci

      - name: doctests
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --doc

      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # scripts/engine/build-wasm.sh builds both WebAssembly artifacts with the
  # wasi-sdk it pins and smoke-tests them; the npm packages build and pack only
  # what they publish; the TypeScript client runs against the native, worker
  # and WASI servers.
  engine-wasm:
    name: Engine WebAssembly and npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # build-wasm.sh adds its link arguments to these flags.
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml pins, with the rustfmt and clippy it lists,
      # then the targets the job builds: rustup ignores `--target` on an install
      # with no name, and `rustup target add` with none adds to the pinned release.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-wasm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The prebuilt release; its version must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.128

      - name: WebAssembly engine (browser and WASI)
        run: bash scripts/engine/build-wasm.sh

      # The code only wasm32 compiles: the engine job's clippy never sees it.
      - name: clippy on the WebAssembly targets
        run: bash scripts/engine/build-wasm.sh clippy

      - name: npm packages build and pack
        run: |
          for p in lsp-client lsp-worker; do (cd "packages/$p" && npm ci); done
          node scripts/engine/check-npm-packs.mjs

      - name: Native language server
        run: cargo build --locked -p opentide-lsp

      # node:wasi's path_open is a V8 fast API call whose allocation can start
      # a GC inside the call, which segfaults node 22 once the WASI instances
      # hold enough memory; plain calls do not.
      - name: lsp-client (stdio, worker, wasi)
        env:
          OPENTIDE_LSP_BIN: target/debug/opentide-lsp
          OPENTIDE_WASI_BIN: target/wasm32-wasip1/release/opentide-lsp.wasm
          OPENTIDE_WASM_GLUE: target/wasm-bindgen/opentide_wasm.js
        run: >-
          node --no-turbo-fast-api-calls --experimental-strip-types
          --test packages/lsp-client/src/index.test.ts

  # Every engine crate builds from its packaged sources, as it will from
  # crates.io: a crate that reads a file outside OPENTIDE_ASSETS fails here, not
  # at release. The binding (analysis/, opentide-native), the tooling (xtask)
  # and the differential comparator (opentide-compare, which only they use)
  # are not crates to publish. The packages carry the embedded catalogs, so the licence scan
  # catches an oracle reference here rather than at release time.
  engine-package:
    name: Engine crates package and licence scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # A compiler warning fails the build, as in engine-ci.yml (workflow-wide there).
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-package
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/engine/release.py vendor
      - run: cargo package --locked --workspace --exclude opentide-native --exclude xtask --exclude opentide-compare --exclude opentide-schema --allow-dirty
      - name: license scan (no oracle references)
        run: bash scripts/engine/license-scan.sh target/package/*.crate

  # The supply-chain gate (#843, deny.toml): licences of what we ship,
  # RustSec advisories (vulnerable, unsound, unmaintained, yanked), a second
  # version of a shipped crate, OpenSSL, and any source but crates.io. fuzz/
  # (its own lock, never shipped) is checked for advisories, bans and
  # sources with the same deny.toml; the publishing/ placeholder crate (its
  # own lock, published) for everything. The advisory database is fetched fresh,
  # so a new advisory fails the next pull request until it is fixed or
  # excepted with a reason in deny.toml. cargo-deny is the prebuilt release,
  # checksum-checked, at the version pinned here.
  deny:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # cargo-deny only reads `cargo metadata`, but every cargo job here denies
    # warnings (tests/test_ci/test_one_ci.py).
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml pins: cargo-deny reads the graph with
      # `cargo metadata`.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: cargo deny (workspace)
        run: cargo deny --config deny.toml --locked check
      - name: cargo deny (fuzz/)
        run: cargo deny --config deny.toml --manifest-path fuzz/Cargo.toml --locked check advisories bans sources
      # The crate that reserves `opentide` on crates.io: a workspace and lock of
      # its own, published, so every check applies.
      - name: cargo deny (publishing/ placeholder crate)
        run: cargo deny --config deny.toml --manifest-path publishing/placeholders/crates/opentide/Cargo.toml --locked check

  # The vendored parser.c of every grammar is what tree-sitter-cli generates
  # from its grammar.js (crates/AGENTS.md: never hand-edited).
  grammars:
    name: Grammars regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --prefix /tmp/ts-cli tree-sitter-cli@0.25.10
      - run: bash scripts/engine/check-grammars.sh

  # The generated grammars as VS Code reads them (language-server#171).
  textmate:
    name: TextMate grammars (vscode-textmate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: TextMate grammars (vscode-textmate)
        working-directory: highlights/test
        run: npm ci && npm test

  # Every public Elastic rule passes Elasticsearch's parser, so any engine
  # error on them is an engine bug (language-server#82). The rules are ELv2:
  # checked out here at a pinned commit (the one oracle.yml reads), never
  # vendored.
  elastic-sweep:
    name: Elastic detection-rules sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # engine-test's environment: the same rust-cache key, so this job reads
      # the Linux cell's cache.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elastic/detection-rules
          persist-credentials: false
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # A subset of engine-test's Linux debug tree: read its cache, never save one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-dev
          key: ubuntu-latest
          save-if: false
      - name: detection-rules sweep
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: cargo test --locked -p opentide-analysis --test elastic_detection_rules -- --nocapture

  # Each fuzz target (fuzz/, cargo-fuzz on nightly) for 60 seconds from its
  # seeds and saved regressions: a panic or a timeout on a pull request fails
  # here. engine-fuzz.yml runs each for ten minutes a night with the corpus
  # it keeps.
  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.targets }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every target of fuzz/fuzz_targets/ (tests/test_ci/test_one_ci.py),
        # up to three to a runner: one build serves them all.
        targets: ["kql spl esql", "eql kuery lucene", "falco tide protocol", "config framing", "cql"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dated nightly fuzz/NIGHTLY pins, which scripts/engine/fuzz.sh also
      # reads: a new nightly reaches this required check in a change of its own.
      - name: Set up Rust (nightly)
        id: nightly
        run: |
          echo "FUZZ_TOOLCHAIN=$(cat fuzz/NIGHTLY)" >> "$GITHUB_ENV"
          FUZZ_TOOLCHAIN="$(cat fuzz/NIGHTLY)"
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --no-self-update
          echo "version=$(rustc +"${FUZZ_TOOLCHAIN}" -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # fuzz/ is a workspace of its own; cargo-fuzz builds into fuzz/target.
      # rust-cache also keeps ~/.cargo/bin, so cargo-fuzz installs once. Its key
      # hashes the pinned stable (rust-toolchain.toml), not the nightly that
      # builds here: `key` names the nightly, so a new one saves a new tree.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz
          key: ${{ steps.nightly.outputs.version }}
          workspaces: fuzz -> target
      - run: cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked --version 0.13.2
      - name: fuzz ${{ matrix.targets }} (60 s each)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            echo "::group::fuzz ${target}"
            bash scripts/engine/fuzz.sh "${target}" 60
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-artifacts-${{ strategy.job-index }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Every asset an engine release publishes, built by the release's own jobs
  # (engine-release-build.yml) for the workspace version, with no tag: no
  # attestation, no GitHub Release, nothing published, a read-only token. Its
  # last job fails unless the files are language-server's last release's
  # (v0.11.0) with this version in their names.
  engine-release-dry-run:
    name: Engine release (dry run)
    permissions:
      contents: read
    uses: ./.github/workflows/engine-release-build.yml
    with:
      dry-run: true

  # opentidehq/vscode-extension pins the highlights zip, the browser build and
  # THIRD-PARTY-LICENSES.html of an engine release (pins.json): its own grammar
  # and engine scripts, at a pinned commit, must accept this run's assets as
  # they would a release of this repository.
  engine-release-consumers:
    name: Engine release assets in vscode-extension
    needs: engine-release-dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/vscode-extension
          ref: 9888813d5484dffe663c9a57c07aad80a0897181
          path: vscode-extension
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: vscode-extension's grammar and engine scripts accept the assets
        run: >-
          node scripts/engine/check-vscode-extension.mjs
          vscode-extension release-assets "$(python3 scripts/engine/release.py tag)"

  # Real clients against the server (language-server#185 P2.8): pytest-lsp
  # replays the capabilities VS Code, Neovim and Emacs send and checks each
  # response against them, and Neovim's own client must show each diagnostic
  # once. Informational while the recorded capabilities and Ubuntu's Neovim move.
  clients:
    name: LSP clients (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      # engine-test's environment: the same rust-cache key, so this job reads
      # the Linux cell's cache.
      RUSTFLAGS: "-Dwarnings"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # A subset of engine-test's Linux debug tree: read its cache, never save one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-dev
          key: ubuntu-latest
          save-if: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo build --locked -p opentide-lsp
      - name: pytest-lsp (VS Code, Neovim, Emacs capabilities)
        env:
          OPENTIDE_LSP_BIN: ${{ github.workspace }}/target/debug/opentide-lsp
        run: |
          pip install -r scripts/engine/clients/requirements.txt
          cd scripts/engine/clients && python -m pytest -q
      - name: Neovim headless
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q neovim
          nvim --headless --clean -l scripts/engine/nvim-smoke.lua target/debug/opentide-lsp

  # analyze() per language and hover in a 1,000-object workspace
  # (language-server#181). The numbers go in the job summary for comparing
  # runs; they gate nothing.
  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: engine-bench
      - name: cargo bench (opentide-analysis)
        run: |
          cargo bench --locked -p opentide-analysis --bench analyze | tee bench.txt
          { echo '### analyze() per language'; echo; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The corpora of UC-0.6 (#804, tests/corpora/README.md) against the oracle,
  # opentide 0.23.0 from PyPI (every wheel hash-pinned): the heavy workspace has
  # no finding, every fault kind reports exactly its codes, the code inventory is
  # the oracle's and COVERAGE.md is current with no code missing.
  corpus:
    name: Corpus (generator, faults, coverage) against opentide 0.23.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: corpus
      - name: Install the oracle (opentide 0.23.0, hash-pinned, own venv)
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/oracle"
          uv pip install --python "$RUNNER_TEMP/oracle/bin/python" --require-hashes \
            -r tests/corpora/oracle-requirements.txt
          echo "OPENTIDE_ORACLE=$RUNNER_TEMP/oracle/bin/opentide" >> "$GITHUB_ENV"
      - name: Generator tests (determinism digests)
        run: cargo test --locked -p xtask --test corpus_generate
      - name: The heavy workspace has zero findings
        run: |
          cargo xtask corpus generate --seed 20261107 --out "$RUNNER_TEMP/heavy"
          cargo xtask corpus clean --engine python --repo "$RUNNER_TEMP/heavy"
      - name: Fault catalogue against the oracle
        run: cargo xtask corpus faults --check --engine python --report "$RUNNER_TEMP/faults.json"
      - name: Upload the fault report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-faults-report
          path: ${{ runner.temp }}/faults.json
          if-no-files-found: ignore
          retention-days: 14
      - name: The code inventory is the oracle's
        run: |
          cargo xtask corpus codes --engine python > "$RUNNER_TEMP/codes.toml"
          diff -u tests/corpora/codes.toml "$RUNNER_TEMP/codes.toml"
      - name: Coverage report is current, no code missing
        run: cargo xtask corpus coverage --check

  test:
    name: Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      code-quality: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # PR head commit (not merge commit) so coverage line numbers map to the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.python-version == env.COVERAGE_PYTHON
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.python-version != env.COVERAGE_PYTHON
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # `uv sync` compiles the analysis engine (analysis/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins; the cache keeps the
      # compiled engine crates between runs.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The binding `uv sync` builds (abi3: one build serves every Python).
      # This job saves it, from its coverage cell; the other Python jobs on
      # Linux read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: python-engine
          save-if: ${{ matrix.python-version == env.COVERAGE_PYTHON }}

      - name: Install dependencies
        run: uv sync --group dev

      # Sharded with xdist, like the E2E job below. This was serial until #530:
      # a few tests left a partial index in `IndexManager._cache` and a mocked
      # registry in `opentide.deployment.utils`, and the suite passed only
      # because the serial file order happened to put the victims first.
      # Reordering it across workers surfaced 11 failures in test_export and
      # test_documentation. Both leaks are fixed, and the suite now produces the
      # same result serially and at -n 2/4/8. `-n 4` is pinned for the same
      # reason as the E2E job -- see the note there.
      - name: Pytest
        if: matrix.python-version != env.COVERAGE_PYTHON
        run: uv run pytest tests/ --no-cov -q -n 4 -m "not cli_e2e and not cli_smoke and not gitlab_ci_lint"

      - name: Pytest with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON
        # sys.monitoring (PEP 669) instead of the C trace function. Same line
        # data for a fraction of the overhead; 3.12+ only, which this cell is.
        #
        # Coverage is combined across xdist workers by pytest-cov, and the
        # totals are identical to a serial run (17959 statements, 1646 missed,
        # 90.8%), so the threshold gate below reads the same number it always
        # did -- verified, because sharding a coverage run silently losing
        # worker data would quietly lower the gate instead of failing it.
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ \
            -m "not cli_e2e and not cli_smoke and not gitlab_ci_lint" \
            -n 4 \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Enforce coverage threshold
        if: matrix.python-version == env.COVERAGE_PYTHON
        run: uv run coverage report

      - name: Upload coverage to GitHub Code Quality
        if: >-
          matrix.python-version == env.COVERAGE_PYTHON &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false

      - name: Publish test report
        if: always() && matrix.python-version == env.COVERAGE_PYTHON
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Pytest (${{ env.COVERAGE_PYTHON }})
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload HTML coverage report
        if: matrix.python-version == env.COVERAGE_PYTHON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

  cli-e2e:
    name: E2E (3.14, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: [test]`. This job is the longest in the
    # workflow, and gating it on the matrix put the slowest unit cell in front
    # of it: the two ran back to back for a ~22 min wall clock where the
    # longest single job was ~16 min. They share no artifact, so running them
    # concurrently costs the same runner minutes and returns the answer sooner.
    strategy:
      # Every shard reports, so a failure anywhere does not hide the others.
      fail-fast: false
      matrix:
        # Keep the length of this list equal to `--splits` below;
        # tests/test_ci/test_own_ci_workflow.py fails if they drift, because a
        # short matrix would silently skip the tests in the groups that no
        # longer have a runner.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # `uv sync` compiles the analysis engine (analysis/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins; the cache keeps the
      # compiled engine crates between runs.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The `test` job's cache of the binding `uv sync` builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: python-engine
          save-if: false

      - name: Install dependencies
        run: uv sync --group dev

      # The longest step in the workflow by a wide margin: 722 tests, most of
      # them a console-script subprocess or a scaffolded repo, so it is
      # dominated by process startup rather than by any one slow test.
      #
      # Within a single runner the win is limited -- each worker re-pays import
      # and scaffold cost -- so the suite is split across runners too. Measured
      # locally: 561s serial for the whole suite, and 54/74/85/84s as 4 shards.
      # Verified to produce an identical pass/fail set serially and sharded.
      #
      # `--splits` partitions the whole selection, so no test can fall outside
      # a shard. Balance comes from .test_durations_e2e; a test missing from it
      # is assigned the average, so adding tests is safe, and refreshing the
      # file (scripts/ci-local.sh --store-e2e-durations) only improves packing.
      #
      # `-n 4` is pinned deliberately rather than `-n auto`. Measured on one
      # shard (262 tests): serial 162s, -n 2 93s, -n 3 72s, -n 4 62s, -n 6 51s,
      # but `auto` on a 10-core host 137s -- slower than 4 workers. Each worker
      # holds an interpreter and the subprocess its test spawned, so the suite
      # hits a memory cliff well before it runs out of cores. `auto` tracks
      # whatever the runner reports, so it would sit on that cliff silently if
      # the hosted spec changed; 4 matches today's ubuntu-latest (4 vCPU) and
      # stays put. Raise it only with a measurement from a real run.
      - name: E2E pytest (CLI + MCP stdio)
        run: >-
          uv run pytest tests/ -m "cli_e2e or cli_smoke" -q --no-cov -n 4
          --splits 4
          --group ${{ matrix.shard }}
          --durations-path .test_durations_e2e

  # Was two trailing steps on cli-e2e, which made a ~20 s check wait out the
  # longest job in the workflow. It renders the pipeline from
  # opentide.ci.render and lints that, consuming nothing the E2E run produces.
  gitlab-ci-lint:
    name: GitLab CI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # `uv sync` compiles the analysis engine (analysis/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins; the cache keeps the
      # compiled engine crates between runs.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The `test` job's cache of the binding `uv sync` builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: python-engine
          save-if: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install GitLab CI linters
        run: |
          bash scripts/install-gitlab-ci-linters.sh "${RUNNER_TEMP}/gitlab-ci-linters"
          echo "${RUNNER_TEMP}/gitlab-ci-linters" >> "$GITHUB_PATH"

      - name: Lint generated GitLab CI
        run: uv run pytest tests/test_ci/test_gitlab_pipeline_lint.py -m gitlab_ci_lint -q --no-cov
        env:
          OPENTIDE_GITLAB_CI_LINT: "1"


  # UC-0.7 (#805): every golden case whose command has a Rust implementation
  # (opentide.cli.engines.RUST_COMMANDS), run through this repository's CLI
  # with OPENTIDE_ENGINE=rust and compared with the oracle's recording
  # (crates/opentide-compare, tests/golden/APPROVED_DIFFS.toml); a stale ledger
  # entry fails it. Here, not in golden.yml, so that it runs on every pull
  # request: a change anywhere in crates/, analysis/ or src/ can change a port.
  golden-compare:
    name: Golden compare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.COVERAGE_PYTHON }}

      # rustup installs the toolchain rust-toolchain.toml pins.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # Its own cache: RUSTFLAGS is part of rust-cache's key, so this job
      # cannot read `test`'s `python-engine` (built without it).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: golden-compare

      # The candidate is this repository's CLI, with the engine compiled in.
      - name: Install this repository's CLI
        run: uv sync --group dev

      - name: Compare every ported command with the recordings
        run: cargo xtask golden check --engine compare --report golden-compare.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-compare
          path: golden-compare.json
          if-no-files-found: ignore

  cli-windows-smoke:
    name: CLI Windows smoke
    runs-on: windows-latest
    # Also not gated on `test`: a 36 s job that waited ~5 min for a matrix it
    # shares nothing with. Left serial — two small test files, so workers would
    # only add startup cost.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # `uv sync` compiles the analysis engine (analysis/, Rust) into opentide (hatch_build.py).
      # rustup installs the toolchain rust-toolchain.toml pins; the cache keeps the
      # compiled engine crates between runs.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: python-engine-windows

      - name: Install dependencies
        run: uv sync --group dev

      - name: Console launcher and redirect smoke
        run: >-
          uv run pytest tests/test_cli/e2e/test_console_script_smoke.py
          -m cli_smoke -q --no-cov

      # Promotion rewrites rule files in place: on Windows they are usually CRLF,
      # and the replace of the temporary file must work on NTFS.
      - name: Promotion keeps a rule file's line endings
        run: uv run pytest tests/test_deployment/test_promotion_rewrite.py -q --no-cov
