# Weekly ATT&CK + MISP vocabulary ingest.
# Opens PRs on specifications (canonical vocabs) and opentide (bundle + lockfile).
# Human review of those PRs is the release gate. Schema pins never move here: new
# keys open a vocabulary contract (actors::1.2) that a shipped revision does not
# pin, and adopting it is a new schema revision (threat::1.1), made by hand.
name: Vocab upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ignore-open-pr:
        description: Run even if a vocab-upstream PR is already open
        type: boolean
        default: true

concurrency:
  group: vocab-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_BRANCH: chore/vocab-upstream
  OPENTIDE_SPECIFICATIONS_ROOT: ${{ github.workspace }}/specifications
  # The ingest is `cargo xtask vocab ingest` (xtask/src/vocab/ingest/), the
  # Rust port of the Python package's opentide.vocabulary (UC-6.3): it writes
  # specifications' vocabularies, then syncs this checkout's bundle and
  # lockfile from them (`cargo xtask vocab sync`).

jobs:
  ingest:
    name: Ingest ATT&CK and MISP
    runs-on: ubuntu-latest
    # `secrets` is not an allowed context in `steps.if`; GitHub rejects the
    # whole file, so no trigger (schedule, dispatch) ever registers.
    env:
      HAS_APP: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_KEY != '' }}
    steps:
      # Both review PRs need the App credential, so assert it BEFORE anything is
      # fetched, committed or pushed. Without this the run used to push
      # `chore/vocab-upstream` and only then fail on `gh pr create`, leaving an
      # updated branch with no PR and no reviewer.
      - name: Require the GitHub App credential
        if: env.HAS_APP != 'true'
        run: |
          set -euo pipefail
          {
            echo "## Vocab upstream did not run"
            echo
            echo "This workflow opens review PRs on **two** repositories, so it needs the"
            echo "\`GH_APP_ID\` / \`GH_APP_KEY\` App credential:"
            echo
            echo "- the \`specifications\` PR is cross-repository, and \`GITHUB_TOKEN\` is scoped"
            echo "  to \`opentide\` alone, so it can never open that one;"
            echo "- the \`opentide\` PR is refused by \`GITHUB_TOKEN\` as"
            echo "  \`GitHub Actions is not permitted to create or approve pull requests\`"
            echo "  unless *Settings -> Actions -> General* allows it."
            echo
            echo "Add both secrets under *Settings -> Secrets and variables -> Actions*, then"
            echo "re-run. Nothing was fetched, committed or pushed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Missing GH_APP_ID/GH_APP_KEY::Vocab upstream needs the GitHub App credential to open its review PRs. Nothing was fetched or pushed."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: development

      - name: Generate GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: opentidehq
          repositories: |
            opentide
            specifications

      - name: Checkout specifications
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentidehq/specifications
          path: specifications
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      # The release rust-toolchain.toml pins. No cache: the job runs weekly, and
      # a cache it alone saved would hold a share of the repository's 10 GB.
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Build xtask
        run: cargo build --locked --package xtask

      - name: Skip when an ingest PR is already open
        id: skip
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          IGNORE_OPEN_PR: ${{ github.event.inputs.ignore-open-pr }}
        run: |
          set -euo pipefail
          skip=false
          check_open=false
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            check_open=true
          elif [[ "${IGNORE_OPEN_PR}" == "false" ]]; then
            check_open=true
          fi
          if [[ "$check_open" == true ]]; then
            open_ot=$(gh pr list --repo opentidehq/opentide --head "$UPSTREAM_BRANCH" --state open --json number --jq 'length')
            open_spec=$(gh pr list --repo opentidehq/specifications --head "$UPSTREAM_BRANCH" --state open --json number --jq 'length')
            if [[ "$open_ot" -gt 0 || "$open_spec" -gt 0 ]]; then
              skip=true
              echo "An ingest PR is already open; skipping."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Fetch and merge upstream vocabularies
        if: steps.skip.outputs.skip != 'true'
        env:
          OPENTIDE_ATTACK_STIX_DIR: ${{ runner.temp }}/attack-stix
        run: |
          set -euo pipefail
          cargo xtask vocab ingest --apply | tee "$RUNNER_TEMP/ingest-summary.txt"

      - name: Open specifications PR
        if: steps.skip.outputs.skip != 'true' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          cd specifications
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabularies
          if git diff --cached --quiet; then
            echo "No specifications changes."
            exit 0
          fi
          git checkout -B "$UPSTREAM_BRANCH"
          git commit -m "chore(vocab): ingest ATT&CK and MISP threat actors"
          # Single-branch clones have no origin/$UPSTREAM_BRANCH; without it
          # --force-with-lease requires the remote branch to be absent and later
          # cycles fail. Fetch the existing head (ok if the branch is new).
          git fetch origin "$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH" || true
          git push --force-with-lease origin "$UPSTREAM_BRANCH"
          # Only skip create when an OPEN PR still exists for this head (merged cycles must open a new PR).
          open_count=$(gh pr list --repo opentidehq/specifications --head "$UPSTREAM_BRANCH" --state open --json number --jq 'length')
          if [[ "$open_count" -eq 0 ]]; then
            gh pr create --repo opentidehq/specifications --base main --head "$UPSTREAM_BRANCH" \
              --title "chore(vocab): ingest ATT&CK techniques and MISP actors" \
              --body "$(cat <<'EOF'
          Automated ingest of the latest MITRE ATT&CK STIX release and MISP threat-actor galaxy.

          Vocabularies are merged with RFC 0003 per-key versions (new keys open the next minor; disappeared keys get `removed` at the next major). Schema pins do not move: every shipped revision keeps the contracts it pins, so new keys stay unreachable until a new schema revision (for example `threat::1.1`) pins their contract.

          Review and merge is the release gate. The companion opentide PR syncs the bundled copy and lockfile.

          Ingest summary:

          ```
          EOF
          cat "$RUNNER_TEMP/ingest-summary.txt"
          echo '```'
          )"
          fi

      - name: Refresh lockfile against specifications HEAD
        if: steps.skip.outputs.skip != 'true'
        run: cargo xtask vocab sync

      - name: Open opentide PR
        # Same guard as the specifications PR above. The `|| secrets.GITHUB_TOKEN`
        # fallback is deliberately absent on a WRITE: it is what let this step push
        # the branch and then fail on `gh pr create`. Reads above may still fall back.
        if: steps.skip.outputs.skip != 'true' && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/opentide/data/vocabulary src/opentide/data/pins data/specifications.lock.json
          if git diff --cached --quiet; then
            echo "No opentide bundle changes."
            exit 0
          fi
          git checkout -B "$UPSTREAM_BRANCH"
          git commit -m "chore(vocab): sync ATT&CK and actor vocabularies"
          git fetch origin "$UPSTREAM_BRANCH:refs/remotes/origin/$UPSTREAM_BRANCH" || true
          git push --force-with-lease origin "$UPSTREAM_BRANCH"
          # Only skip create when an OPEN PR still exists for this head (merged cycles must open a new PR).
          open_count=$(gh pr list --head "$UPSTREAM_BRANCH" --state open --json number --jq 'length')
          if [[ "$open_count" -eq 0 ]]; then
            gh pr create --base development --head "$UPSTREAM_BRANCH" \
              --title "chore(vocab): sync ATT&CK techniques and MISP actors" \
              --body "$(cat <<'EOF'
          Companion to the specifications ingest PR. Bundles the regenerated vocabularies and refreshes `data/specifications.lock.json`. Schema pins do not move: new keys open an unpinned contract that only a new schema revision adopts.

          Merge after the specifications PR (canonical vocabs) is accepted.
          EOF
          )"
          fi
