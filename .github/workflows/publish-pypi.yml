# PyPI publishing is disabled until trusted publishing and the `pypi` environment are configured.
# Re-enable by restoring `on.release.types: [published]` and verifying OIDC on PyPI.
name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    name: Publish to PyPI (disabled)
    if: false
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
