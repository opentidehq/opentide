# Releases opentide and publishes it to PyPI via OIDC trusted publishing.
# First upload: configure a pending publisher at
# https://pypi.org/manage/account/publishing/ (see docs/internal/pypi-trusted-publishing.md).
#
# A release is "Run workflow" on development with checkout_ref empty, as
# language-server releases from main: the guard reads the version from the
# newest dated CHANGELOG.md heading (scripts/build/release.py) and refuses
# unless the notes PR merged and the tag does not exist yet; the wheels and
# sdist build from that commit; the `release` job creates the tag with the
# GitHub Release; then `publish` uploads to PyPI. Agents without `gh` start it
# through the GitHub API (workflow_dispatch on publish-pypi.yml, ref development).
# The Release is created with GITHUB_TOKEN, which starts no `release: published`
# run, so this run is the only publish.
#
# A GitHub Release published by hand (`gh release create`) still publishes, as
# before: the `release` job is skipped and the guard requires its tag.
#
# After a successful upload, dispatch opentidehq/website so docs/changelog/specs
# rebuild immediately. The landing version number is fetched live from PyPI and
# does not wait on that rebuild. Uses GH_APP_ID / GH_APP_KEY, the secret names
# vocab-upstream also reads; the App must be installed on opentidehq/website with
# contents: write, which repository_dispatch requires (contents: read mints a
# token and then 403s). If notify is skipped or fails, publish still succeeds,
# the last step warns "Website not notified", and the website's hourly cron is
# the backup:
#   gh api repos/opentidehq/website/dispatches -f event_type=opentide-released
#
# Build with `uv build` (same as CI). Do not use `hatch build`: hatch 1.18.1 +
# hatchling 1.32.1 isolated envs import `hatch` from BinaryBuilder and fail with
# ModuleNotFoundError.
#
# `release: published` runs the workflow file from the tag commit. A tag cut
# before this uv-build change cannot be rescued by converting the Release to
# draft and back. Re-run an existing tag from the default branch:
#   gh api repos/opentidehq/opentide/dispatches \
#     -f event_type=publish-pypi \
#     -f client_payload[checkout_ref]=v0.x.y
# (workflow_dispatch is equivalent in the Actions UI; GitHub App tokens often
# lack actions:write and cannot call that endpoint.)
#
# The same dispatch is the retry after a PyPI 5xx or partial upload.
# `skip-existing: true` makes it upload only the files PyPI does not have yet,
# and the verify step fails the job unless PyPI lists every file in dist/.
#
# opentide compiles its analysis engine (analysis/, Rust) into the package
# (hatch_build.py), so a release is one wheel per platform and an sdist, all
# of opentide: cibuildwheel builds the wheels ([tool.cibuildwheel] in
# pyproject.toml), each tagged cp310-abi3-<platform> for every CPython from
# 3.10. A platform without a wheel builds the sdist, which needs Rust. The
# engine builds from crates.io sources only (check_engine_pin.py --release).
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Empty on development releases the version CHANGELOG.md names. A tag (e.g. v0.1.8) re-publishes that existing Release.
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [publish-pypi]

permissions:
  contents: read
  id-token: write

# One release at a time; never cancel one that may have uploaded already.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  # Nothing is built, let alone published, from a commit that is not the
  # release tag (or, releasing from development, whose notes PR has not
  # merged), or with the engine from git sources.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    env:
      # Run workflow without a checkout_ref: release development.
      FROM_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.checkout_ref == '' }}
      RELEASE_TAG: ${{ github.event.client_payload.checkout_ref || github.event.inputs.checkout_ref || github.event.release.tag_name || github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create_release: ${{ steps.version.outputs.create_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.client_payload.checkout_ref || github.event.inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The checkout is the release tag, or development ready to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${FROM_BRANCH}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/development" ]]; then
              echo "::error::Run the release from development, not ${GITHUB_REF_NAME}, or pass checkout_ref to re-publish a tag." >&2
              exit 1
            fi
            RELEASE_TAG="v$(python scripts/build/release.py version)"
            python scripts/build/release.py check "${RELEASE_TAG}"
            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null \
              || gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::${RELEASE_TAG} is already tagged. Merge the next version's notes PR, or re-publish it with checkout_ref=${RELEASE_TAG}." >&2
              exit 1
            fi
          elif [[ ! "${RELEASE_TAG}" =~ ^v[0-9] ]] || ! git tag --points-at HEAD | grep -qx "${RELEASE_TAG}"; then
            echo "::error::Refusing to publish: HEAD is not the release tag ${RELEASE_TAG}. Checkout a v* tag." >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "create_release=${FROM_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Engine sources are crates.io releases
        run: python scripts/build/check_engine_pin.py --release

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Native runners: the engine is compiled for the machine that builds it.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
    env:
      # The version of the tag; the Linux containers build from a copy of the checkout.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.checkout_ref || github.event.inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The other images carry Rust; this one may not.
      - name: Rust on Windows on Arm
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
            & $installer -y --profile minimal
            Join-Path $env:USERPROFILE '.cargo\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # manylinux and musllinux on Linux, the runner's architecture on macOS
      # and Windows; each wheel is installed and run before it is kept, except
      # win_arm64's, which the next step installs.
      - name: Build wheels
        run: |
          python -m pip install cibuildwheel==4.3.5
          python -m cibuildwheel --output-dir wheelhouse

      # cibuildwheel's test install would take the newest cryptography, which
      # publishes no Windows on Arm wheel (the last are 46.0.3's cp38-abi3 and
      # cp311-abi3 ones), and compile it. Install the wheel the way a user
      # does, with cryptography from a wheel, and check the engine and doctor.
      - name: Install the win_arm64 wheel and run doctor
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        env:
          PIP_ONLY_BINARY: cryptography
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = @(Get-ChildItem wheelhouse -Filter '*-cp310-abi3-win_arm64.whl')
          if ($wheel.Count -ne 1) { throw "expected one win_arm64 wheel, found $($wheel.Count)" }
          $venv = Join-Path $env:RUNNER_TEMP 'smoke'
          python -m venv $venv
          $python = Join-Path $venv 'Scripts\python.exe'
          $opentide = Join-Path $venv 'Scripts\opentide.exe'
          & $python -m pip install --quiet $wheel[0].FullName
          & $opentide --version
          & $python -c "from opentide.analysis import check_query; assert [f.code for f in check_query('SecurityEvent | wher x', language='kql')] == ['kql_unknown_operator']"
          $workspace = Join-Path $env:RUNNER_TEMP 'smoke-workspace'
          & $opentide --json setup --path $workspace --yes | Out-Null
          Push-Location $workspace
          & $opentide --json doctor --offline
          Pop-Location

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Sdist
    needs: guard
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.checkout_ref || github.event.inputs.checkout_ref || github.sha }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Releasing from development: the tag and the GitHub Release, on the commit
  # the wheels and sdist were built from, before anything reaches PyPI, which
  # is permanent. The changelog section is not re-rendered: the notes PR wrote
  # the body (.github/release-notes/vX.Y.Z.md). No --latest flag: the newest
  # version is Latest by default. GITHUB_TOKEN events start no other workflow,
  # so this Release does not run publish-pypi.yml a second time.
  release:
    name: GitHub Release
    needs: [guard, wheels, sdist]
    if: needs.guard.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/release-notes

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_VERSION}" \
            --notes-file ".github/release-notes/${RELEASE_TAG}.md"

  publish:
    name: Publish to PyPI
    needs: [guard, wheels, sdist, release]
    # `release` is skipped unless this run releases development; a status
    # function is needed for a job after a skipped one to run at all.
    if: >-
      !cancelled()
      && needs.wheels.result == 'success'
      && needs.sdist.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opentide
    # Promote secret presence to env — `secrets` is not allowed in `steps.if`
    # and GitHub treats that as a workflow-file error (release triggers never register).
    env:
      HAS_WEBSITE_APP: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_KEY != '' }}
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Twine check
        run: |
          python -m pip install twine
          python -m twine check dist/*

      # Every platform's wheel and the sdist, of the version the guard approved.
      - name: Reject untagged / dev versions, and missing platforms
        env:
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          built = sorted(p.name for p in Path("dist").iterdir() if p.is_file())
          wheels = [name for name in built if name.endswith(".whl")]
          sdists = [name for name in built if name.endswith(".tar.gz")]
          versions = {name.split("-")[1] for name in wheels} | {
              name.removesuffix(".tar.gz").rsplit("-", 1)[1] for name in sdists
          }
          problems = []
          if len(sdists) != 1:
              problems.append(f"expected one sdist, found {sdists}")
          if len(versions) != 1 or any("dev" in v or "+" in v for v in versions):
              problems.append(f"expected one release version, found {sorted(versions)}")
          elif versions != {os.environ["EXPECTED_VERSION"]}:
              problems.append(f"built {sorted(versions)}, but the guard approved {os.environ['EXPECTED_VERSION']}")
          for platform in ("manylinux", "musllinux", "macosx", "win_amd64", "win_arm64"):
              if not any(platform in name for name in wheels):
                  problems.append(f"no {platform} wheel")
          if not all("-cp310-abi3-" in name for name in wheels):
              problems.append(f"a wheel is not cp310-abi3: {wheels}")
          for problem in problems:
              print(f"::error::Refusing to publish: {problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

      # Inline on purpose: a dispatch retry checks out an older tag, which would
      # not contain a helper script added after it.
      - name: Verify PyPI lists every built file
        env:
          PYPI_JSON_BASE: https://pypi.org/pypi
          VERIFY_TIMEOUT_SECONDS: "600"
          VERIFY_INTERVAL_SECONDS: "15"
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          built = sorted(p.name for p in Path("dist").iterdir() if p.is_file())
          wheels = [name for name in built if name.endswith(".whl")]
          sdists = [name for name in built if name.endswith(".tar.gz")]
          if not wheels or len(sdists) != 1:
              print(f"::error::Expected wheels and one sdist in dist/, found {built}")
              sys.exit(1)
          project, version = wheels[0].split("-")[:2]
          expected = set(wheels + sdists)
          url = f"{os.environ['PYPI_JSON_BASE'].rstrip('/')}/{project}/{version}/json"
          deadline = time.monotonic() + float(os.environ["VERIFY_TIMEOUT_SECONDS"])
          interval = float(os.environ["VERIFY_INTERVAL_SECONDS"])
          while True:
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      listed = {item["filename"] for item in json.load(response).get("urls", [])}
                  status = f"PyPI lists {sorted(listed)}"
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  listed = set()
                  status = f"{url}: {exc}"
              missing = sorted(expected - listed)
              if not missing:
                  print(f"PyPI lists every built file for {project} {version}: {sorted(expected)}")
                  sys.exit(0)
              if time.monotonic() >= deadline:
                  print(f"::error::PyPI is missing {missing} for {project} {version} ({status}).")
                  print(
                      "Retry without retagging; skip-existing uploads only the missing files:\n"
                      "  gh api repos/opentidehq/opentide/dispatches \\\n"
                      "    -f event_type=publish-pypi \\\n"
                      f"    -f client_payload[checkout_ref]=v{version}\n"
                      f"or Actions > Publish to PyPI > Run workflow with checkout_ref=v{version}"
                  )
                  sys.exit(1)
              print(f"Waiting for {missing}; {status}")
              time.sleep(interval)
          PY

      - name: Token to notify the website
        id: website
        continue-on-error: true
        if: env.HAS_WEBSITE_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: opentidehq
          repositories: website

      - name: Notify website to sync docs
        id: notify
        if: steps.website.outcome == 'success' && steps.website.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.website.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/opentidehq/website/dispatches \
            -f event_type=opentide-released \
            -f client_payload[source]=publish-pypi \
            -f client_payload[tag]="${RELEASE_TAG}"

      # Both notify steps are continue-on-error so the website never fails a
      # publish that already succeeded, and a skipped notify looks identical to
      # a working one in the run summary (#540). Say so. No status function in
      # `if`: GitHub prepends success(), so a failed publish adds no warning.
      - name: Warn when the website was not notified
        if: steps.notify.outcome != 'success'
        env:
          HAS_GH_APP_ID: ${{ secrets.GH_APP_ID != '' }}
          HAS_GH_APP_KEY: ${{ secrets.GH_APP_KEY != '' }}
          WEBSITE_TOKEN_OUTCOME: ${{ steps.website.outcome }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          set -euo pipefail
          if [[ "${HAS_WEBSITE_APP}" != "true" ]]; then
            if [[ "${HAS_GH_APP_ID}" == "true" ]]; then
              reason="GH_APP_KEY is not set for this workflow"
            elif [[ "${HAS_GH_APP_KEY}" == "true" ]]; then
              reason="GH_APP_ID is not set for this workflow"
            else
              reason="GH_APP_ID and GH_APP_KEY are not set for this workflow"
            fi
          elif [[ "${WEBSITE_TOKEN_OUTCOME}" == "failure" ]]; then
            reason="it could not mint a GitHub App token for opentidehq/website (is the App installed there?)"
          elif [[ "${NOTIFY_OUTCOME}" == "failure" ]]; then
            reason="the dispatch to opentidehq/website failed (the App needs contents: write there)"
          else
            reason="the GitHub App token was empty"
          fi
          echo "::warning title=Website not notified::${RELEASE_TAG} is on PyPI, but ${reason}. The website's hourly sync will pick it up; to rebuild sooner, run the command in this step's log."
          echo "gh api repos/opentidehq/website/dispatches -f event_type=opentide-released"
