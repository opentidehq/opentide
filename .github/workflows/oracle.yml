name: Oracle

# CI-only differential oracles (scripts/engine/oracles/README.md). The engine is
# compared with Microsoft Kusto.Language, Splunk's search parser, Falco's own
# `falco --validate`, and the Elastic and Lucene parsers (@elastic/esql,
# EqlBase.g4, Kibana's kuery grammar, Lucene's QueryParser). A disagreement not
# listed in crates/testdata/oracles/exceptions.toml is a red build, and so is a
# listed one that is gone. The references never ship: ci.yml's
# `engine-package` job runs scripts/engine/license-scan.sh on the packaged
# crates, as the engine's release (engine-release-build.yml) does on every
# asset.
#
# Imported from opentidehq/language-server (#800), whose oracles also ran on
# its release tags: here that is an `engine-v*` tag (engine-release.yml). `v*`
# tags are opentide's releases, cut from a development commit these jobs
# already checked.
on:
  push:
    # integration/unified-core: the Unified Core PRs merge there before development.
    branches: [main, development, integration/unified-core, "train/catchup-*"]
    tags: ["engine-v*"]
  # On a pull request only when it changes what the references check: the
  # query languages' crates and what they build on, every crate manifest
  # (ci-oracle.sh fails when one depends on a reference), the grammars, the
  # catalogs and the oracles. The full set (ci.yml's header) runs it on every
  # push to the branches above, weekly and on Run workflow.
  pull_request:
    paths:
      - "crates/opentide-analysis/**"
      - "crates/opentide-core/**"
      - "crates/opentide-syntax/**"
      - "crates/opentide-highlight/**"
      - "crates/opentide-ecs/**"
      - "crates/opentide-kql/**"
      - "crates/opentide-spl/**"
      - "crates/opentide-esql/**"
      - "crates/opentide-eql/**"
      - "crates/opentide-kuery/**"
      - "crates/opentide-lucene/**"
      - "crates/opentide-falco/**"
      - "crates/opentide-cql/**"
      - "crates/opentide-lsp/**"
      - "crates/testdata/oracles/**"
      - "crates/*/Cargo.toml"
      - "packages/*/package.json"
      - "grammars/**"
      - "Cargo.lock"
      - "data/catalogs/kql/**"
      - "data/catalogs/spl/**"
      - "data/catalogs/esql/**"
      - "data/catalogs/eql/**"
      - "data/catalogs/carbon_black/**"
      - "data/catalogs/falco/**"
      - "scripts/engine/oracles/**"
      - "scripts/engine/ci-oracle.sh"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:
  schedule:
    # The Carbon Black Cloud tenant is checked weekly, not on every push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPENTIDE_ORACLE_REQUIRED: "1"

jobs:
  # On a pull request, each reference runs only when its language's inputs
  # change (bash patterns, one a line; `*` matches `/` too): a change to the
  # KQL engine no longer pulls Splunk's, Falco's and Elasticsearch's images or
  # Lucene's jars. What every language builds on runs them all. Not a pull
  # request, the `full-ci` label, or a checkout that is not the pull request's
  # merge commit: everything (it fails open, as ci.yml's `changes`).
  changes:
    name: Oracle paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kql: ${{ steps.paths.outputs.kql }}
      spl: ${{ steps.paths.outputs.spl }}
      falco: ${{ steps.paths.outputs.falco }}
      elastic: ${{ steps.paths.outputs.elastic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch's tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Detect each reference's inputs
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          COMMON_PATHS: |
            crates/opentide-analysis/*
            crates/opentide-core/*
            crates/opentide-syntax/*
            crates/opentide-highlight/*
            crates/opentide-lsp/*
            crates/*/Cargo.toml
            crates/testdata/oracles/exceptions.toml
            packages/*/package.json
            Cargo.lock
            scripts/engine/oracles/oracle.py
            scripts/engine/oracles/README.md
            scripts/engine/ci-oracle.sh
            .github/workflows/oracle.yml
          KQL_PATHS: |
            crates/opentide-kql/*
            grammars/tree-sitter-opentide-kql/*
            data/catalogs/kql/*
            crates/testdata/oracles/kql/*
            scripts/engine/oracles/kusto/*
          SPL_PATHS: |
            crates/opentide-spl/*
            grammars/tree-sitter-opentide-spl/*
            data/catalogs/spl/*
            crates/testdata/oracles/spl/*
            scripts/engine/oracles/splunk/*
          FALCO_PATHS: |
            crates/opentide-falco/*
            grammars/tree-sitter-opentide-falco/*
            data/catalogs/falco/*
            crates/testdata/oracles/falco/*
            scripts/engine/oracles/falco/*
          ELASTIC_PATHS: |
            crates/opentide-esql/*
            crates/opentide-eql/*
            crates/opentide-kuery/*
            crates/opentide-lucene/*
            crates/opentide-ecs/*
            grammars/tree-sitter-opentide-esql/*
            grammars/tree-sitter-opentide-eql/*
            grammars/tree-sitter-opentide-kuery/*
            grammars/tree-sitter-opentide-lucene/*
            data/catalogs/esql/*
            data/catalogs/eql/*
            crates/testdata/oracles/elasticsearch/*
            scripts/engine/oracles/elastic/*
            scripts/engine/oracles/elasticsearch/*
        run: |
          set -euo pipefail
          outputs=(kql spl falco elastic)
          if [[ "${EVENT_NAME}" != "pull_request" || "${FULL_CI}" == true ]] \
            || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            for output in "${outputs[@]}"; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          matches() {
            local patterns="$1" file pattern
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              while IFS= read -r pattern; do
                # Unquoted on the right: a pattern, not a string.
                # shellcheck disable=SC2053
                if [[ -n "${pattern}" && "${file}" == ${pattern} ]]; then
                  echo "input changed: ${file}" >&2
                  return 0
                fi
              done <<<"${patterns}"
            done <<<"${changed}"
            return 1
          }
          common=false
          if matches "${COMMON_PATHS}"; then common=true; fi
          for output in "${outputs[@]}"; do
            patterns_var="${output^^}_PATHS"
            value="${common}"
            if matches "${!patterns_var}"; then value=true; fi
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          done

  kql:
    name: Kusto.Language
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.kql == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      # Every oracle builds the same debug opentide-lsp: one cache, saved by
      # this job on a branch push (not a tag), read by the others.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: oracle
          save-if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: bash scripts/engine/ci-oracle.sh kql

  spl:
    name: Splunk
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.spl == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      # Not a service container: splunkd takes minutes to start and the runner's
      # readiness check needs a health status, so start.sh runs it and
      # oracle.py waits. Starting it accepts the Splunk General Terms for this
      # throwaway instance, bound to 127.0.0.1, which only answers search/parser.
      - name: Splunk oracle
        run: |
          eval "$(bash scripts/engine/oracles/splunk/start.sh)"
          bash scripts/engine/ci-oracle.sh spl

  falco:
    # Every case of crates/testdata/oracles/falco/cases.yaml and every Falco default
    # rule condition (with its broken twin) through the real Falco, one
    # `falco --validate` per case, beside the engine's verdict. The pins are
    # recorded in scripts/engine/oracles/README.md; bump them together.
    name: Falco ${{ matrix.falco }}
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.falco == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        falco: ["0.45.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: falcosecurity/rules
          persist-credentials: false
          ref: e7b066bfbc8d81226ca5fa3e95ffd4dee38a2428
          path: falco-rules
          sparse-checkout: rules
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: docker pull falcosecurity/falco:${{ matrix.falco }}
      - name: Falco oracle
        run: >
          python3 scripts/engine/oracles/falco/oracle.py
          --rules falco-rules
          --docker falcosecurity/falco:${{ matrix.falco }}
          --report falco-oracle-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: falco-oracle-report-${{ matrix.falco }}
          path: falco-oracle-report.json

  elastic:
    name: Elastic and Lucene
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.elastic == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Elastic's public rules (ELv2), read at CI time and never vendored.
      # Elasticsearch accepts every one, so they are queries the engine must
      # not reject. Same pin as ci.yml's elastic-sweep job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elastic/detection-rules
          persist-credentials: false
          ref: 2b30453d7dede69f980472cff51a2ae9a6917bae
          path: detection-rules
          sparse-checkout: |
            rules
            rules_building_block
            hunting
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      # The pinned references oracle.py fetches (Lucene's jars from Maven
      # Central, Elasticsearch's EQL grammar and Kibana's kuery grammar):
      # cached under their pins (oracle.py's FETCH), so a run does not depend
      # on Maven answering (it rate-limits: HTTP 429 on #1041). oracle.py
      # checks every file's SHA-256, a restored one too, and fetches again on a
      # mismatch. Saved from pushes only, as every cache here.
      - name: Restore the pinned references
        id: references
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/engine/oracles/elastic/.cache/*.jar
            scripts/engine/oracles/elastic/.cache/*.g4
            scripts/engine/oracles/elastic/.cache/*.peggy
          key: oracle-references-${{ hashFiles('scripts/engine/oracles/oracle.py') }}
      - name: Elastic oracles
        env:
          OPENTIDE_DETECTION_RULES: ${{ github.workspace }}/detection-rules
        run: bash scripts/engine/ci-oracle.sh esql eql kuery lucene
      - name: Save the pinned references
        if: github.event_name == 'push' && steps.references.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/engine/oracles/elastic/.cache/*.jar
            scripts/engine/oracles/elastic/.cache/*.g4
            scripts/engine/oracles/elastic/.cache/*.peggy
          key: oracle-references-${{ hashFiles('scripts/engine/oracles/oracle.py') }}

  elasticsearch:
    # The oldest and newest recorded release lines. probes.py fails when a
    # verdict in crates/testdata/oracles/elasticsearch/expected.tsv no longer holds;
    # esql_catalog.py fails when a data/catalogs/esql `versions` list is wrong.
    name: Live Elasticsearch ${{ matrix.version }}
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'full-ci')
        || needs.changes.result != 'success'
        || needs.changes.outputs.elastic == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.19.23", "9.5.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start Elasticsearch
        shell: bash  # with pipefail, so a failed start fails the step
        run: bash scripts/engine/oracles/elasticsearch/start.sh ${{ matrix.version }} | sed "s/^export //" >> "$GITHUB_ENV"
      - name: Probes
        run: python3 scripts/engine/oracles/elasticsearch/probes.py
      - name: ES|QL catalog versions
        run: python3 scripts/engine/oracles/elasticsearch/esql_catalog.py
      - name: Stop Elasticsearch
        if: always()
        run: docker rm -f opentide-es-oracle-9200

  # Carbon Black Cloud (#162): every Carbon Black query through a tenant's
  # search_validation. It needs a tenant: OPENTIDE_CBC_URL, OPENTIDE_CBC_ORG_KEY
  # and OPENTIDE_CBC_TOKEN (`<api secret>/<api id>`, org.search.events READ) as
  # secrets. Weekly and on demand only, never on a pull request, so a fork
  # never sees them; without them the job says so and passes.
  carbon_black:
    name: Carbon Black Cloud
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENTIDE_ORACLE_REQUIRED: "0"
      OPENTIDE_CBC_URL: ${{ secrets.OPENTIDE_CBC_URL }}
      OPENTIDE_CBC_ORG_KEY: ${{ secrets.OPENTIDE_CBC_ORG_KEY }}
      OPENTIDE_CBC_TOKEN: ${{ secrets.OPENTIDE_CBC_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: oracle
          save-if: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - run: bash scripts/engine/ci-oracle.sh carbon_black
