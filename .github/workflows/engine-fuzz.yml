name: Engine fuzz

# Each engine and the LSP host under cargo-fuzz for five minutes a night
# (language-server#182), imported with the engine (#800). Informational: a crash
# uploads its input and fails this run only. Fix it, then save the input under
# fuzz/regressions/<target>/ (fuzz/README.md).
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [kql, spl, esql, eql, kuery, lucene, falco, tide, protocol]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dated nightly fuzz/NIGHTLY pins, which scripts/engine/fuzz.sh also reads.
      - name: Set up Rust (nightly)
        run: |
          echo "FUZZ_TOOLCHAIN=$(cat fuzz/NIGHTLY)" >> "$GITHUB_ENV"
          FUZZ_TOOLCHAIN="$(cat fuzz/NIGHTLY)"
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --no-self-update
      - run: cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: bash scripts/engine/fuzz.sh "${{ matrix.target }}" "$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
