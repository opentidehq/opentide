name: Engine fuzz

# Every fuzz target (fuzz/fuzz_targets/) under cargo-fuzz for ten minutes
# (#843; language-server#182), in the nightly: ci.yml's `nightly` job calls
# nightly.yml, which calls this workflow, so a failure here is the nightly's
# and `nightly-report` files it. Run workflow runs it alone. A crash or a
# timeout fails its cell and uploads the input; fix it with a regression
# test, then save the input under fuzz/regressions/<target>/ (fuzz/README.md),
# where the normal test run replays it. The corpus each target learns is kept
# in the Actions cache from night to night; tests/test_ci/test_workflows.py
# keeps the matrix complete.
on:
  workflow_call:
    inputs:
      seconds:
        description: seconds per target
        type: number
        default: 600
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Ten minutes of fuzzing, the build and the cache: a hang past this is a
    # failure too.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [kql, spl, esql, eql, kuery, lucene, falco, cql, yara, exabeam, yaral, tide, protocol, config, framing, cli, serve, from_node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dated nightly fuzz/NIGHTLY pins, which scripts/engine/fuzz.sh also reads.
      - name: Set up Rust (nightly)
        id: nightly
        run: |
          echo "FUZZ_TOOLCHAIN=$(cat fuzz/NIGHTLY)" >> "$GITHUB_ENV"
          FUZZ_TOOLCHAIN="$(cat fuzz/NIGHTLY)"
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --no-self-update
          echo "version=$(rustc +"${FUZZ_TOOLCHAIN}" -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # fuzz/ is a workspace of its own; cargo-fuzz builds into fuzz/target.
      # rust-cache also keeps ~/.cargo/bin, so cargo-fuzz installs once. Its
      # key hashes the pinned stable (rust-toolchain.toml), not the nightly
      # that builds here: `key` names the nightly, so a new one saves a new
      # tree. Saved by one cell of the scheduled nightly only (on
      # development, the default branch, whose caches every pull request
      # reads): a target tree per run evicted the compiler caches pull
      # requests restore (#841).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ matrix.target == 'kql' && github.event_name == 'schedule' }}
          shared-key: fuzz
          key: ${{ steps.nightly.outputs.version }}
          workspaces: fuzz -> target
      - run: cargo +"${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked --version 0.13.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/engine/fuzz.sh "${TARGET}" "${SECONDS_PER_TARGET}"
      # A cell stopped by timeout-minutes is cancelled, not failed: upload then too.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
