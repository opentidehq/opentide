# The parity dashboard (plan §5.4 "Strength", UC-X.2 #844): `cargo xtask parity
# dashboard` renders each command × corpus × mode against the Python oracle,
# the approved diffs and the fault catalogue's coverage.
#
# By default nothing is pushed. Every run (pull requests, pushes to
# `development` and `integration/unified-core`, the daily schedule, a manual
# run) puts the page in the job summary and in the `parity-dashboard`
# artifact, read-only. That alone shows the migration's state on every change.
#
# Keeping docs/internal/parity.md current on the branch is a maintainer option:
# set the repository variable PARITY_COMMIT to `true`. The `commit` job then:
# - runs only on the schedule (the default branch, development) or on a manual
#   run of development or integration/unified-core: never on a pull request,
#   never on a push, never on code from a fork;
# - holds `contents: write` and no other token or secret; the rest of the
#   workflow is `contents: read`;
# - writes exactly one path, docs/internal/parity.md (`git commit --only`),
#   from the page the read-only `dashboard` job rendered, and runs no code from
#   the repository;
# - never force-pushes: when the branch has moved on, the push is refused and
#   the next run writes the page. A push made with GITHUB_TOKEN starts no
#   workflow, so it cannot loop.
# Why a commit at all: a generated page in the repository is readable from the
# docs site and the epic without opening a run. A pull request per change is
# the other no-bypass route, but a PR opened with GITHUB_TOKEN starts no
# workflow, so its required checks never report and a human merges a generated
# file. Branch protection must let github-actions[bot] push the commit.
name: Parity

on:
  push:
    # integration/unified-core collects the unified-core work before it
    # reaches development (the maintainer's merge flow).
    branches: [development, integration/unified-core]
  pull_request:
  schedule:
    # Daily at 05:23 UTC on the default branch: the page a commit would write.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  # On a pushed branch a run is not cancelled mid-commit; GitHub keeps one pending
  # run per group, so the newest push's page is the one that lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    name: Parity dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The engine state: RUST_COMMANDS in src/opentide/cli/engines.py, read
      # with the standard library alone (no Python environment needed). The
      # compare results come with UC-0.5's golden-compare job; until it
      # publishes its RunReport, commands with Rust show "compare not run".
      - name: Render the dashboard
        run: |
          set -o pipefail
          mkdir -p parity
          python3 scripts/parity_engines.py > parity/engines.json
          cargo xtask parity dashboard --engines parity/engines.json --out parity/parity.md
          cat parity/parity.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-dashboard
          path: parity/parity.md
          if-no-files-found: error
          retention-days: 14

  commit:
    name: Commit the dashboard
    needs: dashboard
    # Off unless a maintainer sets PARITY_COMMIT; then only on the schedule or
    # a manual run, and only on these two branches (see the header).
    if: >-
      vars.PARITY_COMMIT == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/integration/unified-core')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The commit the dashboard was rendered from; the credentials stay for
      # the one push below (contents: write, this job only).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-dashboard
          path: parity

      - name: Commit docs/internal/parity.md when it changed
        env:
          PUSHED: ${{ github.sha }}
          # One of the two branches the job condition allows.
          BRANCH: ${{ github.ref }}
        run: |
          cp parity/parity.md docs/internal/parity.md
          # porcelain also sees the page when it is not tracked yet.
          if [ -z "$(git status --porcelain -- docs/internal/parity.md)" ]; then
            echo "The dashboard is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --only docs/internal/parity.md \
            -m "docs(parity): regenerate the parity dashboard" \
            -m "Rendered by the dashboard job of the parity workflow from $PUSHED (UC-X.2, #844)."
          if git push origin "HEAD:$BRANCH"; then
            echo "Committed the dashboard on $BRANCH." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Refused. The branch moved on: the run on the newer commit writes
          # the page. Otherwise (branch protection, say) fail and say so.
          remote=$(git ls-remote origin "$BRANCH" | cut -f1)
          if [ "$remote" != "$PUSHED" ]; then
            echo "$BRANCH moved on to $remote; the run on that commit writes the page." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The push of docs/internal/parity.md to $BRANCH was refused: branch protection must let github-actions[bot] push it (.github/workflows/parity.yml)."
          exit 1
