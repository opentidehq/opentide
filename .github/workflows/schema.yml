name: Schema

# opentide-schema (UC-1.1, #807): the Tide model builds for every host that will
# load it: native, CPython through PyO3 (abi3-py310, feature `python`) and the
# browser (wasm32-unknown-unknown, feature `wasm`). ci.yml's `engine` job lints
# and tests the workspace without features, so the Python class and the wasm32
# build are linted and tested here. Its own workflow until UC-0.3 (#801) brings
# CI together.
#
# On a pull request only when it changes opentide-schema, what it builds on or
# its generated stubs (the paths below; not a required check); on every push to
# main, development and integration/unified-core, nightly and on Run workflow,
# as ci.yml's full set.

on:
  # Part of the nightly: ci.yml calls this workflow (its `nightly` scope,
  # .github/AGENTS.md); Run workflow runs it alone. Never on a pull request
  # or a push, so it never blocks a merge.
  workflow_call:
  workflow_dispatch:

concurrency:
  # A pull request's new push cancels its stale run; every other run (a push
  # to development, integration/unified-core or main, the nightly, Run
  # workflow) has a group of its own, its run id, so none cancels another and
  # each push to a base branch gets a complete run (tests/test_ci/test_concurrency.py).
  group: schema-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  schema:
    name: opentide-schema (native, abi3-py310, wasm32)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings"
      CARGO_TERM_COLOR: always
      # A changed or missing snapshot fails; CI never writes one.
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/python.rs embeds CPython: 3.10 is the abi3 floor, and its shared
      # libpython is what the test links.
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      # The release rust-toolchain.toml pins. `rustup toolchain install` with no
      # name installs the file's toolchain but drops `--target`, so the wasm32
      # standard library and clippy are added to it explicitly.
      - name: Set up Rust
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup component add clippy
          rustup target add wasm32-unknown-unknown

      # Its own cache: no other job builds these features or this target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved by the nightly and pushes to development only (the default
          # branch, whose caches every pull request reads): a target tree per
          # integration merge, whose Cargo.lock nearly always changed, evicted
          # the compiler caches pull requests restore (#841).
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/development' }}
          workspaces: . -> target
          shared-key: schema

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.148

      - name: Build for the native target, abi3-py310 and wasm32
        run: |
          cargo build --locked -p opentide-schema
          cargo build --locked -p opentide-schema --features python
          cargo build --locked -p opentide-schema --target wasm32-unknown-unknown --features wasm

      - name: clippy (python, wasm32)
        run: |
          cargo clippy --locked -p opentide-schema --all-targets --features python -- -D warnings
          cargo clippy --locked -p opentide-schema --all-targets --features stubs -- -D warnings
          cargo clippy --locked -p opentide-schema --target wasm32-unknown-unknown --features wasm -- -D warnings

      # PYO3_PYTHON: link the interpreter setup-python installed, not the
      # runner's; LD_LIBRARY_PATH: where the test binary finds its libpython.
      - name: Tests, with the Python class
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          LD_LIBRARY_PATH="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          cargo nextest run --locked -p opentide-schema --features python --profile ci
          cargo test --locked -p opentide-schema --features python --doc

      # The stubs of opentide._native.models and opentide._native.sdk are
      # generated from the extension (UC-1.9, ADR 0011; UC-5.2b): build it with
      # PyO3's introspection data, as Python 3.10 (the abi3 floor) sees it, and
      # fail when a committed stub differs.
      - name: Generated stubs are up to date
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo xtask stubs --check
