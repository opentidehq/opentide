[[options]]
command = "stats"
name = "by"
docs = "Split-by fields."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Stats"

[[options]]
command = "chart"
name = "over"
docs = "Chart over field."
