# Command arguments for completion and signature help.
# Names and values are the Search Reference syntax for that command.
# Commands with no row here have no argument schema (names stay in commands.toml).
[[options]]
command = "tstats"
name = "summariesonly"
values = ["t", "f", "true", "false"]
docs = "Restrict to accelerated data-model summaries (true/false/t/f)."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
command = "tstats"
name = "prestats"
values = ["t", "f", "true", "false"]
docs = "Emit prestats format for a later stats/chart."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
command = "tstats"
name = "allow_old_summaries"
values = ["t", "f", "true", "false"]
docs = "Include outdated summaries."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
command = "tstats"
name = "fillnull_value"
docs = "Fill missing values."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
command = "tstats"
name = "from"
docs = "from datamodel=Model.Dataset (or namespace)."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
command = "tstats"
name = "datamodel"
docs = "CIM / ES data model path (Endpoint.Processes)."
citation = "https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/Tstats"

[[options]]
