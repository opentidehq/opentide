# CIM data models used in ES / ESCU tstats detections.
# prefix is applied to fields until `drop_dm_object_name(prefix)` runs.
[[datamodels]]
name = "Endpoint.Processes"
prefix = "Processes"
model = "Endpoint"
docs = "Process creation (CIM Endpoint)."
fields = ["process_name", "process", "process_exec", "process_path", "process_id", "process_guid", "process_hash", "parent_process_name", "parent_process_path", "parent_process_id", "user", "dest", "os", "original_file_name", "action"]
citation = "https://docs.splunk.com/Documentation/CIM/latest/User/Endpoint"

[[datamodels]]
name = "Endpoint.Filesystem"
prefix = "Filesystem"
model = "Endpoint"
docs = "File create/modify/delete."
fields = ["file_name", "file_path", "file_hash", "file_size", "dest", "user", "process_name", "action"]
citation = "https://docs.splunk.com/Documentation/CIM/latest/User/Endpoint"

[[datamodels]]
name = "Endpoint.Registry"
prefix = "Registry"
model = "Endpoint"
docs = "Registry changes."
fields = ["registry_hive", "registry_path", "registry_key_name", "registry_value_name", "registry_value_data", "dest", "user", "process_name", "action"]
citation = "https://docs.splunk.com/Documentation/CIM/latest/User/Endpoint"

[[datamodels]]
name = "Endpoint.Services"
