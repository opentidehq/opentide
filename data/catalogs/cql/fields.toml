sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#ecs.version"
layer = "cps"
kind = "tag"
type = "string"
docs = "ECS version the parser maps to. Required by CPS."
sources = ["library.humio.com", "cqlqueries"]

[[fields]]
name = "#Cps.version"
layer = "cps"
kind = "tag"
type = "string"
docs = "CPS version the parser follows, capital C. Required by CPS."
sources = ["library.humio.com", "cqlqueries"]

[[fields]]
name = "#observer.type"
layer = "cps"
kind = "tag"
type = "string"
docs = "ECS `observer.type` kept as a tag (firewall, proxy, ...). Required by CPS."
sources = ["library.humio.com", "cqlqueries"]

[[fields]]
name = "#error"
layer = "cps"
kind = "tag"
type = "string"
scope = "parser"
docs = "true when a CPS parser could not parse the whole event."
sources = ["lcc"]

[[fields]]
name = "Parser.version"
layer = "cps"
kind = "field"
type = "string"
docs = "Version of the parser that produced the event (semver)."
