# CQL fields and tags, generated by scripts/sync_cql_catalog.py. Do not edit.
# Layers: `logscale` (on every event or ingest route), `falcon` (Falcon platform data),
# `cps` (third-party data parsed to the CrowdStrike Parsing Standard, ECS names at the root).
# Names are facts from library.humio.com and the sources below; `docs` is written
# for this catalog. Rows with `ecs = true` take their description from catalogs/ecs.
# Source: CrowdStrike/logscale-community-content@77cfc4e314d40611fdbc354c80ed39c9548fa12c (2026-11-02)
# Source: ByteRay-Labs/Query-Hub@a453fcb09118894840a4e00b0db0f9807ba8441d (2026-10-21)
# Source: cs-shadowbq/CQL-Queries@dff08d679873d9c690eae1e560279a8522014a83 (2026-05-07)
# Source: Azure/Azure-Sentinel@432892c3a8271b0755a7b1f6885a1329665d5ac2 (2026-11-06)
# Source: SigmaHQ/pySigma-backend-crowdstrike@cd97ea07aaf570f0f405bdfdd48a3f93c017dbfd (2026-10-30)
# Source: elastic/ecs@401807e0547301525acd28c4fb667203fec66d59 (v9.5.0) via catalogs/ecs/fields.json (Apache-2.0) for ECS types.
# `values`: values the public queries compare the tag with (twice or more; for `#repo`, the
# CrowdStrike-managed repositories among them). Completion only.
# LogScale is schemaless: this is never a closed list.

[[fields]]
name = "@timestamp"
layer = "logscale"
kind = "metadata"
type = "timestamp"
docs = "When the event happened, in milliseconds since the Unix epoch (UTC). Searches filter on it."
sources = ["library.humio.com"]

[[fields]]
name = "@timestamp.nanos"
layer = "logscale"
kind = "metadata"
type = "integer"
docs = "Nanoseconds beyond the millisecond of `@timestamp`, when the source has them."
sources = ["library.humio.com"]

[[fields]]
name = "@ingesttimestamp"
layer = "logscale"
kind = "metadata"
type = "timestamp"
docs = "When LogScale received the event, in epoch milliseconds. Correlation rules can schedule on it."
sources = ["library.humio.com", "developer.crowdstrike.com"]

[[fields]]
name = "@rawstring"
layer = "logscale"
kind = "metadata"
type = "string"
docs = "The event as it arrived, before parsing. Free-text search and most parsers read it."
sources = ["library.humio.com"]

[[fields]]
name = "@id"
layer = "logscale"
kind = "metadata"
type = "string"
docs = "Identifier LogScale gives each stored event."
sources = ["library.humio.com"]

[[fields]]
name = "@timezone"
layer = "logscale"
kind = "metadata"
type = "string"
docs = "Time zone of the source timestamp, when the parser could tell."
sources = ["library.humio.com"]

[[fields]]
name = "@error_msg"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "parser"
docs = "Why parsing the event failed; can be an array (`@error_msg[0]`)."
sources = ["lcc"]

[[fields]]
name = "@event_parsed"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "parser"
docs = "Parser flag recording whether the event was parsed."
sources = ["lcc"]

[[fields]]
name = "@source"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "collector"
docs = "Ingest source label set on the way in (for example by a data connector)."
sources = ["cqlqueries"]

[[fields]]
name = "@sourcetype"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "collector"
docs = "Source type label set at ingest."
sources = ["cqlqueries", "lcc"]

[[fields]]
name = "@host"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "collector"
docs = "Host the shipper or collector sent the event from."
sources = ["lcc"]

[[fields]]
name = "@dataConnectionID"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "ngsiem"
docs = "Next-Gen SIEM data connector that brought the event in."
sources = ["cqlqueries", "lcc"]

[[fields]]
name = "@collect.channel"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "collector"
docs = "LogScale Collector source (channel) the event was read from."
sources = ["lcc"]

[[fields]]
name = "@collect.host"
layer = "logscale"
kind = "metadata"
type = "string"
scope = "collector"
docs = "Host name the LogScale Collector reports for itself."
sources = ["lcc"]

[[fields]]
name = "@collect.timestamp"
layer = "logscale"
kind = "metadata"
type = "timestamp"
scope = "collector"
docs = "When the LogScale Collector read the event."
sources = ["lcc"]

[[fields]]
name = "#repo"
layer = "logscale"
kind = "tag"
type = "string"
docs = "Repository that stores the event. A view such as search-all spans several."
values = [
    "base_sensor", "detections", "xdr_indicatorsrepo", "sensor_metadata", "falcon_for_it",
    "humio-fleet", "fcs_csp_events", "humio-usage", "3pi_connection_errors", "fusion",
    "humio-measurements",
]
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#type"
layer = "logscale"
kind = "tag"
type = "string"
docs = "Parser that ingested the event."
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#humioBackfill"
layer = "logscale"
kind = "tag"
type = "string"
docs = "Set at ingest on events whose timestamp is more than about a day old."
sources = ["library.humio.com"]

[[fields]]
name = "#repo.cid"
layer = "falcon"
kind = "tag"
type = "string"
scope = "ngsiem"
docs = "Falcon customer ID (CID) of the repository; filters a multi-CID (MSSP) tenant."
sources = ["lcc", "cqlqueries"]

[[fields]]
name = "#event_simpleName"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Falcon event type, such as ProcessRollup2. FDR exports carry it as the plain field `event_simpleName`."
sources = ["lcc", "queryhub", "cqlqueries", "sentinel", "pysigma"]

[[fields]]
name = "#cid"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Falcon customer ID of a sensor event; the field `cid` holds the same value."
sources = ["lcc"]

[[fields]]
name = "#streamingApiEvent"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Streaming API type of a record in the detections repository, such as Event_EppDetectionSummaryEvent."
values = [
    "Event_DetectionSummaryEvent", "Event_UserActivityAuditEvent", "Event_IdpDetectionSummaryEvent",
]
sources = ["lcc"]

[[fields]]
name = "#kind"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Primary for sensor events, Secondary for lookup data such as aidmaster."
values = ["Secondary", "Primary"]
sources = ["lcc"]

[[fields]]
name = "#data_source_name"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Lookup data set in sensor_metadata, such as aidmaster or cid_name."
values = ["aidmaster", "cid_name", "aid-policy", "policyinfo"]
sources = ["lcc"]

[[fields]]
name = "#data_source_group"
layer = "falcon"
kind = "tag"
type = "string"
docs = "Group a sensor_metadata data set belongs to."
sources = ["lcc"]

[[fields]]
name = "aid"
layer = "falcon"
kind = "field"
type = "string"
docs = "Falcon agent ID: the sensor (host) that sent the event."
sources = ["lcc", "sentinel"]

[[fields]]
name = "cid"
layer = "falcon"
kind = "field"
type = "string"
docs = "Falcon customer ID of the sensor's tenant."
sources = ["lcc", "sentinel"]

[[fields]]
name = "aip"
layer = "falcon"
kind = "field"
type = "string"
docs = "The host's external IP address as the Falcon cloud saw it."
sources = ["lcc", "sentinel"]

[[fields]]
name = "event_platform"
layer = "falcon"
kind = "field"
type = "string"
docs = "Operating system family of the sensor: Win, Mac, Lin or K8S."
values = ["Win", "Mac", "Lin", "K8S"]
sources = ["lcc", "sentinel", "pysigma"]

[[fields]]
name = "ComputerName"
layer = "falcon"
kind = "field"
type = "string"
docs = "Host name of the sensor. Many queries join it from aidmaster."
sources = ["lcc", "pysigma"]

[[fields]]
name = "timestamp"
layer = "falcon"
kind = "field"
type = "timestamp"
docs = "When the Falcon cloud received the event, in epoch milliseconds."
sources = ["sentinel"]

[[fields]]
name = "ContextTimeStamp"
layer = "falcon"
kind = "field"
type = "number"
docs = "When the sensor saw the activity, in epoch seconds with a fraction."
sources = ["lcc", "sentinel"]

[[fields]]
name = "name"
layer = "falcon"
kind = "field"
type = "string"
docs = "Internal name of the sensor event record."
sources = ["sentinel"]

[[fields]]
name = "id"
layer = "falcon"
kind = "field"
type = "string"
docs = "Unique ID of the sensor event."
sources = ["sentinel"]

[[fields]]
name = "ConfigBuild"
layer = "falcon"
kind = "field"
type = "string"
docs = "Sensor build and configuration version that produced the event."
sources = ["lcc", "sentinel"]

[[fields]]
name = "ConfigStateHash"
layer = "falcon"
kind = "field"
type = "string"
docs = "Hash of the sensor's configuration state."
sources = ["sentinel"]

[[fields]]
name = "EffectiveTransmissionClass"
layer = "falcon"
kind = "field"
type = "string"
docs = "How the sensor prioritised sending the event."
sources = ["sentinel"]

[[fields]]
name = "Entitlements"
layer = "falcon"
kind = "field"
type = "string"
docs = "Falcon modules the sensor was licensed for when it sent the event."
sources = ["sentinel"]

[[fields]]
name = "EventOrigin"
layer = "falcon"
kind = "field"
type = "string"
docs = "Which part of the sensor produced the event."
sources = ["sentinel"]

[[fields]]
name = "ExternalApiType"
layer = "falcon"
kind = "field"
type = "string"
docs = "Streaming API record type in the detections repository, such as Event_UserActivityAuditEvent."
sources = ["lcc", "cqlqueries"]

[[fields]]
name = "#Vendor"
layer = "cps"
kind = "tag"
type = "string"
docs = "Vendor of the data source in lower case (aws, microsoft, zscaler). Required by CPS."
values = [
    "corelight", "google", "paloalto", "netskope", "mimecast", "microsoft", "appomni", "fortinet",
    "crowdstrike", "okta", "cisco",
]
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#event.module"
layer = "cps"
kind = "tag"
type = "string"
docs = "Product or service of the vendor (cloudtrail, azure, zia). Required by CPS."
values = ["ndr", "defender-identity", "azure", "emailsecurity", "duo", "sso"]
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#event.dataset"
layer = "cps"
kind = "tag"
type = "string"
docs = "Data set within the module, written `module.dataset`. Required by CPS."
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#event.kind"
layer = "cps"
kind = "tag"
type = "string"
docs = "ECS `event.kind` kept as a tag; event or alert in practice. Required by CPS."
values = ["alert", "event"]
sources = ["library.humio.com", "lcc"]

[[fields]]
name = "#event.outcome"
layer = "cps"
kind = "tag"
type = "string"
docs = "ECS `event.outcome` kept as a tag: success, failure or unknown. Required by CPS."
