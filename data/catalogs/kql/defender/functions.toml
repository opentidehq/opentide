[[functions]]
name = "DeviceFromIP"
signature = "invoke DeviceFromIP()"
docs = "Use the DeviceFromIP() function in your advanced hunting queries to quickly obtain the list of devices that have been assigned to a certain IP address at a given point in time."
citation = "https://learn.microsoft.com/defender-xdr/advanced-hunting-devicefromip-function"
kind = "tabular"
profile = "defender"

[[functions.parameters]]
name = "x"
docs = "The first parameter is typically already a column in the query. In this case, it's the column named IP, the IP address for which you want to see a list of devices that have been assigned to it. It should be a local IP address. External IP addresses aren't supported."
required = true

[[functions.parameters]]
name = "y"
docs = "A second optional parameter is the Timestamp, which instructs the function to obtain the most recent assigned devices from a specific time. If not specified, the function returns the latest available records."
required = false

[[functions]]
name = "SeenBy"
signature = "invoke SeenBy(x)"
docs = "The SeenBy() function is invoked to see a list of onboarded devices that have seen a certain device using the device discovery feature."
citation = "https://learn.microsoft.com/defender-xdr/advanced-hunting-seenby-function"
kind = "tabular"
profile = "defender"

[[functions.parameters]]
name = "x"
docs = "where x is the device ID of interest"
required = true

[[functions]]
name = "AssignedIPAddresses"
signature = "AssignedIPAddresses(x, y)"
docs = "Use the AssignedIPAddresses() function in your advanced hunting queries to quickly obtain the latest IP addresses that have been assigned to a device."
citation = "https://learn.microsoft.com/defender-xdr/advanced-hunting-assignedipaddresses-function"
kind = "tabular"
profile = "defender"

[[functions.parameters]]
name = "x"
docs = "DeviceId or DeviceName value identifying the device"
required = true

[[functions.parameters]]
name = "y"
docs = "Timestamp (datetime) value instructing the function to obtain the most recent assigned IP addresses from a specific time. If not specified, the function returns the latest IP addresses."
