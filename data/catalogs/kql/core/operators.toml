# KQL tabular operators.
# Signatures are the Learn syntax, wrapped as name(...) so signature help has an argument list.
# Blurbs are the article's opening sentence (pipe characters inside signatures are not split).

[[operators]]
name = "where"
kind = "tabular"
signature = "where(Predicate)"
docs = "Filters a table to the subset of rows that satisfy a predicate."
citation = "https://learn.microsoft.com/kusto/query/where-operator"

[[operators.parameters]]
name = "Predicate"
docs = "Expression that evaluates to a bool for each row in T."
required = true

[[operators]]
name = "filter"
kind = "tabular"
signature = "filter(Predicate)"
docs = "Alias of where."
citation = "https://learn.microsoft.com/kusto/query/where-operator"
alias_of = "where"

[[operators.parameters]]
name = "Predicate"
docs = "Expression that evaluates to a bool for each row in T."
required = true

[[operators]]
name = "search"
kind = "tabular"
signature = "search([kind= CaseSensitivity] [in(TableSources)] SearchPredicate)"
docs = "Searches a text pattern in multiple tables and columns."
citation = "https://learn.microsoft.com/kusto/query/search-operator"
warning = "sentinel_star_restricted"

[[operators.parameters]]
name = "CaseSensitivity"
docs = "A flag that controls the behavior of all string scalar operators, such as has, with respect to case sensitivity."
required = false

[[operators.parameters]]
name = "TableSources"
docs = "A comma-separated list of \"wildcarded\" table names to take part in the search."
required = false

[[operators.parameters]]
name = "SearchPredicate"
docs = "A boolean expression to be evaluated for every record in the input."
required = true

[[operators]]
name = "find"
kind = "tabular"
signature = "find([withsource= ColumnName] [in(Tables)] where Predicate [project-smart | project ColumnName[: ColumnType, ...] [, pack_all()]])"
docs = "Finds rows that match a predicate across a set of tables."
citation = "https://learn.microsoft.com/kusto/query/find-operator"

[[operators.parameters]]
name = "ColumnName"
docs = "By default, the output includes a column called source_ whose values indicate which source table contributed to each row."
required = false

[[operators.parameters]]
name = "Predicate"
docs = "This boolean expression is evaluated for each row in each input table."
required = true

[[operators.parameters]]
name = "Tables"
docs = "Zero or more comma-separated table references."
required = false

[[operators.parameters]]
name = "project-smart | project"
docs = "If not specified, project-smart is used by default."
required = false

[[operators]]
name = "take"
kind = "tabular"
signature = "take(NumberOfRows)"
docs = "Return up to the specified number of rows."
citation = "https://learn.microsoft.com/kusto/query/take-operator"

[[operators.parameters]]
name = "NumberOfRows"
docs = "The number of rows to return."
required = true

[[operators]]
name = "limit"
kind = "tabular"
signature = "limit(NumberOfRows)"
docs = "Alias of take."
citation = "https://learn.microsoft.com/kusto/query/take-operator"
alias_of = "take"

[[operators.parameters]]
name = "NumberOfRows"
docs = "The number of rows to return."
required = true

[[operators]]
name = "top"
kind = "tabular"
signature = "top(NumberOfRows by Expression [asc | desc] [nulls first | nulls last])"
docs = "Returns the first N records sorted by the specified column."
citation = "https://learn.microsoft.com/kusto/query/top-operator"

[[operators.parameters]]
name = "NumberOfRows"
docs = "The number of rows of T to return."
required = true

[[operators.parameters]]
name = "Expression"
docs = "The scalar expression by which to sort."
required = true

[[operators.parameters]]
name = "asc | desc"
docs = "Controls whether the selection is from the \"bottom\" or \"top\" of the range."
required = false

[[operators.parameters]]
name = "nulls first | nulls last"
docs = "Controls whether null values appear at the \"bottom\" or \"top\" of the range."
required = false

[[operators]]
name = "top-hitters"
kind = "tabular"
signature = "top-hitters(NumberOfValues of ValueExpression [by SummingExpression])"
docs = "Returns an approximation for the most popular distinct values, or the values with the largest sum, in the input."
citation = "https://learn.microsoft.com/kusto/query/top-hitters-operator"

[[operators.parameters]]
name = "NumberOfValues"
docs = "The number of distinct values of ValueExpression."
required = true

[[operators.parameters]]
name = "ValueExpression"
docs = "An expression over the input table T whose distinct values are returned."
required = true

[[operators.parameters]]
name = "SummingExpression"
docs = "If specified, a numeric expression over the input table T whose sum per distinct value of ValueExpression establishes which values to emit."
required = false

[[operators]]
name = "top-nested"
kind = "tabular"
signature = "top-nested([N] of Expr [with others = ConstExpr] by Aggregation [asc | desc] [, ...])"
docs = "The top-nested operator performs hierarchical aggregation and value selection."
citation = "https://learn.microsoft.com/kusto/query/top-nested-operator"

[[operators.parameters]]
name = "N"
docs = "The number of top values to be returned for this hierarchy level."
required = false

[[operators.parameters]]
name = "Expr"
docs = "An expression over the input record indicating which value to return for this hierarchy level."
required = true

[[operators.parameters]]
name = "ConstExpr"
docs = "If specified, for each hierarchy level, one record is added with the value that is the aggregation over all records that didn't make it to the top."
required = false

[[operators.parameters]]
name = "Aggregation"
docs = "The aggregation function applied to records with the same Expr value."
required = false

