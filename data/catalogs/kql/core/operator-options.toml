[[options]]
operator = "summarize"
name = "hint.strategy"
kind = "enum"
place = "alongside"
values = ["shuffle"]
docs = "Aggregation strategy hint."
citation = "https://learn.microsoft.com/kusto/query/summarize-operator"
signature = "summarize hint.strategy=shuffle"

[[options]]
operator = "bag_unpack"
name = "columnsConflict"
kind = "enum"
place = "argument"
parameter_index = 2
values = ["error", "replace_source", "keep_source"]
docs = "How to resolve a bag property that collides with a source column. error is the default."
citation = "https://learn.microsoft.com/kusto/query/bag-unpack-plugin"
signature = "bag_unpack(Column, OutputColumnPrefix, columnsConflict, ignoredProperties)"
