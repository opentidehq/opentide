[[options]]
operator = "make-series"
name = "to"
kind = "keyword"
place = "alongside"
docs = "High bound of the axis."
citation = "https://learn.microsoft.com/kusto/query/make-series-operator"
signature = "make-series ... to end"

[[options]]
operator = "make-series"
name = "step"
kind = "keyword"
place = "alongside"
docs = "Bin size between axis values."
citation = "https://learn.microsoft.com/kusto/query/make-series-operator"
signature = "make-series ... step step"

[[options]]
operator = "make-series"
name = "by"
kind = "keyword"
place = "alongside"
docs = "Group the series by an expression."
citation = "https://learn.microsoft.com/kusto/query/make-series-operator"
signature = "make-series ... by GroupExpression"

[[options]]
operator = "make-series"
name = "default"
kind = "assign"
place = "alongside"
docs = "Value used for axis bins that have no rows. Default is 0."
citation = "https://learn.microsoft.com/kusto/query/make-series-operator"
