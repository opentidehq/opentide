[[options]]
operator = "make-series"
name = "kind"
kind = "enum"
place = "alongside"
values = ["nonempty"]
docs = "Produces a default result when the make-series input is empty."
citation = "https://learn.microsoft.com/kusto/query/make-series-operator"
