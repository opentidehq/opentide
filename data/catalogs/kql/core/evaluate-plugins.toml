[[plugins.parameters]]
name = "script"
docs = "The valid Python script to execute."
required = true

[[plugins.parameters]]
name = "script_parameters"
docs = "A property bag of name value pairs to be passed to the Python script as the reserved kargs dictionary."
required = false

[[plugins.parameters]]
name = "external_artifacts"
docs = "A property bag of name and URL pairs for artifacts that are accessible from cloud storage."
required = false

[[plugins.parameters]]
name = "spill_to_disk"
docs = "Specifies an alternative method for serializing the input table to the Python sandbox."
required = false

[[plugins]]
