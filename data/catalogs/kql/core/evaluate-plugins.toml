[[plugins]]
name = "python"
signature = "python(output_schema, script [, script_parameters] [, external_artifacts] [, spill_to_disk])"
docs = "The Python plugin runs a user-defined function (UDF) using a Python script."
citation = "https://learn.microsoft.com/kusto/query/python-plugin"
