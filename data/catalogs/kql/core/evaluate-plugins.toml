# KQL evaluate plugins. Invoked as: T | evaluate PluginName(...)
# Signatures come from each plugin's Learn article. Extra ADX-only plugins are not added.

[[plugins]]
name = "bag_unpack"
signature = "bag_unpack(Column [, OutputColumnPrefix] [, columnsConflict] [, ignoredProperties])[: OutputSchema]"
docs = "The bag_unpack plugin unpacks a single column of type dynamic, by treating each property bag top-level slot as a column."
citation = "https://learn.microsoft.com/kusto/query/bag-unpack-plugin"

[[plugins.parameters]]
name = "Column"
docs = "The column of T to unpack."
required = true

[[plugins.parameters]]
name = "OutputColumnPrefix"
docs = "A common prefix to add to all columns produced by the plugin."
required = false

[[plugins.parameters]]
name = "columnsConflict"
docs = "The direction for column conflict resolution."
required = false

[[plugins.parameters]]
name = "ignoredProperties"
docs = "An optional set of bag properties to be ignored."
required = false

[[plugins.parameters]]
name = "OutputSchema"
docs = "Specify the column names and types for the bag_unpack plugin output."
required = false

[[plugins]]
name = "pivot"
signature = "pivot(pivotColumn[, aggregationFunction] [, column1 [, column2 ...]])[: OutputSchema]"
docs = "Rotates a table by turning the unique values from one column in the input table into multiple columns in the output table and performs aggregations as required on any remaining column values that will appear in the final output."
citation = "https://learn.microsoft.com/kusto/query/pivot-plugin"

[[plugins.parameters]]
name = "pivotColumn"
docs = "The column to rotate."
required = true

[[plugins.parameters]]
name = "aggregationFunction"
docs = "An aggregation function used to aggregate multiple rows in the input table to a single row in the output table."
required = false

[[plugins.parameters]]
name = "column1, column2, ..."
docs = "A column name or comma-separated list of column names."
required = false

[[plugins.parameters]]
name = "OutputSchema"
docs = "The names and types for the expected columns of the pivot plugin output."
required = false

[[plugins]]
name = "autocluster"
signature = "autocluster([SizeWeight [, WeightColumn [, NumSeeds [, CustomWildcard [, ...]]]]])"
docs = "autocluster finds common patterns of discrete attributes (dimensions) in the data."
citation = "https://learn.microsoft.com/kusto/query/autocluster-plugin"

[[plugins.parameters]]
name = "SizeWeight"
docs = "A double between 0 and 1 that controls the balance between generic (high coverage) and informative (many shared) values."
required = false

[[plugins.parameters]]
name = "WeightColumn"
docs = "Considers each row in the input according to the specified weight."
required = false

[[plugins.parameters]]
name = "NumSeeds"
docs = "Determines the number of initial local search points."
required = false

[[plugins.parameters]]
name = "CustomWildcard"
docs = "A type literal that sets the wildcard value for a specific type in the results table, indicating no restriction on this column."
required = false

[[plugins]]
name = "basket"
signature = "basket([Threshold, WeightColumn, MaxDimensions, CustomWildcard, CustomWildcard, ...])"
docs = "The basket plugin finds frequent patterns of attributes in the data and returns the patterns that pass a frequency threshold in that data."
citation = "https://learn.microsoft.com/kusto/query/basket-plugin"

[[plugins.parameters]]
name = "Threshold"
docs = "A double in the range of 0.015 to 1 that sets the minimal ratio of the rows to be considered frequent."
required = false

[[plugins.parameters]]
name = "WeightColumn"
docs = "The column name to use to consider each row in the input according to the specified weight."
required = false

[[plugins.parameters]]
name = "MaxDimensions"
docs = "Sets the maximal number of uncorrelated dimensions per basket, limited by default, to minimize the query runtime."
required = false

[[plugins.parameters]]
name = "CustomWildcard"
docs = "Sets the wildcard value for a specific type in the result table that will indicate that the current pattern doesn't have a restriction on this column."
required = false

[[plugins]]
name = "diffpatterns"
signature = "diffpatterns(SplitColumn, SplitValueA, SplitValueB [, WeightColumn, Threshold, MaxDimensions, CustomWildcard, ...])"
docs = "Compares two datasets of the same structure and finds patterns of discrete attributes (dimensions) that characterize differences between the two datasets."
citation = "https://learn.microsoft.com/kusto/query/diffpatterns-plugin"

[[plugins.parameters]]
name = "SplitColumn"
docs = "The column name that tells the algorithm how to split the query into datasets."
required = true

[[plugins.parameters]]
name = "SplitValueA"
docs = "A string representation of one of the values in the SplitColumn that was specified."
required = true

[[plugins.parameters]]
name = "SplitValueB"
docs = "A string representation of one of the values in the SplitColumn that was specified."
required = true

[[plugins.parameters]]
name = "WeightColumn"
docs = "The column used to consider each row in the input according to the specified weight."
required = false

[[plugins.parameters]]
name = "Threshold"
docs = "A real in the range of 0.015 to 1."
required = false

[[plugins.parameters]]
name = "MaxDimensions"
docs = "Sets the maximum number of uncorrelated dimensions per result pattern."
required = false

[[plugins.parameters]]
name = "CustomWildcard"
docs = "Sets the wildcard value for a specific type in the result table that will indicate that the current pattern doesn't have a restriction on this column."
required = false

[[plugins]]
name = "diffpatterns_text"
signature = "diffpatterns_text(TextColumn, BooleanCondition [, MinTokens, Threshold, MaxTokens])"
docs = "Compares two datasets of string values and finds text patterns that characterize differences between the two datasets."
citation = "https://learn.microsoft.com/kusto/query/diffpatterns-text-plugin"

[[plugins.parameters]]
name = "TextColumn"
docs = "The text column to analyze."
required = true

[[plugins.parameters]]
name = "BooleanCondition"
docs = "An expression that evaluates to a boolean value."
required = true

[[plugins.parameters]]
name = "MinTokens"
docs = "An integer value between 0 and 200 that represents the minimal number of non-wildcard tokens per result pattern."
required = false

[[plugins.parameters]]
name = "Threshold"
docs = "A decimal value between 0.015 and 1 that sets the minimal pattern ratio difference between the two sets."
required = false

[[plugins.parameters]]
name = "MaxTokens"
docs = "An integer value between 0 and 20 that sets the maximal number of tokens per result pattern, specifying a lower limit decreases the query runtime."
required = false

[[plugins]]
name = "sequence_detect"
signature = "sequence_detect(TimelineColumn, MaxSequenceStepWindow, MaxSequenceSpan, Expr1, Expr2, ..., Dim1, Dim2, ...)"
docs = "Detects sequence occurrences based on provided predicates."
citation = "https://learn.microsoft.com/kusto/query/sequence-detect-plugin"

[[plugins.parameters]]
name = "TimelineColumn"
docs = "The column reference representing timeline, must be present in the source expression."
required = true

[[plugins.parameters]]
name = "MaxSequenceStepWindow"
docs = "The value of the max allowed timespan between 2 sequential steps in the sequence."
required = true

[[plugins.parameters]]
name = "MaxSequenceSpan"
docs = "The max timespan for the sequence to complete all steps."
required = true

[[plugins.parameters]]
name = "Expr1, Expr2, ..."
docs = "The boolean predicate expressions defining sequence steps."
required = true

[[plugins.parameters]]
name = "Dim1, Dim2, ..."
docs = "The dimension expressions that are used to correlate sequences."
required = true

[[plugins]]
name = "narrow"
signature = "narrow()"
docs = "The narrow plugin \"unpivots\" a wide table into a table with three columns:."
citation = "https://learn.microsoft.com/kusto/query/narrow-plugin"

[[plugins]]
name = "preview"
signature = "preview(NumberOfRows)"
docs = "Returns a table with up to the specified number of rows from the input record set, and the total number of records in the input record set."
citation = "https://learn.microsoft.com/kusto/query/preview-plugin"

[[plugins.parameters]]
name = "NumberOfRows"
docs = "The number of rows to preview from the table."
required = true

[[plugins]]
name = "rolling_percentile"
signature = "rolling_percentile(ValueColumn, Percentile, IndexColumn, BinSize, BinsPerWindow [, dim1, dim2, ...])"
docs = "Returns an estimate for the specified percentile of the ValueColumn population in a rolling (sliding) BinsPerWindow size window per BinSize."
citation = "https://learn.microsoft.com/kusto/query/rolling-percentile-plugin"

[[plugins.parameters]]
name = "ValueColumn"
docs = "The name of the column used to calculate the percentiles."
required = true

[[plugins.parameters]]
name = "Percentile"
docs = "Scalar with the percentile to calculate."
required = true

[[plugins.parameters]]
name = "IndexColumn"
docs = "The name of the column over which to run the rolling window."
required = true

[[plugins.parameters]]
name = "BinSize"
docs = "Scalar with size of the bins to apply over the IndexColumn."
required = true

[[plugins.parameters]]
name = "BinsPerWindow"
docs = "The number of bins included in each window."
required = true

[[plugins.parameters]]
name = "dim1, dim2, ..."
docs = "A list of the dimensions columns to slice by."
required = false

[[plugins]]
name = "rows_near"
signature = "rows_near(Condition, NumRows, [, RowsAfter])"
docs = "Finds rows near a specified condition."
citation = "https://learn.microsoft.com/kusto/query/rows-near-plugin"

[[plugins.parameters]]
name = "Condition"
docs = "Represents the condition to find rows around."
required = true

[[plugins.parameters]]
name = "NumRows"
docs = "The number of rows to find before and after the condition."
required = true

[[plugins.parameters]]
name = "RowsAfter"
docs = "When specified, overrides the number of rows to find after the condition."
required = false

[[plugins]]
name = "dcount_intersect"
signature = "dcount_intersect(hll_1, hll_2, [, hll_3, ...])"
