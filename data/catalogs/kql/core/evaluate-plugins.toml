[[plugins.parameters]]
name = "hll_i"
required = false

[[plugins]]
name = "ipv4_lookup"
signature = "ipv4_lookup(LookupTable, SourceIPv4Key, IPv4LookupKey [, ExtraKey1 [.., ExtraKeyN [, return_unmatched]]])"
docs = "The ipv4_lookup plugin looks up an IPv4 value in a lookup table and returns rows with matched values."
citation = "https://learn.microsoft.com/kusto/query/ipv4-lookup-plugin"

[[plugins.parameters]]
name = "LookupTable"
docs = "Table or tabular expression with IPv4 lookup data, whose column LookupKey is used for IPv4 matching."
required = true

[[plugins.parameters]]
name = "SourceIPv4Key"
docs = "The column of T with IPv4 string to be looked up in LookupTable."
required = true

[[plugins.parameters]]
name = "IPv4LookupKey"
docs = "The column of LookupTable with IPv4 string that is matched against each SourceIPv4Key value."
required = true

[[plugins.parameters]]
name = "ExtraKey1 .. ExtraKeyN"
docs = "Additional column references that are used for lookup matches."
required = false

[[plugins.parameters]]
name = "return_unmatched"
docs = "A boolean flag that defines if the result should include all or only matching rows (default: false - only matching rows returned)."
required = false

