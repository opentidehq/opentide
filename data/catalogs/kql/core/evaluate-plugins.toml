required = true

[[plugins.parameters]]
name = "SqlParameters"
docs = "A property bag object that holds key-value pairs to pass as parameters along with the query."
required = false

[[plugins.parameters]]
name = "OutputSchema"
docs = "The names and types for the expected columns of the mysql_request plugin output."
required = false

