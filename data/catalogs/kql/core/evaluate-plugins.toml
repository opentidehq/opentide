[[plugins.parameters]]
name = "Options"
docs = "A property bag of key-value pairs to pass more advanced settings along with the query."
required = false

[[plugins.parameters]]
name = "OutputSchema"
docs = "The names and types for the expected columns of the sql_request plugin output."
required = false

[[plugins]]
name = "mysql_request"
signature = "mysql_request(ConnectionString, SqlQuery [, SqlParameters])[: OutputSchema]"
docs = "The mysql_request plugin sends a SQL query to an Azure MySQL Server network endpoint and returns the first rowset in the results."
