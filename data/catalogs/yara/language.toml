# The YARA language's profiles and fixed vocabulary (opentidehq/specifications
# yara-1.0, harfanglab-1.0 1.2, bitdefender-1.0). Hand-written: each value
# cites the spec table it comes from.

# The modules the engine knows are YARA-X's default modules, less `vt`
# (#1225): modules.toml, generated by `cargo xtask codegen`.

# YARA-X 1.x reserved words and built-ins (libyara/lexer.l's, with YARA-X's): a rule may not be named after
# one (`yara_rule_identifier_conflict`), and neither may a derived HarfangLab
# rule name (`harfanglab_yara_rule_name`).
keywords = [
  "all", "and", "any", "ascii", "at", "base64", "base64wide", "condition",
  "contains", "defined", "endswith", "entrypoint", "false", "filesize",
  "for", "fullword", "global", "icontains", "iendswith", "iequals", "import",
  "in", "include", "int16", "int16be", "int32", "int32be", "int8", "int8be",
  "istartswith", "matches", "meta", "nocase", "none", "not", "of", "or",
  "private", "rule", "startswith", "strings", "them", "true", "uint16",
  "uint16be", "uint32", "uint32be", "uint8", "uint8be", "wide", "xor",
  # YARA-X's: `with` and its 64-bit and float readers.
  "float32", "float32be", "float64", "float64be", "int64", "int64be",
  "uint64", "uint64be", "with",
]

# yara-1.0 "Platform profiles".
[profile.harfanglab]
# Whether the platform is known to accept YARA-X-only syntax (`with`, digit
# separators, float meta, `"""` strings, booleans in `of` tuples, hex or octal
# jump bounds, `.len()`): "refused" until a live deploy confirms it
# (docs/internal/publishing.md, live-tenant checklist).
yara_x_syntax = "refused"
ascii_only = false
confirmed_modules = ["pe", "elf", "math", "hash", "time"]
recommended_meta = ["context"]
# harfanglab-1.0 "YARA profile": the values a meta `context` joins with
# commas (`file.pe,memory`); deploy writes the block's contexts that way.
context_values = ["file", "memory", "file.pe", "file.elf", "file.macho"]

[profile.bitdefender]
# Whether the platform is known to accept YARA-X-only syntax (`with`, digit
# separators, float meta, `"""` strings, booleans in `of` tuples, hex or octal
# jump bounds, `.len()`): "refused" until a live deploy confirms it
# (docs/internal/publishing.md, live-tenant checklist).
yara_x_syntax = "refused"
ascii_only = true
max_characters = 30000
# yara-1.0 "Platform profiles" (RFC 0015): neither vendor publishes its
# module list, so the confirmed set is a maintainer decision (2026-11-10),
# the same as HarfangLab's. Importing another known module is the warning
# `yara_module_unconfirmed` until a live deploy confirms it
# (docs/internal/publishing.md, live-tenant checklist; #1252).
confirmed_modules = ["pe", "elf", "math", "hash", "time"]
recommended_meta = []
