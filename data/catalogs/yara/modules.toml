[meta]
yara_x = "1.23.0"
# YARA-X's default modules, less the ones opentide excludes (`excluded`).
modules = ["console", "crx", "cuckoo", "dex", "dotnet", "elf", "hash", "lnk", "macho", "math", "pe", "string", "time", "zip"]
excluded = ["vt"]

# Why importing each of these is `yara_unknown_module`.
[unsupported]
magic = "YARA-X builds `magic` only with its non-default `magic-module` feature and libmagic (https://virustotal.github.io/yara-x/docs/modules/magic/), so a rule that imports it is not portable"
msi = "`msi` is experimental in YARA-X and not built by default"
olecf = "`olecf` is experimental in YARA-X and not built by default"
vba = "`vba` is experimental in YARA-X and not built by default"
vt = "`vt` describes VirusTotal's own scan metadata, which only VirusTotal's scanning fills in"

