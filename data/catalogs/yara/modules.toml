[[member]]
module = "pe"
path = "imports"
kind = "function"
[[member.overload]]
args = "irr"
ret = "integer"
doc = "Returns the number of imported functions where the function's name matches\n `func_name` and the DLL name matches `dll_name`.\n\n Both `dll_name` and `func_name` are case-sensitive unless you use the \"/i\"\n modifier in the regexp, as shown in the example below. See [`imports_dll`]\n for details about the `import_flags` argument."
[[member.overload]]
args = "is"
ret = "integer"
doc = "Returns the number of functions imported by the PE from `dll_name`.\n\n `dll_name` is case-insensitive. `import_flags` specify the types of\n import which should be taken into account. This value can be composed\n by a bitwise OR of the following values:\n\n * `pe.IMPORT_STANDARD` : standard import only\n * `pe.IMPORT_DELAYED` : delayed imports only\n * `pe.IMPORT_ANY` : both standard and delayed imports"
[[member.overload]]
args = "isi"
ret = "boolean"
doc = "Returns true if the PE imports `ordinal` from `dll_name`.\n\n `dll_name` is case-insensitive. See [`imports_dll`] for details about\n the `import_flags` argument."
[[member.overload]]
args = "iss"
ret = "boolean"
doc = "Returns true if the PE imports `func_name` from `dll_name`.\n\n Both `func_name` and `dll_name` are case-insensitive. See [`imports_dll`]\n for details about the `import_flags` argument."
[[member.overload]]
args = "rr"
ret = "integer"
doc = "Returns the number of imported functions where the function's name matches\n `func_name` and the DLL name matches `dll_name`.\n\n Both `dll_name` and `func_name` are case-sensitive unless you use the \"/i\"\n modifier in the regexp, as shown in the example below."
[[member.overload]]
args = "s"
ret = "integer"
doc = "Returns the number of functions imported by the PE from `dll_name`.\n\n `dll_name` is case-insensitive."
[[member.overload]]
args = "si"
ret = "integer"
doc = "Returns true if the PE imports `ordinal` from `dll_name`.\n\n `dll_name` is case-insensitive."
[[member.overload]]
args = "ss"
ret = "boolean"
doc = "Returns true if the PE imports `func_name` from `dll_name`.\n\n Both `func_name` and `dll_name` are case-insensitive."

