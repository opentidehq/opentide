# Carbon Black Cloud process search fields (#162), for the Carbon Black
# dialect of opentide-lucene: hover, completion and `cbc_unknown_field`.
#
# Facts only, with descriptions written here. Field names and value types come
# from what these sources send to or receive from Carbon Black Cloud's process
# search; `source` says which:
#   sdk      carbonblack/carbon-black-cloud-sdk-python (MIT, Broadcom) at
#            fc0c2643f340af86e3b4ac39b800cce2c661f664: the recorded process
#            search and observation responses in src/tests/unit/fixtures/.
#   pysigma  7RedViolin/pySigma-backend-carbonblack (MIT) at
#            24d4ee2a55f4fa736ef6fc46ddaf33cb798bfe7f: the process search
#            field mapping (cb_fieldmapping) and the values it writes
#            (device_os, process_integrity_level).
#
# `list = true`: a process can hold several values (the field matches when one
# does). Whether a field is tokenized is not recorded: Carbon Black documents
# that only on developer.carbonblack.com, not reachable when this file was
# written, so the upper-case regexp hint stays on every field.

[[field]]
name = "process_name"
type = "string"
description = "File path of the process's main module."
source = "sdk"

[[field]]
name = "process_cmdline"
type = "string"
list = true
description = "Command line the process ran."
source = "sdk"

[[field]]
name = "process_cmdline_length"
type = "integer"
list = true
description = "Length of the process command line."
source = "sdk"

[[field]]
name = "process_hash"
type = "string"
list = true
description = "MD5 and SHA-256 hashes of the process's main module."
source = "sdk"

[[field]]
name = "process_sha256"
type = "string"
description = "SHA-256 hash of the process's main module."
source = "sdk"

[[field]]
name = "process_pid"
type = "integer"
list = true
description = "Process id."
source = "sdk"

[[field]]
name = "process_guid"
type = "string"
description = "Unique id of the process in Carbon Black."
source = "sdk"

[[field]]
name = "process_username"
type = "string"
list = true
description = "User the process runs as."
source = "sdk"

[[field]]
name = "process_start_time"
type = "datetime"
description = "When the process started."
source = "sdk"

[[field]]
name = "process_terminated"
type = "boolean"
description = "Whether the process has ended."
values = ["true", "false"]
source = "sdk"

[[field]]
name = "process_reputation"
type = "string"
description = "Reputation of the process's main module."
source = "sdk"

[[field]]
name = "process_effective_reputation"
type = "string"
description = "Reputation Carbon Black applied to the process."
source = "sdk"

[[field]]
name = "process_publisher_state"
type = "string"
list = true
description = "Signature state of the process's main module."
source = "sdk"

[[field]]
name = "process_integrity_level"
type = "string"
description = "Windows integrity level of the process."
values = ["PROTECTED", "SYSTEM", "HIGH", "MEDIUM", "LOW"]
source = "pysigma"

[[field]]
name = "process_original_filename"
type = "string"
