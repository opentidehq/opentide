name = "Threat Level to Organization"
field = "level"
version = "1.0"
description = "Informed estimate of the risk level that can be attributed to the adversary, from public or closed reports, the targets they are actively engaging, their sophistication, and targets. The closer their domains, successes and victims are similar to the organization, the more at risk it is and thus the higher the threat level."

key = "name"
[[keys]]
name = "Faun"

description = "Active attacker that isn't necessarily highly sophisticated, but conducts campaigns with some degree of end success."

[[keys]]
name = "Cerberus"

description = "Group with a defined modus operandi, recognizable successes but limited capabilites, may do a limited range of damage in weakest part of infrastructure"

[[keys]]
name = "Medusa"

description = "Actor with record of potent attacks, but not necessarily demonstrating a high level of sophistication and unlikely to severely impact the organization."

[[keys]]
name = "Hydra"

description = "Advanced threat actor with proven ability to impact the organization, even if known exploitation paths are mostly guarded."

[[keys]]
name = "Titan"

description = "Significant ability to penetrate and leverage a target, able to provoke direct loss of capabilities , strategic or monetary value to the organization."

[[keys]]
name = "Leviathan"

description = "Considerable threat generator with a proven track record of full compromise of similar organization. Will  cause irreparable damages."
