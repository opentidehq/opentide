name = "Malicious Window API"
field = "malapi"
version = "1.0"
description = "MalAPI.io maps Windows APIs to common techniques used by malware."
reference = "https://malapi.io"

key = "name"
[[stages]]
name = "Enumeration"

description = "Functions associated with system enumeration."

[[stages]]
name = "Injection"

description = "Functions associated with process-related attacks (e.g. DLL injection, process hollowing)"

[[stages]]
name = "Evasion"

description = "Functions associated with evasive behaviour to evade security controls and solutions."

[[stages]]
name = "Spying"

description = "Functions associated with spying on user actions (e.g. keylogger, screen capture)."

[[stages]]
name = "Internet"

description = "Functions associated with malicious internet connectivity (e.g. C&C, exfiltration, downloads)."

[[stages]]
name = "Anti-Debugging"

description = "Functions associated with anti-reverse engineering and debugging."

[[stages]]
name = "Ransomware"

description = "Cryptographic functions used by ransomware."

[[stages]]
name = "Helper"

description = "Functions that are not necessarily malicious, but can aid malware."

[[keys]]
name = "Accept"
description = "Accept is used to permit an incoming connection attempt on a socket.\nLibrary : `Ws2_32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/winsock2/nf-winsock2-accept"
"tide.vocab.stages" = "Internet"

[[keys]]
