description = "WSAStartup is used to initiate use of the Winsock DLL by a process.\nLibrary : `Ws2_32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/winsock2/nf-winsock2-wsastartup"
"tide.vocab.stages" = "Internet"

[[keys]]
name = "WaitForMultipleObjects"
description = "WaitForMultipleObjects is used to wait until one or all of the specified objects are in the signaled state or the time-out interval elapses. This function is commonly used to allow time for shellcode to execute or for time-based evasion.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/synchapi/nf-synchapi-waitformultipleobjects"
"tide.vocab.stages" = [ "Injection", "Evasion",]

[[keys]]
name = "WaitForMultipleObjectsEx"
description = "WaitForMultipleObjectsEx is used to wait until one or all of the specified objects are in the signaled state or the time-out interval elapses. This function is commonly used to allow time for shellcode to execute or for time-based evasion.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/synchapi/nf-synchapi-waitformultipleobjectsex"
"tide.vocab.stages" = [ "Injection", "Evasion",]

[[keys]]
name = "WaitForSingleObject"
description = "WaitForSingleObject is used to delay the execution of an object. This function is commonly used to allow time for shellcode being executed within a thread to run. It is also used for time-based evasion.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/synchapi/nf-synchapi-waitforsingleobject"
"tide.vocab.stages" = [ "Injection", "Evasion",]

[[keys]]
name = "WaitForSingleObjectEx"
description = "WaitForSingleObjectEx is used to delay the execution of an object. This function is commonly used to allow time for shellcode being executed within a thread to run. It is also used for time-based evasion.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/synchapi/nf-synchapi-waitforsingleobjectex"
"tide.vocab.stages" = [ "Injection", "Evasion",]

[[keys]]
name = "WinExec"
description = "WinExec is used to allow the execution of an application.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-winexec"
"tide.vocab.stages" = "Internet"

[[keys]]
name = "Wow64SetThreadContext"
description = "Wow64SetThreadContext is used to set the context for the specified thread. This function can be used by malware as part of a process hollowing attack.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-setthreadcontext"
"tide.vocab.stages" = "Injection"

[[keys]]
name = "WriteFile"
