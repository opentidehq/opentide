"tide.vocab.stages" = "Helper"

[[keys]]
name = "WriteProcessMemory"
description = "Writing data into a specified region of memory. This function is often used by malware as part of process injection to inject malicious code into a specified process.\nLibrary : `Kernel32.dll`"
link = "https://docs.microsoft.com/en-us/windows/win32/api/memoryapi/nf-memoryapi-writeprocessmemory"
"tide.vocab.stages" = "Injection"

