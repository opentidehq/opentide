[[keys]]
name = "CreateProcessInternal"
description = "CreateProcessInternal is an undocumented API for process creation. According to Windows Internals, CreateProcess and CreateProcessAsUser actually lead to this API, which is responsible for starting the process creation in user land. Eventually it calls NtCreateUserProcess for the kernel land operations. This API is commonly used for spawning a suspended process to be hollowed/injected.\nLibrary : `Kernel32.dll`"
link = "https://medium.com/@Achilles8284/the-birth-of-a-process-part-1-bfb4fdac070e"
"tide.vocab.stages" = [ "Injection", "Evasion",]

