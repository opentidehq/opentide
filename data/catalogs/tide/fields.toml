# Pydantic-aligned Tide field catalog.
# Source of truth for Tide YAML key highlighting, hover, and completions.
# Mirrors OpenTide CLI pydantic models (Rule / Objective / Threat / nested configs).

[[fields]]
name = "name"
capture = "tide.keyword"
title = "Name"
type = "string"
required = true
description = "Human-readable object title. The LSP does not rename this field; filename slug warnings compare the slugified name to the basename."

[[fields]]
name = "metadata"
capture = "tide.keyword"
title = "Metadata"
type = "object"
required = true
description = "Identity envelope: UUID v4, schema id, version, timestamps, TLP, author, organisation."

[[fields]]
name = "description"
capture = "tide.keyword"
title = "Description"
type = "string"
markdown = true
required = true
description = "Markdown detection narrative (headings, lists, inline code, links). Required on `rule::1.0`."

[[fields]]
name = "status"
capture = "tide.keyword"
title = "Status"
type = "string"
description = "Lifecycle of the object. Common values: STAGING, DEVELOPMENT, PRODUCTION, DEPRECATED."

[[fields]]
name = "severity"
capture = "tide.keyword"
title = "Severity"
type = "string"
vocab = "severity"
description = "NCSC-style incident severity for the detection or threat (e.g. Substantial incident)."

[[fields]]
name = "techniques"
capture = "tide.keyword"
title = "Techniques"
type = "array"
vocab = "att&ck"
description = "ATT&CK technique IDs (`T1059`, `T1552.001`). Completions come from the att&ck vocabulary."

[[fields]]
name = "platforms"
capture = "tide.keyword"
title = "Platforms"
type = "object"
description = "Optional per-platform annotations (not the deployable `configurations` block)."

[[fields]]
name = "references"
capture = "tide.keyword"
title = "References"
type = "object"
description = "Public, internal, and report references. Map keys may be integers or slugs."

[[fields]]
name = "detection_model"
capture = "tide.keyword"
title = "Detection Model"
type = "uuid"
required = true
description = "UUID of the parent `objective::1.0` (detection model) this rule implements."

[[fields]]
name = "response"
capture = "tide.keyword"
title = "Response"
type = "object"
required = true
description = "Analyst response pack: alert severity and procedure (analysis, hunts, containment)."

[[fields]]
name = "configurations"
capture = "tide.keyword"
title = "Detection System Technical Setup"
type = "object"
required = true
description = "Per-platform deployable configuration (Sentinel, Defender, Splunk, …). CrowdStrike is unsupported."

[[fields]]
name = "file"
capture = "tide.keyword"
title = "File"
type = "string"
description = "Optional path annotation from the CLI; not required in the workspace."

[[fields]]
name = "composition"
capture = "tide.keyword"
title = "Composition"
type = "object"
description = "How signals combine on an objective (strategy + narrative)."

[[fields]]
name = "objective"
capture = "tide.keyword"
title = "Objective"
type = "object"
description = "Objective body: priority, type, threats, signals."

[[fields]]
name = "threat"
capture = "tide.keyword"
title = "Threat"
type = "object"
description = "Threat body: impact, leverage, viability, ATT&CK, chaining."

[[fields]]
name = "criticality"
capture = "tide.keyword"
title = "Criticality"
type = "string"
vocab = "criticality"
description = "How critical this threat is to the organisation (threat objects)."

[[fields]]
name = "uuid"
capture = "tide.property"
title = "UUID"
type = "uuid"
required = true
description = "RFC 4122 UUID version 4. Identity of the object (or nested organisation / signal)."

[[fields]]
name = "schema"
capture = "tide.property"
title = "Schema"
type = "string"
required = true
description = "Object schema id, e.g. `rule::1.0`, `objective::1.0`, `threat::1.0`."

[[fields]]
name = "version"
capture = "tide.property"
title = "Version"
type = "string | integer"
required = true
description = "Object document version (integer or string)."

[[fields]]
name = "created"
capture = "tide.property"
title = "Created"
type = "string"
required = true
description = "ISO-8601 creation date."

[[fields]]
name = "modified"
capture = "tide.property"
title = "Modified"
type = "string"
required = true
description = "ISO-8601 last-modified date."

[[fields]]
name = "tlp"
capture = "tide.property"
title = "TLP"
type = "string"
vocab = "tlp"
required = true
description = "Traffic Light Protocol sharing label (`clear`, `green`, `amber`, `amber+strict`, `red`)."

[[fields]]
name = "author"
capture = "tide.property"
title = "Author"
type = "string"
description = "Recommended author of the object. Missing author is a warning (`missing_author`)."

[[fields]]
name = "contributors"
capture = "tide.property"
title = "Contributors"
type = "array"
description = "Optional additional authors."

[[fields]]
name = "organisation"
capture = "tide.property"
title = "Organisation"
type = "object"
description = "Owning organisation (`uuid` + `name`). Missing organisation is a warning (`missing_organisation`)."

[[fields]]
name = "public"
capture = "tide.property"
title = "Public references"
type = "object"
description = "Public URLs keyed by integer or slug."

[[fields]]
name = "internal"
capture = "tide.property"
title = "Internal references"
type = "object"
description = "Internal document links."

[[fields]]
name = "reports"
capture = "tide.property"
title = "Reports"
type = "array"
description = "Report identifiers related to this object."

[[fields]]
name = "alert_severity"
capture = "tide.property"
title = "Alert Severity"
type = "string"
vocab = "alert_severity"
description = "Alert severity pushed to the detection platform (High, Medium, Low, Informational)."

[[fields]]
name = "procedure"
capture = "tide.keyword"
title = "Procedure"
type = "object"
description = "Incident procedure: analysis steps, hunt searches, containment."

[[fields]]
name = "analysis"
capture = "tide.property"
title = "Analysis"
type = "string"
markdown = true
description = "Markdown investigation steps for the responding analyst."

[[fields]]
name = "searches"
capture = "tide.property"
title = "Searches"
type = "array"
description = "Hunt queries (`purpose`, `system`, `query`) used during investigation."

[[fields]]
name = "containment"
capture = "tide.property"
title = "Containment"
type = "string"
markdown = true
description = "Markdown containment / eradication guidance."

[[fields]]
name = "purpose"
capture = "tide.property"
title = "Purpose"
type = "string"
description = "Why this hunt query is run."

[[fields]]
name = "system"
capture = "tide.property"
title = "System"
type = "string"
description = "Detection platform for an injected hunt query (`sentinel`, `defender_for_endpoint`, `splunk`, …)."

[[fields]]
name = "query"
capture = "tide.property"
title = "Query"
type = "string"
description = "Injected detection/hunt query. Language follows the parent platform (KQL or SPL). Not markdown."

[[fields]]
name = "search"
capture = "tide.property"
title = "Search"
type = "string"
description = "Legacy Splunk search field; treated as SPL injection."

[[fields]]
name = "enabled"
capture = "tide.property"
title = "Enabled"
type = "boolean"
description = "Whether this platform configuration is active."

[[fields]]
name = "sentinel"
capture = "tide.keyword"
title = "Microsoft Sentinel"
type = "object"
description = "Sentinel analytics rule configuration (`query` is KQL)."

[[fields]]
name = "defender_for_endpoint"
capture = "tide.keyword"
title = "Microsoft Defender for Endpoint"
type = "object"
description = "Defender XDR custom detection configuration (`query` is KQL)."

[[fields]]
name = "splunk"
capture = "tide.keyword"
title = "Splunk"
type = "object"
description = "Splunk ES configuration (`query` / legacy `search` is SPL)."

[[fields]]
name = "crowdstrike"
capture = "tide.keyword"
title = "CrowdStrike"
type = "object"
description = "Unsupported platform. OpenTide never fakes CrowdStrike validation (`crowdstrike_unsupported`)."

[[fields]]
name = "sentinel_one"
capture = "tide.keyword"
title = "SentinelOne"
type = "object"
description = "SentinelOne platform block (no query-language injection in v1)."

[[fields]]
name = "harfanglab"
capture = "tide.keyword"
title = "HarfangLab"
type = "object"
description = "HarfangLab platform block (no query-language injection in v1)."

[[fields]]
name = "carbon_black_cloud"
capture = "tide.keyword"
title = "Carbon Black Cloud"
type = "object"
description = "Carbon Black Cloud platform block (no query-language injection in v1)."

[[fields]]
name = "scheduling"
capture = "tide.property"
title = "Scheduling"
type = "object | string"
vocab = "scheduling"
description = "Run cadence. Object form uses `frequency` / `lookback` (ISO-8601 durations) or a vocab token (`1H`, `Real-time`)."

[[fields]]
name = "frequency"
capture = "tide.property"
title = "Frequency"
type = "string"
description = "How often the scheduled detection runs (e.g. `PT1H`)."

[[fields]]
name = "lookback"
capture = "tide.property"
title = "Lookback"
type = "string"
description = "Query lookback window (e.g. `PT2H`)."

[[fields]]
name = "cron_schedule"
capture = "tide.property"
title = "Cron schedule"
type = "string"
description = "Optional cron expression when the platform uses cron instead of ISO-8601 frequency."

[[fields]]
name = "alert"
capture = "tide.property"
title = "Alert"
type = "object"
description = "Alert presentation: title, category, recommendation, techniques, suppression."

[[fields]]
name = "title"
capture = "tide.property"
title = "Title"
type = "string"
description = "Alert title. May include platform mustache tokens such as `{{DeviceName}}`."

[[fields]]
name = "suppression"
capture = "tide.property"
title = "Suppression"
type = "boolean"
description = "Whether duplicate alerts are suppressed."

[[fields]]
name = "category"
capture = "tide.property"
title = "Category"
type = "string"
description = "Alert category (e.g. Credential Access)."

[[fields]]
name = "recommendation"
capture = "tide.property"
title = "Recommendation"
type = "string"
markdown = true
description = "Markdown response recommendation shown on the alert."

[[fields]]
name = "grouping"
capture = "tide.property"
title = "Grouping"
type = "object"
description = "Alert grouping strategy (`event`, nested `alert.enabled`)."

[[fields]]
name = "event"
capture = "tide.property"
title = "Event grouping"
type = "string"
description = "How events collapse into alerts (e.g. `SingleAlert`)."

[[fields]]
name = "impacted_entities"
capture = "tide.property"
title = "Impacted entities"
type = "object"
description = "Entity columns surfaced on the alert (e.g. `device: DeviceName`)."

[[fields]]
name = "device"
capture = "tide.property"
title = "Device"
type = "string"
description = "Device entity column name in the query output."

[[fields]]
name = "scope"
capture = "tide.property"
title = "Scope"
type = "object"
description = "Deployment scope (`selection: All` or a device group)."

[[fields]]
name = "selection"
capture = "tide.property"
title = "Selection"
type = "string"
description = "Scope selector (`All` or a named group)."

[[fields]]
name = "priority"
capture = "tide.property"
title = "Priority"
type = "string"
description = "Objective priority (High / Medium / Low)."

[[fields]]
name = "type"
capture = "tide.property"
title = "Type"
type = "string"
vocab = "detection.types"
description = "Objective type (e.g. Threat)."

[[fields]]
name = "strategy"
capture = "tide.property"
title = "Strategy"
type = "string"
vocab = "detection.composition"
description = "Composition strategy (e.g. Combined)."

[[fields]]
name = "threats"
capture = "tide.property"
title = "Threats"
type = "array"
description = "UUIDs of `threat::1.0` objects this objective covers."

[[fields]]
name = "signals"
capture = "tide.property"
title = "Signals"
type = "array"
description = "Named detection signals with methodology, entities, and data requirements."

[[fields]]
name = "methodology"
capture = "tide.property"
title = "Methodology"
type = "string"
vocab = "detection.methodology"
description = "How the signal is produced (e.g. Statistical)."

[[fields]]
name = "entities"
capture = "tide.property"
title = "Entities"
type = "array"
vocab = "signal.entities"
description = "Entity types the signal emits (Hostname, User, …)."

[[fields]]
name = "data"
capture = "tide.property"
title = "Data"
type = "object"
description = "Data availability and requirements for a signal."

[[fields]]
name = "availability"
capture = "tide.property"
title = "Availability"
type = "string"
description = "How complete the required telemetry is (e.g. Complete)."

[[fields]]
name = "requirements"
capture = "tide.property"
title = "Requirements"
type = "string"
description = "Telemetry / log source requirements in prose."

[[fields]]
name = "impact"
capture = "tide.property"
title = "Impact"
type = "string"
vocab = "impact"
description = "Threat impact class (e.g. Data Breach)."

[[fields]]
name = "leverage"
capture = "tide.property"
title = "Leverage"
type = "string"
vocab = "leverage"
description = "How the actor gains leverage (e.g. Information Gathering)."

[[fields]]
name = "viability"
capture = "tide.property"
title = "Viability"
type = "string"
vocab = "viability"
description = "How viable the threat is (e.g. Likely)."

[[fields]]
name = "terrain"
capture = "tide.property"
title = "Terrain"
type = "string"
markdown = true
description = "Where the threat lives (markdown-capable prose)."

[[fields]]
name = "surface"
capture = "tide.property"
title = "Surface"
type = "array"
vocab = "surface"
description = "Affected surfaces (e.g. Windows::Desktop)."

[[fields]]
name = "att&ck"
capture = "tide.property"
title = "ATT&CK"
type = "array"
vocab = "att&ck"
description = "ATT&CK techniques on a threat object."

[[fields]]
name = "actors"
capture = "tide.property"
title = "Actors"
type = "array"
vocab = "actors"
description = "Threat actors (`name: att&ck::G0006`)."

[[fields]]
name = "chaining"
capture = "tide.property"
title = "Chaining"
type = "array"
description = "Related threats: `relation` + `vector` UUID."

[[fields]]
name = "relation"
capture = "tide.property"
title = "Relation"
type = "string"
vocab = "chaining_relations"
description = "How this threat chains to `vector` (preceeds, follows, …)."

[[fields]]
name = "vector"
capture = "tide.property"
title = "Vector"
type = "uuid"
description = "UUID of the chained threat object."
