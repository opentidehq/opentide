[[rules]]
name = "User mgmt binaries"
condition = "spawned_process and not container and proc.name in (user_mgmt_binaries) and not proc.name in (su, sudo, lastlog, nologin, unix_chkpwd) and not proc.pname in (cron_binaries, systemd, systemd.postins, udev.postinst, run-parts) and not proc.cmdline startswith \"passwd -S\" and not proc.cmdline startswith \"useradd -D\" and not proc.cmdline startswith \"systemd --version\" and not run_by_qualys and not run_by_sumologic_securefiles and not run_by_yum and not run_by_ms_oms and not run_by_google_accounts_daemon and not chage_list and not user_known_user_management_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-incubating_rules.yaml"

[[rules]]
name = "User password reset by OKTA admin"
condition = "okta.evt.type = \"user.account.reset_password\""
source = "okta"
origin = "falcosecurity/plugins/plugins/okta/rules/okta_rules.yaml"

[[rules]]
name = "Web Server Spawned Shell"
condition = "spawned_process and spawned_by_web_server and proc.name in (shell_binaries) and not proc.cmdline startswith \"sh -c /usr/bin\" and not proc.cmdline contains \"healthcheck\" and not user_known_web_server_shell_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Web Server Spawned Suspicious Child Process"
condition = "spawned_process and spawned_by_web_server and proc.name in (suspicious_web_children) and not proc.name in (shell_binaries) and not proc.cmdline contains \"healthcheck\" and not proc.cmdline contains \"status\" and not user_known_web_server_child_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Webhook Connected"
condition = "github.type=ping"
source = "github"
origin = "falcosecurity/plugins/plugins/github/rules/github.yaml"

[[rules]]
name = "Webhook Disconnected"
condition = "github.type=meta and github.action=deleted"
source = "github"
origin = "falcosecurity/plugins/plugins/github/rules/github.yaml"

[[rules]]
name = "Write below binary dir"
condition = "open_write and bin_dir and not package_mgmt_procs and not exe_running_docker_save and not python_running_get_pip and not python_running_ms_oms and not user_known_write_below_binary_dir_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Write below etc"
condition = "write_etc_common"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Write below monitored dir"
condition = "open_write and monitored_dir and not package_mgmt_procs and not coreos_write_ssh_dir and not exe_running_docker_save and not python_running_get_pip and not python_running_ms_oms and not google_accounts_daemon_writing_ssh and not cloud_init_writing_ssh and not user_known_write_monitored_dir_conditions"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Write below root"
condition = "open_write and root_dir and proc_name_exists and not fd.name in (known_root_files) and not fd.directory pmatch (known_root_directories) and not exe_running_docker_save and not gugent_writing_guestagent_log and not dse_writing_tmp and not zap_writing_state and not airflow_writing_state and not rpm_writing_root_rpmdb and not maven_writing_groovy and not chef_writing_conf and not kubectl_writing_state and not cassandra_writing_state and not galley_writing_state and not calico_writing_state and not rancher_writing_root and not runc_writing_exec_fifo and not mysqlsh_writing_state and not known_root_conditions and not user_known_write_root_conditions and not user_known_write_below_root_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "Write below rpm database"
condition = "open_write and fd.name startswith /var/lib/rpm and not rpm_procs and not ansible_running_python and not python_running_chef and not exe_running_docker_save and not amazon_linux_running_python_yum and not user_known_write_rpm_database_activities"
source = "syscall"
origin = "falcosecurity/rules/rules/falco-sandbox_rules.yaml"

[[rules]]
name = "port-forward"
condition = "ka.target.subresource in (portforward) and not user_known_portforward_activities"
source = "k8s_audit"
origin = "falcosecurity/plugins/plugins/k8saudit/rules/k8s_audit_rules.yaml"

[[rules]]
name = "removing MFA factor from user in OKTA"
condition = "okta.evt.type = \"user.mfa.factor.deactivate\""
source = "okta"
origin = "falcosecurity/plugins/plugins/okta/rules/okta_rules.yaml"

[[rules]]
name = "removing all MFA factor from user in OKTA"
condition = "okta.evt.type = \"user.mfa.factor.reset_all\""
source = "okta"
origin = "falcosecurity/plugins/plugins/okta/rules/okta_rules.yaml"
