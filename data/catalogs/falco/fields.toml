[[fields]]
name = "proc.aargs"
type = "CHARBUF"
list = false
kind = "string"
class = "thread"
origin = "libsinsp"
sources = ["syscall"]
arg = "allowed"
arg_index = false
arg_key = false
no_rhs = false
no_transformer = false
filter_only = false
print_only = false
deprecated = false
description = "The arguments passed on the command line when starting the process generating the event for a specific process ancestor. You can access different levels of ancestors by using indices. For example, proc.aargs[1] retrieves the arguments passed on the command line of the parent process, proc.aargs[2] retrieves the proc.args of the grandparent process, and so on. The current process's arguments passed on the command line can be obtained using proc.aargs[0]. When used without any arguments in filters, proc.aargs matches any of the process ancestors. For instance, you can use `proc.aargs contains base64` to match any process ancestor whose arguments contain the term base64. In output, proc.aargs without arguments returns the space-separated list of proc.args values of all ancestors."

[[fields]]
name = "proc.acmdline"
type = "CHARBUF"
list = false
kind = "string"
class = "thread"
origin = "libsinsp"
sources = ["syscall"]
arg = "allowed"
arg_index = false
arg_key = false
no_rhs = true
no_transformer = true
filter_only = false
print_only = false
deprecated = false
description = "The full command line (proc.name + proc.args) for a specific process ancestor. You can access different levels of ancestors by using indices. For example, proc.acmdline[1] retrieves the full command line of the parent process, proc.acmdline[2] retrieves the proc.cmdline of the grandparent process, and so on. The current process's full command line can be obtained using proc.acmdline[0]. When used without any arguments in filters, proc.acmdline matches any of the process ancestors. For instance, you can use `proc.acmdline contains base64` to match any process ancestor whose command line contains the term base64. In output, proc.acmdline without arguments returns the space-separated list of proc.cmdline values of all ancestors."

[[fields]]
name = "proc.aenv"
type = "CHARBUF"
list = false
kind = "string"
class = "thread"
origin = "libsinsp"
sources = ["syscall"]
arg = "allowed"
arg_index = false
arg_key = false
no_rhs = true
no_transformer = true
filter_only = false
print_only = false
deprecated = false
description = "[EXPERIMENTAL] This field can be used in three flavors: (1) as a filter checking all parents, e.g. 'proc.aenv contains xyz', which is similar to the familiar 'proc.aname contains xyz' approach, (2) checking the `proc.env` of a specified level of the parent, e.g. 'proc.aenv[2]', which is similar to the familiar 'proc.aname[2]' approach, or (3) checking the first matched value of a known ENV_NAME in the parent lineage, such as 'proc.aenv[ENV_NAME]' (across a max of 20 ancestor levels). This field may be deprecated or undergo breaking changes in future releases. Please use it with caution."

[[fields]]
name = "proc.aexe"
type = "CHARBUF"
list = false
kind = "string"
class = "thread"
origin = "libsinsp"
sources = ["syscall"]
arg = "allowed"
arg_index = false
arg_key = false
no_rhs = true
no_transformer = true
filter_only = false
print_only = false
deprecated = false
description = "The proc.exe (first command line argument argv[0]) for a specific process ancestor. You can access different levels of ancestors by using indices. For example, proc.aexe[1] retrieves the proc.exe of the parent process, proc.aexe[2] retrieves the proc.exe of the grandparent process, and so on. The current process's proc.exe line can be obtained using proc.aexe[0]. When used without any arguments in filters, proc.aexe matches any of the process ancestors. For instance, you can use `proc.aexe endswith java` to match any process ancestor whose proc.exe ends with the term `java`. In output, proc.aexe without arguments returns the space-separated list of proc.exe values of all ancestors."

