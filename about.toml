# cargo-about: the licences of the Rust crates compiled into opentide-lsp.
# release.yml renders about.hbs to THIRD-PARTY-LICENSES.html for every
# release; a crate under a licence not listed here fails the release.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "EUPL-1.2",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
