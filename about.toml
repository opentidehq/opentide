# cargo-about: the licences of the Rust crates compiled into what the release ships
# (opentide-lsp, the `opentide` binaries, and the WebAssembly modules).
# engine-release-build.yml renders about.hbs to THIRD-PARTY-LICENSES.html for every
# release; a crate under a licence not listed here fails the release. The list is
# deny.toml's, under the same policy: permissive licences for every crate, no
# per-crate exceptions.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "EUPL-1.2",
  "CC0-1.0",
  "MIT-0",
  "CDLA-Permissive-2.0",
]
# The targets the release builds for. The native ones, and both WebAssembly
# targets the `wasm` job builds (engine-release-build.yml): a crate only a
# WebAssembly build links, such as `wasi` of the command line's WASI module
# (opentide-wasm32-wasip1.wasm), is listed only when its target is here.
# tests (scripts/engine/test_release.py) keep this list and that job's targets equal.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

